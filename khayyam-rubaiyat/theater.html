<!DOCTYPE html>

<head>

<title>Rubáiyát of Omar Khayyám — Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500;600&family=Vazirmatn:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== THEMES =====
   The palette blocks are the Rubáiyát reader's, verbatim, so the stage is lit
   the same colour as the book. Theater adds only --dim (the stage furniture),
   --controls-bg / --controls-border (reusing the reader's bar values) and
   --progress-bg. Default theme is dark-violet: the stage is dark. */
:root {
  --font-serif: 'EB Garamond', Georgia, serif;
  --font-sans: 'Jost', -apple-system, Helvetica Neue, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-fa: 'Vazirmatn', 'Noto Naskh Arabic', 'EB Garamond', Georgia, serif;
}

[data-theme="sepia"] {
  --bg: #f5efe0;
  --text: #3a2e1e;
  --text-secondary: #7a6a52;
  --border: #d4c8a8;
  --accent: #b45309;
  --dim: #9a8a72;
  --controls-bg: rgba(245,239,224,0.94);
  --controls-border: rgba(0,0,0,0.06);
  --progress-bg: rgba(0,0,0,0.1);
  --btn-bg: rgba(0,0,0,0.05);
}
[data-theme="light-purple"] {
  --bg: #faf8f3;
  --text: #363b48;
  --text-secondary: #65707a;
  --border: #d6d0c4;
  --accent: #7c3aed;
  --dim: #8a8fa8;
  --controls-bg: rgba(250,248,243,0.94);
  --controls-border: rgba(0,0,0,0.06);
  --progress-bg: rgba(0,0,0,0.1);
  --btn-bg: rgba(0,0,0,0.05);
}
[data-theme="light-azure"] {
  --bg: #ffffff;
  --text: #363b48;
  --text-secondary: #65707a;
  --border: #d6d0c4;
  --accent: #2e6ab4;
  --dim: #8a98b0;
  --controls-bg: rgba(255,255,255,0.92);
  --controls-border: rgba(0,0,0,0.08);
  --progress-bg: rgba(0,0,0,0.1);
  --btn-bg: rgba(0,0,0,0.06);
}
[data-theme="dark-violet"] {
  --bg: #1a1a1a;
  --text: #dce0ec;
  --text-secondary: #8490aa;
  --border: #333;
  --accent: #9b7aed;
  --dim: #546080;
  --controls-bg: rgba(26,26,26,0.95);
  --controls-border: rgba(255,255,255,0.08);
  --progress-bg: rgba(255,255,255,0.08);
  --btn-bg: rgba(255,255,255,0.08);
}
[data-theme="dark-blue"] {
  --bg: #000000;
  --text: #8490aa;
  --text-secondary: #546080;
  --border: #1c2440;
  --accent: #2e6ab4;
  --dim: #364060;
  --controls-bg: rgba(0,0,0,0.95);
  --controls-border: rgba(255,255,255,0.06);
  --progress-bg: rgba(255,255,255,0.06);
  --btn-bg: rgba(255,255,255,0.06);
}

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-serif);
  -webkit-font-smoothing: antialiased;
  transition: background 0.5s, color 0.5s;
  display: flex; flex-direction: column;
}

/* ===== STAGE ===== */
.stage {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 72px 40px 76px; overflow: hidden;
  cursor: pointer; position: relative;
}

.quatrain-view {
  max-width: 620px; width: 100%;
  max-height: 100%; overflow-y: auto;
  scrollbar-width: none; -ms-overflow-style: none;
  opacity: 1; transform: translateY(0);
  transition: opacity 0.42s ease, transform 0.42s ease;
  text-align: center;
}
.quatrain-view::-webkit-scrollbar { display: none; }
.quatrain-view.fading { opacity: 0; transform: translateY(20px); }

/* ===== LARGE QUATRAIN COUNT ===== */
.q-ordinal {
  font-family: var(--font-serif);
  font-size: clamp(46px, 8vw, 82px);
  font-weight: 400; line-height: 1;
  letter-spacing: 0.06em;
  color: var(--accent); opacity: 0.24;
  margin-bottom: 6px;
}
.q-ordinal.fa { font-family: var(--font-fa); letter-spacing: 0.02em; }
.q-count {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--dim); margin-bottom: 4px;
}
.q-rule {
  width: 56px; height: 1px; margin: 20px auto 40px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.6;
}

/* ===== VERSE ===== */
.q-verse {
  font-size: 24px; line-height: 2.0;
  color: var(--text);
  text-align: left; text-indent: 0;
  display: inline-block; max-width: 100%;
}
.q-verse p { margin: 0 0 0.18em; text-indent: 0; }
.q-verse p.indented { text-indent: 1.4em; }
.q-verse p.q-prose {
  text-align: left; font-size: 21px; line-height: 1.85;
  hyphens: auto; -webkit-hyphens: auto;
}

/* Persian stage — right-to-left, transliteration right-aligned beneath */
.quatrain-view.q-rtl .q-verse {
  font-family: var(--font-fa);
  direction: rtl; text-align: right;
}
.quatrain-view.q-rtl .q-verse p.fa { font-size: 1.02em; line-height: 2.15; margin: 0 0 0.08em; }
.q-verse p.translit {
  direction: ltr; text-align: right;
  font-family: var(--font-mono); font-size: 0.5em; line-height: 1.95;
  color: var(--text-secondary); opacity: 0.85;
  letter-spacing: 0.2px; margin: -2px 0 12px;
}

/* ===== TOP INDICATOR ===== */
.stage-indicator {
  position: fixed; top: 0; left: 0; right: 0; height: 46px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-sans); font-size: 10px;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--dim);
  background: var(--controls-bg);
  border-bottom: 1px solid var(--controls-border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; transform: translateY(-100%);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 100; pointer-events: none; padding: 0 16px;
}
.stage-indicator.visible { opacity: 1; transform: translateY(0); }
.stage-indicator .si-ed { color: var(--accent); }

/* ===== CONTROLS ===== */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; flex-wrap: wrap;
  align-items: center; justify-content: center; gap: 4px 12px;
  padding: 8px 16px 10px;
  background: var(--controls-bg);
  border-top: 1px solid var(--controls-border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; transform: translateY(100%);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 100;
}
.controls.visible { opacity: 1; transform: translateY(0); }

.ctrl-btn {
  font-family: var(--font-sans); font-size: 11px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); background: none; border: none; cursor: pointer;
  padding: 8px 12px; min-height: 40px;
  display: flex; align-items: center; gap: 6px;
  border-radius: 6px; transition: color 0.2s, background 0.15s;
}
.ctrl-btn:hover { color: var(--accent); background: var(--btn-bg); }
.ctrl-btn:disabled { opacity: 0.25; cursor: default; background: none; }

.ctrl-pos {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--dim); letter-spacing: 1px;
  min-width: 66px; text-align: center; flex-shrink: 0;
}
.ctrl-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

/* Edition switch — same chip row as the reader's top bar */
.ed-switch {
  display: inline-flex; border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden; flex-shrink: 0;
}
.ed-switch .ed-opt {
  background: transparent; border: none; color: var(--dim);
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  padding: 6px 10px; cursor: pointer; line-height: 1.4;
  min-height: 30px; letter-spacing: .3px;
  transition: background .15s, color .15s;
}
.ed-switch .ed-opt:hover { background: var(--btn-bg); color: var(--text); }
.ed-switch .ed-opt.active { color: var(--accent); background: var(--btn-bg); }
.ed-switch .ed-opt + .ed-opt { border-left: 1px solid var(--border); }
.ed-switch .ed-opt[lang="fa"] { font-family: var(--font-fa); font-size: 13px; padding: 4px 9px; }

/* ===== THEME DOTS ===== */
.theme-dots { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.theme-dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: none; padding: 0; cursor: pointer; flex-shrink: 0;
  position: relative; transition: transform 0.2s, box-shadow 0.2s;
}
/* Keep the dot visually 12px (10px on phones) but give it a 40px-tall hit area
   spanning the gap to its neighbour — wider would steal the next dot's clicks. */
.theme-dot::before {
  content: ""; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); width: calc(100% + 6px); height: 40px;
}
.theme-dot:hover { transform: scale(1.3); }
.theme-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.theme-dot.active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
.theme-dot[data-t="light-purple"] { background: #7c3aed; }
.theme-dot[data-t="sepia"]        { background: #b45309; }
.theme-dot[data-t="light-azure"]  { background: #2e6ab4; }
.theme-dot[data-t="dark-violet"]  { background: #9b7aed; }
.theme-dot[data-t="dark-blue"]    { background: #4a90d9; }

/* ===== BACK LINK ===== */
.ctrl-back {
  font-family: var(--font-sans); font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); text-decoration: none;
  padding: 10px; transition: color 0.2s; flex-shrink: 0;
}
.ctrl-back:hover { color: var(--accent); }

/* ===== PROGRESS ===== */
.progress {
  position: fixed; bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--progress-bg); z-index: 101; pointer-events: none;
}
.progress-fill { height: 100%; background: var(--accent); transition: width 0.4s ease; }

/* ── Focus-visible ── */
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button:focus:not(:focus-visible) { outline: none; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .stage { padding: 56px 24px 96px; }
  .q-verse { font-size: 21px; line-height: 1.95; }
  .q-verse p.q-prose { font-size: 19px; }
  .controls { gap: 2px 8px; }
  .ctrl-btn { padding: 8px 8px; font-size: 10px; }
}
@media (max-width: 480px) {
  .stage { padding: 52px 18px 116px; }
  .q-verse { font-size: 19px; line-height: 1.9; }
  .q-verse p.q-prose { font-size: 17px; }
  .q-rule { margin: 14px auto 28px; }
  .ctrl-sep { display: none; }
  .ctrl-back { display: none; }
  .theme-dots { gap: 6px; }
  .theme-dot { width: 10px; height: 10px; }
  .ed-switch .ed-opt { padding: 6px 7px; font-size: 10px; }
  .ed-switch .ed-opt[lang="fa"] { font-size: 12px; padding: 4px 7px; }
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="stage-indicator" id="indicator">
  <span class="si-ed" id="si-ed"></span>
  <span id="si-pos"></span>
</div>

<div class="stage" id="stage">

</div>

<div class="controls" id="controls">
  <a class="ctrl-back" href="index.html">&#8592; Book</a>
  <button class="ctrl-btn" id="prev" aria-label="Previous quatrain">&#8592;<span class="ctrl-word">Prev</span></button>

  <button class="ctrl-btn" id="next" aria-label="Next quatrain"><span class="ctrl-word">Next</span>&#8594;</button>

  <div class="ed-switch" id="ed-switch" role="tablist" aria-label="Choose edition"></div>

    <button type="button" class="theme-dot" data-t="light-purple" title="Light Purple" aria-label="Light purple theme"></button>
    <button type="button" class="theme-dot" data-t="sepia" title="Sepia" aria-label="Sepia theme"></button>
    <button type="button" class="theme-dot" data-t="light-azure" title="Light Azure" aria-label="Light azure theme"></button>

  </div>
</div>

<script>
// ===================================================================

const DATA = {"order":["first","fifth","whinfield","nicolas","persian"],"default":"fifth","groupSize":10,"editions":{"first":{"short":"FG1","label":"FitzGerald &middot; First Edition","plain":"FitzGerald, First Edition","year":1859,"unit":"quatrains","dir":"ltr","lang":"en","kind":"verse","title":"FitzGerald 1st edition, 1859 — 75 quatrains, English verse","note":"FitzGerald's anonymous debut — terser, stranger, closer to the Persian cadence.","key":"first","count":75,"quatrains":[{"n":1,"label":"I","verse":"<p>Awake! for Morning in the Bowl of Night<\/p><p>Has flung the Stone that puts the Stars to Flight:<\/p><p class=\"indented\">And Lo! the Hunter of the East has caught<\/p><p>The Sultan&#x27;s Turret in a Noose of Light.<\/p>"},{"n":2,"label":"II","verse":"<p>Dreaming when Dawn&#x27;s Left Hand was in the Sky<\/p><p>I heard a Voice within the Tavern cry,<\/p><p class=\"indented\">&quot;Awake, my Little ones, and fill the Cup<\/p><p>Before Life&#x27;s Liquor in its Cup be dry.&quot;<\/p>"},{"n":3,"label":"III","verse":"<p>And, as the Cock crew, those who stood before<\/p><p>The Tavern shouted--&quot;Open then the Door.<\/p><p class=\"indented\">You know how little while we have to stay,<\/p><p>And, once departed, may return no more.&quot;<\/p>"},{"n":4,"label":"IV","verse":"<p>Now the New Year reviving old Desires,<\/p><p>The thoughtful Soul to Solitude retires,<\/p><p class=\"indented\">Where the WHITE HAND OF MOSES on the Bough<\/p><p>Puts out, and Jesus from the Ground suspires.<\/p>"},{"n":5,"label":"V","verse":"<p>Iram indeed is gone with all its Rose,<\/p><p>And Jamshyd&#x27;s Sev&#x27;n-ring&#x27;d Cup where no one knows;<\/p><p class=\"indented\">But still the Vine her ancient Ruby yields,<\/p><p>And still a Garden by the Water blows.<\/p>"},{"n":6,"label":"VI","verse":"<p>And David&#x27;s Lips are lock&#x27;t; but in divine<\/p><p>High piping Pelevi, with &quot;Wine!  Wine!  Wine!<\/p><p class=\"indented\">Red Wine!&quot;--the Nightingale cries to the Rose<\/p><p>That yellow Cheek of hers to&#x27;incarnadine.<\/p>"},{"n":7,"label":"VII","verse":"<p>Come, fill the Cup, and in the Fire of Spring<\/p><p>The Winter Garment of Repentance fling:<\/p><p class=\"indented\">The Bird of Time has but a little way<\/p><p>To fly--and Lo! the Bird is on the Wing.<\/p>"},{"n":8,"label":"VIII","verse":"<p>And look--a thousand Blossoms with the Day<\/p><p>Woke--and a thousand scatter&#x27;d into Clay:<\/p><p class=\"indented\">And this first Summer Month that brings the Rose<\/p><p>Shall take Jamshyd and Kaikobad away.<\/p>"},{"n":9,"label":"IX","verse":"<p>But come with old Khayyam, and leave the Lot<\/p><p>Of Kaikobad and Kaikhosru forgot:<\/p><p class=\"indented\">Let Rustum lay about him as he will,<\/p><p>Or Hatim Tai cry Supper--heed them not.<\/p>"},{"n":10,"label":"X","verse":"<p>With me along some Strip of Herbage strown<\/p><p>That just divides the desert from the sown,<\/p><p class=\"indented\">Where name of Slave and Sultan scarce is known,<\/p><p>And pity Sultan Mahmud on his Throne.<\/p>"},{"n":11,"label":"XI","verse":"<p>Here with a Loaf of Bread beneath the Bough,<\/p><p>A Flask of Wine, a Book of Verse--and Thou<\/p><p class=\"indented\">Beside me singing in the Wilderness--<\/p><p>And Wilderness is Paradise enow.<\/p>"},{"n":12,"label":"XII","verse":"<p>&quot;How sweet is mortal Sovranty!&quot;--think some:<\/p><p>Others--&quot;How blest the Paradise to come!&quot;<\/p><p class=\"indented\">Ah, take the Cash in hand and waive the Rest;<\/p><p>Oh, the brave Music of a distant Drum!<\/p>"},{"n":13,"label":"XIII","verse":"<p>Look to the Rose that blows about us--&quot;Lo,<\/p><p>Laughing,&quot; she says, &quot;into the World I blow:<\/p><p class=\"indented\">At once the silken Tassel of my Purse<\/p><p>Tear, and its Treasure on the Garden throw.&quot;<\/p>"},{"n":14,"label":"XIV","verse":"<p>The Worldly Hope men set their Hearts upon<\/p><p>Turns Ashes--or it prospers; and anon,<\/p><p class=\"indented\">Like Snow upon the Desert&#x27;s dusty Face<\/p><p>Lighting a little Hour or two--is gone.<\/p>"},{"n":15,"label":"XV","verse":"<p>And those who husbanded the Golden Grain,<\/p><p>And those who flung it to the Winds like Rain,<\/p><p class=\"indented\">Alike to no such aureate Earth are turn&#x27;d<\/p><p>As, buried once, Men want dug up again.<\/p>"},{"n":16,"label":"XVI","verse":"<p>Think, in this batter&#x27;d Caravanserai<\/p><p>Whose Doorways are alternate Night and Day,<\/p><p class=\"indented\">How Sultan after Sultan with his Pomp<\/p><p>Abode his Hour or two, and went his way.<\/p>"},{"n":17,"label":"XVII","verse":"<p>They say the Lion and the Lizard keep<\/p><p>The Courts where Jamshyd gloried and drank deep:<\/p><p class=\"indented\">And Bahram, that great Hunter--the Wild Ass<\/p><p>Stamps o&#x27;er his Head, and he lies fast asleep.<\/p>"},{"n":18,"label":"XVIII","verse":"<p>I sometimes think that never blows so red<\/p><p>The Rose as where some buried Caesar bled;<\/p><p class=\"indented\">That every Hyacinth the Garden wears<\/p><p>Dropt in its Lap from some once lovely Head.<\/p>"},{"n":19,"label":"XIX","verse":"<p>And this delightful Herb whose tender Green<\/p><p>Fledges the River&#x27;s Lip on which we lean--<\/p><p class=\"indented\">Ah, lean upon it lightly! for who knows<\/p><p>From what once lovely Lip it springs unseen!<\/p>"},{"n":20,"label":"XX","verse":"<p>Ah! my Beloved, fill the Cup that clears<\/p><p>TO-DAY of past Regrets and future Fears-<\/p><p class=\"indented\">To-morrow?--Why, To-morrow I may be<\/p><p>Myself with Yesterday&#x27;s Sev&#x27;n Thousand Years.<\/p>"},{"n":21,"label":"XXI","verse":"<p>Lo! some we loved, the loveliest and the best<\/p><p>That Time and Fate of all their Vintage prest,<\/p><p class=\"indented\">Have drunk their Cup a Round or two before,<\/p><p>And one by one crept silently to Rest.<\/p>"},{"n":22,"label":"XXII","verse":"<p>And we, that now make merry in the Room<\/p><p>They left, and Summer dresses in new Bloom,<\/p><p class=\"indented\">Ourselves must we beneath the Couch of Earth<\/p><p>Descend, ourselves to make a Couch--for whom?<\/p>"},{"n":23,"label":"XXIII","verse":"<p>Ah, make the most of what we yet may spend,<\/p><p>Before we too into the Dust Descend;<\/p><p class=\"indented\">Dust into Dust, and under Dust, to lie,<\/p><p>Sans Wine, sans Song, sans Singer and--sans End!<\/p>"},{"n":24,"label":"XXIV","verse":"<p>Alike for those who for TO-DAY prepare,<\/p><p>And those that after a TO-MORROW stare,<\/p><p class=\"indented\">A Muezzin from the Tower of Darkness cries<\/p><p>&quot;Fools! your Reward is neither Here nor There.&quot;<\/p>"},{"n":25,"label":"XXV","verse":"<p>Why, all the Saints and Sages who discuss&#x27;d<\/p><p>Of the Two Worlds so learnedly, are thrust<\/p><p class=\"indented\">Like foolish Prophets forth; their Words to Scorn<\/p><p>Are scatter&#x27;d, and their Mouths are stopt with Dust.<\/p>"},{"n":26,"label":"XXVI","verse":"<p>Oh, come with old Khayyam, and leave the Wise<\/p><p>To talk; one thing is certain, that Life flies;<\/p><p class=\"indented\">One thing is certain, and the Rest is Lies;<\/p><p>The Flower that once has blown for ever dies.<\/p>"},{"n":27,"label":"XXVII","verse":"<p>Myself when young did eagerly frequent<\/p><p>Doctor and Saint, and heard great Argument<\/p><p class=\"indented\">About it and about: but evermore<\/p><p>Came out by the same Door as in I went.<\/p>"},{"n":28,"label":"XXVIII","verse":"<p>With them the Seed of Wisdom did I sow,<\/p><p>And with my own hand labour&#x27;d it to grow:<\/p><p class=\"indented\">And this was all the Harvest that I reap&#x27;d--<\/p><p>&quot;I came like Water, and like Wind I go.&quot;<\/p>"},{"n":29,"label":"XXIX","verse":"<p>Into this Universe, and why not knowing,<\/p><p>Nor whence, like Water willy-nilly flowing:<\/p><p class=\"indented\">And out of it, as Wind along the Waste,<\/p><p>I know not whither, willy-nilly blowing.<\/p>"},{"n":30,"label":"XXX","verse":"<p>What, without asking, hither hurried whence?<\/p><p>And, without asking, whither hurried hence!<\/p><p class=\"indented\">Another and another Cup to drown<\/p><p>The Memory of this Impertinence!<\/p>"},{"n":31,"label":"XXXI","verse":"<p>Up from Earth&#x27;s Centre through the seventh Gate<\/p><p>I rose, and on the Throne of Saturn sate,<\/p><p class=\"indented\">And many Knots unravel&#x27;d by the Road;<\/p><p>But not the Knot of Human Death and Fate.<\/p>"},{"n":32,"label":"XXXII","verse":"<p>There was a Door to which I found no Key:<\/p><p>There was a Veil past which I could not see:<\/p><p class=\"indented\">Some little Talk awhile of ME and THEE<\/p><p>There seemed--and then no more of THEE and ME.<\/p>"},{"n":33,"label":"XXXIII","verse":"<p>Then to the rolling Heav&#x27;n itself I cried,<\/p><p>Asking, &quot;What Lamp had Destiny to guide<\/p><p class=\"indented\">Her little Children stumbling in the Dark?&quot;<\/p><p>And--&quot;A blind understanding!&quot; Heav&#x27;n replied.<\/p>"},{"n":34,"label":"XXXIV","verse":"<p>Then to this earthen Bowl did I adjourn<\/p><p>My Lip the secret Well of Life to learn:<\/p><p class=\"indented\">And Lip to Lip it murmur&#x27;d--&quot;While you live,<\/p><p>Drink!--for once dead you never shall return.&quot;<\/p>"},{"n":35,"label":"XXXV","verse":"<p>I think the Vessel, that with fugitive<\/p><p>Articulation answer&#x27;d, once did live,<\/p><p class=\"indented\">And merry-make; and the cold Lip I kiss&#x27;d<\/p><p>How many Kisses might it take--and give.<\/p>"},{"n":36,"label":"XXXVI","verse":"<p>For in the Market-place, one Dusk of Day,<\/p><p>I watch&#x27;d the Potter thumping his wet Clay:<\/p><p class=\"indented\">And with its all obliterated Tongue<\/p><p>It murmur&#x27;d--&quot;Gently, Brother, gently, pray!&quot;<\/p>"},{"n":37,"label":"XXXVII","verse":"<p>Ah, fill the Cup:--what boots it to repeat<\/p><p>How Time is slipping underneath our Feet:<\/p><p class=\"indented\">Unborn TO-MORROW and dead YESTERDAY,<\/p><p>Why fret about them if TO-DAY be sweet!<\/p>"},{"n":38,"label":"XXXVIII","verse":"<p>One Moment in Annihilation&#x27;s Waste,<\/p><p>One moment, of the Well of Life to taste--<\/p><p class=\"indented\">The Stars are setting, and the Caravan<\/p><p>Starts for the dawn of Nothing--Oh, make haste!<\/p>"},{"n":39,"label":"XXXIX","verse":"<p>How long, how long, in infinite Pursuit<\/p><p>Of This and That endeavour and dispute?<\/p><p class=\"indented\">Better be merry with the fruitful Grape<\/p><p>Than sadden after none, or bitter, Fruit.<\/p>"},{"n":40,"label":"XL","verse":"<p>You know, my Friends, how long since in my House<\/p><p>For a new Marriage I did make Carouse:<\/p><p class=\"indented\">Divorced old barren Reason from my Bed,<\/p><p>And took the Daughter of the Vine to Spouse.<\/p>"},{"n":41,"label":"XLI","verse":"<p>For &quot;IS&quot; and &quot;IS-NOT&quot; though with Rule and Line,<\/p><p>And, &quot;UP-AND-DOWN&quot; without, I could define,<\/p><p class=\"indented\">I yet in all I only cared to know,<\/p><p>Was never deep in anything but--Wine.<\/p>"},{"n":42,"label":"XLII","verse":"<p>And lately, by the Tavern Door agape,<\/p><p>Came stealing through the Dusk an Angel Shape,<\/p><p class=\"indented\">Bearing a vessel on his Shoulder; and<\/p><p>He bid me taste of it; and &#x27;twas--the Grape!<\/p>"},{"n":43,"label":"XLIII","verse":"<p>The Grape that can with Logic absolute<\/p><p>The Two-and-Seventy jarring Sects confute:<\/p><p class=\"indented\">The subtle Alchemist that in a Trice<\/p><p>Life&#x27;s leaden Metal into Gold transmute.<\/p>"},{"n":44,"label":"XLIV","verse":"<p>The mighty Mahmud, the victorious Lord,<\/p><p>That all the misbelieving and black Horde<\/p><p class=\"indented\">Of Fears and Sorrows that infest the Soul<\/p><p>Scatters and slays with his enchanted Sword.<\/p>"},{"n":45,"label":"XLV","verse":"<p>But leave the Wise to wrangle, and with me<\/p><p>The Quarrel of the Universe let be:<\/p><p class=\"indented\">And, in some corner of the Hubbub coucht,<\/p><p>Make Game of that which makes as much of Thee.<\/p>"},{"n":46,"label":"XLVI","verse":"<p>For in and out, above, about, below,<\/p><p>&#x27;Tis nothing but a Magic Shadow-show,<\/p><p class=\"indented\">Play&#x27;d in a Box whose Candle is the Sun,<\/p><p>Round which we Phantom Figures come and go.<\/p>"},{"n":47,"label":"XLVII","verse":"<p>And if the Wine you drink, the Lip you press,<\/p><p>End in the Nothing all Things end in--Yes-<\/p><p class=\"indented\">Then fancy while Thou art, Thou art but what<\/p><p>Thou shalt be--Nothing--Thou shalt not be less.<\/p>"},{"n":48,"label":"XLVIII","verse":"<p>While the Rose blows along the River Brink,<\/p><p>With old Khayyam the Ruby Vintage drink:<\/p><p class=\"indented\">And when the Angel with his darker Draught<\/p><p>Draws up to thee--take that, and do not shrink.<\/p>"},{"n":54,"label":"LIV","verse":"<p>&#x27;Tis all a Chequer-board of Nights and Days<\/p><p>Where Destiny with Men for Pieces plays:<\/p><p class=\"indented\">Hither and thither moves, and mates, and slays,<\/p><p>And one by one back in the Closet lays.<\/p>"},{"n":50,"label":"L","verse":"<p>The Ball no Question makes of Ayes and Noes,<\/p><p>But Right or Left as strikes the Player goes;<\/p><p class=\"indented\">And He that toss&#x27;d Thee down into the Field,<\/p><p>He knows about it all--HE knows--HE knows!<\/p>"},{"n":51,"label":"LI","verse":"<p>The Moving Finger writes; and, having writ,<\/p><p>Moves on: nor all thy Piety nor Wit<\/p><p class=\"indented\">Shall lure it back to cancel half a Line,<\/p><p>Nor all thy Tears wash out a Word of it.<\/p>"},{"n":52,"label":"LII","verse":"<p>And that inverted Bowl we call The Sky,<\/p><p>Whereunder crawling coop&#x27;t we live and die,<\/p><p class=\"indented\">Lift not thy hands to IT for help--for It<\/p><p>Rolls impotently on as Thou or I.<\/p>"},{"n":53,"label":"LIII","verse":"<p>With Earth&#x27;s first Clay They did the Last Man&#x27;s knead,<\/p><p>And then of the Last Harvest sow&#x27;d the Seed:<\/p><p class=\"indented\">Yea, the first Morning of Creation wrote<\/p><p>What the Last Dawn of Reckoning shall read.<\/p>"},{"n":54,"label":"LIV","verse":"<p>I tell Thee this--When, starting from the Goal,<\/p><p>Over the shoulders of the flaming Foal<\/p><p class=\"indented\">Of Heav&#x27;n Parwin and Mushtari they flung,<\/p><p>In my predestin&#x27;d Plot of Dust and Soul<\/p>"},{"n":55,"label":"LV","verse":"<p>The Vine had struck a Fibre; which about<\/p><p>If clings my Being--let the Sufi flout;<\/p><p class=\"indented\">Of my Base Metal may be filed a Key,<\/p><p>That shall unlock the Door he howls without.<\/p>"},{"n":56,"label":"LVI","verse":"<p>And this I know: whether the one True Light,<\/p><p>Kindle to Love, or Wrath consume me quite,<\/p><p class=\"indented\">One Glimpse of It within the Tavern caught<\/p><p>Better than in the Temple lost outright.<\/p>"},{"n":57,"label":"LVII","verse":"<p>Oh Thou who didst with Pitfall and with Gin<\/p><p>Beset the Road I was to wander in,<\/p><p class=\"indented\">Thou wilt not with Predestination round<\/p><p>Enmesh me, and impute my Fall to Sin?<\/p>"},{"n":58,"label":"LVIII","verse":"<p>Oh Thou, who Man of baser Earth didst make,<\/p><p>And who with Eden didst devise the Snake;<\/p><p class=\"indented\">For all the Sin wherewith the Face of Man<\/p><p>Is blacken&#x27;d, Man&#x27;s Forgiveness give--and take!<\/p>"},{"n":59,"label":"LIX","verse":"<p>Listen again.  One Evening at the Close<\/p><p>Of Ramazan, ere the better Moon arose,<\/p><p class=\"indented\">In that old Potter&#x27;s Shop I stood alone<\/p><p>With the clay Population round in Rows.<\/p>"},{"n":60,"label":"LX","verse":"<p>And strange to tell, among that Earthen Lot<\/p><p>Some could articulate, while others not:<\/p><p class=\"indented\">And suddenly one more impatient cried--<\/p><p>&quot;Who is the Potter, pray, and who the Pot?&quot;<\/p>"},{"n":61,"label":"LXI","verse":"<p>Then said another--&quot;Surely not in vain<\/p><p>My substance from the common Earth was ta&#x27;en,<\/p><p class=\"indented\">That He who subtly wrought me into Shape<\/p><p>Should stamp me back to common Earth again.&quot;<\/p>"},{"n":62,"label":"LXII","verse":"<p>Another said--&quot;Why, ne&#x27;er a peevish Boy<\/p><p>Would break the Bowl from which he drank in Joy;<\/p><p class=\"indented\">Shall He that made the Vessel in pure Love<\/p><p>And Fansy, in an after Rage destroy!&quot;<\/p>"},{"n":63,"label":"LXIII","verse":"<p>None answer&#x27;d this; but after Silence spake<\/p><p>A Vessel of a more ungainly Make:<\/p><p class=\"indented\">&quot;They sneer at me for leaning all awry;<\/p><p>What? did the Hand then of the Potter shake?&quot;<\/p>"},{"n":64,"label":"LXIV","verse":"<p>Said one--&quot;Folks of a surly Tapster tell,<\/p><p>And daub his Visage with the Smoke of Hell;<\/p><p class=\"indented\">They talk of some strict Testing of us--Pish!<\/p><p>He&#x27;s a Good Fellow, and &#x27;twill all be well.&quot;<\/p>"},{"n":65,"label":"LXV","verse":"<p>Then said another with a long-drawn Sigh,<\/p><p>&quot;My Clay with long oblivion is gone dry:<\/p><p class=\"indented\">But, fill me with the old familiar Juice,<\/p><p>Methinks I might recover by-and-bye!&quot;<\/p>"},{"n":66,"label":"LXVI","verse":"<p>So, while the Vessels one by one were speaking,<\/p><p>One spied the little Crescent all were seeking:<\/p><p class=\"indented\">And then they jogg&#x27;d each other, &quot;Brother! Brother!<\/p><p>Hark to the Porter&#x27;s Shoulder-knot a-creaking!&quot;<\/p>"},{"n":67,"label":"LXVII","verse":"<p>Ah, with the Grape my fading Life provide,<\/p><p>And wash my Body whence the life has died,<\/p><p class=\"indented\">And in a Windingsheet of Vineleaf wrapt,<\/p><p>So bury me by some sweet Gardenside.<\/p>"},{"n":68,"label":"LXVIII","verse":"<p>That ev&#x27;n my buried Ashes such a Snare<\/p><p>Of Perfume shall fling up into the Air,<\/p><p class=\"indented\">As not a True Believer passing by<\/p><p>But shall be overtaken unaware.<\/p>"},{"n":69,"label":"LXIX","verse":"<p>Indeed, the Idols I have loved so long<\/p><p>Have done my Credit in Men&#x27;s Eye much wrong:<\/p><p class=\"indented\">Have drown&#x27;d my Honour in a shallow Cup,<\/p><p>And sold my Reputation for a Song.<\/p>"},{"n":70,"label":"LXX","verse":"<p>Indeed, indeed, Repentance oft before<\/p><p>I swore--but was I sober when I swore?<\/p><p class=\"indented\">And then and then came Spring, and Rose-in-hand<\/p><p>My thread-bare Penitence a-pieces tore.<\/p>"},{"n":71,"label":"LXXI","verse":"<p>And much as Wine has play&#x27;d the Infidel,<\/p><p>And robb&#x27;d me of my Robe of Honour--well,<\/p><p class=\"indented\">I often wonder what the Vintners buy<\/p><p>One half so precious as the Goods they sell.<\/p>"},{"n":72,"label":"LXXII","verse":"<p>Alas, that Spring should vanish with the Rose!<\/p><p>That Youth&#x27;s sweet-scented Manuscript should close!<\/p><p class=\"indented\">The Nightingale that in the Branches sang,<\/p><p>Ah, whence, and whither flown again, who knows!<\/p>"},{"n":73,"label":"LXXIII","verse":"<p>Ah, Love! could thou and I with Fate conspire<\/p><p>To grasp this sorry Scheme of Things entire,<\/p><p class=\"indented\">Would not we shatter it to bits--and then<\/p><p>Re-mould it nearer to the Heart&#x27;s Desire!<\/p>"},{"n":74,"label":"LXXIV","verse":"<p>Ah, Moon of my Delight who know&#x27;st no wane,<\/p><p>The Moon of Heav&#x27;n is rising once again:<\/p><p class=\"indented\">How oft hereafter rising shall she look<\/p><p>Through this same Garden after me--in vain!<\/p>"},{"n":75,"label":"LXXV","verse":"<p>And when Thyself with shining Foot shall pass<\/p><p>Among the Guests Star-scatter&#x27;d on The Grass,<\/p><p class=\"indented\">And in Thy joyous Errand reach the Spot<\/p><p>Where I made one--turn down an empty Glass!<\/p>"}]},"fifth":{"short":"FG5","label":"FitzGerald &middot; Fifth Edition","plain":"FitzGerald, Fifth Edition","year":1889,"unit":"quatrains","dir":"ltr","lang":"en","kind":"verse","title":"FitzGerald 5th edition, 1889 — 101 quatrains, English verse (with Heron-Allen Persian-source scholarly notes)","note":"The canonical text, published months after FitzGerald&rsquo;s death.","key":"fifth","count":101,"quatrains":[{"n":1,"label":"I","verse":"<p>WAKE! For the Sun, who scatter&#x27;d into flight<\/p><p>The Stars before him from the Field of Night,<\/p><p class=\"indented\">Drives Night along with them from Heav&#x27;n, and strikes<\/p><p>The Sultan&#x27;s Turret with a Shaft of Light.<\/p>"},{"n":2,"label":"II","verse":"<p>Before the phantom of False morning died,<\/p><p>Methought a Voice within the Tavern cried,<\/p><p class=\"indented\">&quot;When all the Temple is prepared within,<\/p><p>&quot;Why nods the drowsy Worshiper outside?&quot;<\/p>"},{"n":3,"label":"III","verse":"<p>And, as the Cock crew, those who stood before<\/p><p>The Tavern shouted--&quot;Open then the Door!<\/p><p class=\"indented\">&quot;You know how little while we have to stay,<\/p><p>And, once departed, may return no more.&quot;<\/p>"},{"n":4,"label":"IV","verse":"<p>Now the New Year reviving old Desires,<\/p><p>The thoughtful Soul to Solitude retires,<\/p><p class=\"indented\">Where the WHITE HAND OF MOSES on the Bough<\/p><p>Puts out, and Jesus from the Ground suspires.<\/p>"},{"n":5,"label":"V","verse":"<p>Iram indeed is gone with all his Rose,<\/p><p>And Jamshyd&#x27;s Sev&#x27;n-ring&#x27;d Cup where no one knows;<\/p><p class=\"indented\">But still a Ruby kindles in the Vine,<\/p><p>And many a Garden by the Water blows.<\/p>"},{"n":6,"label":"VI","verse":"<p>And David&#x27;s lips are lockt; but in divine<\/p><p>High-piping Pehlevi, with &quot;Wine! Wine! Wine!<\/p><p class=\"indented\">&quot;Red Wine!&quot;--the Nightingale cries to the Rose<\/p><p>That sallow cheek of hers to&#x27; incarnadine.<\/p>"},{"n":7,"label":"VII","verse":"<p>Come, fill the Cup, and in the fire of Spring<\/p><p>Your Winter garment of Repentance fling:<\/p><p class=\"indented\">The Bird of Time has but a little way<\/p><p>To flutter--and the Bird is on the Wing.<\/p>"},{"n":8,"label":"VIII","verse":"<p>Whether at Naishapur or Babylon,<\/p><p>Whether the Cup with sweet or bitter run,<\/p><p class=\"indented\">The Wine of Life keeps oozing drop by drop,<\/p><p>The Leaves of Life keep falling one by one.<\/p>"},{"n":9,"label":"IX","verse":"<p>Each Morn a thousand Roses brings, you say:<\/p><p>Yes, but where leaves the Rose of Yesterday?<\/p><p class=\"indented\">And this first Summer month that brings the Rose<\/p><p>Shall take Jamshyd and Kaikobad away.<\/p>"},{"n":10,"label":"X","verse":"<p>Well, let it take them!  What have we to do<\/p><p>With Kaikobad the Great, or Kaikhosru?<\/p><p class=\"indented\">Let Zal and Rustum bluster as they will,<\/p><p>Or Hatim call to Supper--heed not you.<\/p>"},{"n":11,"label":"XI","verse":"<p>With me along the strip of Herbage strown<\/p><p>That just divides the desert from the sown,<\/p><p class=\"indented\">Where name of Slave and Sultan is forgot--<\/p><p>And Peace to Mahmud on his golden Throne!<\/p>"},{"n":12,"label":"XII","verse":"<p>A Book of Verses underneath the Bough,<\/p><p>A Jug of Wine, a Loaf of Bread--and Thou<\/p><p class=\"indented\">Beside me singing in the Wilderness--<\/p><p>Oh, Wilderness were Paradise enow!<\/p>"},{"n":13,"label":"XIII","verse":"<p>Some for the Glories of This World; and some<\/p><p>Sigh for the Prophet&#x27;s Paradise to come;<\/p><p class=\"indented\">Ah, take the Cash, and let the Credit go,<\/p><p>Nor heed the rumble of a distant Drum!<\/p>"},{"n":14,"label":"XIV","verse":"<p>Look to the blowing Rose about us--&quot;Lo,<\/p><p>Laughing,&quot; she says, &quot;into the world I blow,<\/p><p class=\"indented\">At once the silken tassel of my Purse<\/p><p>Tear, and its Treasure on the Garden throw.&quot;<\/p>"},{"n":15,"label":"XV","verse":"<p>And those who husbanded the Golden grain,<\/p><p>And those who flung it to the winds like Rain,<\/p><p class=\"indented\">Alike to no such aureate Earth are turn&#x27;d<\/p><p>As, buried once, Men want dug up again.<\/p>"},{"n":16,"label":"XVI","verse":"<p>The Worldly Hope men set their Hearts upon<\/p><p>Turns Ashes--or it prospers; and anon,<\/p><p class=\"indented\">Like Snow upon the Desert&#x27;s dusty Face,<\/p><p>Lighting a little hour or two--is gone.<\/p>"},{"n":17,"label":"XVII","verse":"<p>Think, in this batter&#x27;d Caravanserai<\/p><p>Whose Portals are alternate Night and Day,<\/p><p class=\"indented\">How Sultan after Sultan with his Pomp<\/p><p>Abode his destined Hour, and went his way.<\/p>"},{"n":18,"label":"XVIII","verse":"<p>They say the Lion and the Lizard keep<\/p><p>The courts where Jamshyd gloried and drank deep:<\/p><p class=\"indented\">And Bahram, that great Hunter--the Wild Ass<\/p><p>Stamps o&#x27;er his Head, but cannot break his Sleep.<\/p>"},{"n":19,"label":"XIX","verse":"<p>I sometimes think that never blows so red<\/p><p>The Rose as where some buried Caesar bled;<\/p><p class=\"indented\">That every Hyacinth the Garden wears<\/p><p>Dropt in her Lap from some once lovely Head.<\/p>"},{"n":20,"label":"XX","verse":"<p>And this reviving Herb whose tender Green<\/p><p>Fledges the River-Lip on which we lean--<\/p><p class=\"indented\">Ah, lean upon it lightly! for who knows<\/p><p>From what once lovely Lip it springs unseen!<\/p>"},{"n":21,"label":"XXI","verse":"<p>Ah, my Beloved, fill the Cup that clears<\/p><p>TO-DAY of past Regrets and future Fears:<\/p><p class=\"indented\">To-morrow--Why, To-morrow I may be<\/p><p>Myself with Yesterday&#x27;s Sev&#x27;n thousand Years.<\/p>"},{"n":22,"label":"XXII","verse":"<p>For some we loved, the loveliest and the best<\/p><p>That from his Vintage rolling Time hath prest,<\/p><p class=\"indented\">Have drunk their Cup a Round or two before,<\/p><p>And one by one crept silently to rest.<\/p>"},{"n":23,"label":"XXIII","verse":"<p>And we, that now make merry in the Room<\/p><p>They left, and Summer dresses in new bloom,<\/p><p class=\"indented\">Ourselves must we beneath the Couch of Earth<\/p><p>Descend--ourselves to make a Couch--for whom?<\/p>"},{"n":24,"label":"XXIV","verse":"<p>Ah, make the most of what we yet may spend,<\/p><p>Before we too into the Dust descend;<\/p><p class=\"indented\">Dust into Dust, and under Dust to lie,<\/p><p>Sans Wine, sans Song, sans Singer, and--sans End!<\/p>"},{"n":25,"label":"XXV","verse":"<p>Alike for those who for TO-DAY prepare,<\/p><p>And those that after some TO-MORROW stare,<\/p><p class=\"indented\">A Muezzin from the Tower of Darkness cries,<\/p><p>&quot;Fools! your Reward is neither Here nor There.&quot;<\/p>"},{"n":26,"label":"XXVI","verse":"<p>Why, all the Saints and Sages who discuss&#x27;d<\/p><p>Of the Two Worlds so wisely--they are thrust<\/p><p class=\"indented\">Like foolish Prophets forth; their Words to Scorn<\/p><p>Are scatter&#x27;d, and their Mouths are stopt with Dust.<\/p>"},{"n":27,"label":"XXVII","verse":"<p>Myself when young did eagerly frequent<\/p><p>Doctor and Saint, and heard great argument<\/p><p class=\"indented\">About it and about: but evermore<\/p><p>Came out by the same door where in I went.<\/p>"},{"n":28,"label":"XXVIII","verse":"<p>With them the seed of Wisdom did I sow,<\/p><p>And with mine own hand wrought to make it grow;<\/p><p class=\"indented\">And this was all the Harvest that I reap&#x27;d--<\/p><p>&quot;I came like Water, and like Wind I go.&quot;<\/p>"},{"n":29,"label":"XXIX","verse":"<p>Into this Universe, and Why not knowing<\/p><p>Nor Whence, like Water willy-nilly flowing;<\/p><p class=\"indented\">And out of it, as Wind along the Waste,<\/p><p>I know not Whither, willy-nilly blowing.<\/p>"},{"n":30,"label":"XXX","verse":"<p>What, without asking, hither hurried Whence?<\/p><p>And, without asking, Whither hurried hence!<\/p><p class=\"indented\">Oh, many a Cup of this forbidden Wine<\/p><p>Must drown the memory of that insolence!<\/p>"},{"n":31,"label":"XXXI","verse":"<p>Up from Earth&#x27;s Center through the Seventh Gate<\/p><p>I rose, and on the Throne of Saturn sate,<\/p><p class=\"indented\">And many a Knot unravel&#x27;d by the Road;<\/p><p>But not the Master-knot of Human Fate.<\/p>"},{"n":32,"label":"XXXII","verse":"<p>There was the Door to which I found no Key;<\/p><p>There was the Veil through which I might not see:<\/p><p class=\"indented\">Some little talk awhile of ME and THEE<\/p><p>There was--and then no more of THEE and ME.<\/p>"},{"n":33,"label":"XXXIII","verse":"<p>Earth could not answer; nor the Seas that mourn<\/p><p>In flowing Purple, of their Lord Forlorn;<\/p><p class=\"indented\">Nor rolling Heaven, with all his Signs reveal&#x27;d<\/p><p>And hidden by the sleeve of Night and Morn.<\/p>"},{"n":34,"label":"XXXIV","verse":"<p>Then of the THEE IN ME who works behind<\/p><p>The Veil, I lifted up my hands to find<\/p><p class=\"indented\">A lamp amid the Darkness; and I heard,<\/p><p>As from Without--&quot;THE ME WITHIN THEE BLIND!&quot;<\/p>"},{"n":35,"label":"XXXV","verse":"<p>Then to the Lip of this poor earthen Urn<\/p><p>I lean&#x27;d, the Secret of my Life to learn:<\/p><p class=\"indented\">And Lip to Lip it murmur&#x27;d--&quot;While you live,<\/p><p>&quot;Drink!--for, once dead, you never shall return.&quot;<\/p>"},{"n":36,"label":"XXXVI","verse":"<p>I think the Vessel, that with fugitive<\/p><p>Articulation answer&#x27;d, once did live,<\/p><p class=\"indented\">And drink; and Ah! the passive Lip I kiss&#x27;d,<\/p><p>How many Kisses might it take--and give!<\/p>"},{"n":37,"label":"XXXVII","verse":"<p>For I remember stopping by the way<\/p><p>To watch a Potter thumping his wet Clay:<\/p><p class=\"indented\">And with its all-obliterated Tongue<\/p><p>It murmur&#x27;d--&quot;Gently, Brother, gently, pray!&quot;<\/p>"},{"n":38,"label":"XXXVIII","verse":"<p>And has not such a Story from of Old<\/p><p>Down Man&#x27;s successive generations roll&#x27;d<\/p><p class=\"indented\">Of such a clod of saturated Earth<\/p><p>Cast by the Maker into Human mold?<\/p>"},{"n":39,"label":"XXXIX","verse":"<p>And not a drop that from our Cups we throw<\/p><p>For Earth to drink of, but may steal below<\/p><p class=\"indented\">To quench the fire of Anguish in some Eye<\/p><p>There hidden--far beneath, and long ago.<\/p>"},{"n":40,"label":"XL","verse":"<p>As then the Tulip for her morning sup<\/p><p>Of Heav&#x27;nly Vintage from the soil looks up,<\/p><p class=\"indented\">Do you devoutly do the like, till Heav&#x27;n<\/p><p>To Earth invert you--like an empty Cup.<\/p>"},{"n":41,"label":"XLI","verse":"<p>Perplext no more with Human or Divine,<\/p><p>To-morrow&#x27;s tangle to the winds resign,<\/p><p class=\"indented\">And lose your fingers in the tresses of<\/p><p>The Cypress-slender Minister of Wine.<\/p>"},{"n":42,"label":"XLII","verse":"<p>And if the Wine you drink, the Lip you press,<\/p><p>End in what All begins and ends in--Yes;<\/p><p class=\"indented\">Think then you are TO-DAY what YESTERDAY<\/p><p>You were--TO-MORROW you shall not be less.<\/p>"},{"n":43,"label":"XLIII","verse":"<p>So when that Angel of the darker Drink<\/p><p>At last shall find you by the river-brink,<\/p><p class=\"indented\">And, offering his Cup, invite your Soul<\/p><p>Forth to your Lips to quaff--you shall not shrink.<\/p>"},{"n":44,"label":"XLIV","verse":"<p>Why, if the Soul can fling the Dust aside,<\/p><p>And naked on the Air of Heaven ride,<\/p><p class=\"indented\">Were&#x27;t not a Shame--were&#x27;t not a Shame for him<\/p><p>In this clay carcass crippled to abide?<\/p>"},{"n":45,"label":"XLV","verse":"<p>&#x27;Tis but a Tent where takes his one day&#x27;s rest<\/p><p>A Sultan to the realm of Death addrest;<\/p><p class=\"indented\">The Sultan rises, and the dark Ferrash<\/p><p>Strikes, and prepares it for another Guest.<\/p>"},{"n":46,"label":"XLVI","verse":"<p>And fear not lest Existence closing your<\/p><p>Account, and mine, should know the like no more;<\/p><p class=\"indented\">The Eternal Saki from that Bowl has pour&#x27;d<\/p><p>Millions of Bubbles like us, and will pour.<\/p>"},{"n":47,"label":"XLVII","verse":"<p>When You and I behind the Veil are past,<\/p><p>Oh, but the long, long while the World shall last,<\/p><p class=\"indented\">Which of our Coming and Departure heeds<\/p><p>As the Sea&#x27;s self should heed a pebble-cast.<\/p>"},{"n":48,"label":"XLVIII","verse":"<p>A Moment&#x27;s Halt--a momentary taste<\/p><p>Of BEING from the Well amid the Waste--<\/p><p class=\"indented\">And Lo!--the phantom Caravan has reach&#x27;d<\/p><p>The NOTHING it set out from--Oh, make haste!<\/p>"},{"n":49,"label":"XLIX","verse":"<p>Would you that spangle of Existence spend<\/p><p>About THE SECRET--quick about it, Friend!<\/p><p class=\"indented\">A Hair perhaps divides the False from True--<\/p><p>And upon what, prithee, may life depend?<\/p>"},{"n":50,"label":"L","verse":"<p>A Hair perhaps divides the False and True;<\/p><p>Yes; and a single Alif were the clue--<\/p><p class=\"indented\">Could you but find it--to the Treasure-house,<\/p><p>And peradventure to THE MASTER too;<\/p>"},{"n":51,"label":"LI","verse":"<p>Whose secret Presence through Creation&#x27;s veins<\/p><p>Running Quicksilver-like eludes your pains;<\/p><p class=\"indented\">Taking all shapes from Mah to Mahi and<\/p><p>They change and perish all--but He remains;<\/p>"},{"n":52,"label":"LII","verse":"<p>A moment guessed--then back behind the Fold<\/p><p>Immerst of Darkness round the Drama roll&#x27;d<\/p><p class=\"indented\">Which, for the Pastime of Eternity,<\/p><p>He doth Himself contrive, enact, behold.<\/p>"},{"n":53,"label":"LIII","verse":"<p>But if in vain, down on the stubborn floor<\/p><p>Of Earth, and up to Heav&#x27;n&#x27;s unopening Door,<\/p><p class=\"indented\">You gaze TO-DAY, while You are You--how then<\/p><p>TO-MORROW, when You shall be You no more?<\/p>"},{"n":54,"label":"LIV","verse":"<p>Waste not your Hour, nor in the vain pursuit<\/p><p>Of This and That endeavor and dispute;<\/p><p class=\"indented\">Better be jocund with the fruitful Grape<\/p><p>Than sadden after none, or bitter, Fruit.<\/p>"},{"n":55,"label":"LV","verse":"<p>You know, my Friends, with what a brave Carouse<\/p><p>I made a Second Marriage in my house;<\/p><p class=\"indented\">Divorced old barren Reason from my Bed,<\/p><p>And took the Daughter of the Vine to Spouse.<\/p>"},{"n":56,"label":"LVI","verse":"<p>For &quot;Is&quot; and &quot;Is-not&quot; though with Rule and Line<\/p><p>And &quot;UP-AND-DOWN&quot; by Logic I define,<\/p><p class=\"indented\">Of all that one should care to fathom, I<\/p><p>was never deep in anything but--Wine.<\/p>"},{"n":57,"label":"LVII","verse":"<p>Ah, by my Computations, People say,<\/p><p>Reduce the Year to better reckoning?--Nay,<\/p><p class=\"indented\">&#x27;Twas only striking from the Calendar<\/p><p>Unborn To-morrow and dead Yesterday.<\/p>"},{"n":58,"label":"LVIII","verse":"<p>And lately, by the Tavern Door agape,<\/p><p>Came shining through the Dusk an Angel Shape<\/p><p class=\"indented\">Bearing a Vessel on his Shoulder; and<\/p><p>He bid me taste of it; and &#x27;twas--the Grape!<\/p>"},{"n":59,"label":"LIX","verse":"<p>The Grape that can with Logic absolute<\/p><p>The Two-and-Seventy jarring Sects confute:<\/p><p class=\"indented\">The sovereign Alchemist that in a trice<\/p><p>Life&#x27;s leaden metal into Gold transmute;<\/p>"},{"n":60,"label":"LX","verse":"<p>The mighty Mahmud, Allah-breathing Lord,<\/p><p>That all the misbelieving and black Horde<\/p><p class=\"indented\">Of Fears and Sorrows that infest the Soul<\/p><p>Scatters before him with his whirlwind Sword.<\/p>"},{"n":61,"label":"LXI","verse":"<p>Why, be this Juice the growth of God, who dare<\/p><p>Blaspheme the twisted tendril as a Snare?<\/p><p class=\"indented\">A Blessing, we should use it, should we not?<\/p><p>And if a Curse--why, then, Who set it there?<\/p>"},{"n":62,"label":"LXII","verse":"<p>I must abjure the Balm of Life, I must,<\/p><p>Scared by some After-reckoning ta&#x27;en on trust,<\/p><p class=\"indented\">Or lured with Hope of some Diviner Drink,<\/p><p>To fill the Cup--when crumbled into Dust!<\/p>"},{"n":63,"label":"LXIII","verse":"<p>Of threats of Hell and Hopes of Paradise!<\/p><p>One thing at least is certain--This Life flies;<\/p><p class=\"indented\">One thing is certain and the rest is Lies;<\/p><p>The Flower that once has blown for ever dies.<\/p>"},{"n":64,"label":"LXIV","verse":"<p>Strange, is it not? that of the myriads who<\/p><p>Before us pass&#x27;d the door of Darkness through,<\/p><p class=\"indented\">Not one returns to tell us of the Road,<\/p><p>Which to discover we must travel too.<\/p>"},{"n":65,"label":"LXV","verse":"<p>The Revelations of Devout and Learn&#x27;d<\/p><p>Who rose before us, and as Prophets burn&#x27;d,<\/p><p class=\"indented\">Are all but Stories, which, awoke from Sleep<\/p><p>They told their comrades, and to Sleep return&#x27;d.<\/p>"},{"n":66,"label":"LXVI","verse":"<p>I sent my Soul through the Invisible,<\/p><p>Some letter of that After-life to spell:<\/p><p class=\"indented\">And by and by my Soul return&#x27;d to me,<\/p><p>And answer&#x27;d &quot;I Myself am Heav&#x27;n and Hell:&quot;<\/p>"},{"n":67,"label":"LXVII","verse":"<p>Heav&#x27;n but the Vision of fulfill&#x27;d Desire,<\/p><p>And Hell the Shadow from a Soul on fire,<\/p><p class=\"indented\">Cast on the Darkness into which Ourselves,<\/p><p>So late emerged from, shall so soon expire.<\/p>"},{"n":68,"label":"LXVIII","verse":"<p>We are no other than a moving row<\/p><p>Of Magic Shadow-shapes that come and go<\/p><p class=\"indented\">Round with the Sun-illumined Lantern held<\/p><p>In Midnight by the Master of the Show;<\/p>"},{"n":69,"label":"LXIX","verse":"<p>But helpless Pieces of the Game He plays<\/p><p>Upon this Chequer-board of Nights and Days;<\/p><p class=\"indented\">Hither and thither moves, and checks, and slays,<\/p><p>And one by one back in the Closet lays.<\/p>"},{"n":70,"label":"LXX","verse":"<p>The Ball no question makes of Ayes and Noes,<\/p><p>But Here or There as strikes the Player goes;<\/p><p class=\"indented\">And He that toss&#x27;d you down into the Field,<\/p><p>He knows about it all--HE knows--HE knows!<\/p>"},{"n":71,"label":"LXXI","verse":"<p>The Moving Finger writes; and, having writ,<\/p><p>Moves on: nor all your Piety nor Wit<\/p><p class=\"indented\">Shall lure it back to cancel half a Line,<\/p><p>Nor all your Tears wash out a Word of it.<\/p>"},{"n":72,"label":"LXXII","verse":"<p>And that inverted Bowl they call the Sky,<\/p><p>Whereunder crawling coop&#x27;d we live and die,<\/p><p class=\"indented\">Lift not your hands to It for help--for It<\/p><p>As impotently moves as you or I.<\/p>"},{"n":73,"label":"LXXIII","verse":"<p>With Earth&#x27;s first Clay They did the Last Man knead,<\/p><p>And there of the Last Harvest sow&#x27;d the Seed:<\/p><p class=\"indented\">And the first Morning of Creation wrote<\/p><p>What the Last Dawn of Reckoning shall read.<\/p>"},{"n":74,"label":"LXXIV","verse":"<p>YESTERDAY This Day&#x27;s Madness did prepare;<\/p><p>TO-MORROW&#x27;s Silence, Triumph, or Despair:<\/p><p class=\"indented\">Drink! for you not know whence you came, nor why:<\/p><p>Drink! for you know not why you go, nor where.<\/p>"},{"n":75,"label":"LXXV","verse":"<p>I tell you this--When, started from the Goal,<\/p><p>Over the flaming shoulders of the Foal<\/p><p class=\"indented\">Of Heav&#x27;n Parwin and Mushtari they flung,<\/p><p>In my predestined Plot of Dust and Soul.<\/p>"},{"n":76,"label":"LXXVI","verse":"<p>The Vine had struck a fiber: which about<\/p><p>If clings my Being--let the Dervish flout;<\/p><p class=\"indented\">Of my Base metal may be filed a Key<\/p><p>That shall unlock the Door he howls without.<\/p>"},{"n":77,"label":"LXXVII","verse":"<p>And this I know: whether the one True Light<\/p><p>Kindle to Love, or Wrath consume me quite,<\/p><p class=\"indented\">One Flash of It within the Tavern caught<\/p><p>Better than in the Temple lost outright.<\/p>"},{"n":78,"label":"LXXVIII","verse":"<p>What! out of senseless Nothing to provoke<\/p><p>A conscious Something to resent the yoke<\/p><p class=\"indented\">Of unpermitted Pleasure, under pain<\/p><p>Of Everlasting Penalties, if broke!<\/p>"},{"n":79,"label":"LXXIX","verse":"<p>What! from his helpless Creature be repaid<\/p><p>Pure Gold for what he lent him dross-allay&#x27;d--<\/p><p class=\"indented\">Sue for a Debt he never did contract,<\/p><p>And cannot answer--Oh the sorry trade!<\/p>"},{"n":80,"label":"LXXX","verse":"<p>Oh Thou, who didst with pitfall and with gin<\/p><p>Beset the Road I was to wander in,<\/p><p class=\"indented\">Thou wilt not with Predestined Evil round<\/p><p>Enmesh, and then impute my Fall to Sin!<\/p>"},{"n":81,"label":"LXXXI","verse":"<p>Oh Thou, who Man of baser Earth didst make,<\/p><p>And ev&#x27;n with Paradise devise the Snake:<\/p><p class=\"indented\">For all the Sin wherewith the Face of Man<\/p><p>Is blacken&#x27;d--Man&#x27;s forgiveness give--and take!<\/p>"},{"n":82,"label":"LXXXII","verse":"<p>As under cover of departing Day<\/p><p>Slunk hunger-stricken Ramazan away,<\/p><p class=\"indented\">Once more within the Potter&#x27;s house alone<\/p><p>I stood, surrounded by the Shapes of Clay.<\/p>"},{"n":83,"label":"LXXXIII","verse":"<p>Shapes of all Sorts and Sizes, great and small,<\/p><p>That stood along the floor and by the wall;<\/p><p class=\"indented\">And some loquacious Vessels were; and some<\/p><p>Listen&#x27;d perhaps, but never talk&#x27;d at all.<\/p>"},{"n":84,"label":"LXXXIV","verse":"<p>Said one among them--&quot;Surely not in vain<\/p><p>My substance of the common Earth was ta&#x27;en<\/p><p class=\"indented\">And to this Figure molded, to be broke,<\/p><p>Or trampled back to shapeless Earth again.&quot;<\/p>"},{"n":85,"label":"LXXXV","verse":"<p>Then said a Second--&quot;Ne&#x27;er a peevish Boy<\/p><p>Would break the Bowl from which he drank in joy;<\/p><p class=\"indented\">And He that with his hand the Vessel made<\/p><p>Will surely not in after Wrath destroy.&quot;<\/p>"},{"n":86,"label":"LXXXVI","verse":"<p>After a momentary silence spake<\/p><p>Some Vessel of a more ungainly Make;<\/p><p class=\"indented\">&quot;They sneer at me for leaning all awry:<\/p><p>What! did the Hand then of the Potter shake?&quot;<\/p>"},{"n":87,"label":"LXXXVII","verse":"<p>Whereat some one of the loquacious Lot--<\/p><p>I think a Sufi pipkin--waxing hot--<\/p><p class=\"indented\">&quot;All this of Pot and Potter--Tell me then,<\/p><p>Who is the Potter, pray, and who the Pot?&quot;<\/p>"},{"n":88,"label":"LXXXVIII","verse":"<p>&quot;Why,&quot; said another, &quot;Some there are who tell<\/p><p>Of one who threatens he will toss to Hell<\/p><p class=\"indented\">The luckless Pots he marr&#x27;d in making--Pish!<\/p><p>He&#x27;s a Good Fellow, and &#x27;twill all be well.&quot;<\/p>"},{"n":89,"label":"LXXXIX","verse":"<p>&quot;Well,&quot; murmured one, &quot;Let whoso make or buy,<\/p><p>My Clay with long Oblivion is gone dry:<\/p><p class=\"indented\">But fill me with the old familiar Juice,<\/p><p>Methinks I might recover by and by.&quot;<\/p>"},{"n":90,"label":"XC","verse":"<p>So while the Vessels one by one were speaking,<\/p><p>The little Moon look&#x27;d in that all were seeking:<\/p><p class=\"indented\">And then they jogg&#x27;d each other, &quot;Brother! Brother!<\/p><p>Now for the Porter&#x27;s shoulders&#x27; knot a-creaking!&quot;<\/p>"},{"n":91,"label":"XCI","verse":"<p>Ah, with the Grape my fading life provide,<\/p><p>And wash the Body whence the Life has died,<\/p><p class=\"indented\">And lay me, shrouded in the living Leaf,<\/p><p>By some not unfrequented Garden-side.<\/p>"},{"n":92,"label":"XCII","verse":"<p>That ev&#x27;n buried Ashes such a snare<\/p><p>Of Vintage shall fling up into the Air<\/p><p class=\"indented\">As not a True-believer passing by<\/p><p>But shall be overtaken unaware.<\/p>"},{"n":93,"label":"XCIII","verse":"<p>Indeed the Idols I have loved so long<\/p><p>Have done my credit in this World much wrong:<\/p><p class=\"indented\">Have drown&#x27;d my Glory in a shallow Cup,<\/p><p>And sold my reputation for a Song.<\/p>"},{"n":94,"label":"XCIV","verse":"<p>Indeed, indeed, Repentance oft before<\/p><p>I swore--but was I sober when I swore?<\/p><p class=\"indented\">And then and then came Spring, and Rose-in-hand<\/p><p>My thread-bare Penitence apieces tore.<\/p>"},{"n":95,"label":"XCV","verse":"<p>And much as Wine has play&#x27;d the Infidel,<\/p><p>And robb&#x27;d me of my Robe of Honor--Well,<\/p><p class=\"indented\">I wonder often what the Vintners buy<\/p><p>One half so precious as the stuff they sell.<\/p>"},{"n":96,"label":"XCVI","verse":"<p>Yet Ah, that Spring should vanish with the Rose!<\/p><p>That Youth&#x27;s sweet-scented manuscript should close!<\/p><p class=\"indented\">The Nightingale that in the branches sang,<\/p><p>Ah whence, and whither flown again, who knows!<\/p>"},{"n":97,"label":"XCVII","verse":"<p>Would but the Desert of the Fountain yield<\/p><p>One glimpse--if dimly, yet indeed, reveal&#x27;d,<\/p><p class=\"indented\">To which the fainting Traveler might spring,<\/p><p>As springs the trampled herbage of the field!<\/p>"},{"n":98,"label":"XCVIII","verse":"<p>Would but some winged Angel ere too late<\/p><p>Arrest the yet unfolded Roll of Fate,<\/p><p class=\"indented\">And make the stern Recorder otherwise<\/p><p>Enregister, or quite obliterate!<\/p>"},{"n":99,"label":"XCIX","verse":"<p>Ah Love! could you and I with Him conspire<\/p><p>To grasp this sorry Scheme of Things entire,<\/p><p class=\"indented\">Would not we shatter it to bits--and then<\/p><p>Re-mold it nearer to the Heart&#x27;s Desire!<\/p>"},{"n":100,"label":"C","verse":"<p>Yon rising Moon that looks for us again--<\/p><p>How oft hereafter will she wax and wane;<\/p><p class=\"indented\">How oft hereafter rising look for us<\/p><p>Through this same Garden--and for one in vain!<\/p>"},{"n":101,"label":"CI","verse":"<p>And when like her, oh Saki, you shall pass<\/p><p>Among the Guests Star-scatter&#x27;d on the Grass,<\/p><p class=\"indented\">And in your joyous errand reach the spot<\/p><p>Where I made One--turn down an empty Glass!<\/p>"}]},"whinfield":{"short":"Wh","label":"E. H. Whinfield","plain":"E. H. Whinfield","year":1883,"unit":"quatrains","dir":"ltr","lang":"en","kind":"verse","title":"E. H. Whinfield, 1883 — 500 quatrains, English verse (literal)","note":"The broadest English verse rendering of the era — nearer a literal quatrain-by-quatrain than a paraphrase.","key":"whinfield","count":500,"quatrains":[{"n":1,"label":"I","verse":"<p>At dawn a cry through all the tavern shrilled,<\/p><p>&quot;Arise my brethren of the revellers&#x27; guild,<\/p><p>That I may fill our measure, full of wine<\/p><p>Or e&#x27;er the measure of our days be filled.&quot;<\/p>"},{"n":2,"label":"II","verse":"<p>Who was it brought thee here at nightfall, who?<\/p><p>Forth from the harem in this manner, who?<\/p><p>To him who in thy absence burns as fire,<\/p><p>And trembles like hot air, who was it, who?<\/p>"},{"n":3,"label":"III","verse":"<p>&#x27;Tis but a day we sojourn here below,<\/p><p>And all the gain we get is grief and woe,<\/p><p>And then, leaving life&#x27;s riddles all unsolved,<\/p><p>And burdened with regrets, we have to go.<\/p>"},{"n":4,"label":"IV","verse":"<p>Khaja! grant one request, and only one,<\/p><p>Wish me God-speed, and get your preaching done;<\/p><p>I walk aright, &#x27;tis you who see awry;<\/p><p>Go! heal your purblind eyes, leave me alone.<\/p>"},{"n":5,"label":"V","verse":"<p>Arise! and come, and of thy courtesy<\/p><p>Resolve my weary heart&#x27;s perplexity,<\/p><p>And fill my goblet, so that I may drink,<\/p><p>Or e&#x27;er they make their goblets out of me.<\/p>"},{"n":6,"label":"VI","verse":"<p>When I am dead, with wine my body lave,<\/p><p>For obit chant a bacchanalian stave,<\/p><p>And, if you need me at the day of doom,<\/p><p>Beneath the tavern threshold seek my grave.<\/p>"},{"n":7,"label":"VII","verse":"<p>Since no one can assure thee of the morrow,<\/p><p>Rejoice thy heart to-day, and banish sorrow<\/p><p>With moonbright wine, fair moon, for heaven&#x27;s moon.<\/p><p>Will look for us in vain on many a morrow.<\/p>"},{"n":8,"label":"VIII","verse":"<p>Let lovers all distraught and frenzied be,<\/p><p>And flown with wine, and reprobates, like me;<\/p><p>When sober, I find everything amiss,<\/p><p>But in my cups cry, &quot;Let what will be, be.&quot;<\/p>"},{"n":9,"label":"IX","verse":"<p>In Allah&#x27;s name, say, wherefore set the wise<\/p><p>Their hearts upon this house of vanities?<\/p><p>Whene&#x27;er they think to rest them from their toils,<\/p><p>Death takes them by the hand, and says, &quot;Arise.&quot;<\/p>"},{"n":10,"label":"X","verse":"<p>Men say the Koran holds all heavenly lore,<\/p><p>But on its pages seldom care to pore;<\/p><p>The lucid lines engraven on the bowl,--<\/p><p>_That_ is the text they dwell on evermore.<\/p>"},{"n":11,"label":"XI","verse":"<p>Blame not the drunkards, you who wine eschew,<\/p><p>Had I but grace, I would abstain like you,<\/p><p>And mark me, vaunting zealot, you commit<\/p><p>A hundredfold worse sins than drunkards do.<\/p>"},{"n":12,"label":"XII","verse":"<p>What though &#x27;tis fair to view, this form of man,<\/p><p>I know not why the heavenly Artisan<\/p><p>Hath set these tulip cheeks and cypress forms<\/p><p>To deck the mournful halls of earth&#x27;s divan.<\/p>"},{"n":13,"label":"XIII","verse":"<p>My fire gives forth no smoke-cloud here below,<\/p><p>My stock-in-trade no profit here below,<\/p><p>And you, who call me tavern-haunter, know<\/p><p>There is indeed no tavern here below<\/p>"},{"n":14,"label":"XIV","verse":"<p>Thus spake an idol to his worshipper,<\/p><p>&quot;Why dost thou worship this dead stone, fair sir?<\/p><p>&#x27;Tis because He who gazeth through thine eyes,<\/p><p>Doth some part of His charms on it confer.&quot;<\/p>"},{"n":15,"label":"XV","verse":"<p>Whate&#x27;er thou doest, never grieve thy brother,<\/p><p>Nor kindle fumes of wrath his peace to smother;<\/p><p>Dost thou desire to taste eternal bliss,<\/p><p>Vex thine own heart, but never vex another!<\/p>"},{"n":16,"label":"XVI","verse":"<p>O Thou! to please whose love and wrath as well,<\/p><p>Allah created heaven and likewise hell;<\/p><p>Thou hast thy court in heaven, and I have naught,<\/p><p>Why not admit me in thy courts to dwell?<\/p>"},{"n":17,"label":"XVII","verse":"<p>So many cups of wine will I consume,<\/p><p>Its bouquet shall exhale from out my tomb,<\/p><p>And every one that passes by shall halt,<\/p><p>And reel and stagger with that mighty fume.<\/p>"},{"n":18,"label":"XVIII","verse":"<p>Young wooer, charm all hearts with lover&#x27;s art,<\/p><p>Glad winner, lead thy paragon apart!<\/p><p>A hundred Ka&#x27;bas equal not one heart,<\/p><p>Seek not the Ka&#x27;ba, rather seek a heart!<\/p>"},{"n":19,"label":"XIX","verse":"<p>What time, my cup in hand, its draughts I drain,<\/p><p>And with rapt heart unconsciousness attain,<\/p><p>Behold what wondrous miracles are wrought,<\/p><p>Songs flow as water from my burning brain.<\/p>"},{"n":20,"label":"XX","verse":"<p>To-day is but a breathing space, quaff wine!<\/p><p>Thou wilt not see again this life of thine;<\/p><p>So, as the world becomes the spoil of time,<\/p><p>Offer thyself to be the spoil of wine!<\/p>"},{"n":21,"label":"XXI","verse":"<p>&#x27;Tis we who to wine&#x27;s yoke our necks incline,<\/p><p>And risk our lives to gain the smiles of wine;<\/p><p>The henchman grasps the flagon by its throat<\/p><p>And squeezes out the lifeblood of the vine.<\/p>"},{"n":22,"label":"XXII","verse":"<p>Here in this tavern haunt I make my lair,<\/p><p>Pawning for wine, heart, soul, and all I wear,<\/p><p>Without a hope of bliss, or fear of bale,<\/p><p>Rapt above water, earth, and fire, and air.<\/p>"},{"n":23,"label":"XXIII","verse":"<p>Quoth fish to duck, &quot;Twill be a sad affair,<\/p><p>If this brook leaves its channel dry and bare&quot;;<\/p><p>To whom the duck, &quot;When I am dead and roasted<\/p><p>The brook may run with wine for aught I care.&quot;<\/p>"},{"n":24,"label":"XXIV","verse":"<p>From doubt to clear assurance is a breath,<\/p><p>A breath from infidelity to faith;<\/p><p>O precious breath! enjoy it while you may,<\/p><p>&#x27;Tis all that life can give, and then comes death.<\/p>"},{"n":25,"label":"XXV","verse":"<p>Ah! wheel of heaven to tyranny inclined,<\/p><p>&#x27;Twas e&#x27;er your wont to show yourself unkind;<\/p><p>And, cruel earth, if they should cleave your breast,<\/p><p>What store of buried jewels they would find!<\/p>"},{"n":26,"label":"XXVI","verse":"<p>My life lasts but a day or two, and fast<\/p><p>Sweeps by, like torrent stream or desert blast,<\/p><p>Howbeit, of two days I take no heed,--<\/p><p>The day to come, and that already past.<\/p>"},{"n":27,"label":"XXVII","verse":"<p>That pearl is from a mine unknown to thee,<\/p><p>That ruby bears a stamp thou canst not see<\/p><p>The tale of love some other tongue must tell,<\/p><p>All our conjectures are mere phantasy.<\/p>"},{"n":28,"label":"XXVIII","verse":"<p>Now with its joyful prime my age is rife,<\/p><p>I quaff enchanting wine, and list to fife;<\/p><p>Chide not at wine for all its bitter taste,<\/p><p>Its bitterness sorts well with human life!<\/p>"},{"n":29,"label":"XXIX","verse":"<p>O soul! whose lot it is to bleed with pain,<\/p><p>And daily change of fortune to sustain,<\/p><p>Into this body wherefore didst thou come,<\/p><p>Seeing thou must at last go forth again?<\/p>"},{"n":30,"label":"XXX","verse":"<p>To-day is thine to spend, but not to-morrow,<\/p><p>Counting on morrows breedeth naught but sorrow;<\/p><p>Oh! squander not this breath that heaven hath lent thee,<\/p><p>Nor make too sure another breath to borrow!<\/p>"},{"n":31,"label":"XXXI","verse":"<p>&#x27;Tis labour lost thus to all doors to crawl,<\/p><p>Take thy good fortune, and thy bad withal;<\/p><p>Know for a surety each must play his game,<\/p><p>As from heaven&#x27;s dice-box fate&#x27;s dice chance to fall.<\/p>"},{"n":32,"label":"XXXII","verse":"<p>This jug did once, like me, love&#x27;s sorrows taste,<\/p><p>And bonds of beauty&#x27;s tresses once embraced,<\/p><p>This handle, which you see upon its side,<\/p><p>Has many a time twined round a slender waist!<\/p>"},{"n":33,"label":"XXXIII","verse":"<p>Days changed to nights, ere you were born, or I,<\/p><p>And on its business ever rolled the sky;<\/p><p>See you tread gently on this dust--perchance<\/p><p>&#x27;Twas once the apple of some beauty&#x27;s eye.<\/p>"},{"n":34,"label":"XXXIV","verse":"<p>Pagodas, just as mosques, are homes of prayer,<\/p><p>&#x27;Tis prayer that church-bells chime unto the air,<\/p><p>Yea, Church and Ka&#x27;ba, Rosary and Cross<\/p><p>Are all but divers tongues of world-wide prayer.<\/p>"},{"n":35,"label":"XXXV","verse":"<p>&#x27;Twas writ at first, whatever was to be,<\/p><p>By pen, unheeding bliss or misery,<\/p><p>Yea, writ upon the tablet once for all,<\/p><p>To murmur or resist is vanity.<\/p>"},{"n":36,"label":"XXXVI","verse":"<p>There is a mystery I know full well,<\/p><p>Which to all, good and bad, I cannot tell;<\/p><p>My words are dark, but I cannot unfold<\/p><p>The secrets of the &quot;station&quot; where I dwell.<\/p>"},{"n":37,"label":"XXXVII","verse":"<p>No base or light-weight coins pass current here,<\/p><p>Of such a broom has swept our dwelling clear<\/p><p>Forth from the tavern comes a sage and cries,<\/p><p>&quot;Drink! for ye all must sleep through ages drear&quot;<\/p>"},{"n":38,"label":"XXXVIII","verse":"<p>With outward seeming we can cheat mankind,<\/p><p>But to God&#x27;s will we can but be resigned,<\/p><p>The deepest wiles my cunning e&#x27;er devised,<\/p><p>To balk resistless fate no way could find.<\/p>"},{"n":39,"label":"XXXIX","verse":"<p>Is a friend faithless? spurn him as a foe;<\/p><p>Upon trustworthy foes respect bestow;<\/p><p>Hold healing poison for an antidote,<\/p><p>And baneful sweets for deadly eisel know.<\/p>"},{"n":40,"label":"XL","verse":"<p>No heart is there but bleeds when torn from Thee,<\/p><p>No sight so clear but craves Thy face to see;<\/p><p>And though perchance Thou carest not for them,<\/p><p>No soul is there but pines with care for Thee.<\/p>"},{"n":41,"label":"XLI","verse":"<p>Sobriety doth dry up all delight,<\/p><p>And drunkenness doth drown my sense outright;<\/p><p>There is a middle state, it is my life,<\/p><p>Not altogether drunk, nor sober quite.<\/p>"},{"n":42,"label":"XLII","verse":"<p>Behold these cups! Can He who deigned to make them,<\/p><p>In wanton freak let ruin overtake them,<\/p><p>So many shapely feet and hands and heads,--<\/p><p>What love drives Him to make, what wrath to break them?<\/p>"},{"n":43,"label":"XLIII","verse":"<p>Death&#x27;s terrors spring from baseless phantasy,<\/p><p>Death yields the tree of immortality;<\/p><p>Since &#x27;Isa breathed new life into my soul,<\/p><p>Eternal death has washed its hands of me!<\/p>"},{"n":44,"label":"XLIV","verse":"<p>Like tulips in the Spring your cups lift up,<\/p><p>And, with a tulip-cheeked companion, sup<\/p><p>With joy your wine, or e&#x27;er this azure wheel<\/p><p>With some unlooked-for blast upset your cup.<\/p>"},{"n":45,"label":"XLV","verse":"<p>Facts will not change to humour man&#x27;s caprice,<\/p><p>So vaunt not human powers, but hold your peace;<\/p><p>Here must we stay, weighed down with grief for this,<\/p><p>That we were born so late, so soon decease.<\/p>"},{"n":46,"label":"XLVI","verse":"<p>Khayyam! why weep you that your life is bad?<\/p><p>What boots it thus to mourn? Rather be glad.<\/p><p>He that sins not can make no claim to mercy,<\/p><p>Mercy was made for sinners--be not sad.<\/p>"},{"n":47,"label":"XLVII","verse":"<p>All mortal ken is bounded by the veil,<\/p><p>To see beyond man&#x27;s sight is all too frail;<\/p><p>Yea! earth&#x27;s dark bosom is his only home;--<\/p><p>Alas! &#x27;twere long to tell the doleful tale.<\/p>"},{"n":48,"label":"XLVIII","verse":"<p>This faithless world, my home, I have surveyed,<\/p><p>Yea, and with all my wit deep question made,<\/p><p>But found no moon with face so bright as thine,<\/p><p>No cypress in such stateliness arrayed.<\/p>"},{"n":49,"label":"XLIX","verse":"<p>In synagogue and cloister, mosque and school,<\/p><p>Hell&#x27;s terrors and heaven&#x27;s lures men&#x27;s bosoms rule,<\/p><p>But they who master Allah&#x27;s mysteries,<\/p><p>Sow not this empty chaff their hearts to fool.<\/p>"},{"n":50,"label":"L","verse":"<p>You see the world, but all you see is naught,<\/p><p>And all you say, and all you hear is naught,<\/p><p>Naught the four quarters of the mighty earth,<\/p><p>The secrets treasured in your chamber naught.<\/p>"},{"n":51,"label":"LI","verse":"<p>I dreamt a sage said, &quot;Wherefore life consume<\/p><p>In sleep? Can sleep make pleasure&#x27;s roses bloom?<\/p><p>For gather not with death&#x27;s twin-brother sleep,<\/p><p>Thou wilt have sleep enough within thy tomb!&quot;<\/p>"},{"n":52,"label":"LII","verse":"<p>If the heart knew life&#x27;s secrets here below,<\/p><p>At death &#x27;twould know God&#x27;s secrets too, I trow;<\/p><p>But, if you know naught here, while still yourself,<\/p><p>To-morrow, stripped of self, what can you know?<\/p>"},{"n":53,"label":"LIII","verse":"<p>On that dread day, when wrath shall rend the sky,<\/p><p>And darkness dim the bright stars&#x27; galaxy,<\/p><p>I&#x27;ll seize the Loved One by His skirt, and cry,<\/p><p>&quot;Why hast Thou doomed these guiltless ones to die?&quot;<\/p>"},{"n":54,"label":"LIV","verse":"<p>To knaves Thy secret we must not confide,<\/p><p>To comprehend it is to fools denied,<\/p><p>See then to what hard case Thou doomest men,<\/p><p>Our hopes from one and all perforce we hide.<\/p>"},{"n":55,"label":"LV","verse":"<p>Cupbearer! what though fate&#x27;s blows here betide us,<\/p><p>And a safe resting-place be here denied us,<\/p><p>So long as the bright wine-cup stands between us,<\/p><p>We have the very Truth at hand to guide us.<\/p>"},{"n":56,"label":"LVI","verse":"<p>Long time in wine and rose I took delight,<\/p><p>But then my business never went aright;<\/p><p>Since wine could not accomplish my desire,<\/p><p>I have abandoned and forsworn it quite.<\/p>"},{"n":57,"label":"LVII","verse":"<p>Bring wine! my heart with dancing spirits teems,<\/p><p>Wake! fortune&#x27;s waking is as fleeting dreams;<\/p><p>Quicksilver-like our days are swift of foot,<\/p><p>And youthful fire subsides as torrent streams.<\/p>"},{"n":58,"label":"LVIII","verse":"<p>Love&#x27;s devotees, not Moslems here you see,<\/p><p>Not Solomons, but ants of low degree;<\/p><p>Here are but faces wan and tattered rags,<\/p><p>No store of Cairene cloth or silk have we.<\/p>"},{"n":59,"label":"LIX","verse":"<p>My law it is in pleasure&#x27;s paths to stray,<\/p><p>My creed to shun the theologic fray;<\/p><p>I wedded Luck, and offered her a dower,<\/p><p>She said, &quot;I want none, so thy heart be gay.&quot;<\/p>"},{"n":60,"label":"LX","verse":"<p>From mosque an outcast, and to church a foe,<\/p><p>Allah! of what clay didst thou form me so?<\/p><p>Like sceptic monk, or ugly courtesan,<\/p><p>No hopes have I above, no joys below.<\/p>"},{"n":61,"label":"LXI","verse":"<p>Men&#x27;s lusts, like house-dogs, still the house distress<\/p><p>With clamour, barking for mere wantonness;<\/p><p>Foxes are they, and sleep the sleep of hares;<\/p><p>Crafty as wolves, as tigers pitiless.<\/p>"},{"n":62,"label":"LXII","verse":"<p>Yon turf, fringing the margent of the stream,<\/p><p>As down upon a cherub&#x27;s lip might seem,<\/p><p>Or growth from dust of buried tulip cheeks;<\/p><p>Tread not that turf with scorn, or light esteem!<\/p>"},{"n":63,"label":"LXIII","verse":"<p>Hearts with the light of love illumined well,<\/p><p>Whether in mosque or synagogue they dwell,<\/p><p>Have _their_ names written in the book of love,<\/p><p>Unvexed by hopes of heaven or fears of hell.<\/p>"},{"n":64,"label":"LXIV","verse":"<p>One draught of wine outweighs the realm of Tus,<\/p><p>Throne of Kobad and crown of Kai Kawus;<\/p><p>Sweeter are sighs that lovers heave at morn,<\/p><p>Than all the groanings zealot breasts produce.<\/p>"},{"n":65,"label":"LXV","verse":"<p>Though Moslems for my sins condemn and chide me,<\/p><p>Like heathens to my idol I confide me;<\/p><p>Yea, when I perish of a drunken bout,<\/p><p>I&#x27;ll call on wine, whatever doom betide me.<\/p>"},{"n":66,"label":"LXVI","verse":"<p>In drinking thus it is not my design<\/p><p>To riot, or transgress the law divine,<\/p><p>No! to attain unconsciousness of self<\/p><p>Is the sole cause I drink me drunk with wine.<\/p>"},{"n":67,"label":"LXVII","verse":"<p>Drunkards are doomed to hell, so men declare,<\/p><p>Believe it not, &#x27;tis but a foolish scare;<\/p><p>Heaven will be empty as this hand of mine,<\/p><p>If none who love good drink find entrance there.<\/p>"},{"n":68,"label":"LXVIII","verse":"<p>&#x27;Tis wrong, according to the strict Koran,<\/p><p>To drink in Rajah, likewise in Sha&#x27;ban,<\/p><p>God and the Prophet claim those months as theirs;<\/p><p>Was Ramazan then made for thirsty man?<\/p>"},{"n":69,"label":"LXIX","verse":"<p>Now Ramazan is come, no wine must flow,<\/p><p>Our simple pastimes we must now forego,<\/p><p>The wine we have in store we must not drink,<\/p><p>Nor on our mistresses one kiss bestow.<\/p>"},{"n":70,"label":"LXX","verse":"<p>What is the world? A _caravanserai_,<\/p><p>A pied pavilion of night and day;<\/p><p>A feast whereat a thousand Jamshids sat,<\/p><p>A couch whereon a thousand Bahrams lay.<\/p>"},{"n":71,"label":"LXXI","verse":"<p>Now that your roses bloom with flowers of bliss,<\/p><p>To grasp your goblets be not so remiss,<\/p><p>Drink while you may! Time is a treacherous foe,<\/p><p>You may not see another day like this.<\/p>"},{"n":72,"label":"LXXII","verse":"<p>Here in this palace, where Bahram held sway,<\/p><p>The wild roes drop their young, and tigers stray;<\/p><p>And that great hunter king--ah! well-a-day!<\/p><p>Now to the hunter death is fallen a prey.<\/p>"},{"n":73,"label":"LXXIII","verse":"<p>Down fall the tears from skies enwrapt in gloom,<\/p><p>Without this drink, the flowers could never bloom!<\/p><p>As now these flowerets yield delight to me,<\/p><p>So shall my dust yield flowers,--God knows for whom.<\/p>"},{"n":74,"label":"LXXIV","verse":"<p>To-day is Friday, as the Moslem says,<\/p><p>Drink then from bowls served up in quick relays;<\/p><p>Suppose on common days you drink one bowl,<\/p><p>To-day drink two, for &#x27;tis the prince of days.<\/p>"},{"n":75,"label":"LXXV","verse":"<p>The _very_ wine a myriad forms sustains,<\/p><p>And to take shapes of plants and creatures deigns<\/p><p>But deem not that its essence ever dies,<\/p><p>Its forms may perish, but its self remains.<\/p>"},{"n":76,"label":"LXXVI","verse":"<p>&#x27;Tis naught but smoke this people&#x27;s fire doth bear,<\/p><p>For my well-being not a soul doth care;<\/p><p>With hands fate makes me lift up in despair,<\/p><p>I grasp men&#x27;s skirts, but find no succour there.<\/p>"},{"n":77,"label":"LXXVII","verse":"<p>This bosom friend, on whom you so rely,<\/p><p>Seems to clear wisdom&#x27;s eyes an enemy;<\/p><p>Choose not your friends from this rude multitude,<\/p><p>Their converse is a plague &#x27;tis best to fly.<\/p>"},{"n":78,"label":"LXXVIII","verse":"<p>O foolish one! this moulded earth is naught,<\/p><p>This particoloured vault of heaven is naught;<\/p><p>Our sojourn in this seat of life and death<\/p><p>Is but one breath, and what is that but naught?<\/p>"},{"n":79,"label":"LXXIX","verse":"<p>Some wine, a Houri (Houris if there be),<\/p><p>A green bank by a stream, with minstrelsy;--<\/p><p>Toil not to find a better Paradise<\/p><p>If other Paradise indeed there be!<\/p>"},{"n":80,"label":"LXXX","verse":"<p>To the wine-house I saw the sage repair,<\/p><p>Bearing a wine-cup, and a mat for prayer;<\/p><p>I said, &quot;O Shaikh, what does this conduct mean?&quot;<\/p><p>Said he, &quot;Go drink! the world is naught but air.&quot;<\/p>"},{"n":81,"label":"LXXXI","verse":"<p>The Bulbul to the garden winged his way,<\/p><p>Viewed lily cups, and roses smiling gay,<\/p><p>Cried in ecstatic notes, &quot;O live your life,<\/p><p>You never will re-live this fleeting day.&quot;<\/p>"},{"n":82,"label":"LXXXII","verse":"<p>Thy body is a tent, where harbourage<\/p><p>The Sultan spirit takes for one brief age;<\/p><p>When he departs, comes the tent-pitcher death,<\/p><p>Strikes it, and onward moves, another stage.<\/p>"},{"n":83,"label":"LXXXIII","verse":"<p>Khayyam, who long time stitched the tents of learning,<\/p><p>Has fallen into a furnace, and lies burning,<\/p><p>Death&#x27;s shears have cut his thread of life asunder,<\/p><p>Fate&#x27;s brokers sell him off with scorn and spurning.<\/p>"},{"n":84,"label":"LXXXIV","verse":"<p>In the sweet spring a grassy bank I sought,<\/p><p>And thither wine, and a fair Houri brought;<\/p><p>And, though the people called me graceless dog,<\/p><p>Gave not to Paradise another thought!<\/p>"},{"n":85,"label":"LXXXV","verse":"<p>Sweet is rose-ruddy wine in goblets gay,<\/p><p>And sweet are lute and harp and roundelay;<\/p><p>But for the zealot who ignores the cup,<\/p><p>&#x27;Tis sweet when he is twenty leagues away!<\/p>"},{"n":86,"label":"LXXXVI","verse":"<p>Life, void of wine, and minstrels with their lutes,<\/p><p>And the soft murmurs of Irakian flutes,<\/p><p>Were nothing worth: I scan the world and see:<\/p><p>Save pleasure, life yields only bitter fruits.<\/p>"},{"n":87,"label":"LXXXVII","verse":"<p>Make haste! soon must you quit this life below,<\/p><p>And pass the veil, and Allah&#x27;s secrets know,<\/p><p>Make haste to take your pleasure while you may,<\/p><p>You wot not whence you come, nor whither go.<\/p>"},{"n":88,"label":"LXXXVIII","verse":"<p>Depart we must! what boots it then to be,<\/p><p>To walk in

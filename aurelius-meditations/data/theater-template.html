<!DOCTYPE html>
<html lang="en" data-theme="dark-violet">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditations — Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Palette blocks are reader-casaubon.html's, verbatim. Default dark-violet:
   the stage is dark, matching gibran-prophet/theater.html. */
:root{
  --font-serif:'EB Garamond',Georgia,serif;
  --font-sans:'Jost',-apple-system,Helvetica Neue,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-greek:'EB Garamond',Georgia,serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text-secondary:#7a6a52;--border:#d4c8a8;--accent:#8b6914;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(245,239,224,.94);--sheet-bg:#ede5d0}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(250,248,243,.94);--sheet-bg:#f2efe8}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn-bg:rgba(0,0,0,.06);--bar-bg:rgba(255,255,255,.92);--sheet-bg:#f5f5f5}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text-secondary:#8490aa;--border:#333;--accent:#9b7aed;--btn-bg:rgba(255,255,255,.08);--bar-bg:rgba(26,26,26,.95);--sheet-bg:#222}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text-secondary:#546080;--border:#1c2440;--accent:#2e6ab4;--btn-bg:rgba(255,255,255,.06);--bar-bg:rgba(0,0,0,.95);--sheet-bg:#0a0a0a}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-serif);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font-family:inherit;color:inherit}

#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:80px 24px}
#view{max-width:660px;width:100%;max-height:100%;overflow-y:auto;text-align:center;transition:opacity .28s ease}
#view.fading{opacity:0}
.t-num{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-secondary);opacity:.7;margin-bottom:8px}
.t-ord{font-family:var(--font-serif);font-size:clamp(40px,7vw,68px);line-height:1;color:var(--accent);opacity:.85;margin-bottom:6px}
.t-rule{width:60px;height:1px;background:var(--border);margin:0 auto 30px}
.t-text{font-size:clamp(19px,2.4vw,23px);line-height:1.9;text-align:left}
.t-text p{margin:0 0 1em}
.t-text p:last-child{margin-bottom:0}
.t-greek{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);font-size:18px;line-height:2;color:var(--text-secondary);text-align:left}
.t-greek p{margin:0 0 .8em}

#controls{position:fixed;bottom:0;left:0;right:0;height:60px;z-index:10;background:var(--bar-bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;font-family:var(--font-sans);opacity:1;transition:opacity .3s}
#controls.hidden{opacity:0;pointer-events:none}
.c-btn{width:40px;height:40px;border:none;background:transparent;color:var(--text-secondary);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.c-btn:hover{background:var(--btn-bg);color:var(--text)}
.c-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.c-btn.on{color:var(--accent);background:var(--btn-bg)}
#pos{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums;min-width:82px;text-align:center}
#bk{position:fixed;top:20px;left:0;right:0;text-align:center;font-family:var(--font-sans);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-secondary);opacity:.6;pointer-events:none;z-index:5}
#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);z-index:11;transition:width .25s}

.theme-dots{display:flex;gap:8px;align-items:center}
.theme-dot{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;padding:0;position:relative}
.theme-dot::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% + 8px);height:40px}
.theme-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dot.active{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.theme-dot[data-theme="sepia"]{background:#d4c8a8}
.theme-dot[data-theme="light-purple"]{background:#c9b8e8}
.theme-dot[data-theme="light-azure"]{background:#d4e8f7}
.theme-dot[data-theme="dark-violet"]{background:#4a3a6a}
.theme-dot[data-theme="dark-blue"]{background:#1e2a4a}
@media (prefers-reduced-motion:reduce){#view,#controls,#progress{transition:none}}
</style>
</head>
<body>
<div id="progress" style="width:0"></div>
<div id="bk"></div>
<main id="stage"><div id="view" aria-live="polite"></div></main>
<nav id="controls">
  <button class="c-btn" id="prev" aria-label="Previous passage">&#8592;</button>
  <span id="pos"></span>
  <button class="c-btn" id="next" aria-label="Next passage">&#8594;</button>
  <button class="c-btn" id="greek-btn" aria-label="Toggle Greek text" aria-pressed="false">&#913;&#945;</button>
  <div class="theme-dots" role="group" aria-label="Theme" id="theme-dots"></div>
</nav>
<script>
const DATA = __DATA__;
const PREFS_KEY = 'meditations-theater-prefs';
const THEMES = {sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};
const P = DATA.passages;
let idx = 0, showGreek = false;
const $ = id => document.getElementById(id);

function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify({theme:document.documentElement.dataset.theme, greek:showGreek})); }catch(e){} }
function loadPrefs(){
  let p=null; try{ p=JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); }catch(e){}
  if(!p) return;
  if(p.theme && THEMES[p.theme]) document.documentElement.dataset.theme = p.theme;
  showGreek = !!p.greek;
}
function writeHash(){ history.replaceState(null,'','#m-'+P[idx].id); }
function readHash(){
  const m = location.hash.match(/^#m-(\d+\.\d+)$/); if(!m) return false;
  const i = P.findIndex(p => p.id === m[1]); if(i<0) return false;
  idx = i; return true;
}
function render(){
  const p = P[idx], bk = DATA.books.find(b => b.n === p.bnum);
  const v = $('view');
  v.classList.add('fading');
  setTimeout(() => {
    let h = '<div class="t-num">' + bk.roman + ' &middot; ' + p.num + '</div>';
    h += '<div class="t-ord">' + p.num + '</div><div class="t-rule"></div>';
    h += '<div class="t-text">' + p.text + '</div>';
    if(showGreek && p.greek) h += '<div class="t-greek" lang="grc">' + p.greek + '</div>';
    v.innerHTML = h; v.scrollTop = 0; v.classList.remove('fading');
  }, 180);
  $('bk').textContent = bk.title + (bk.subtitle ? ' — ' + bk.subtitle : '');
  $('pos').textContent = (idx+1) + ' / ' + P.length;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === P.length-1;
  $('progress').style.width = ((idx+1)/P.length*100) + '%';
  $('greek-btn').setAttribute('aria-pressed', String(showGreek));
  $('greek-btn').classList.toggle('on', showGreek);
  writeHash();
}
function go(d){ const n = idx+d; if(n<0||n>=P.length) return; idx=n; render(); }
function buildThemes(){
  const w = $('theme-dots'); w.innerHTML='';
  Object.keys(THEMES).forEach(t => {
    const b=document.createElement('button'); b.type='button';
    b.className='theme-dot'+(document.documentElement.dataset.theme===t?' active':'');
    b.dataset.theme=t; b.setAttribute('aria-label',THEMES[t]+' theme');
    b.addEventListener('click',e=>{e.stopPropagation();document.documentElement.dataset.theme=t;buildThemes();savePrefs();});
    w.appendChild(b);
  });
}
$('prev').addEventListener('click', e=>{e.stopPropagation();go(-1)});
$('next').addEventListener('click', e=>{e.stopPropagation();go(1)});
$('greek-btn').addEventListener('click', e=>{e.stopPropagation();showGreek=!showGreek;render();savePrefs()});
$('stage').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='j'||e.key===' '){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='k'){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ e.preventDefault(); idx=0; render(); }
  else if(e.key==='End'){ e.preventDefault(); idx=P.length-1; render(); }
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50) go(dx<0?1:-1);
},{passive:true});
window.addEventListener('hashchange',()=>{ if(readHash()) render(); });
loadPrefs(); readHash(); buildThemes(); render();
</script>
</body>
</html>

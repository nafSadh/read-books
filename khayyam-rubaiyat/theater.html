t\" dir=\"ltr\" lang=\"en-fa-Latn\">dr kargh kvzh gran kvzh shvym<\/p>"},{"n":127,"label":"۱۲۷","verse":"<p class=\"fa\">چون نیست مقام ما در این دهر مُقیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn nyst mqam ma dr ayn dhr moqym<\/p><p class=\"fa\">پس بی می و معشوق خطائی است عظیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ps by my v m&#x27;shvq khtaiy ast &#x27;zym<\/p><p class=\"fa\">تا کی ز قدیم و محدث امّیدم و بیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta ky z qdym v mhds ammydm v bym<\/p><p class=\"fa\">چون من برفتم جهان چه محدث چه قدیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn mn brftm jhan chh mhds chh qdym<\/p>"},{"n":128,"label":"۱۲۸","verse":"<p class=\"fa\">خورشید بگل نهفت می نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvrshyd bgl nhft my ntvanm<\/p><p class=\"fa\">و اسرار زمانه گفت می نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">v asrar zmanh gft my ntvanm<\/p><p class=\"fa\">از بحر تفکّرم برآورد خِرَد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az bhr tfkkrm brāvrd kherad<\/p><p class=\"fa\">دُرّی که ز بیم سفت می‌نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dorry kh z bym sft my-ntvanm<\/p>"},{"n":129,"label":"۱۲۹","verse":"<p class=\"fa\">دشمن بغلط گفت که من فلسفیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dshmn bghlt gft kh mn flsfym<\/p><p class=\"fa\">ایزد داند که آنچه او گفت نیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayzd dand kh ānchh av gft nym<\/p><p class=\"fa\">لیکن چو درین غم آشیان آمده‌ام<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">lykn chv dryn ghm āshyan āmdh-am<\/p><p class=\"fa\">آخر کم از آنکه من بدانم که کیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ākhr km az ānkh mn bdanm kh kym<\/p>"},{"n":130,"label":"۱۳۰","verse":"<p class=\"fa\">مائیم که اصل شادی و کانِ غمیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">maiym kh asl shady v kane ghmym<\/p><p class=\"fa\">سرمایهٔ دادیم و نهادِ ستمیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">srmayhٔ dadym v nhade stmym<\/p><p class=\"fa\">پستیم و بلندیم و کمالیم و کمیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pstym v blndym v kmalym v kmym<\/p><p class=\"fa\">آئینهٔ زنگ خورده و جام جمیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āiynhٔ zng khvrdh v jam jmym<\/p>"},{"n":131,"label":"۱۳۱","verse":"<p class=\"fa\">من می نه ز بهر تنگدستی نخورم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn my nh z bhr tngdsty nkhvrm<\/p><p class=\"fa\">یا از غم رسوائی و مستی نخورم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ya az ghm rsvaiy v msty nkhvrm<\/p><p class=\"fa\">من می ز برای خوشدلی میخوردم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn my z bray khvshdly mykhvrdm<\/p><p class=\"fa\">اکنون که تو بر دلم نشستی نخورم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aknvn kh tv br dlm nshsty nkhvrm<\/p>"},{"n":132,"label":"۱۳۲","verse":"<p class=\"fa\">من بی می ناب زیستن نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn by my nab zystn ntvanm<\/p><p class=\"fa\">بی باده کشید بار تن نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">by badh kshyd bar tn ntvanm<\/p><p class=\"fa\">من بندهٔ آن دَمَم که ساقی گوید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn bndhٔ ān damam kh saqy gvyd<\/p><p class=\"fa\">یک جام دگر بگیر و من نتوانم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jam dgr bgyr v mn ntvanm<\/p>"},{"n":133,"label":"۱۳۳","verse":"<p class=\"fa\">هر یک چندی یکی برآید که منم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr yk chndy yky brāyd kh mnm<\/p><p class=\"fa\">با نعمت و با سیم و زر آید که منم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba n&#x27;mt v ba sym v zr āyd kh mnm<\/p><p class=\"fa\">چون کارک او نظام گیرد روزی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn kark av nzam gyrd rvzy<\/p><p class=\"fa\">ناگه اجل از کمین درآید که منم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nagh ajl az kmyn drāyd kh mnm<\/p>"},{"n":134,"label":"۱۳۴","verse":"<p class=\"fa\">یک چند بکودکی باُستاد شدیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk chnd bkvdky baostad shdym<\/p><p class=\"fa\">یک چند باُستادی خود شاد شدیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk chnd baostady khvd shad shdym<\/p><p class=\"fa\">پایان سخن شنو که ما را چه رسید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">payan skhn shnv kh ma ra chh rsyd<\/p><p class=\"fa\">از خاک درآمدیم و بر باد شدیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az khak drāmdym v br bad shdym<\/p>"},{"n":135,"label":"۱۳۵","verse":"<p class=\"fa\">یک روز ز بند عالم آزاد نیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk rvz z bnd &#x27;alm āzad nym<\/p><p class=\"fa\">یکدم زدن از وجود خود شاد نیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ykdm zdn az vjvd khvd shad nym<\/p><p class=\"fa\">شاگردی روزگار کردم بسیار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shagrdy rvzgar krdm bsyar<\/p><p class=\"fa\">در کار جهان هنوز اُستاد نیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr kar jhan hnvz aostad nym<\/p>"},{"n":136,"label":"۱۳۶","verse":"<p class=\"fa\">از دی که گذشت هیچ ازو یاد مکن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az dy kh gzsht hych azv yad mkn<\/p><p class=\"fa\">فردا که نیامده است فریاد مکن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda kh nyamdh ast fryad mkn<\/p><p class=\"fa\">بر نامَده و گذشته بنیاد مکن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br namadh v gzshth bnyad mkn<\/p><p class=\"fa\">حالی خوش باش و عمر بر باد مکن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">haly khvsh bash v &#x27;mr br bad mkn<\/p>"},{"n":137,"label":"۱۳۷","verse":"<p class=\"fa\">ای دیده اگر کور نهٔ گور ببین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay dydh agr kvr nhٔ gvr bbyn<\/p><p class=\"fa\">وین عالم پُر فتنه و پر شور ببین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vyn &#x27;alm por ftnh v pr shvr bbyn<\/p><p class=\"fa\">شاهان و سران و سروران زیر گلَند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shahan v sran v srvran zyr gland<\/p><p class=\"fa\">روهای چو مه در دهن مور ببین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rvhay chv mh dr dhn mvr bbyn<\/p>"},{"n":138,"label":"۱۳۸","verse":"<p class=\"fa\">برخیز و مخور غم جهانِ گذران<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brkhyz v mkhvr ghm jhane gzran<\/p><p class=\"fa\">بنشین و دَمی بشادمانی گذران<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnshyn v damy bshadmany gzran<\/p><p class=\"fa\">در طبع جهان اگر وفائی بودی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr tb&#x27; jhan agr vfaiy bvdy<\/p><p class=\"fa\">نوبت بتو خود نیامدی از دگران<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nvbt btv khvd nyamdy az dgran<\/p>"},{"n":139,"label":"۱۳۹","verse":"<p class=\"fa\">چون حاصل آدمی در این شورستان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn hasl ādmy dr ayn shvrstan<\/p><p class=\"fa\">جز خوردن غصّه نیست تا کَندنِ جان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jz khvrdn ghssh nyst ta kandne jan<\/p><p class=\"fa\">خرّم دل آنکه زین جهان زود برفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khrrm dl ānkh zyn jhan zvd brft<\/p><p class=\"fa\">و آسوده کسیکه خود نیامد بجهان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">v āsvdh ksykh khvd nyamd bjhan<\/p>"},{"n":140,"label":"۱۴۰","verse":"<p class=\"fa\">رفتم که درین منزل بیداد بدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rftm kh dryn mnzl bydad bdn<\/p><p class=\"fa\">در دست نخواهد بجز از باد بدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dst nkhvahd bjz az bad bdn<\/p><p class=\"fa\">آنرا باید بمرگ من شاد بدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ānra bayd bmrg mn shad bdn<\/p><p class=\"fa\">کز دست اجل تواند آزاد بدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kz dst ajl tvand āzad bdn<\/p>"},{"n":141,"label":"۱۴۱","verse":"<p class=\"fa\">رندی دیدم نشسته بر خنگ زمین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rndy dydm nshsth br khng zmyn<\/p><p class=\"fa\">نه کفر و نه اسلام و نه دنیا و نه دین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nh kfr v nh aslam v nh dnya v nh dyn<\/p><p class=\"fa\">نه حقّ نه حقیقت نه شریعت نه یقین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nh hqq nh hqyqt nh shry&#x27;t nh yqyn<\/p><p class=\"fa\">اندر دو جهان کرا بود زهرهٔ این<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">andr dv jhan kra bvd zhrhٔ ayn<\/p>"},{"n":142,"label":"۱۴۲","verse":"<p class=\"fa\">قانع بیک استخوان چو کرکس بودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qan&#x27; byk astkhvan chv krks bvdn<\/p><p class=\"fa\">به زانکه طفیل خوانِ ناکس بودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bh zankh tfyl khvane naks bvdn<\/p><p class=\"fa\">با نان جوینِ خویش حقّا که به است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba nan jvyne khvysh hqqa kh bh ast<\/p><p class=\"fa\">کالوده بپالوده هر خَس بودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kalvdh bpalvdh hr khas bvdn<\/p>"},{"n":143,"label":"۱۴۳","verse":"<p class=\"fa\">قومی متفکّرند اندر رهِ دین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qvmy mtfkkrnd andr rhe dyn<\/p><p class=\"fa\">قومی بگمان فتاده در راه یقین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qvmy bgman ftadh dr rah yqyn<\/p><p class=\"fa\">میترسم از آنکه بانگ آید روزی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mytrsm az ānkh bang āyd rvzy<\/p><p class=\"fa\">کای بیخبران راه نه آنست و نه این<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kay bykhbran rah nh ānst v nh ayn<\/p>"},{"n":144,"label":"۱۴۴","verse":"<p class=\"fa\">گاوی است در آسمان و نامش پروین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gavy ast dr āsman v namsh prvyn<\/p><p class=\"fa\">یک گاو دگر نهفته در زیر زمین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk gav dgr nhfth dr zyr zmyn<\/p><p class=\"fa\">چشم خِرَدَت باز کن از روی یقین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chshm kheradat baz kn az rvy yqyn<\/p><p class=\"fa\">زیر و زبر دو گاو مشتی خر بین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zyr v zbr dv gav mshty khr byn<\/p>"},{"n":145,"label":"۱۴۵","verse":"<p class=\"fa\">گر بر فلکم دست بُدی چون یزدان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr br flkm dst body chvn yzdan<\/p><p class=\"fa\">برداشتمی من این فلک را ز میان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brdashtmy mn ayn flk ra z myan<\/p><p class=\"fa\">وز نو فلکی دگر چنان ساختمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz nv flky dgr chnan sakhtmy<\/p><p class=\"fa\">کازاده بکام دل رسیدی آسان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kazadh bkam dl rsydy āsan<\/p>"},{"n":146,"label":"۱۴۶","verse":"<p class=\"fa\">مشنو سخن از زمانه ساز آمدگان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mshnv skhn az zmanh saz āmdgan<\/p><p class=\"fa\">می‌خواه مروّق بطراز آمدگان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my-khvah mrvvq btraz āmdgan<\/p><p class=\"fa\">رفتند یکان یکان فراز آمدگان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rftnd ykan ykan fraz āmdgan<\/p><p class=\"fa\">کس می ندهد نشان ز بازآمدگان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks my ndhd nshan z bazāmdgan<\/p>"},{"n":147,"label":"۱۴۷","verse":"<p class=\"fa\">می خوردن و گِردِ نیکوان گردیدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvrdn v gerde nykvan grdydn<\/p><p class=\"fa\">به زانکه بزرق زاهدی ورزیدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bh zankh bzrq zahdy vrzydn<\/p><p class=\"fa\">گر عاشق و مست دوزخی خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr &#x27;ashq v mst dvzkhy khvahd bvd<\/p><p class=\"fa\">پس روی بهشت کس نخواهد دیدن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ps rvy bhsht ks nkhvahd dydn<\/p>"},{"n":148,"label":"۱۴۸","verse":"<p class=\"fa\">نتوان دل شاد را بغم فرسودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ntvan dl shad ra bghm frsvdn<\/p><p class=\"fa\">وقت خوش خود بسنگ محنت سودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vqt khvsh khvd bsng mhnt svdn<\/p><p class=\"fa\">کس غیب چه داند که چه خواهد بودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks ghyb chh dand kh chh khvahd bvdn<\/p><p class=\"fa\">می باید و معشوق و بکام آسودن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my bayd v m&#x27;shvq v bkam āsvdn<\/p>"},{"n":149,"label":"۱۴۹","verse":"<p class=\"fa\">آن قصر که بر چرخ همی زد پهلو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān qsr kh br chrkh hmy zd phlv<\/p><p class=\"fa\">بر درگَهِ او شهان نهادندی رو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br drgahe av shhan nhadndy rv<\/p><p class=\"fa\">دیدیم که بر کنگره‌اش فاختهٔ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dydym kh br kngrh-ash fakhthٔ<\/p><p class=\"fa\">بنشسته همی گفت که کو کو کو کو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnshsth hmy gft kh kv kv kv kv<\/p>"},{"n":150,"label":"۱۵۰","verse":"<p class=\"fa\">از آمدن و رفتن ما سودی کو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az āmdn v rftn ma svdy kv<\/p><p class=\"fa\">وز تار امید عمر ما پودی کو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz tar amyd &#x27;mr ma pvdy kv<\/p><p class=\"fa\">چندین سر و پای نازنینانِ جهان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chndyn sr v pay naznynane jhan<\/p><p class=\"fa\">میسوزد و خاک میشود دودی کو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mysvzd v khak myshvd dvdy kv<\/p>"},{"n":151,"label":"۱۵۱","verse":"<p class=\"fa\">از تن چو برفت جانِ پاکِ من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az tn chv brft jane pake mn v tv<\/p><p class=\"fa\">خشتی دو نهند بر مغاک من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khshty dv nhnd br mghak mn v tv<\/p><p class=\"fa\">وانگاه برای خشت گورِ دگران<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vangah bray khsht gvre dgran<\/p><p class=\"fa\">در کالبدی کشند خاک من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr kalbdy kshnd khak mn v tv<\/p>"},{"n":152,"label":"۱۵۲","verse":"<p class=\"fa\">می خور که فلک بهر هلاکِ من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh flk bhr hlake mn v tv<\/p><p class=\"fa\">قصدی دارد بجانِ پاکِ من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qsdy dard bjane pake mn v tv<\/p><p class=\"fa\">در سبزه نشین و میِ روشن میخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr sbzh nshyn v mye rvshn mykhvr<\/p><p class=\"fa\">کاین سبزه بسی دَمَد ز خاکِ من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn sbzh bsy damad z khake mn v tv<\/p>"},{"n":153,"label":"۱۵۳","verse":"<p class=\"fa\">از هرچه بجز میَ است کوتاهی به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az hrchh bjz mya ast kvtahy bh<\/p><p class=\"fa\">می هم ز کف بُتان خرگاهی به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my hm z kf botan khrgahy bh<\/p><p class=\"fa\">مستیّ و قلندری و گمراهی به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mstyy v qlndry v gmrahy bh<\/p><p class=\"fa\">یک جرعهٔ می ز ماه تا ماهی به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jr&#x27;hٔ my z mah ta mahy bh<\/p>"},{"n":154,"label":"۱۵۴","verse":"<p class=\"fa\">بنگر ز صبا دامنِ گُل چاک شده<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bngr z sba damne gol chak shdh<\/p><p class=\"fa\">بلبل ز جمال گُل طربناک شده<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">blbl z jmal gol trbnak shdh<\/p><p class=\"fa\">در سایهٔ گُل نشین که بسیار این گُل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr sayhٔ gol nshyn kh bsyar ayn gol<\/p><p class=\"fa\">در خاک فرو ریزد و ما خاک شده<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr khak frv ryzd v ma khak shdh<\/p>"},{"n":155,"label":"۱۵۵","verse":"<p class=\"fa\">تا کی غم آن خورم که دارم یا نه<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta ky ghm ān khvrm kh darm ya nh<\/p><p class=\"fa\">وین عمر بخوشدلی گذارم یا نه<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vyn &#x27;mr bkhvshdly gzarm ya nh<\/p><p class=\"fa\">پُر کن قدح باده که معلومم نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">por kn qdh badh kh m&#x27;lvmm nyst<\/p><p class=\"fa\">کایندم که فرو برم بر آرم یا نه<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayndm kh frv brm br ārm ya nh<\/p>"},{"n":156,"label":"۱۵۶","verse":"<p class=\"fa\">یک جرعه میِ کهن ملکی نو به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jr&#x27;h mye khn mlky nv bh<\/p><p class=\"fa\">وز هرچه نه می طریق بیرون شو به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz hrchh nh my tryq byrvn shv bh<\/p><p class=\"fa\">در دست به از تخت فریدون صدبار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dst bh az tkht frydvn sdbar<\/p><p class=\"fa\">خشتِ سر خم ز مُلک کیخسرو به<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khshte sr khm z molk kykhsrv bh<\/p>"},{"n":157,"label":"۱۵۷","verse":"<p class=\"fa\">آن مایه ز دنیا که خوری یا پوشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān mayh z dnya kh khvry ya pvshy<\/p><p class=\"fa\">معذوری اگر در طلبش میکوشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">m&#x27;zvry agr dr tlbsh mykvshy<\/p><p class=\"fa\">باقی همه رایگان نیرزد هشدار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">baqy hmh raygan nyrzd hshdar<\/p><p class=\"fa\">تا عمر گرانبها بدان نفروشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta &#x27;mr granbha bdan nfrvshy<\/p>"},{"n":158,"label":"۱۵۸","verse":"<p class=\"fa\">از آمدنِ بهار و از رفتن دی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az āmdne bhar v az rftn dy<\/p><p class=\"fa\">اوراق وجود ما همی گردد طی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">avraq vjvd ma hmy grdd ty<\/p><p class=\"fa\">می خور مخور اندوه که فرمود حکیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr mkhvr andvh kh frmvd hkym<\/p><p class=\"fa\">غمهای جهان چو زهر و تریاقش می<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ghmhay jhan chv zhr v tryaqsh my<\/p>"},{"n":159,"label":"۱۵۹","verse":"<p class=\"fa\">از کوزه گری کوزه خریدم باری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az kvzh gry kvzh khrydm bary<\/p><p class=\"fa\">آن کوزه سخن گفت ز هر اسراری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān kvzh skhn gft z hr asrary<\/p><p class=\"fa\">شاهی بودم که جام زرّینم بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shahy bvdm kh jam zrrynm bvd<\/p><p class=\"fa\">اکنون شده‌ام کوزهٔ هر خمّاری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aknvn shdh-am kvzhٔ hr khmmary<\/p>"},{"n":160,"label":"۱۶۰","verse":"<p class=\"fa\">ای آنکه نتیجهٔ چهار و هفتی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay ānkh ntyjhٔ chhar v hfty<\/p><p class=\"fa\">وز هفت و چهار دائم اندر تفتی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz hft v chhar daim andr tfty<\/p><p class=\"fa\">می خور که هزار بار بیشت گفتم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh hzar bar bysht gftm<\/p><p class=\"fa\">باز آمدنت نیست چو رفتی رفتی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">baz āmdnt nyst chv rfty rfty<\/p>"},{"n":161,"label":"۱۶۱","verse":"<p class=\"fa\">ایدل تو باسرار معمّا نرسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aydl tv basrar m&#x27;mma nrsy<\/p><p class=\"fa\">در نکته زیرکان دانا نرسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr nkth zyrkan dana nrsy<\/p><p class=\"fa\">این‌جا بمی لعل بهشتی میساز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn-ja bmy l&#x27;l bhshty mysaz<\/p><p class=\"fa\">کآنجا که بهشت است رسی یا نرسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kānja kh bhsht ast rsy ya nrsy<\/p>"},{"n":162,"label":"۱۶۲","verse":"<p class=\"fa\">ای دوست حقیقت شنو از من سخنی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay dvst hqyqt shnv az mn skhny<\/p><p class=\"fa\">با بادهٔ لعل باش و با سیم تنی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba badhٔ l&#x27;l bash v ba sym tny<\/p><p class=\"fa\">کانکس که جهان کرد فراغت دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kanks kh jhan krd fraght dard<\/p><p class=\"fa\">از سبلت چون توئی و ریش چو منی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az sblt chvn tviy v rysh chv mny<\/p>"},{"n":163,"label":"۱۶۳","verse":"<p class=\"fa\">ای کاش که جای آرمیدن بودی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay kash kh jay ārmydn bvdy<\/p><p class=\"fa\">یا این ره دور را رسیدن بودی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ya ayn rh dvr ra rsydn bvdy<\/p><p class=\"fa\">کاش از پی صدهزار سال از دلِ خاک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kash az py sdhzar sal az dle khak<\/p><p class=\"fa\">چون سبزه امید بر دمیدن بودی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn sbzh amyd br dmydn bvdy<\/p>"},{"n":164,"label":"۱۶۴","verse":"<p class=\"fa\">بر سنگ زدم دوش سبوی کاشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br sng zdm dvsh sbvy kashy<\/p><p class=\"fa\">سرمست بُدم چو کردم این اوباشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">srmst bodm chv krdm ayn avbashy<\/p><p class=\"fa\">با من بزبان حال میگفت سبو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba mn bzban hal mygft sbv<\/p><p class=\"fa\">من چون تو بُدم تو نیز چون من باشی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn chvn tv bodm tv nyz chvn mn bashy<\/p>"},{"n":165,"label":"۱۶۵","verse":"<p class=\"fa\">بر شاخ امید اگر بری یافتمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br shakh amyd agr bry yaftmy<\/p><p class=\"fa\">هم رشتهٔ خویش را سری یافتمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hm rshthٔ khvysh ra sry yaftmy<\/p><p class=\"fa\">تا چند ز تنگنای زندانِ وجود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta chnd z tngnay zndane vjvd<\/p><p class=\"fa\">ایکاش سوی عدم دری یافتمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aykash svy &#x27;dm dry yaftmy<\/p>"},{"n":166,"label":"۱۶۶","verse":"<p class=\"fa\">برگیر پیاله و سبو ای دلجوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brgyr pyalh v sbv ay dljvy<\/p><p class=\"fa\">فارغ بنشین بکِشته‌زار و لبِ جوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fargh bnshyn bkeshth-zar v lbe jvy<\/p><p class=\"fa\">بس شخص عزیز را که چرخ بدخوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bs shkhs &#x27;zyz ra kh chrkh bdkhvy<\/p><p class=\"fa\">صدبار پیاله کرد و صد بار سبوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sdbar pyalh krd v sd bar sbvy<\/p>"},{"n":167,"label":"۱۶۷","verse":"<p class=\"fa\">پیری دیدم بخانهٔ خمّاری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pyry dydm bkhanhٔ khmmary<\/p><p class=\"fa\">گفتم نکنی ز رفتگان اخباری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gftm nkny z rftgan akhbary<\/p><p class=\"fa\">گفتا می خور که همچو ما بسیاری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gfta my khvr kh hmchv ma bsyary<\/p><p class=\"fa\">رفتند و خبر باز نیامد باری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rftnd v khbr baz nyamd bary<\/p>"},{"n":168,"label":"۱۶۸","verse":"<p class=\"fa\">تا چند حدیث پنج و چار ای ساقی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta chnd hdys pnj v char ay saqy<\/p><p class=\"fa\">مشکل چه یکی چه صد هزار ای ساقی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mshkl chh yky chh sd hzar ay saqy<\/p><p class=\"fa\">خاکیم همه چنگ بساز ای ساقی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khakym hmh chng bsaz ay saqy<\/p><p class=\"fa\">بادیم همه باده بیار ای ساقی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">badym hmh badh byar ay saqy<\/p>"},{"n":169,"label":"۱۶۹","verse":"<p class=\"fa\">چندانکه نگاه میکنم هر سوئی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chndankh ngah myknm hr sviy<\/p><p class=\"fa\">در باغ روان است ز کوثر جوئی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr bagh rvan ast z kvsr jviy<\/p><p class=\"fa\">صحرا چو بهشت است ز کوثر کم گوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shra chv bhsht ast z kvsr km gvy<\/p><p class=\"fa\">بنشین به بهشت با بهشتی روئی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnshyn bh bhsht ba bhshty rviy<\/p>"},{"n":170,"label":"۱۷۰","verse":"<p class=\"fa\">خوش باش که پخته‌اند سودای تو دی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash kh pkhth-and svday tv dy<\/p><p class=\"fa\">فارغ شده‌اند از تمنّای تو دی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fargh shdh-and az tmnnay tv dy<\/p><p class=\"fa\">قصّه چکنم که بی تقاضای تو دی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qssh chknm kh by tqazay tv dy<\/p><p class=\"fa\">دادند قرار فردای تو دی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dadnd qrar frday tv dy<\/p>"},{"n":171,"label":"۱۷۱","verse":"<p class=\"fa\">در کارگه کوزه‌گری کردم رای<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr kargh kvzh-gry krdm ray<\/p><p class=\"fa\">در پایهٔ چرخ دیدم اُستاد بپای<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr payhٔ chrkh dydm aostad bpay<\/p><p class=\"fa\">میکرد دلیر کوزه را دسته و سر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mykrd dlyr kvzh ra dsth v sr<\/p><p class=\"fa\">از کلّه پادشاه و از دست گدای<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az kllh padshah v az dst gday<\/p>"},{"n":172,"label":"۱۷۲","verse":"<p class=\"fa\">در گوش دلم گفت فلک پنهانی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr gvsh dlm gft flk pnhany<\/p><p class=\"fa\">حکمی که قضا بود ز من میدانی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hkmy kh qza bvd z mn mydany<\/p><p class=\"fa\">در گردش خویش اگر مرا دست بدی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr grdsh khvysh agr mra dst bdy<\/p><p class=\"fa\">خود را برهاندمی ز سرگردانی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvd ra brhandmy z srgrdany<\/p>"},{"n":173,"label":"۱۷۳","verse":"<p class=\"fa\">زان کوزهٔ می که نیست در وی ضرری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan kvzhٔ my kh nyst dr vy zrry<\/p><p class=\"fa\">پُر کن قدحی بخور بمن ده دگری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">por kn qdhy bkhvr bmn dh dgry<\/p><p class=\"fa\">زان پیشتر ای صنم که در رهگذری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pyshtr ay snm kh dr rhgzry<\/p><p class=\"fa\">خاکِ من و تو کوزه کند کوزه‌گری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khake mn v tv kvzh knd kvzh-gry<\/p>"},{"n":174,"label":"۱۷۴","verse":"<p class=\"fa\">گر آمدنم بخود بُدی نامدمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr āmdnm bkhvd body namdmy<\/p><p class=\"fa\">ور نیز شدن بمن بُدی کی شدمی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vr nyz shdn bmn body ky shdmy<\/p><p class=\"fa\">به زان نبُدی که اندر این دیر خراب<\/p><p class=\"translit\" dir=\ const ORDER = DATA.order;
const EDITIONS = DATA.editions;

const PREFS_KEY = 'rubaiyat-theater-prefs';
const THEME_ORDER = ['light-purple', 'sepia', 'light-azure', 'dark-violet', 'dark-blue'];
const FADE_MS = 240;

let edKey = ORDER.includes(DATA.default) ? DATA.default : ORDER[0];
let quatrains = [];
let numToIndex = {};
let current = 0;
let animating = false;
let hideTimer = null;

const viewEl = document.getElementById('view');
const stageEl = document.getElementById('stage');
const controlsEl = document.getElementById('controls');
const indicatorEl = document.getElementById('indicator');
const edSwitchEl = document.getElementById('ed-switch');

function reducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/** Isolate a possibly-RTL token inside an LTR line. Without this, "فا" at the
 *  head of "فا · 12 of 178" drags the neighbouring digits into its RTL run and
 *  the line renders as "12 · فا OF 178". */
function bdi(s) { return '<bdi>' + s + '</bdi>'; }

// ===================================================================
// RENDER
// ===================================================================
function paint(idx) {
  const q = quatrains[idx];
  const ed = EDITIONS[edKey];
  const rtl = ed.dir === 'rtl';

  // dir="rtl" goes on the quatrain container itself, not on the whole view —
  // an RTL view would bidi-reorder the Latin count line above it into nonsense.
  viewEl.classList.toggle('q-rtl', rtl);

  viewEl.innerHTML =
    '<div class="q-count">' + bdi(ed.short) + ' &middot; ' + (idx + 1) + ' of ' + quatrains.length + '</div>' +
    '<div class="q-ordinal' + (rtl ? ' fa' : '') + '"' + (rtl ? ' lang="fa"' : '') + '>' + q.label + '</div>' +
    '<div class="q-rule"></div>' +
    '<div class="q-verse"' + (rtl ? ' dir="rtl" lang="fa"' : '') + '>' + q.verse + '</div>';
  viewEl.scrollTop = 0;

  document.getElementById('pos').textContent = (idx + 1) + ' / ' + quatrains.length;
  document.getElementById('si-ed').textContent = ed.plain;
  document.getElementById('si-pos').innerHTML =
    bdi(q.label) + ' &middot; ' + (idx + 1) + ' / ' + quatrains.length;
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === quatrains.length - 1;
  document.getElementById('progress-fill').style.width =
    (quatrains.length > 1 ? (idx / (quatrains.length - 1) * 100) : 100) + '%';

  writeHash(idx);
}

function render(idx) {
  if (animating) return;
  current = idx;
  if (reducedMotion()) { paint(idx); return; }
  animating = true;
  viewEl.classList.add('fading');
  setTimeout(() => {
    paint(current);
    viewEl.classList.remove('fading');
    animating = false;
  }, FADE_MS);
}

function go(dir) {
  if (animating) return;
  const next = current + dir;
  if (next < 0 || next >= quatrains.length) return;
  render(next);
}

// ===================================================================
// URL HASH — #q-<edition>-N, the same deep-link form reader.html parses
// ===================================================================
function writeHash(idx) {
  const q = quatrains[idx];
  if (!q) return;
  history.replaceState(null, '', location.pathname + location.search +
    '#q-' + edKey + '-' + q.n);
}

function parseHash() {
  const h = location.hash.replace('#', '');
  let m = h.match(/^q-([a-z]+)-(\d+)$/);
  if (m && EDITIONS[m[1]]) return { ed: m[1], n: parseInt(m[2], 10) };
  // The reader also accepts #q-N and the short #q-N-1 / #q-N-5 forms.
  m = h.match(/^q-(\d+)(?:-(1|5))?$/);
  if (m) {
    return {
      ed: m[2] === '1' ? 'first' : m[2] === '5' ? 'fifth' : null,
      n: parseInt(m[1], 10),
    };
  }
  return null;
}

// ===================================================================
// EDITIONS
// ===================================================================
function buildEditionSwitch() {
  edSwitchEl.innerHTML = '';
  ORDER.forEach(key => {
    const ed = EDITIONS[key];
    const btn = document.createElement('button');
    btn.className = 'ed-opt';
    btn.id = 'ed-' + key;
    btn.setAttribute('role', 'tab');
    btn.textContent = ed.short;
    btn.title = ed.title;
    btn.setAttribute('aria-label', ed.plain + ', ' + ed.count + ' quatrains');
    if (ed.dir === 'rtl') btn.setAttribute('lang', ed.lang);
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (edKey !== key) { applyEdition(key); render(0); savePrefs(); }
      showControls();
    });
    edSwitchEl.appendChild(btn);
  });
}

function applyEdition(key) {
  edKey = key;
  quatrains = EDITIONS[key].quatrains;
  numToIndex = {};
  quatrains.forEach((q, i) => { numToIndex[q.n] = i; });
  document.documentElement.dataset.edition = key;
  ORDER.forEach(k => {
    const btn = document.getElementById('ed-' + k);
    if (!btn) return;
    btn.classList.toggle('active', k === key);
    btn.setAttribute('aria-selected', String(k === key));
  });
}

// ===================================================================
// THEME + PREFERENCES
// ===================================================================
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.t === t));
  savePrefs();
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      theme: document.documentElement.dataset.theme || 'dark-violet',
      edition: edKey,
    }));
  } catch (e) {}
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return {};
    // An older build stored a bare theme string under this key.
    if (raw[0] !== '{') return THEME_ORDER.includes(raw) ? { theme: raw } : {};
    return JSON.parse(raw) || {};
  } catch (e) { return {}; }
}

// ===================================================================
// CONTROLS AUTO-HIDE
// ===================================================================
function showControls() {
  controlsEl.classList.add('visible');
  indicatorEl.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideControls, 2400);
}
function hideControls() {
  controlsEl.classList.remove('visible');
  indicatorEl.classList.remove('visible');
}

// ===================================================================
// INIT
// ===================================================================
(function init() {
  const prefs = loadPrefs();
  if (prefs.theme && THEME_ORDER.includes(prefs.theme)) {
    document.documentElement.dataset.theme = prefs.theme;
  }
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.classList.toggle('active', d.dataset.t === document.documentElement.dataset.theme);
  });

  buildEditionSwitch();

  // Position lives in the hash and is restored here, in script — the stage is
  // JS-rendered, so there is no anchor for the browser to jump to.
  const parsed = parseHash();
  const startEd = (parsed && parsed.ed) ? parsed.ed
    : (ORDER.includes(prefs.edition) ? prefs.edition : edKey);
  applyEdition(startEd);

  let startIdx = 0;
  if (parsed && numToIndex[parsed.n] !== undefined) startIdx = numToIndex[parsed.n];
  current = startIdx;
  paint(current);

  stageEl.addEventListener('click', (e) => {
    if (e.target.closest('#controls') || e.target.closest('#indicator')) return;
    go(1);
  });

  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); go(1); });
  document.querySelectorAll('.theme-dot').forEach(d => {
    d.addEventListener('click', (e) => { e.stopPropagation(); setTheme(d.dataset.t); });
  });

  document.addEventListener('mousemove', showControls);
  document.addEventListener('touchstart', showControls, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    showControls();
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'j':
        e.preventDefault(); go(1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'k':
        e.preventDefault(); go(-1); break;
      case 'Home': e.preventDefault(); render(0); break;
      case 'End': e.preventDefault(); render(quatrains.length - 1); break;
      case 'Escape': hideControls(); break;
    }
  });

  let touchX = 0, touchY = 0;
  document.addEventListener('touchstart', (e) => {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 2) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  window.addEventListener('hashchange', () => {
    const p = parseHash();
    if (!p) return;
    if (p.ed && p.ed !== edKey) { applyEdition(p.ed); savePrefs(); }
    const idx = numToIndex[p.n];
    if (idx !== undefined && idx !== current) render(idx);
  });

  showControls();
})();
</script>
</body>
</html>

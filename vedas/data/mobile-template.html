<!DOCTYPE html>
<html lang="bn" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>বেদ — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --f-serif:'EB Garamond',Georgia,serif;
  --f-sans:'Jost',-apple-system,Helvetica Neue,sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
  --f-beng:'Noto Serif Bengali','EB Garamond',serif;
  --f-deva:'Noto Serif Devanagari','EB Garamond',serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text2:#7a6a52;--border:#d4c8a8;--accent:#8b6914;--btn:rgba(0,0,0,.05);--bar:rgba(245,239,224,.94);--sheet:#ede5d0}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text2:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn:rgba(0,0,0,.05);--bar:rgba(250,248,243,.94);--sheet:#f2efe8}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text2:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn:rgba(0,0,0,.06);--bar:rgba(255,255,255,.92);--sheet:#f5f5f5}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text2:#8490aa;--border:#333;--accent:#9b7aed;--btn:rgba(255,255,255,.08);--bar:rgba(26,26,26,.95);--sheet:#222}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text2:#546080;--border:#1c2440;--accent:#2e6ab4;--btn:rgba(255,255,255,.06);--bar:rgba(0,0,0,.95);--sheet:#0a0a0a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;color:inherit}

.mantra{padding:18px 0;border-bottom:1px solid var(--border)}
.mantra:last-child{border-bottom:none}
.m-num{font-family:var(--f-mono);font-size:10px;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px}
.m-bn{font-family:var(--f-beng);font-size:1.06em;line-height:2.0;margin-bottom:6px}
.m-dv{font-family:var(--f-deva);font-size:1.02em;line-height:2.0;color:var(--text2);margin-bottom:6px}
.m-iast{font-family:var(--f-mono);font-size:.80em;line-height:1.85;color:var(--text2);opacity:.85;margin-bottom:8px}
.m-mean{font-size:.94em;line-height:1.75;margin-bottom:5px}
.m-mean-bn{font-family:var(--f-beng);line-height:1.95}
body:not(.show-dv) .m-dv,body:not(.show-bn) .m-bn,body:not(.show-iast) .m-iast,
body:not(.show-en) .m-en,body:not(.show-mb) .m-mb{display:none}

/* 100dvh with a 100vh fallback: dvh needs iOS 15.4+, and the fallback keeps
   older iPhones usable (the bar just overlaps slightly). */
body{background:var(--bg);color:var(--text);font-family:var(--f-serif);
  height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
  font-size:17px;                     /* base reading size on a phone */
}
#bar{position:fixed;top:0;left:0;right:0;height:48px;z-index:20;background:var(--bar);
  border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:4px;padding:0 6px;font-family:var(--f-sans)}
.bb{width:40px;height:40px;flex:0 0 auto;border:none;background:transparent;color:var(--text2);
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.bb:active{background:var(--btn)}
.bb.on{color:var(--accent);background:var(--btn)}
#label{flex:1 1 auto;min-width:0;text-align:center;font-size:11px;letter-spacing:.5px;
  color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-sans)}
#pager{position:absolute;top:48px;bottom:calc(52px + env(safe-area-inset-bottom,0px));left:0;right:0;overflow:hidden}
#slide{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:22px 20px 40px;transition:opacity .18s}
#slide.fading{opacity:0}
.s-head{margin-bottom:14px}
.s-veda{font-family:var(--f-sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.s-title{font-family:var(--f-beng);font-size:1.35em;line-height:1.45;margin-bottom:2px}
.s-title-en{font-family:var(--f-sans);font-size:.80em;color:var(--text2);letter-spacing:.5px}
.s-meta{font-family:var(--f-sans);font-size:.72em;color:var(--text2);margin-top:8px;line-height:1.7}
.s-note{font-size:.86em;line-height:1.7;color:var(--text2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
#foot{position:fixed;bottom:0;left:0;right:0;height:calc(52px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--bar);border-top:1px solid var(--border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0px);font-family:var(--f-sans)}
#pos{font-family:var(--f-mono);font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
#prog{position:fixed;top:48px;left:0;height:2px;background:var(--accent);z-index:19;transition:width .2s}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.bd.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);
  border-top:1px solid var(--border);border-radius:14px 14px 0 0;
  padding:8px 0 calc(14px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s ease;
  max-height:72vh;max-height:72dvh;overflow-y:auto;font-family:var(--f-sans)}
.sheet.open{transform:translateY(0)}
.sheet h2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;color:var(--text2);padding:10px 18px 8px}
.row{display:block;width:100%;text-align:left;background:none;border:none;padding:13px 18px;
  font-size:15px;cursor:pointer;min-height:46px;border-bottom:1px solid var(--border);color:var(--text)}
.row:last-child{border-bottom:none}
.row.active{color:var(--accent);font-weight:500}
.row .sub{display:block;font-family:var(--f-mono);font-size:10px;color:var(--text2);margin-top:2px}
.row .bnt{font-family:var(--f-beng)}
#scripts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px}
.chip{border:1px solid var(--border);background:none;color:var(--text2);border-radius:20px;
  padding:9px 14px;font-size:13px;cursor:pointer;min-height:40px;font-family:var(--f-sans)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--btn)}
#themes{display:flex;gap:14px;padding:14px 18px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);cursor:pointer;padding:0;flex:0 0 auto}
.dot.active{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--accent)}
.dot[data-theme="sepia"]{background:#d4c8a8}.dot[data-theme="light-purple"]{background:#c9b8e8}
.dot[data-theme="light-azure"]{background:#d4e8f7}.dot[data-theme="dark-violet"]{background:#4a3a6a}
.dot[data-theme="dark-blue"]{background:#1e2a4a}
/* Bigger phones (S25 Ultra / Pro Max) get slightly more type, not more chrome. */
@media (min-width:410px){ body{font-size:17.5px} #slide{padding:24px 22px 44px} }
@media (prefers-reduced-motion:reduce){#slide,.sheet,.bd,#prog{transition:none}}

</style>
</head>
<body class="show-bn show-dv show-en show-mb">
<div id="prog" style="width:0"></div>
<nav id="bar">
  <button class="bb" id="toc-btn" aria-label="Choose sukta">&#9776;</button>
  <span id="label"></span>
  <button class="bb" id="scr-btn" aria-label="Scripts and translations">&#2437;A</button>
  <button class="bb" id="thm-btn" aria-label="Theme">&#9680;</button>
</nav>
<main id="pager"><div id="slide"></div></main>
<nav id="foot">
  <button class="bb" id="prev" aria-label="Previous sukta">&#8592;</button>
  <span id="pos"></span>
  <button class="bb" id="next" aria-label="Next sukta">&#8594;</button>
</nav>
<div class="bd" id="bd"></div>
<div class="sheet" id="toc" role="dialog" aria-modal="true" aria-label="Suktas" aria-hidden="true"><h2>Sūktas</h2><div id="toc-list"></div></div>
<div class="sheet" id="scr" role="dialog" aria-modal="true" aria-label="Scripts" aria-hidden="true"><h2>Show</h2><div id="scripts"></div></div>
<div class="sheet" id="thm" role="dialog" aria-modal="true" aria-label="Theme" aria-hidden="true"><h2>Theme</h2><div id="themes"></div></div>
<script>
const DATA = __DATA__;

const KEY='vedas-mobile-prefs';
const THEMES={sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};
const SCRIPTS=[['show-bn','\u09ac\u0999\u09cd\u0997\u09b2\u09bf\u09aa\u09bf'],['show-dv','\u0926\u0947\u0935\u0928\u093e\u0917\u0930\u0940'],['show-iast','IAST'],['show-en','English'],['show-mb','\u09ac\u09be\u0982\u09b2\u09be']];
const S=DATA.suktas; let idx=0;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({theme:document.documentElement.dataset.theme,cls:[...document.body.classList].filter(c=>c.startsWith('show-'))}))}catch(e){}}
function load(){let p=null;try{p=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!p)return; if(p.theme&&THEMES[p.theme])document.documentElement.dataset.theme=p.theme;
  if(Array.isArray(p.cls)){SCRIPTS.forEach(([c])=>document.body.classList.remove(c));p.cls.forEach(c=>document.body.classList.add(c));}}
function writeHash(){const s=S[idx];history.replaceState(null,'','#s-'+s.veda+'-'+s.num)}
function readHash(){const m=location.hash.match(/^#s-([a-z]+)-(\d+)$/);if(!m)return false;
  const i=S.findIndex(s=>s.veda===m[1]&&String(s.num)===m[2]);if(i<0)return false;idx=i;return true}
function mantraHTML(m){
  let h='<div class="mantra"><div class="m-num">'+m.n+'</div>';
  if(m.bn)h+='<div class="m-bn" lang="sa-Beng">'+m.bn.replace(/\n/g,'<br>')+'</div>';
  if(m.dv)h+='<div class="m-dv" lang="sa-Deva">'+m.dv.replace(/\n/g,'<br>')+'</div>';
  if(m.iast)h+='<div class="m-iast" lang="sa-Latn">'+m.iast.replace(/\n/g,'<br>')+'</div>';
  if(m.mBn)h+='<div class="m-mean m-mb m-mean-bn" lang="bn">'+m.mBn+'</div>';
  if(m.mEn)h+='<div class="m-mean m-en" lang="en">'+m.mEn+'</div>';
  return h+'</div>';
}
function render(){
  const s=S[idx],sl=$('slide');
  sl.classList.add('fading');
  setTimeout(()=>{
    let h='<div class="s-head"><div class="s-veda">'+s.vedaTitle+'</div>';
    h+='<div class="s-title" lang="bn">'+s.title+'</div>';
    if(s.titleEn)h+='<div class="s-title-en" lang="en">'+s.titleEn+'</div>';
    const meta=[s.rishi&&('\u098b\u09b7\u09bf '+s.rishi),s.devata&&('\u09a6\u09c7\u09ac\u09a4\u09be '+s.devata),s.chanda&&('\u099b\u09a8\u09cd\u09a6 '+s.chanda)].filter(Boolean);
    if(meta.length)h+='<div class="s-meta">'+meta.join('<br>')+'</div>';
    if(s.noteEn)h+='<div class="s-note" lang="en">'+s.noteEn+'</div>';
    h+='</div>';
    h+=s.mantras.map(mantraHTML).join('');
    sl.innerHTML=h;sl.scrollTop=0;sl.classList.remove('fading');
  },110);
  $('label').textContent=s.titleEn||s.title;
  $('pos').textContent=(idx+1)+' / '+S.length;
  $('prev').disabled=idx===0;$('next').disabled=idx===S.length-1;
  $('prog').style.width=((idx+1)/S.length*100)+'%';
  writeHash();
}
function go(d){const n=idx+d;if(n<0||n>=S.length)return;idx=n;render()}
let open=null,lastF=null;
function sheet(id){close();const s=$(id);open=s;lastF=document.activeElement;
  s.classList.add('open');s.setAttribute('aria-hidden','false');$('bd').classList.add('open');
  const f=s.querySelector('button');if(f)f.focus()}
function close(){if(!open)return;open.classList.remove('open');open.setAttribute('aria-hidden','true');
  $('bd').classList.remove('open');open=null;if(lastF&&lastF.focus)lastF.focus()}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&open){close();return}
  if(open)return;
  if(e.key==='ArrowRight'||e.key==='j'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='k'){e.preventDefault();go(-1)}});
function buildToc(){const w=$('toc-list');w.innerHTML='';
  DATA.vedas.forEach(v=>{
    S.forEach((s,i)=>{ if(s.veda!==v.id)return;
      const b=document.createElement('button');b.type='button';
      b.className='row'+(i===idx?' active':'');
      b.innerHTML='<span class="bnt">'+s.title+'</span><span class="sub">'+v.title+' \u00b7 '+(s.titleEn||'')+' \u00b7 '+s.mantras.length+' mantras</span>';
      b.addEventListener('click',()=>{idx=i;render();buildToc();close()});
      w.appendChild(b);});});}
function buildScripts(){const w=$('scripts');w.innerHTML='';
  SCRIPTS.forEach(([cls,lbl])=>{const b=document.createElement('button');b.type='button';
    b.className='chip'+(document.body.classList.contains(cls)?' on':'');b.textContent=lbl;
    b.setAttribute('aria-pressed',String(document.body.classList.contains(cls)));
    b.addEventListener('click',()=>{document.body.classList.toggle(cls);buildScripts();save()});
    w.appendChild(b)})}
function buildThemes(){const w=$('themes');w.innerHTML='';
  Object.keys(THEMES).forEach(t=>{const b=document.createElement('button');b.type='button';
    b.className='dot'+(document.documentElement.dataset.theme===t?' active':'');b.dataset.theme=t;
    b.setAttribute('aria-label',THEMES[t]);
    b.addEventListener('click',()=>{document.documentElement.dataset.theme=t;buildThemes();save();close()});
    w.appendChild(b)})}
$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
$('toc-btn').addEventListener('click',()=>sheet('toc'));
$('scr-btn').addEventListener('click',()=>sheet('scr'));
$('thm-btn').addEventListener('click',()=>sheet('thm'));
$('bd').addEventListener('click',close);
let tx=0,ty=0;
$('pager').addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});
$('pager').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)go(dx<0?1:-1)},{passive:true});
window.addEventListener('hashchange',()=>{if(readHash())render()});
load();readHash();buildToc();buildScripts();buildThemes();render();

</script>
</body>
</html>

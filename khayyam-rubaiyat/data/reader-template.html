<!DOCTYPE html>
<html lang="en" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubáiyát of Omar Khayyám — FitzGerald — Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500;600&family=Roboto+Slab:wght@300;400;500&family=Vazirmatn:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== THEMES ===== */
:root {
  --font-serif: 'EB Garamond', Georgia, serif;
  --font-sans: 'Jost', -apple-system, Helvetica Neue, sans-serif;
  --font-slab: 'Roboto Slab', 'Georgia', serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: var(--font-serif);
  --font-size: 19px;
  --line-height: 2.0;
  --content-width: 560px;
}

/* sepia: warm parchment-like (default for The Prophet) */
[data-theme="sepia"] {
  --bg: #f5efe0;
  --text: #3a2e1e;
  --text-secondary: #7a6a52;
  --border: #d4c8a8;
  --bar-bg: rgba(245,239,224,0.94);
  --bar-border: rgba(0,0,0,0.06);
  --chapter-rule: #d4c8a8;
  --dropcap: #b45309;
  --accent: #b45309;
  --btn-bg: rgba(0,0,0,0.05);
  --btn-hover: rgba(0,0,0,0.08);
  --sidebar-bg: #ede5d0;
  --sidebar-hover: #e3d9c2;
}

/* light-purple */
[data-theme="light-purple"] {
  --bg: #faf8f3;
  --text: #363b48;
  --text-secondary: #65707a;
  --border: #d6d0c4;
  --bar-bg: rgba(250,248,243,0.94);
  --bar-border: rgba(0,0,0,0.06);
  --chapter-rule: #d6d0c4;
  --dropcap: #7c3aed;
  --accent: #7c3aed;
  --btn-bg: rgba(0,0,0,0.05);
  --btn-hover: rgba(0,0,0,0.08);
  --sidebar-bg: #f2efe8;
  --sidebar-hover: #e8e4dc;
}

/* light-azure */
[data-theme="light-azure"] {
  --bg: #ffffff;
  --text: #363b48;
  --text-secondary: #65707a;
  --border: #d6d0c4;
  --bar-bg: rgba(255,255,255,0.92);
  --bar-border: rgba(0,0,0,0.08);
  --chapter-rule: #d6d0c4;
  --dropcap: #2e6ab4;
  --accent: #2e6ab4;
  --btn-bg: rgba(0,0,0,0.06);
  --btn-hover: rgba(0,0,0,0.1);
  --sidebar-bg: #f5f5f5;
  --sidebar-hover: #eee;
}

/* dark-violet */
[data-theme="dark-violet"] {
  --bg: #1a1a1a;
  --text: #dce0ec;
  --text-secondary: #8490aa;
  --border: #333;
  --bar-bg: rgba(26,26,26,0.95);
  --bar-border: rgba(255,255,255,0.08);
  --chapter-rule: #444;
  --dropcap: #b598ff;
  --accent: #9b7aed;
  --btn-bg: rgba(255,255,255,0.08);
  --btn-hover: rgba(255,255,255,0.12);
  --sidebar-bg: #222;
  --sidebar-hover: #2a2a2a;
}

/* dark-blue */
[data-theme="dark-blue"] {
  --bg: #000000;
  --text: #8490aa;
  --text-secondary: #546080;
  --border: #1c2440;
  --bar-bg: rgba(0,0,0,0.95);
  --bar-border: rgba(255,255,255,0.06);
  --chapter-rule: #1c2440;
  --dropcap: #4a90d9;
  --accent: #2e6ab4;
  --btn-bg: rgba(255,255,255,0.06);
  --btn-hover: rgba(255,255,255,0.1);
  --sidebar-bg: #0a0a0a;
  --sidebar-hover: #111;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--font-size);
  line-height: var(--line-height);
}

[data-font="sans"] { --font-body: var(--font-sans); }
[data-font="slab"] { --font-body: var(--font-slab); }
[data-font="mono"] { --font-body: var(--font-mono); --font-size: 15px; --line-height: 1.7; }

[data-size="small"] { --font-size: 16px; --line-height: 1.85; }
[data-size="large"] { --font-size: 22px; --line-height: 2.1; }

[data-width="narrow"] { --content-width: 440px; }
[data-width="medium"] { --content-width: 560px; }
[data-width="wide"] { --content-width: 720px; }

/* ===== SIDEBAR & OVERLAY ===== */
#sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  z-index: 1002; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
#sidebar-overlay.open { opacity: 1; pointer-events: auto; }

#chapter-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 260px; max-width: 80vw; background: var(--sidebar-bg);
  z-index: 1003; transform: translateX(-100%); transition: transform 0.3s ease;
  overflow-y: auto; padding: 20px 0; font-family: var(--font-sans);
}
#chapter-sidebar.open { transform: translateX(0); }

#chapter-sidebar h2 {
  font-size: 13px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-secondary);
  padding: 0 20px 12px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}

.sidebar-chapter {
  display: flex; align-items: baseline; gap: 10px; padding: 10px 20px;
  cursor: pointer; transition: background 0.15s; text-decoration: none;
  color: var(--text); font-size: 14px; line-height: 1.4;
}
.sidebar-chapter:hover { background: var(--sidebar-hover); }
.sidebar-chapter.active { color: var(--accent); font-weight: 500; }
.sidebar-chapter .ch-num {
  color: var(--text-secondary); font-size: 11px; font-family: var(--font-mono);
  flex-shrink: 0; width: 22px; text-align: right;
}
.sidebar-chapter .ch-title { flex: 1; }

#sidebar-toggle {
  width: 32px; height: 32px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; transition: background 0.15s, color 0.15s;
}
#sidebar-toggle:hover { background: var(--btn-bg); color: var(--text); }

/* ===== PROGRESS BAR ===== */
#progress-track {
  position: fixed; top: 44px; left: 0; right: 0; height: 3px;
  z-index: 1001; background: var(--border); cursor: pointer;
  display: flex; transition: height 0.15s;
}
#progress-track:hover { height: 8px; }
.progress-seg { height: 100%; position: relative; flex-shrink: 0; transition: background 0.15s; }
.progress-seg.filled { background: var(--accent); }
.progress-seg.partial { background: linear-gradient(to right, var(--accent) var(--fill), var(--border) var(--fill)); }
.progress-seg + .progress-seg { border-left: 1px solid var(--bg); }

/* ===== TOP BAR ===== */
#top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: 44px; background: var(--bar-bg);
  border-bottom: 1px solid var(--bar-border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
  font-family: var(--font-sans); font-size: 13px; color: var(--text-secondary);
}

#top-bar .book-title {
  font-weight: 600; color: var(--text-secondary); letter-spacing: 1px;
  font-size: 13px; white-space: nowrap; flex-shrink: 0;
}
#top-bar .chapter-indicator {
  font-family: 'EB Garamond', Georgia, serif; font-size: 13px; font-style: italic;
  color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 200px; flex-shrink: 1;
}
#top-bar .chapter-indicator::before {
  content: '\00b7'; margin: 0 8px; color: var(--text-secondary); font-style: normal;
}

/* Right controls */
.bar-controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.bar-btn {
  width: 32px; height: 32px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; transition: background 0.15s; font-family: var(--font-sans);
}
.bar-btn:hover { background: var(--btn-bg); }
.bar-btn.active { background: var(--btn-bg); color: var(--text); }

/* Theme toggle */
.theme-wrap { position: relative; display: flex; align-items: center; }
.theme-dots {
  position: absolute; right: 100%; top: 50%; transform: translateY(-50%);
  display: flex; gap: 6px; align-items: center; padding-right: 8px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.theme-wrap:hover .theme-dots,
.theme-wrap.expanded .theme-dots { opacity: 1; pointer-events: auto; }
.theme-dot {
  width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s; flex-shrink: 0;
}
.theme-dot:hover { transform: scale(1.25); }
.theme-dot.active { box-shadow: 0 0 0 2px var(--bar-bg), 0 0 0 3.5px var(--accent); }
.theme-dot[data-theme="sepia"] { background: #d4c8a8; }
.theme-dot[data-theme="light-purple"] { background: #c9b8e8; }
.theme-dot[data-theme="light-azure"] { background: #d4e8f7; }
.theme-dot[data-theme="dark-violet"] { background: #4a3a6a; }
.theme-dot[data-theme="dark-blue"] { background: #1e2a4a; }

/* ===== SETTINGS PANEL ===== */
#settings-panel {
  position: fixed; top: 52px; right: 16px; z-index: 999;
  background: var(--bar-bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  width: 240px; max-width: calc(100vw - 32px);
  display: none; font-family: var(--font-sans); font-size: 13px;
}
#settings-panel.open { display: block; }

.setting-group { margin-bottom: 16px; }
.setting-group:last-child { margin-bottom: 0; }
.setting-label {
  color: var(--text-secondary); font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 600; margin-bottom: 8px; display: block;
}
.btn-row { display: flex; gap: 0; }
.btn-row .opt {
  flex: 1; height: 32px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); background: transparent; color: var(--text);
  cursor: pointer; font-family: var(--font-sans); font-size: 12px;
  transition: background 0.15s, color 0.15s;
}
.btn-row .opt:first-child { border-radius: 5px 0 0 5px; }
.btn-row .opt:last-child { border-radius: 0 5px 5px 0; }
.btn-row .opt + .opt { border-left: none; }
.btn-row .opt:hover { background: var(--btn-bg); }
.btn-row .opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-row .opt.active + .opt { border-left-color: var(--accent); }

/* ===== MAIN CONTENT ===== */
#content {
  max-width: var(--content-width);
  margin: 0 auto;
  padding: 80px 24px 120px;
}

/* ===== BOOK HEADER ===== */
.book-header {
  text-align: center; padding: 60px 0 48px;
  border-bottom: 1px solid var(--chapter-rule); margin-bottom: 48px;
}
.book-header h1 {
  font-family: var(--font-serif); font-size: 2.4em; font-weight: 400;
  letter-spacing: 0.02em; margin-bottom: 8px; color: var(--text);
}
.book-header .author {
  font-family: var(--font-sans); font-size: 14px; font-weight: 400;
  letter-spacing: 2px; text-transform: uppercase; color: var(--text-secondary);
}

/* ===== CHAPTERS ===== */
.chapter { margin-bottom: 0; }
.chapter + .chapter {
  margin-top: 56px; padding-top: 56px; position: relative;
}
.chapter + .chapter::before {
  content: '\2766'; display: block; text-align: center; font-size: 20px;
  color: var(--chapter-rule); position: absolute; top: 0; left: 50%;
  transform: translate(-50%, -50%); background: var(--bg); padding: 0 20px;
}
.chapter + .chapter::after {
  content: ''; display: block; position: absolute; top: 0;
  left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--chapter-rule), transparent);
}

.chapter-divider { text-align: center; padding: 0 0 32px; }
.chapter-divider .ch-num {
  font-family: var(--font-sans); font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--text-secondary); font-weight: 600;
}
.chapter-divider .ch-title {
  font-family: var(--font-serif); font-size: 36px; font-weight: 500;
  color: var(--text); font-style: italic; margin-top: 8px; line-height: 1.2;
}
.chapter-divider .ch-rule {
  width: 60px; height: 1px; margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

/* ===== VERSE TYPOGRAPHY ===== */
.chapter-text {
  font-size: var(--font-size);
  line-height: var(--line-height);
  color: var(--text);
  text-align: left;
  hyphens: manual;
  -webkit-hyphens: manual;
}
.chapter-text p {
  text-indent: 0;
  margin: 0 0 0.3em 0;
}
.chapter-text .stanza {
  margin: 1.4em 0;
}
.chapter-text .stanza:first-child {
  margin-top: 0;
}
.chapter-text .stanza p {
  margin: 0 0 0.2em 0;
}
/* Drop cap on first paragraph of first stanza */
.chapter-text .stanza:first-child p:first-child::first-letter {
  font-size: 3.2em;
  float: left;
  line-height: 0.82;
  margin: 0.04em 0.1em 0 0;
  color: var(--accent);
  font-weight: 500;
}
.chapter-text em { font-style: italic; }

/* ===== BACK TO TOP ===== */
#back-to-top {
  position: fixed; bottom: 24px; right: 24px;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bar-bg);
  color: var(--text-secondary); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s, background 0.15s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100;
}
#back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
#back-to-top:hover { background: var(--btn-hover); }

.ch-scrubber {
  position: absolute; bottom: 100%; right: 0; margin-bottom: 0;
  display: flex; flex-direction: column; gap: 1px;
  background: var(--bar-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 4px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  max-height: 80vh; overflow-y: auto;
}
.ch-scrubber::after {
  content: ''; position: absolute; bottom: -12px;
  left: -12px; right: -12px; height: 12px;
}
#back-to-top:hover .ch-scrubber {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}
.ch-scrubber .ch-node {
  width: 32px; height: 20px; display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: var(--text-secondary);
  font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.5px;
  cursor: pointer; border-radius: 4px;
  transition: background 0.15s, color 0.15s; position: relative;
}
.ch-node:hover { background: var(--accent); color: #fff; }
.ch-node.active { color: var(--accent); font-weight: 600; }
.ch-node::after {
  content: attr(data-title); position: absolute; right: 40px; white-space: nowrap;
  font-family: var(--font-serif); font-size: 12px; font-style: italic;
  color: var(--text); background: var(--bar-bg); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 4px; opacity: 0; pointer-events: none;
  transition: opacity 0.15s;
}
.ch-node:hover::after { opacity: 1; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  #top-bar .book-title { display: none; }
  .theme-dots { opacity: 0; }
  .theme-wrap:hover .theme-dots,
  .theme-wrap.expanded .theme-dots { opacity: 1; }
  #sidebar-toggle { width: 44px; height: 44px; }
  .bar-btn { width: 44px; height: 44px; }
}
@media (max-width: 600px) {
  #content { padding: 64px 16px 80px; }
  .chapter-divider .ch-title { font-size: 28px; }
  .book-header h1 { font-size: 1.8em; }
  .book-header { padding: 40px 0 32px; }
  #settings-panel { right: 8px; }
}

/* ── Focus-visible ── */
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button:focus:not(:focus-visible) { outline: none; }

/* ===== EDITION SWITCH (topbar) ===== */
.ed-switch {
  display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  flex-shrink: 0;
}
.ed-switch .ed-opt {
  background: transparent; border: none; color: var(--text-secondary);
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  padding: 5px 10px; cursor: pointer; line-height: 1.4;
  transition: background .15s, color .15s;
  min-height: 26px; letter-spacing: .3px;
}
.ed-switch .ed-opt sup { font-size: 8px; margin-left: 1px; opacity: .7; }
.ed-switch .ed-opt:hover { background: var(--btn-bg); color: var(--text); }
.ed-switch .ed-opt.active { color: var(--accent); background: var(--btn-bg); }
.ed-switch .ed-opt + .ed-opt { border-left: 1px solid var(--border); }

/* ===== BOOK HEADER SUBTITLES ===== */
.book-header .translator-line {
  font-family: var(--font-serif); font-style: italic; font-size: 14px;
  color: var(--text-secondary); margin-top: 6px;
}
body[data-edition="persian"] .book-header .translator-line { display: none; }
.book-header .edition-caption {
  font-family: var(--font-sans); font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--accent); margin-top: 16px; font-weight: 600;
}

/* ===== QUATRAIN LAYOUT (Meditations-inspired) ===== */

.quatrain {
  margin: 0 0 32px;
  display: grid; grid-template-columns: 44px 1fr; column-gap: 14px; align-items: start;
  scroll-margin-top: 70px;
}
.quatrain .q-num {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  color: var(--text-secondary); letter-spacing: 1.5px;
  padding-top: calc(var(--line-height) * 0.22em);
  text-align: right; opacity: .55; transition: color .2s, opacity .2s;
}
.quatrain:hover .q-num, .quatrain:target .q-num { color: var(--accent); opacity: 1; }
.quatrain .q-verse p { margin: 0; text-align: left; }
.quatrain .q-verse p.indented { text-indent: 1.4em; }
.quatrain:target .q-verse p:first-child::before {
  content:''; display:inline-block; width:6px; height:6px; border-radius:50%;
  background: var(--accent); margin-right:8px; margin-left:-14px; vertical-align:middle;
  animation: q-pulse .8s ease-out;
}
@keyframes q-pulse { 0%{opacity:1;transform:scale(1.4)} 100%{opacity:.6;transform:scale(1)} }

/* Edition visibility */
.edition[data-edition] { display: none; }
.edition[data-edition].visible { display: block; }

/* q-flow: holds detail | main | persian-side. Default: single column. */
.quatrain .q-flow {
  display: grid; grid-template-columns: 1fr; gap: 16px;
  min-width: 0;
}
.quatrain .q-main { position: relative; min-width: 0; }

/* Prose-style quatrain (Nicolas) */
.q-nicolas .q-prose p {
  text-align: justify; hyphens: auto; -webkit-hyphens: auto;
  font-size: 0.97em; line-height: 1.75; margin: 0;
}
.q-nicolas .q-num { padding-top: 0.3em; }

/* Per-quatrain detail toggle button */
.q-detail-btn {
  position: absolute; right: -8px; top: -2px;
  width: 22px; height: 22px; border-radius: 50%;
  background: transparent; border: 1px solid transparent;
  cursor: pointer; color: var(--text-secondary);
  opacity: 0; transition: opacity .2s, color .2s, background .15s, border-color .15s;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600; line-height: 1;
  padding: 0; display: flex; align-items: center; justify-content: center;
}
.quatrain.has-detail:hover .q-detail-btn,
.quatrain.has-detail:focus-within .q-detail-btn { opacity: .55; }
.q-detail-btn:hover { opacity: 1 !important; color: var(--accent); border-color: var(--border); background: var(--btn-bg); }
.quatrain.details-open .q-detail-btn,
body[data-details="on"] .quatrain.has-detail .q-detail-btn { opacity: 1; color: var(--accent); border-color: var(--border); }

/* Detail panel — hidden by default. Shown per-quatrain (details-open)
   OR globally (body[data-details="on"]). */
.q-detail { display: none; }
.quatrain.details-open .q-detail,
body[data-details="on"] .quatrain.has-detail .q-detail { display: block; }

.q-detail {
  background: var(--sidebar-bg);
  border-left: 3px solid var(--accent);
  padding: 14px 16px;
  direction: ltr; text-align: left;
  border-radius: 0 4px 4px 0;
}
.q-detail .qd-section { margin-top: 18px; }
.q-detail .qd-section:first-child { margin-top: 0; }
.q-detail .qd-label {
  font-family: var(--font-sans); font-size: 9.5px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-secondary); opacity: .8; margin: 0 0 8px;

}
.q-detail .qd-ref {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
  color: var(--accent); font-weight: 500; opacity: .9; text-transform: none;
}
.q-detail p { margin: 0; text-align: left; }

/* Persian source block inside detail (for English editions) */
.qd-fa-block { margin-top: 4px; }
.qd-fa-line { margin-bottom: 4px; display: block; }
.qd-fa {
  font-family: 'Vazirmatn', 'Noto Naskh Arabic', serif;
  display: block; text-align: right; direction: rtl;
  font-size: 14.5px; line-height: 2; color: var(--text);
}
.qd-translit {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary); opacity: .7;
  margin-top: -2px; letter-spacing: .2px;
  display: block; direction: ltr; text-align: left;
}

/* Modern translations (LLM-generated) */
.qd-tx { margin-top: 10px; }
.qd-tx-label {
  font-family: var(--font-sans); font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-secondary); opacity: .7;

}
.qd-tx p { font-family: var(--font-serif); font-size: 13.5px; line-height: 1.72; color: var(--text); }

.qd-meta {
  margin-top: 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
}
.qd-theme {
  background: var(--accent); color: #fff;
  padding: 2px 9px; border-radius: 3px;
  font-family: var(--font-sans); font-size: 9px; letter-spacing: .8px;
  font-weight: 600; text-transform: uppercase; white-space: nowrap;
}
.qd-note {
  flex: 1 1 200px;
  color: var(--text-secondary); font-style: italic;
  font-size: 12.5px; line-height: 1.55; font-family: var(--font-serif);
}

/* Alternate historical translations */
.qd-alt { margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--border); }
.qd-alt:first-of-type { margin-top: 0; }
.qd-alt-label {
  font-family: var(--font-sans); font-size: 9px; letter-spacing: 1px;

}

}
.qd-alt p { font-family: var(--font-serif); font-size: 12.5px; line-height: 1.7; color: var(--text-secondary); font-style: italic; }

/* Heron-Allen scholarly block inside detail */
.qd-ha-lines { padding-left: 10px; border-left: 2px solid var(--accent); margin-top: 2px; }
.qd-ha-lines p { font-family: var(--font-serif); font-size: 13px; line-height: 1.7; color: var(--text); font-style: italic; }
.qd-ha-refs {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .3px;
  color: var(--text-secondary); opacity: .7; margin-top: 8px;
}
.qd-ha-note {
  font-family: var(--font-serif); font-style: italic; font-size: 12px;

/* Whinfield self-refs */
.qd-wh-bits { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; font-family: var(--font-sans); font-size: 11px; }
.qd-wh-bits .qd-ha-refs { margin-top: 0; }
.qd-wh-bits .qd-ha-note { margin-top: 0; }

/* Persian side column — hidden by default, visible when body[data-persian="on"]
   AND the quatrain has a match. */
.q-persian {
  display: none;
  direction: rtl; text-align: right;
  font-family: 'Vazirmatn', 'Noto Naskh Arabic', 'EB Garamond', Georgia, serif;
  font-size: 1em; line-height: 2;

.qp-ref {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;

.qp-line { margin: 0 0 2px; }
.qp-translit {
  direction: ltr; text-align: left;
  font-family: var(--font-mono); font-size: 0.62em; line-height: 1.8;
  color: var(--text-secondary); opacity: .7; margin: -2px 0 4px; letter-spacing: .2px;
}

/* ===== WIDE-SCREEN MULTI-COLUMN LAYOUT =====
   The main content area expands when any multi-column mode is active so
   the Detail | Main | Persian grid has room. Book headers and chapter
   dividers stay centered at the reading width. */
@media (min-width: 1100px) {
  body[data-details="on"] #content,
  body[data-persian="on"] #content {
    max-width: min(95vw, 1180px);
  }
  body[data-details="on"] .book-header,
  body[data-persian="on"] .book-header,
  body[data-details="on"] .chapter-divider,
  body[data-persian="on"] .chapter-divider {
    max-width: var(--content-width); margin-left: auto; margin-right: auto;
  }
  body[data-details="on"] .quatrain.has-detail .q-flow,
  .quatrain.details-open .q-flow {
    grid-template-columns: minmax(280px, 42%) 1fr;
  }
  body[data-details="on"] .quatrain.has-detail .q-detail,
  .quatrain.details-open .q-detail { order: -1; }
  body[data-persian="on"] .quatrain.has-persian:not(.details-open) .q-flow {
    grid-template-columns: 1fr minmax(240px, 32%);
  }
}
@media (min-width: 1440px) {
  body[data-details="on"] #content,
  body[data-persian="on"] #content {
    max-width: min(95vw, 1360px);
  }
  body[data-details="on"][data-persian="on"] #content {
    max-width: min(96vw, 1520px);
  }
  body[data-details="on"][data-persian="on"] .quatrain.has-detail.has-persian .q-flow,
  body[data-persian="on"] .quatrain.details-open.has-persian .q-flow {
    grid-template-columns: minmax(260px, 34%) 1fr minmax(220px, 28%);
  }
  body[data-details="on"][data-persian="on"] .quatrain.has-detail.has-persian .q-detail,
  body[data-persian="on"] .quatrain.details-open.has-persian .q-detail { order: -1; }
}

/* ===== PERSIAN EDITION SPINE ===== */
.persian-q {
  direction: rtl; text-align: right;
}
.persian-q .q-main {
  font-family: 'Vazirmatn', 'Noto Naskh Arabic', 'EB Garamond', Georgia, serif;
}
.persian-q .q-num { font-family: var(--font-mono); text-align: left; padding-left: 0; }

.persian-q .translit {

  color: var(--text-secondary); opacity: .85;

body[data-translit="off"] .persian-q .translit { display: none; }
.persian-q .q-detail { direction: ltr; text-align: left; }

  left: -8px; right: auto;
}

/* Persian "فا" chip keeps font consistent with its script */
.ed-switch .ed-opt[lang="fa"] { font-family: 'Vazirmatn', 'Noto Naskh Arabic', sans-serif; font-size: 13px; padding: 3px 9px; }

/* Topbar toggle buttons (Persian / Details) */

.bar-toggle { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

/* Translit toggle: only meaningful in Persian edition */
.translit-btn { display: none !important; }
body[data-edition="persian"] .translit-btn { display: inline-flex !important; }

/* Persian toggle: only useful when an English spine is active (irrelevant in persian edition) */
.persian-btn { display: none !important; }
body[data-edition="first"]     .persian-btn,
body[data-edition="fifth"]     .persian-btn,
body[data-edition="whinfield"] .persian-btn,

  .q-detail-btn { right: -4px; }
}

<script>
// ===== SETTINGS =====
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');

// ===== THEME BUTTON — cycle on click =====
const themeBtnEl = document.getElementById('theme-btn');
const themeWrap = document.getElementById('theme-wrap');
const THEME_ORDER = ['light-purple','sepia','light-azure','dark-violet','dark-blue'];

themeBtnEl.addEventListener('click', (e) => {
  e.stopPropagation();
  const cur = document.body.dataset.theme || 'light-purple';
  const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === next));
  document.documentElement.dataset.theme = next;
  document.body.dataset.theme = next;
  savePrefs();
  settingsPanel.classList.remove('open');
  settingsBtn.classList.remove('active');
});
// On touch devices, tap toggles expanded state (hover doesn't work)
themeBtnEl.addEventListener('touchstart', () => {
  themeWrap.classList.toggle('expanded');
}, { passive: true });

settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsPanel.classList.toggle('open');
  settingsBtn.classList.toggle('active');
  themeWrap.classList.remove('expanded');
});

document.addEventListener('click', (e) => {
  if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
    settingsPanel.classList.remove('open');
    settingsBtn.classList.remove('active');
  }
  if (!themeWrap.contains(e.target)) {
    themeWrap.classList.remove('expanded');
  }
});

// Font size
document.querySelectorAll('[data-size].opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-size].opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.size = btn.dataset.size;
    savePrefs();
  });
});

// Font family
document.querySelectorAll('[data-font].opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-font].opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.font = btn.dataset.font;
    savePrefs();
  });
});

// Width
document.querySelectorAll('[data-width].opt').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-width].opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.width = btn.dataset.width;
    savePrefs();
  });
});

// ===== THEME DOTS =====
document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    document.documentElement.dataset.theme = dot.dataset.theme;
    document.body.dataset.theme = dot.dataset.theme;
    savePrefs();
  });
});

// ===== SIDEBAR =====
const sidebarEl = document.getElementById('chapter-sidebar');
const overlayEl = document.getElementById('sidebar-overlay');
const sidebarBtn = document.getElementById('sidebar-toggle');

function openSidebar() {
  sidebarEl.classList.add('open');
  overlayEl.classList.add('open');
}
function closeSidebar() {
  sidebarEl.classList.remove('open');
  overlayEl.classList.remove('open');
}

sidebarBtn.addEventListener('click', () => {
  sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
});
overlayEl.addEventListener('click', closeSidebar);

// Swipe to open/close sidebar
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
    if (dx > 0 && touchStartX < 40) openSidebar();
    else if (dx < 0 && sidebarEl.classList.contains('open')) closeSidebar();
  }
});

// ===== EDITION SWITCHING =====
// Each edition ("first", "fifth") is rendered in DOM as a <section class="edition"
// data-edition="..."> wrapper containing <section class="chapter"> groups. We swap
// visibility on change and rebuild sidebar/progress/observer against the active set.

const backToTop = document.getElementById('back-to-top');
const progressTrack = document.getElementById('progress-track');
const chapterIndicator = document.getElementById('chapter-indicator');
const editionCaption = document.getElementById('edition-caption');

let chapterEls = [];
let chapterTitles = [];
let sidebarLinks = [];
let segments = [];
let currentObserver = null;
let userHasScrolled = false;
let activeEdition = 'fifth';

const EDITION_META = {
  first:     { label: 'FitzGerald 1st Edition',        year: 1859, count: 75,  unit: 'quatrains' },
  fifth:     { label: 'FitzGerald 5th Edition',        year: 1889, count: 101, unit: 'quatrains · w/ Heron-Allen notes' },
  whinfield: { label: 'E. H. Whinfield (literal)',     year: 1883, count: 500, unit: 'quatrains' },
  nicolas:   { label: 'Nicolas → English (prose)',     year: 1903, count: 464, unit: 'quatrains' },
  persian:   { label: 'Persian — Foroughi & Ghani',    year: 1339, count: 178, unit: 'رباعیات · annotated' },
};

function refreshEditionRefs() {
  chapterEls = Array.from(document.querySelectorAll(
    '.edition[data-edition="' + activeEdition + '"] .chapter'
  ));
  chapterTitles = chapterEls.map(ch => {
    const t = ch.querySelector('.ch-title');
    return t ? t.textContent : '';
  });
}

function absTop(el) {
  return el.getBoundingClientRect().top + window.scrollY;
}

function buildSidebar() {
  const container = document.getElementById('sidebar-chapters');
  container.innerHTML = '';
  chapterEls.forEach((ch, i) => {
    const link = document.createElement('a');
    link.className = 'sidebar-chapter';
    link.href = '#' + ch.id;
    link.innerHTML = '<span class="ch-num">' + (i + 1) + '</span><span class="ch-title">' + chapterTitles[i] + '</span>';
    link.addEventListener('click', (e) => {
      e.preventDefault();
      closeSidebar();
      window.scrollTo({ top: absTop(ch) - 56, behavior: 'smooth' });
    });
    container.appendChild(link);
  });
  sidebarLinks = Array.from(container.querySelectorAll('.sidebar-chapter'));
}

function buildProgressSegments() {
  progressTrack.innerHTML = '';
  const lengths = chapterEls.map(ch => ch.textContent.length);
  const total = lengths.reduce((a, b) => a + b, 0) || 1;
  lengths.forEach((len, i) => {
    const seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.style.width = (len / total * 100) + '%';
    seg.title = chapterTitles[i];
    seg.addEventListener('click', () => {
      window.scrollTo({ top: absTop(chapterEls[i]) - 56, behavior: 'smooth' });
    });
    progressTrack.appendChild(seg);
  });
  segments = Array.from(progressTrack.querySelectorAll('.progress-seg'));
}

function buildScrubber() {
  const scrubber = document.getElementById('ch-scrubber');
  scrubber.innerHTML = '';
  chapterEls.forEach((ch, i) => {
    const node = document.createElement('button');
    node.className = 'ch-node';
    node.textContent = (i + 1);
    node.dataset.title = chapterTitles[i];
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      window.scrollTo({ top: absTop(ch) - 56, behavior: 'smooth' });
    });
    scrubber.appendChild(node);
  });
}

function setupChapterObserver() {
  if (currentObserver) currentObserver.disconnect();
  currentObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = parseInt(entry.target.dataset.chapterIndex);
        sidebarLinks.forEach((link, i) => link.classList.toggle('active', i === idx));
        chapterIndicator.textContent = chapterTitles[idx] || '';
        document.querySelectorAll('.ch-node').forEach((n, i) => n.classList.toggle('active', i === idx));
        if (userHasScrolled) {
          history.replaceState(null, '', '#' + entry.target.id);
        }
      }
    });
  }, { rootMargin: '-20% 0px -60% 0px', threshold: 0 });
  chapterEls.forEach(ch => currentObserver.observe(ch));
}

function updateScroll() {
  const scrollTop = window.scrollY;
  chapterEls.forEach((ch, i) => {
    const chTop = absTop(ch) - 56;
    const chBottom = chTop + ch.offsetHeight;
    const seg = segments[i];
    if (!seg) return;
    if (scrollTop >= chBottom) {
      seg.className = 'progress-seg filled';
      seg.style.removeProperty('--fill');
    } else if (scrollTop > chTop) {
      const pct = Math.round((scrollTop - chTop) / (chBottom - chTop) * 100);
      seg.className = 'progress-seg partial';
      seg.style.setProperty('--fill', pct + '%');
    } else {
      seg.className = 'progress-seg';
      seg.style.removeProperty('--fill');
    }
  });
  backToTop.classList.toggle('visible', scrollTop > 600);
}

window.addEventListener('scroll', updateScroll, { passive: true });
window.addEventListener('scroll', () => { userHasScrolled = true; }, { once: true });
backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

function applyEdition(ed, opts) {
  opts = opts || {};
  activeEdition = ed;
  document.body.dataset.edition = ed;
  document.querySelectorAll('.edition').forEach(sec => {
    sec.classList.toggle('visible', sec.dataset.edition === ed);
  });
  ['first', 'fifth', 'whinfield', 'nicolas', 'persian'].forEach(k => {
    const btn = document.getElementById('ed-' + k);
    if (!btn) return;
    btn.classList.toggle('active', ed === k);
    btn.setAttribute('aria-selected', ed === k);
  });
  const meta = EDITION_META[ed];
  if (editionCaption && meta) {
    editionCaption.textContent = meta.label + ' · ' + meta.year + ' · ' + meta.count + ' ' + meta.unit;
  }

  refreshEditionRefs();
  buildSidebar();
  buildProgressSegments();
  buildScrubber();
  setupChapterObserver();
  updateScroll();
  if (opts.scrollToTop) window.scrollTo({ top: 0, behavior: 'instant' });
}

['first', 'fifth', 'whinfield', 'nicolas', 'persian'].forEach(k => {
  const btn = document.getElementById('ed-' + k);
  if (btn) btn.addEventListener('click', () => {
    if (activeEdition !== k) { applyEdition(k, { scrollToTop: true }); savePrefs(); }
  });
});

// Transliteration toggle (only visible in Persian edition)
const translitBtn = document.getElementById('translit-btn');
translitBtn.addEventListener('click', () => {
  const on = document.body.dataset.translit !== 'off';
  document.body.dataset.translit = on ? 'off' : 'on';
  translitBtn.setAttribute('aria-pressed', String(!on));
  savePrefs();
});

// Persian side-column toggle (English editions only)
const persianBtn = document.getElementById('persian-btn');
persianBtn.addEventListener('click', () => {
  const on = document.body.dataset.persian === 'on';
  document.body.dataset.persian = on ? 'off' : 'on';
  persianBtn.setAttribute('aria-pressed', String(!on));
  savePrefs();
});

// Global details toggle (opens every quatrain's detail panel)
const detailsBtn = document.getElementById('details-btn');
detailsBtn.addEventListener('click', () => {
  const on = document.body.dataset.details === 'on';
  document.body.dataset.details = on ? 'off' : 'on';
  detailsBtn.setAttribute('aria-pressed', String(!on));
  // When switching global details off, also close per-quatrain opens
  if (on) {
    document.querySelectorAll('.quatrain.details-open').forEach(q => q.classList.remove('details-open'));
  }
  savePrefs();
});

// Per-quatrain detail toggle (delegated — works across rebuilds)
document.addEventListener('click', e => {
  const btn = e.target.closest('.q-detail-btn');
  if (!btn) return;
  const q = btn.closest('.quatrain');
  if (q) q.classList.toggle('details-open');
});

// ===== HASH NAVIGATION =====
// Accepted forms:
//   #q-<ed>-<N>      explicit edition ("first" | "fifth" | "persian")
//   #q-<N>           current edition
//   #q-<N>-1 | -5    short-form for English 1st / 5th
function parseHash() {
  const h = location.hash.replace('#', '');
  let ed = null, n = null;
  let m = h.match(/^q-(first|fifth|whinfield|nicolas|persian)-(\d+)$/);
  if (m) { ed = m[1]; n = parseInt(m[2]); }
  else {
    m = h.match(/^q-(\d+)(?:-(1|5))?$/);
    if (m) { n = parseInt(m[1]); ed = m[2] === '1' ? 'first' : m[2] === '5' ? 'fifth' : null; }
  }
  if (n === null) return;
  const swapped = ed && ed !== activeEdition;
  if (swapped) applyEdition(ed);
  const targetId = 'q-' + (ed || activeEdition) + '-' + n;
  const doScroll = () => {
    const el = document.getElementById(targetId);
    if (!el) return;
    const targetTop = el.getBoundingClientRect().top + window.scrollY - 56;
    // Temporarily disable CSS smooth-scroll so first landing is instant.
    const prev = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = 'auto';
    window.scrollTo(0, Math.max(0, targetTop));
    document.documentElement.style.scrollBehavior = prev;
  };
  if (swapped) requestAnimationFrame(doScroll);
  else doScroll();
}
function restoreHash() {
  if (!location.hash) return;
  const go = () => { void document.body.offsetHeight; parseHash(); };
  // Fire once on fonts-ready-or-timeout, whichever comes first.
  let fired = false;
  const once = () => { if (fired) return; fired = true; go(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(once, 50));
  setTimeout(once, 400);
}
window.addEventListener('hashchange', parseHash);

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const scrollAmt = window.innerHeight * 0.85;
  switch(e.key) {
    case 'j': case 'ArrowDown': case 'ArrowRight':
      window.scrollBy({ top: scrollAmt, behavior: 'smooth' });
      e.preventDefault(); break;
    case 'k': case 'ArrowUp': case 'ArrowLeft':
      window.scrollBy({ top: -scrollAmt, behavior: 'smooth' });
      e.preventDefault(); break;
    case ' ':
      if (e.shiftKey) window.scrollBy({ top: -scrollAmt, behavior: 'smooth' });
      else window.scrollBy({ top: scrollAmt, behavior: 'smooth' });
      e.preventDefault(); break;
    case 'Escape':
      settingsPanel.classList.remove('open');
      settingsBtn.classList.remove('active');
      closeSidebar();
      break;
  }
});

// ===== PREFERENCES =====
function savePrefs() {
  try {
    const prefs = {
      theme: document.body.dataset.theme,
      font: document.body.dataset.font,
      size: document.body.dataset.size,
      width: document.body.dataset.width,
      edition: activeEdition,
      translit: document.body.dataset.translit || 'on',
      persian: document.body.dataset.persian || 'off',
      details: document.body.dataset.details || 'off',
    };
    localStorage.setItem('rubaiyat-reader-prefs', JSON.stringify(prefs));
  } catch(e) {}
}

function loadPrefs() {
  try {
    const saved = localStorage.getItem('rubaiyat-reader-prefs');
    if (!saved) return {};
    const prefs = JSON.parse(saved);
    if (prefs.theme) {
      document.documentElement.dataset.theme = prefs.theme;
      document.body.dataset.theme = prefs.theme;
      document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === prefs.theme));
    }
    if (prefs.font) {
      document.body.dataset.font = prefs.font;
      document.querySelectorAll('[data-font].opt').forEach(b => b.classList.toggle('active', b.dataset.font === prefs.font));
    }
    if (prefs.size) {
      document.body.dataset.size = prefs.size;
      document.querySelectorAll('[data-size].opt').forEach(b => b.classList.toggle('active', b.dataset.size === prefs.size));
    }
    if (prefs.width) {
      document.body.dataset.width = prefs.width;
      document.querySelectorAll('[data-width].opt').forEach(b => b.classList.toggle('active', b.dataset.width === prefs.width));
    }
    return prefs;
  } catch(e) { return {}; }
}

const loadedPrefs = loadPrefs();
const initialEdition = (['first','fifth','whinfield','nicolas','persian'].includes(loadedPrefs.edition))
  ? loadedPrefs.edition : 'fifth';
const initialTranslit = loadedPrefs.translit === 'off' ? 'off' : 'on';
document.body.dataset.translit = initialTranslit;
translitBtn.setAttribute('aria-pressed', String(initialTranslit === 'on'));

const initialPersian = loadedPrefs.persian === 'on' ? 'on' : 'off';
document.body.dataset.persian = initialPersian;
persianBtn.setAttribute('aria-pressed', String(initialPersian === 'on'));

const initialDetails = loadedPrefs.details === 'on' ? 'on' : 'off';
document.body.dataset.details = initialDetails;
detailsBtn.setAttribute('aria-pressed', String(initialDetails === 'on'));

applyEdition(initialEdition);

if (location.hash) restoreHash();
</script>
</body>

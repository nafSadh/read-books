 lips, and wine,<\/p><p>Cast not thy precious life unto the wind!<\/p>"},{"n":413,"label":"CDXIII","verse":"<p>Of mosque and prayer and fast preach not to me,<\/p><p>Rather go drink, were it on charity!<\/p><p>Yea, drink, Khayyam, your dust will soon be made<\/p><p>A jug, or pitcher, or a cup, may be!<\/p>"},{"n":414,"label":"CDXIV","verse":"<p>Bulbuls, doting on roses, oft complain<\/p><p>How forward breezes rend their veils in twain;<\/p><p>Sit we beneath this rose, which many a time<\/p><p>Has sunk to earth, and sprung from earth again.<\/p>"},{"n":415,"label":"CDXV","verse":"<p>Suppose the world goes well with you, what then?<\/p><p>When life&#x27;s last page is read and turned, what then?<\/p><p>Suppose you live a hundred years of bliss,<\/p><p>Yea, and a hundred years besides, what then?<\/p>"},{"n":416,"label":"CDXVI","verse":"<p>How is it that of all the leafy tribe,<\/p><p>Cypress and lily men as &quot;free&quot; describe?<\/p><p>This has a dozen tongues, yet holds her peace,<\/p><p>That has a hundred hands which take no bribe.<\/p>"},{"n":417,"label":"CDXVII","verse":"<p>Cupbearer, bring my wine-cup, let me grasp it!<\/p><p>Bring that delicious darling, let me grasp it!<\/p><p>That pleasing chain which tangles in its coils<\/p><p>Wise men and fools together, let me grasp it!<\/p>"},{"n":418,"label":"CDXVIII","verse":"<p>Alas! my wasted life has gone to wrack!<\/p><p>What with forbidden meats, and lusts, alack!<\/p><p>And leaving undone what &#x27;twas right to do,<\/p><p>And doing wrong, my face is very black!<\/p>"},{"n":419,"label":"CDXIX","verse":"<p>I could repent of all, but of wine, never!<\/p><p>I could dispense with all, but with wine, never!<\/p><p>If so be I became a Musulman,<\/p><p>Could I abjure my Magian wine? no, never!<\/p>"},{"n":420,"label":"CDXX","verse":"<p>We rest our hopes on Thy free grace alone,<\/p><p>Nor seek by merits for our sins to atone;<\/p><p>Mercy drops where it lists, and estimates<\/p><p>Ill done as undone, good undone as done.<\/p>"},{"n":421,"label":"CDXXI","verse":"<p>This is the form Thou gavest me of old,<\/p><p>Wherein Thou workest marvels manifold;<\/p><p>Can I aspire to be a better man,<\/p><p>Or other than I issued from Thy mould?<\/p>"},{"n":422,"label":"CDXXII","verse":"<p>O Lord! to Thee all creatures worship pay,<\/p><p>To Thee both small and great for ever pray,<\/p><p>Thou takest woe away, and givest weal,<\/p><p>Give then, or, if it please Thee, take away!<\/p>"},{"n":423,"label":"CDXXIII","verse":"<p>With going to and fro in this sad vale<\/p><p>Thou art grown double, and thy credit stale,<\/p><p>Thy nails are thickened like a horse&#x27;s hoof,<\/p><p>Thy beard is ragged as an ass&#x27;s tail.<\/p>"},{"n":424,"label":"CDXXIV","verse":"<p>O unenlightened race of humankind,<\/p><p>Ye are a nothing, built on empty wind!<\/p><p>Yea, a mere nothing, hovering in the abyss,<\/p><p>A void before you, and a void behind!<\/p>"},{"n":425,"label":"CDXXV","verse":"<p>Each morn I say, &quot;To-night I will repent<\/p><p>Of wine, and tavern haunts no more frequent&quot;;<\/p><p>But while &#x27;tis spring, and roses are in bloom,<\/p><p>To loose me from my promise, O consent!<\/p>"},{"n":426,"label":"CDXXVI","verse":"<p>Vain study of philosophy eschew!<\/p><p>Rather let tangled curls attract your view;<\/p><p>And shed the bottle&#x27;s life-blood in your cup,<\/p><p>Or e&#x27;er death shed your blood, and feast on you.<\/p>"},{"n":427,"label":"CDXXVII","verse":"<p>O heart! can&#x27;st thou the darksome riddle read,<\/p><p>Where wisest men have failed, wilt thou succeed?<\/p><p>Quaff wine, and make thy heaven here below,<\/p><p>Who knows if heaven above will be thy meed?<\/p>"},{"n":428,"label":"CDXXVIII","verse":"<p>They that have passed away, and gone before,<\/p><p>Sleep in delusion&#x27;s dust for evermore;<\/p><p>Go, boy, and fetch some wine, this is the truth,<\/p><p>Their dogmas were but air, and wind their lore!<\/p>"},{"n":429,"label":"CDXXIX","verse":"<p>O heart! when on the Loved One&#x27;s sweets you feed,<\/p><p>You lose yourself, but find your Self indeed;<\/p><p>And, when you drink of His entrancing cup,<\/p><p>You hasten your escape from quick and dead!<\/p>"},{"n":430,"label":"CDXXX","verse":"<p>Though I am wont a wine-bibber to be,<\/p><p>Why should the people rail and chide at me?<\/p><p>Would that all evil actions made men drunk,<\/p><p>For then no sober people should I see!<\/p>"},{"n":431,"label":"CDXXXI","verse":"<p>Child of four elements and sevenfold heaven,<\/p><p>Who fume and sweat because of these eleven,<\/p><p>Drink! I have told you seventy times and seven,<\/p><p>Once gone, nor hell will send you back, nor heaven.<\/p>"},{"n":432,"label":"CDXXXII","verse":"<p>With many a snare Thou dost beset my way,<\/p><p>And threatenest, if I fall therein, to slay;<\/p><p>Thy rule resistless sways the world, yet Thou<\/p><p>Imputest sin, when I do but obey!<\/p>"},{"n":433,"label":"CDXXXIII","verse":"<p>To Thee, whose essence baffles human thought,<\/p><p>Our sins and righteous deeds alike seem naught,<\/p><p>May Thy grace sober me, though drunk with sins,<\/p><p>And pardon all the ill that I have wrought!<\/p>"},{"n":434,"label":"CDXXXIV","verse":"<p>If this life were indeed an empty play,<\/p><p>Each day would be an _&#x27;lid_ of festal day,<\/p><p>And men might conquer all their hearts&#x27; desire,<\/p><p>Fearless of after penalties to pay!<\/p>"},{"n":435,"label":"CDXXXV","verse":"<p>O wheel of heaven, you thwart my heart&#x27;s desire,<\/p><p>And rend to shreds my scanty joy&#x27;s attire,<\/p><p>The water that I drink you foul with earth,<\/p><p>And turn the very air I breathe to fire!<\/p>"},{"n":436,"label":"CDXXXVI","verse":"<p>O soul! could you but doff this flesh and bone,<\/p><p>You&#x27;d soar a sprite about the heavenly throne;<\/p><p>Had you no shame to leave your starry home,<\/p><p>And dwell an alien on this earthly zone?<\/p>"},{"n":437,"label":"CDXXXVII","verse":"<p>Ah, potter, stay thine hand&#x27; with ruthless art<\/p><p>Put not to such base use man&#x27;s mortal part!<\/p><p>See, thou art mangling on thy cruel wheel<\/p><p>Faridun&#x27;s fingers, and Kai Khosrau&#x27;s heart!<\/p>"},{"n":438,"label":"CDXXXVIII","verse":"<p>O rose! all beauties&#x27; charms thou dost excel,<\/p><p>As wine excels the pearl within its shell;<\/p><p>O fortune! thou dost ever show thyself<\/p><p>More strange, although I seem to know thee well!<\/p>"},{"n":439,"label":"CDXXXIX","verse":"<p>From this world&#x27;s kitchen crave not to obtain<\/p><p>Those dainties, seeming real, but really vain,<\/p><p>Which greedy worldlings gorge to their own loss;<\/p><p>Renounce that loss, so loss shall prove thy gain!<\/p>"},{"n":440,"label":"CDXL","verse":"<p>Plot not of nights, thy fellows&#x27; peace to blight,<\/p><p>So that they cry to God the live-long night;<\/p><p>Nor plume thee on thy wealth and might, which thieves<\/p><p>May steal by night, or death, or fortune&#x27;s might.<\/p>"},{"n":441,"label":"CDXLI","verse":"<p>This soul of mine was once Thy cherished bride,<\/p><p>What caused Thee to divorce her from Thy side?<\/p><p>Thou didst not use to treat her thus of yore,<\/p><p>Why then now doom her in the world to abide?<\/p>"},{"n":442,"label":"CDXLII","verse":"<p>Ah! would there were a place of rest from pain,<\/p><p>Which we, poor pilgrims, might at last attain,<\/p><p>And after many thousand wintry years,<\/p><p>Renew our life, like flowers, and bloom again!<\/p>"},{"n":443,"label":"CDXLIII","verse":"<p>While in love&#x27;s book I sought an augury;<\/p><p>An ardent youth cried out in ecstasy,<\/p><p>&quot;Who owns a sweetheart beauteous as the moon,<\/p><p>Might wish his moments long as years to be!&quot;<\/p>"},{"n":444,"label":"CDXLIV","verse":"<p>Winter is past, and spring-tide has begun,<\/p><p>Soon will the pages of life&#x27;s book be done!<\/p><p>Well saith the sage, &quot;Life is a poison rank,<\/p><p>And antidote, save grape-juice, there is none.&quot;<\/p>"},{"n":445,"label":"CDXLV","verse":"<p>Beloved, if thou a reverend Molla be,<\/p><p>Quit saintly show, and feigned austerity,<\/p><p>And quaff the wine that Murtaza purveys,<\/p><p>And sport with Houris &#x27;neath some shady tree!<\/p>"},{"n":446,"label":"CDXLVI","verse":"<p>Last night I dashed my cup against a stone,<\/p><p>In a mad drunken freak, as I must own,<\/p><p>And lo! the cup cries out in agony,<\/p><p>&quot;You too, like me, shall soon be overthrown.&quot;<\/p>"},{"n":447,"label":"CDXLVII","verse":"<p>My heart is weary of hypocrisy,<\/p><p>Cupbearer, bring some wine, I beg of thee!<\/p><p>This hooded cowl and prayer-mat pawn for wine,<\/p><p>Then will I boast me in security.<\/p>"},{"n":448,"label":"CDXLVIII","verse":"<p>Audit yourself, your truce account to frame,<\/p><p>See! you go empty, as you empty came;<\/p><p>You say, &quot;I will not drink and peril life,&quot;<\/p><p>But, drink or no, you must die all the same!<\/p>"},{"n":449,"label":"CDXLIX","verse":"<p>Open the door! O entrance who procurest,<\/p><p>And guide the way, O Thou of guides the surest!<\/p><p>Directors born of men shall not direct me,<\/p><p>Their counsel comes to naught, but Thou endurest!<\/p>"},{"n":450,"label":"CDL","verse":"<p>In slandering and reviling you persist,<\/p><p>Calling me infidel and atheist:<\/p><p>My errors I will not deny, but yet<\/p><p>Does foul abuse become a moralist?<\/p>"},{"n":451,"label":"CDLI","verse":"<p>To find a remedy, put up with pain,<\/p><p>Chafe not at woe, and healing thou wilt gain;<\/p><p>Though poor, be ever of a thankful mind,<\/p><p>&#x27;Tis the sure method riches to obtain.<\/p>"},{"n":452,"label":"CDLII","verse":"<p>Give me a skin of wine, a crust of bread<\/p><p>A pittance bare, a book of verse to read;<\/p><p>With thee, O love, to share my lowly roof,<\/p><p>I would not take the Sultan&#x27;s realm instead!<\/p>"},{"n":453,"label":"CDLIII","verse":"<p>Reason not of the five, nor of the four,<\/p><p>Be their dark problems one, or many score;<\/p><p>We are but earth, go, minstrel, bring the lute,<\/p><p>We are but air, bring wine, I ask no more!<\/p>"},{"n":454,"label":"CDLIV","verse":"<p>Why argue on Yasin and on Barat?<\/p><p>Write me the draft for wine they call Barat!<\/p><p>The day my weariness is drowned in wine<\/p><p>Will seem to me as the great night Barat!<\/p>"},{"n":455,"label":"CDLV","verse":"<p>Whilst thou dost wear this fleshy livery,<\/p><p>Step not beyond the bounds of destiny;<\/p><p>Bear up, though very Rustums be thy foes,<\/p><p>And crave no boon from friends like Hatim Tai!<\/p>"},{"n":456,"label":"CDLVI","verse":"<p>These ruby lips, and wine, and minstrel boys,<\/p><p>And lute, and harp, your dearly cherished toys,<\/p><p>Are mere redundancies, and you are naught,<\/p><p>Till you renounce the world&#x27;s delusive joys.<\/p>"},{"n":457,"label":"CDLVII","verse":"<p>Bow down, heaven&#x27;s tyranny to undergo,<\/p><p>Quaff wine to face the world, and all its woe;<\/p><p>Your origin and end are both in earth,<\/p><p>But now you are _above_ earth, not _below_!<\/p>"},{"n":458,"label":"CDLVIII","verse":"<p>You know all secrets of this earthly sphere,<\/p><p>Why then remain a prey to empty fear?<\/p><p>You cannot bend things to your will, but yet<\/p><p>Cheer up for the few moments you are here!<\/p>"},{"n":459,"label":"CDLIX","verse":"<p>Behold, where&#x27;er we turn our ravished eyes,<\/p><p>Sweet verdure springs, and crystal Kausars rise;<\/p><p>And plains, once bare as hell, now smile as heaven:<\/p><p>Enjoy this heaven with maids of Paradise!<\/p>"},{"n":460,"label":"CDLX","verse":"<p>Never in this false world on friends rely<\/p><p>(I give this counsel confidentially),<\/p><p>Put up with pain, and seek no antidote,<\/p><p>Endure your grief, and ask no sympathy!<\/p>"},{"n":461,"label":"CDLXI","verse":"<p>Of wisdom&#x27;s dictates two are principal,<\/p><p>Surpassing all your lore traditional;<\/p><p>Better to fast than eat of every meat,<\/p><p>Better to live alone than mate with all!<\/p>"},{"n":462,"label":"CDLXII","verse":"<p>Why unripe grapes are sharp, prithee explain,<\/p><p>And then grow sweet, while wine is sharp again?<\/p><p>When one has carved a block into a lute,<\/p><p>Can he from that same block a pipe obtain?<\/p>"},{"n":463,"label":"CDLXIII","verse":"<p>When dawn doth silver the dark firmament,<\/p><p>Why shrills the bird of dawning his lament?<\/p><p>It is to show in dawn&#x27;s bright looking-glass<\/p><p>How of thy careless life a night is spent.<\/p>"},{"n":464,"label":"CDLXIV","verse":"<p>Cupbearer, come! from thy full-throated ewer<\/p><p>Pour blood-red wine, the world&#x27;s despite to cure!<\/p><p>Where can I find another friend like wine,<\/p><p>So genuine, so solacing, so pure?<\/p>"},{"n":465,"label":"CDLXV","verse":"<p>Though you should sit in sage Aristo&#x27;s room,<\/p><p>Or rival Cæsar on his throne of Rum,<\/p><p>Drain Jemshid&#x27;s goblet, for your end&#x27;s the tomb,<\/p><p>Yea, were you Bahram&#x27;s self, your end&#x27;s the tomb!<\/p>"},{"n":466,"label":"CDLXVI","verse":"<p>It chanced into a potter&#x27;s shop I strayed,<\/p><p>He turned his wheel and deftly plied his trade,<\/p><p>And out of monarchs&#x27; heads, and beggars&#x27; feet,<\/p><p>Fair heads and handles for his pitchers made!<\/p>"},{"n":467,"label":"CDLXVII","verse":"<p>If you have sense, true senselessness attain,<\/p><p>And the Etern Cupbearer&#x27;s goblet drain,<\/p><p>If not, true senselessness is not for you,<\/p><p>Not every fool true senselessness can gain!<\/p>"},{"n":468,"label":"CDLXVIII","verse":"<p>O Love! before you pass death&#x27;s portal through,<\/p><p>And potters make their jugs of me and you,<\/p><p>Pour from this jug some wine, of headache void,<\/p><p>And fill your cup, and fill my goblet too!<\/p>"},{"n":469,"label":"CDLXIX","verse":"<p>O Love! while yet you can, with tender art,<\/p><p>Lift sorrow&#x27;s burden from your lover&#x27;s heart;<\/p><p>Your wealth of graces will not always last,<\/p><p>But slip from your possession, and depart!<\/p>"},{"n":470,"label":"CDLXX","verse":"<p>Bestir thee, ere death&#x27;s cup for thee shall flow,<\/p><p>And blows of ruthless fortune lay thee low;<\/p><p>Acquire some substance _here_, there is none _there_,<\/p><p>For those who thither empty-handed go!<\/p>"},{"n":471,"label":"CDLXXI","verse":"<p>Who framed the lots of quick and dead but Thou?<\/p><p>Who turns the troublous wheel of heaven but Thou?<\/p><p>Though we are sinful slaves, is it for Thee<\/p><p>To blame us? Who created us but Thou?<\/p>"},{"n":472,"label":"CDLXXII","verse":"<p>O wine, most limpid, pure, and crystalline,<\/p><p>Would I could drench this silly frame of mine<\/p><p>With thee, that passers by might think &#x27;twas thou,<\/p><p>And cry, &quot;Whence comest thou, fair master wine?&quot;<\/p>"},{"n":473,"label":"CDLXXIII","verse":"<p>A Shaikh beheld a harlot, and quoth he,<\/p><p>&quot;You seem a slave to drink and lechery&quot;;<\/p><p>And she made answer, &quot;What I seem I am,<\/p><p>But, Master, are you all you seem to be?&quot;<\/p>"},{"n":474,"label":"CDLXXIV","verse":"<p>If, like a ball, earth to my house were borne,<\/p><p>When drunk, I&#x27;d rate it at a barley-corn;<\/p><p>Last night they offered me in pawn for wine,<\/p><p>But the rude vintner laughed that pledge to scorn.<\/p>"},{"n":475,"label":"CDLXXV","verse":"<p>Now in thick clouds Thy face Thou dost immerse,<\/p><p>And now display it in this universe;<\/p><p>Thou the spectator, Thou the spectacle,<\/p><p>Sole to Thyself Thy glories dost rehearse.<\/p>"},{"n":476,"label":"CDLXXVI","verse":"<p>Better to make one soul rejoice with glee,<\/p><p>Than plant a desert with a colony;<\/p><p>Rather one freeman bind with chains of love,<\/p><p>Than set a thousand prisoned captives free!<\/p>"},{"n":477,"label":"CDLXXVII","verse":"<p>O thou who for thy pleasure dost impart<\/p><p>A pang of sorrow to thy fellow&#x27;s heart,<\/p><p>Go! mourn thy perished wit, and peace of mind,<\/p><p>Thyself hast slain them, like the fool thou art!<\/p>"},{"n":478,"label":"CDLXXVIII","verse":"<p>Wherever you can get two maunds of wine,<\/p><p>Set to, and drink it like a libertine;<\/p><p>Whoso acts thus will set his spirit free<\/p><p>From saintly airs like yours, and grief like mine.<\/p>"},{"n":479,"label":"CDLXXIX","verse":"<p>So long as I possess two maunds of wine,<\/p><p>Bread of the flower of wheat, and mutton chine,<\/p><p>And you, O Tulip cheek, to share my hut,<\/p><p>Not every Sultan&#x27;s lot can vie with mine.<\/p>"},{"n":480,"label":"CDLXXX","verse":"<p>They call you wicked, if to fame you&#x27;re known,<\/p><p>And an intriguer, if you live alone,<\/p><p>Trust me, though you were Khizr or Elias,<\/p><p>&#x27;Tis best to know none, and of none be known.<\/p>"},{"n":481,"label":"CDLXXXI","verse":"<p>Yes! here am I with wine and feres again!<\/p><p>I did repent, but, ah! &#x27;twas all in vain;<\/p><p>Preach not to me of Noah and his flood,<\/p><p>But pour a flood of wine to drown my pain!<\/p>"},{"n":482,"label":"CDLXXXII","verse":"<p>For union with my love I sigh in vain,<\/p><p>The pangs of absence I can scarce sustain,<\/p><p>My grief I dare not tell to any friend;<\/p><p>O trouble strange, sweet passion, bitter pain!<\/p>"},{"n":483,"label":"CDLXXXIII","verse":"<p>&#x27;Tis dawn! I hear the loud Muezzin&#x27;s call,<\/p><p>And here am I before the vintner&#x27;s hall;<\/p><p>This is no time of piety. Be still!<\/p><p>And drop your talk and airs devotional!<\/p>"},{"n":484,"label":"CDLXXXIV","verse":"<p>Angel of joyful foot! the dawn is nigh;<\/p><p>Pour wine, and lift your tuneful voice on high,<\/p><p>Sing how Jemshids and Khosraus bit the dust,<\/p><p>Whelmed by the rolling months, from Tir to Dai!<\/p>"},{"n":485,"label":"CDLXXXV","verse":"<p>Frown not at revellers, I beg of thee,<\/p><p>For all thou keepest righteous company;<\/p><p>But drink, for, drink or no, &#x27;tis all the same,<\/p><p>If doomed to hell, no heaven thou&#x27;lt ever see.<\/p>"},{"n":486,"label":"CDLXXXVI","verse":"<p>I wish that Allah would rebuild these skies,<\/p><p>And earth, and that at once, before my eyes,<\/p><p>And either raze my name from off his roll,<\/p><p>Or else relieve my dire necessities!<\/p>"},{"n":487,"label":"CDLXXXVII","verse":"<p>Lord! make thy bounty&#x27;s cup for me to flow,<\/p><p>And bread unbegged for day by day bestow;<\/p><p>Yea, with thy wine make me beside myself.<\/p><p>No more to feel the headache of my woe!<\/p>"},{"n":488,"label":"CDLXXXVIII","verse":"<p>Omar! of burning heart, perchance to burn<\/p><p>In hell, and feed its bale-fires in thy turn,<\/p><p>Presume not to teach Allah clemency,<\/p><p>For who art thou to teach, or He to learn?<\/p>"},{"n":489,"label":"CDLXXXIX","verse":"<p>Cheer up! your lot was settled yesterday!<\/p><p>Heedless of all that you might do or say,<\/p><p>Without so much as &quot;By your leave&quot; they fixed<\/p><p>Your lot for all the morrows yesterday!<\/p>"},{"n":490,"label":"CDXC","verse":"<p>I never would have come, had I been asked,<\/p><p>I would as lief not go, if I were asked,<\/p><p>And, to be short, I would annihilate<\/p><p>All coming, being, going, were I asked!<\/p>"},{"n":491,"label":"CDXCI","verse":"<p>Man is a cup, his soul the wine therein,<\/p><p>Flesh is a pipe, spirit the voice within;<\/p><p>O Khayyam, have you fathomed what man is?<\/p><p>A magic lantern with a light therein!<\/p>"},{"n":492,"label":"CDXCII","verse":"<p>O skyey wheel, all base men you supply<\/p><p>With baths, mills, and canals that run not dry,<\/p><p>While good men have to pawn their goods for bread:<\/p><p>Pray, who would give a fig for such a sky?<\/p>"},{"n":493,"label":"CDXCIII","verse":"<p>A potter at his work I chanced to see,<\/p><p>Pounding some earth and shreds of pottery;<\/p><p>I looked with eyes of insight, and methought<\/p><p>&#x27;Twas Adam&#x27;s dust with which he made so free!<\/p>"},{"n":494,"label":"CDXCIV","verse":"<p>The Saki knows my _genus properly_,<\/p><p>To all woe&#x27;s _species_ he holds a key,<\/p><p>Whene&#x27;er my _mood_ is sad, he brings me wine,<\/p><p>And that makes all the _difference_ to me!<\/p>"},{"n":495,"label":"CDXCV","verse":"<p>Dame Fortune! all your acts and deeds confess<\/p><p>That you are foul oppression&#x27;s votaress;<\/p><p>You cherish bad men, and annoy the good;<\/p><p>Is this from dotage, or sheer foolishness?<\/p>"},{"n":496,"label":"CDXCVI","verse":"<p>You, who in carnal lusts your time employ,<\/p><p>Wearing your precious spirit with annoy,<\/p><p>Know that these things you set your heart upon<\/p><p>Sooner or later must the soul destroy!<\/p>"},{"n":497,"label":"CDXCVII","verse":"<p>Hear from the spirit world this mystery:<\/p><p>Creation is summed up, O man, in thee;<\/p><p>Angel and demon, man and beast art thou,<\/p><p>Yea, thou _art_ all thou dost _appear_ to be!<\/p>"},{"n":498,"label":"CDXCVIII","verse":"<p>If popularity you would ensue,<\/p><p>Speak well of Moslem, Christian, and Jew;<\/p><p>So shall you be esteemed of great and small,<\/p><p>And none will venture to speak ill of you.<\/p>"},{"n":499,"label":"CDXCIX","verse":"<p>O wheel of heaven, what have I done to you,<\/p><p>That you should thus annoy me? Tell me true;<\/p><p>To get a drink I have to cringe and stoop,<\/p><p>And for my bread you make me beg and sue.<\/p>"},{"n":500,"label":"D","verse":"<p>No longer hug your grief and vain despair,<\/p><p>But in this unjust world be just and fair;<\/p><p>And since the issue of the world is naught,<\/p><p>Think you are naught, and so shake off dull care!<\/p>"}]},"nicolas":{"short":"Ni","label":"Nicolas &rarr; English Prose","plain":"Nicolas to English Prose","year":1903,"unit":"quatrains","dir":"ltr","lang":"en","kind":"prose","title":"Nicolas 1867 → English prose, 1903 — 464 quatrains","note":"English prose after J. B. Nicolas&rsquo;s 1867 French — a Sufistic reading.","key":"nicolas","count":464,"quatrains":[{"n":1,"label":"I","verse":"<p class=\"q-prose\">One morning, coming from the tavern I heard a voice which said: Come, joyous drinkers, youthful fools, arise, and fill with me a cup of wine, ere Fate shall come to fill the cup of our existence.<\/p>"},{"n":2,"label":"II","verse":"<p class=\"q-prose\">O Thou who in the universe art the object chosen of my heart! Thou who art more dear than the soul which gives me life, than the eyes which give me light! O Idol, though in life there be no thing more precious than this life, Thou art indeed a hundred times more precious than that life.<\/p>"},{"n":3,"label":"III","verse":"<p class=\"q-prose\">Who led thee here this night, thus given up to wine? Who, indeed, raising the veil which hid thee, has been able to lead thee here? Who, finally, brought thee as rapidly as the wind which fans the fire that still burned in thy absence?<\/p>"},{"n":4,"label":"IV","verse":"<p class=\"q-prose\">We meet but chagrin and misfortune in this world, which serves us as a tent for the time. Alas! No problem of creation has been solved for us, and behold! we leave it with hearts full of regret at knowing naught about it.<\/p>"},{"n":5,"label":"V","verse":"<p class=\"q-prose\">O Khadja, give us lawfully a single one of our desires; reserve thy breath and lead us into the way of God. Surely we walk aright, it is thou that seest crosswise; heal, then, thine eyes and leave us here in peace.<\/p>"},{"n":6,"label":"VI","verse":"<p class=\"q-prose\">Come, come, arise, and, for the healing of my heart, one problem solve for me: yet quickly bring me a pitcher of wine, and let us drink before they make pitchers out of our own dust.<\/p>"},{"n":7,"label":"VII","verse":"<p class=\"q-prose\">When I am dead, wash me with the juice of the vine; in place of prayer, sing above my tomb the praise of the cup and the wine, and, if you would find me again at the day of doom, seek me in the dust of the tavern floor.<\/p>"},{"n":8,"label":"VIII","verse":"<p class=\"q-prose\">Since no one has ever been able to answer thee from one day to the next, hasten to glad thy heart filled with sadness. Drink, O adorable Moon! drink from thy silver cup, for long shalt thou turn in the firmament without finding us here again.<\/p>"},{"n":9,"label":"IX","verse":"<p class=\"q-prose\">Would that the lover [the true believer] were intoxicated the whole year, mad, absorbed with wine, covered with dishonor! For, when we have sound reason, chagrin assails us on all sides; but when we are in wine, well, let come what will!<\/p>"},{"n":10,"label":"X","verse":"<p class=\"q-prose\">In Heaven&#x27;s name! with what hope does the sage attach his heart to the illusory treasures of this palace of misfortune? Oh! that the One who gave me the name of drunkard would recant his error, for how can he see the tavern&#x27;s sign from his exalted abode.<\/p>"},{"n":11,"label":"XI","verse":"<p class=\"q-prose\">The Koran, which is but a name for The Sublime Word, is, however, read only from time to time and not with constancy; while ever on the brim of the cup is found a verse full of light which one can read always and everywhere.<\/p>"},{"n":12,"label":"XII","verse":"<p class=\"q-prose\">Thou that drinkest not wine shouldst not for this reason blame the drunkard, for I am ready to renounce God, myself, should He order me to renounce wine. Thou glorifiest thyself for not drinking wine, but such glory but ill befits those who commit acts a hundredfold more reprehensible than drunkenness.<\/p>"},{"n":13,"label":"XIII","verse":"<p class=\"q-prose\">Though my body be beautiful, and the perfume it exhales agreeable, though the color of my face rival that of the tulip, and my figure be supple as the cypress, it has not been demonstrated why my celestial author placed me upon this earth.<\/p>"},{"n":14,"label":"XIV","verse":"<p class=\"q-prose\">I would drink so much wine that the odor should come out of the earth when I have been returned to it, and that drinkers who wish to visit my tomb may fall senseless from the sole effect of this odor.<\/p>"},{"n":15,"label":"XV","verse":"<p class=\"q-prose\">In the region of hope, form as many friends as you can; in the time of existence, bind yourself to a perfect friend, for, know well that a hundred Kaabas, made of earth and water, are not worth one heart. Leave, then, thy Kaabas and rather seek a heart.<\/p>"},{"n":16,"label":"XVI","verse":"<p class=\"q-prose\">When I take in my hand a cup of wine and, in the joy of my soul, become intoxicate, then, in that state of fire which devours me, I see a hundred miracles grow real, and words, clear as the most limpid water, come to explain the mystery of all things.<\/p>"},{"n":17,"label":"XVII","verse":"<p class=\"q-prose\">Since the duration of a day is only two stages, make haste to drink wine, the limpid wine; for know well that you near the end of your vanishing existence. And, since you know that this world drags all to decay, be wise, and, also, day and night be drenched in wine.<\/p>"},{"n":18,"label":"XVIII","verse":"<p class=\"q-prose\">We who give ourselves up to the will of wine offer with joy our souls in holocaust to the laughing lips of the juice divine. Oh! rapturous sight! Our cup-bearer holds in one hand the neck of the flask and in the other the cup overflowing, as if inviting us to receive the purest of the blood!<\/p>"},{"n":19,"label":"XIX","verse":"<p class=\"q-prose\">Yes, we, seated in the midst of this treasure in ruins, surrounded by wine and dancers, have put in pawn [in order to procure them] all that we possess: soul, heart, goods--everything but the cup. We are thus freed from hope of pardon and fear of punishment. We are beyond the air, the earth, and fire and water.<\/p>"},{"n":20,"label":"XX","verse":"<p class=\"q-prose\">The distance which separates incredulity from faith is but a breath,--that which separates doubt from certainty is equally but a breath. Let us, then, pass this precious space of a breath gaily, for our life also is only separated [from death] by the space of a breath.<\/p>"},{"n":21,"label":"XXI","verse":"<p class=\"q-prose\">O Wheel of Destiny! destruction comes of thy implacable hate. Tyranny for thee is an act of predilection which thou hast committed from the commencement of centuries; and thou, also, O Earth, if one search in thy bosom, what inappreciable treasures will he not find there!<\/p>"},{"n":22,"label":"XXII","verse":"<p class=\"q-prose\">My turn of existence has slipped around in a few days. It has passed as passes the wind over the desert. Then, while remains to me a breath of life, two days shall be for which I never need be troubled, the day which has not come and that which now has passed.<\/p>"},{"n":23,"label":"XXIII","verse":"<p class=\"q-prose\">This priceless ruby comes from a mine of its own, this rare pearl is pregnant with a character its own; our different dogmas on this matter are erroneous, since the enigma of perfect love is explained in a language of its own [and that is not conveyed to us].<\/p>"},{"n":24,"label":"XXIV","verse":"<p class=\"q-prose\">Since to-day is my turn for youth, I intend to pass it in drinking wine, for that is my pleasure. Begin not to talk of its bitterness, to speak ill of this delicious juice, for it is agreeable, and is only bitter because it enforces the bitterness of my life.<\/p>"},{"n":25,"label":"XXV","verse":"<p class=\"q-prose\">O my poor heart! Since thy lot is to be bruised to death by chagrin, since nature wills that thou be wounded each day with some new torment, tell me, O my soul, why stay you in my body, since you must finally leave it some day?<\/p>"},{"n":26,"label":"XXVI","verse":"<p class=\"q-prose\">Thou canst not count to-day on seeing the day after to-morrow; even to think of this to-morrow would be the part of folly; if thy heart is awakened, lose not in inaction this instant of life [which remains to thee] and for the duration of which I see no warranty.<\/p>"},{"n":27,"label":"XXVII","verse":"<p class=\"q-prose\">It is not necessary to knock at every door unless there be a reason for it. It is better to accommodate oneself to the good and the bad here below, for hereafter we can only enjoy the number of moves which destiny presents upon the chessboard of this terrestrial ball.<\/p>"},{"n":28,"label":"XXVIII","verse":"<p class=\"q-prose\">This jug [earthen vessel] has been, like me, a loving and unhappy creature; it has sighed for a lock of some young beauty&#x27;s hair; this handle that you see attached to its neck was an amorous arm passed about the neck of some girl.<\/p>"},{"n":29,"label":"XXIX","verse":"<p class=\"q-prose\">Before your time or mine, there were many twilights, many dawns, and it is not without reason that the movement of rotation is enforced upon the heavens. Be careful as you place your foot upon this dust, for it has, without doubt, formed the eyes of someone young and fair.<\/p>"},{"n":30,"label":"XXX","verse":"<p class=\"q-prose\">The temple of idols and the Kaaba are places of adoration; the chime of the bells is but a hymn chanted to the praise of the All-Powerful. The _mehrab_ [Mohammedan pulpit], the church, the chapel, the cross are, in truth, but different stations for rendering homage to the Deity.<\/p>"},{"n":31,"label":"XXXI","verse":"<p class=\"q-prose\">Existing things were already predestined upon the tablet of creation. The brush [of the universe] did not paint good and bad. With destiny God imprinted whatever should be so imprinted, and the efforts that we make in these directions are wholly lost.<\/p>"},{"n":32,"label":"XXXII","verse":"<p class=\"q-prose\">I can but vaguely tell my secret to the bad or to the good. I cannot elaborate or explain my thought, which is essentially brief. I see a place of which I can only trace a description; I possess a secret which I cannot unveil.<\/p>"},{"n":33,"label":"XXXIII","verse":"<p class=\"q-prose\">False money is not current among us. The broom has rid our joyous dwelling of it completely. An old man, returning from the tavern, said to me: Drink wine, my friend, for other lives shall follow yours in your long sleep.<\/p>"},{"n":34,"label":"XXXIV","verse":"<p class=\"q-prose\">In the face of the decrees of Providence, nothing avails but resignation. Among men nothing avails but seeming and hypocrisy. I have employed every ruse, the strongest that the human mind can invent, but destiny has always overturned my projects.<\/p>"},{"n":35,"label":"XXXV","verse":"<p class=\"q-prose\">If a stranger shows you fidelity, consider him as a kinsman; but if a kinsman endeavors to betray you, regard him as an enemy. If poison cures you, consider it an antidote, and if the antidote does not agree with you, regard it as a poison.<\/p>"},{"n":36,"label":"XXXVI","verse":"<p class=\"q-prose\">Except Thy absence there is nothing of worth that can bruise to the quick; he cannot be acute who is not taken with Thy subtle charms, and, although there exist in Thy mind no care for any one, there is none who may not be preoccupied with Thee.<\/p>"},{"n":37,"label":"XXXVII","verse":"<p class=\"q-prose\">As long as I am not drunk, my happiness is incomplete. When I am overcome with wine, ignorance replaces my reason. But there exists an intermediary state between drunkenness and sound reason. Oh! with what happiness do I enslave myself to such a state, since in it there is life!<\/p>"},{"n":38,"label":"XXXVIII","verse":"<p class=\"q-prose\">Who will believe that He who fashioned the cup could think of destroying it? All these beautiful heads, all these beautiful arms, all these dainty hands, are by what love created and by what hate destroyed?<\/p>"},{"n":39,"label":"XXXIX","verse":"<p class=\"q-prose\">It is the effect of thy ignorance which makes thee fear death and abhor annihilation, for it is evident that from this annihilation shoots up a branch of immortality. Since my soul has been revived by the breath of Jesus, eternal death has fled far from me.<\/p>"},{"n":40,"label":"XL","verse":"<p class=\"q-prose\">Imitate the tulip which flowers at New-year&#x27;s; take, like her, a cup in thy hand and, if the occasion presents itself, drink, drink of wine in happiness with some fair girl whose cheeks are tinted with the color of this flower, for this blue wheel [dome], like a breath of wind, can suddenly overturn thee.<\/p>"},{"n":41,"label":"XLI","verse":"<p class=\"q-prose\">Since things are not allowed to come to pass as we desire, to what purpose are our designs and our efforts? We are constantly tormenting ourselves, speaking to ourselves with sighs of regret. Ah! we have arrived too late; too soon will it be necessary for us to depart!<\/p>"},{"n":42,"label":"XLII","verse":"<p class=\"q-prose\">Since the celestial wheel and that of destiny have never been favorable, what matters it whether we are able to count seven heavens or believe that there are eight? There are [I repeat it] two days for which I need not care; the day which has not come and that which now is gone.<\/p>"},{"n":43,"label":"XLIII","verse":"<p class=\"q-prose\">O Khayyam! why so much sorrow for a sin committed? What comfort more or less do you find in this self-torment? He who has not sinned cannot enjoy the sweetness of pardon. It is for sin that pardon must exist; in that event why entertain a fear?<\/p>"},{"n":44,"label":"XLIV","verse":"<p class=\"q-prose\">No one has access to the secrets of God behind the mysterious curtain; no one [even in mind] can penetrate there; we have no other dwelling than the earthly mind. Oh, regret! for this also is an enigma not less difficult to comprehend.<\/p>"},{"n":45,"label":"XLV","verse":"<p class=\"q-prose\">Long time have I delved in this inconstant world, this momentary shelter; and in my searches have employed all faculties with which I am endowed. Ah, well! and I have found the moon to pale before the light of Thy visage, that the cypress is deformed beside Thy beauteous form.<\/p>"},{"n":46,"label":"XLVI","verse":"<p class=\"q-prose\">In the mosque, in the _medresseh_ [school annexed to the mosque], in the church, and in the synagogue, they have a horror of Hell and seek for Paradise, but the seed of such disquiet never germinates in the hearts of those who penetrate the secrets of the All-Powerful.<\/p>"},{"n":47,"label":"XLVII","verse":"<p class=\"q-prose\">You have traveled over the world! Ah, well! all that you have seen is nothing; all that you have seen and all that you have heard are equally nothing. You have gone from one end of the universe to the other, all that is nothing; you have summed it all up in one corner of your room, all that is nothing, still nothing.<\/p>"},{"n":48,"label":"XLVIII","verse":"<p class=\"q-prose\">One night I saw in thought a sage who said to me: Sleep, O my friend, has never caused the rose of happiness to bloom for anyone; why lend yourself to aught so similar to death? Rather drink wine, for you will sleep enough when buried in the earth.<\/p>"},{"n":49,"label":"XLIX","verse":"<p class=\"q-prose\">Had the human heart an exact knowledge of the secrets of life, it would also know, at the point of death, the secrets of God. If to-day, when you are with yourself, you know nothing, what will you know to-morrow when you shall be separated from yourself?<\/p>"},{"n":50,"label":"L","verse":"<p class=\"q-prose\">The day when the heavens shall be confounded, when the stars shall be obscured, I will stop Thee upon Thy way, O Idol! and, taking Thee by the hem of Thy robe, will ask of Thee why Thou hast robbed me of life [after giving it to me].<\/p>"},{"n":51,"label":"LI","verse":"<p class=\"q-prose\">We should tell no secrets to the vilely indiscreet; from the nightingale, even, should we conceal them. Consider, then, the torment you inflict on human souls by forcing them to disrobe thus before the gaze of all.<\/p>"},{"n":52,"label":"LII","verse":"<p class=\"q-prose\">O Cupbearer! since time is here, ready to break down you and me, this world for neither you nor me can be a place of permanence. But, equally, be well convinced that while this jug of wine is here &#x27;twixt you and me, our God is in our hands.<\/p>"},{"n":53,"label":"LIII","verse":"<p class=\"q-prose\">Long time, indeed, with cup in hand, I walked among the flowers; nevertheless none of my projects has been realized in this world. But, although wine has not led me to the goal of my desires, I will not stray from its path, for when one follows a road he cannot retrogress.<\/p>"},{"n":54,"label":"LIV","verse":"<p class=\"q-prose\">Put a cup of wine in my hand, for my heart is inflamed, and my life slips away as quicksilver. Arise, then, for the favors of fortune are only a dream; arise, for the fire of thy youth is running away like the water of a torrent.<\/p>"},{"n":55,"label":"LV","verse":"<p class=\"q-prose\">We are the idolaters of love, but the Musulman differs from us; we are like the pitiful ant, but Salomon is our foe. Our visages should aye be paled with love, and our apparel in rags, and yet the mart for silken stuffs is here below.<\/p>"},{"n":56,"label":"LVI","verse":"<p class=\"q-prose\">To drink wine and rejoice is my gospel of life. To be as indifferent to heresy as to religion is my creed. I asked the bride of the human race [the world] what her dowry was, and she answered: My dowry consists in the joy of my heart.<\/p>"},{"n":57,"label":"LVII","verse":"<p class=\"q-prose\">I am worthy neither of Hell nor a celestial abode; God knows from what clay he has moulded me. Heretical as a dervish and foul as a lost woman, I have neither wealth, nor fortune, nor hope of Paradise.<\/p>"},{"n":58,"label":"LVIII","verse":"<p class=\"q-prose\">Thy passion, man, resembles in all things a house dog which never leaves his kennel. It has the slyness of the fox, it lies low like a hare, and to the rage of the tiger adds the voracity of a wolf.<\/p>"},{"n":59,"label":"LIX","verse":"<p class=\"q-prose\">How beautiful they are, these different greens which mingle on the edge of a brook! One thinks they must have had their birth upon the lips of one divinely fair. Place not thy foot upon them with disdain; they spring from dust which, once a face, was tinted with the colors of a rose.<\/p>"},{"n":60,"label":"LX","verse":"<p class=\"q-prose\">Each heart that God illumines with the light of love, as it frequents the mosque or synagogue, inscribes its name upon the book of love, and is set free from fear of Hell while it awaits the joys of Paradise.<\/p>"},{"n":61,"label":"LXI","verse":"<p class=\"q-prose\">A cup of wine is better than the kingdom of Kawous, and preferable to Kobad&#x27;s throne or to the realm of Thous. The sighs to which, at dawn, a lover is the prey are sweeter than the groans of praying hypocrites.<\/p>"},{"n":62,"label":"LXII","verse":"<p class=\"q-prose\">Though sin hath made me ugly and forlorn, not without hope am I like some idolater relying on his temple gods. So, on the morn I die of yesternight&#x27;s carouse, give me some wine and call the one Beloved, for Hell and Paradise are one to me.<\/p>"},{"n":63,"label":"LXIII","verse":"<p class=\"q-prose\">If I drink wine &#x27;tis not for mere desire; nor for the rousing of the mob or insult to the Faith. No, &#x27;tis for a passing knowledge of relief from self. No other motive could enwreath the cup.<\/p>"},{"n":64,"label":"LXIV","verse":"<p class=\"q-prose\">Men claim fore-knowledge, predicating Hell or Heaven. How plain their fault! How asinine their faith! For know that if all lovers of the fair and of the cup deserve a Hell, then Paradise will be a void.<\/p>"},{"n":65,"label":"LXV","verse":"<p class=\"q-prose\">In Cheeban [a month] I must not embrace the vine; in Redjeb I am consecrate to Him. By right these sixty suns to Allah and his Prophet are assigned: let Ramazan in mercy bring the cooling cup again.<\/p>"},{"n":66,"label":"LXVI","verse":"<p class=\"q-prose\">Now Ramazan has come, the vintage passed, and pledging of the cup and simple customs are afar. Yet full the wine pots are, and still untouched, and houris wait for us in fond suspense.<\/p>"},{"n":67,"label":"LXVII","verse":"<p class=\"q-prose\">This rolling hostelry we call the world, where light and darkness alternate, is but the ruin of a Jamshid&#x27;s entertainment of a hundred Kings, or e&#x27;en a faint memento of a host of hunters like to Bahram&#x27;s self.<\/p>"},{"n":68,"label":"LXVIII","verse":"<p class=\"q-prose\">To-day when fortune&#x27;s rose is burgeoning, fill high the cup. Drink deep, O friend, drink deep, for time is not thy friend or ever willingly repeats a day like this.<\/p>"},{"n":69,"label":"LXIX","verse":"<p class=\"q-prose\">This palace where great Bahram loved to drink now herds the young gazelle, and in it lions sleep. Where Bahram snared the swift wild ass, the snare of Time has in its turn snared him.<\/p>"},{"n":70,"label":"LXX","verse":"<p class=\"q-prose\">The clouds expand and weep upon the earth. No longer can we live without the amaranthine cup. The tender green glads weary eyes to-day, but oh! that emerald verdure growing from our dust, whose sight will it rejoice?<\/p>"},{"n":71,"label":"LXXI","verse":"<p class=\"q-prose\">To-day, which we call Adine [Wednesday], leave the tiny cup and drink wine from a bowl. If other days you drank but one fair bowl, to-day drink two, for Adine ranks its fellow days, save one.<\/p>"},{"n":72,"label":"LXXII","verse":"<p class=\"q-prose\">O heart! since this world makes you sad, since souls so pure must leave the tenement of clay, go, sit upon the verdure of the field sometimes, ere verdure springs in turn from your own dust.<\/p>"},{"n":73,"label":"LXXIII","verse":"<p class=\"q-prose\">This wine, which by its nature hath a multitude of forms, which now is animal and now is plant, can never cease to be, for its imperishable self ordains a lasting life though forms may disappear.<\/p>"},{"n":74,"label":"LXXIV","verse":"<p class=\"q-prose\">No smoke ascends above my holocaust of crime: could man ask more? This hand, which man&#x27;s injustice raises to my head, no comfort brings, even though it touch the hem of saintly robes.<\/p>"},{"n":75,"label":"LXXV","verse":"<p class=\"q-prose\">The one on whom you surely most rely, will be your enemy, if but you cleanse the eyes that are within. Far better, for the short time which remains, to count but little on our friends. The talk of men to-day is but a broken reed.<\/p>"},{"n":76,"label":"LXXVI","verse":"<p class=\"q-prose\">O heedless man! this veil of flesh is naught; this nine-fold vault of brilliant heaven is naught. Then give thyself to joy in this disordered place [the world], for life is but an instant wed to it, and that is equally naught.<\/p>"},{"n":77,"label":"LXXVII","verse":"<p class=\"q-prose\">Now bring me dancers, wine, and a houri with charming, ravishing features--if houris there be. Or find a beautiful brook within a green ravine, if such there be. Ask nothing better; think no more of Hell&#x27;s hot penalties, for, verily, none is, nor any Paradise more fair than that I sing, if Paradise there be.<\/p>"},{"n":78,"label":"LXXVIII","verse":"<p class=\"q-prose\">Came an old man from out the tavern drunk, his prayer-rug on his shoulders and a bowl of wine in hand. I said to him: Aged man! what meaneth this? He answered me: Drink wine, my friend, for this world is naught but wind.<\/p>"},{"n":79,"label":"LXXIX","verse":"<p class=\"q-prose\">A nightingale, inebriate [with love of the rose], within a garden saw the roses laughing with a cup of wine. To me he came and whispered in my ear, in tones appropriate to the circumstance: Be on thy guard, my friend; one cannot hold the life that slips away.<\/p>"},{"n":80,"label":"LXXX","verse":"<p class=\"q-prose\">Naught is thy body but a tent, Khayyam, thy soul is its inhabitant, and its last, long home annihilation is. When thy soul leaves the tent, the slaves arise and strike it ere they pitch it for the oncoming soul.<\/p>"},{"n":81,"label":"LXXXI","verse":"<p class=\"q-prose\">Khayyam, who sewed the tents of philosophic lore, is suddenly engulfed within the crucible of grief, and there is burned. The shears of Fate have cut the thread of his existence; the Auctioneer of Life has sold him for a song.<\/p>"},{"n":82,"label":"LXXXII","verse":"<p class=\"q-prose\">In springtime let me sit upon the edge of a broad field with one fair girl, and wine in plenty if wine is at hand. Though this may culpable be thought, I should be worse than any dog did I not dream of Paradise.<\/p>"},{"n":83,"label":"LXXXIII","verse":"<p class=\"q-prose\">Rose-colored wine in crystal cups delights. It charms when sipped to lutes&#x27; melodious airs or to the plaintive throbbing of the harp. The devotee who knows not of the joy that is in wine is charming [to himself] or when a thousand miles between us yawn.<\/p>"},{"n":84,"label":"LXXXIV","verse":"<p class=\"q-prose\">The time we pass in this world has no worth without the wine-cup and the wine. It also needs the swelling sound of Irak&#x27;s flute. Incessant watching of things here below has told me that in pleasure and in joy alone are worth: the rest is naught.<\/p>"},{"n":85,"label":"LXXXV","verse":"<p class=\"q-prose\">Be on thy guard, my friend, for soon thou wilt be separate from thy soul; thou then shalt go behind the curtain of God&#x27;s secrecy. Drink, for thou knowest not whence thou here hast come; make haste, for thou art ignorant where thou shalt go.<\/p>"},{"n":86,"label":"LXXXVI","verse":"<p class=\"q-prose\">Since we must die, why do we live? Why agonize to reach a problematic bliss? Since, for some unknown cause, we may not here remain, why not concern ourselves about the future pilgrimage? Why disregard our fate?<\/p>"},{"n":87,"label":"LXXXVII","verse":"<p class=\"q-prose\">Occasion makes me sing the praise of wine when I surround myself with men and things I love. O Devotee! canst thou be happy here below knowing that wisdom is your Lord? Then know, at least, that wisdom is my slave.<\/p>"},{"n":88,"label":"LXXXVIII","verse":"<p class=\"q-prose\">The world will ever count me as depraved. Natheless I am not guilty, Men of Holiness! Look on yourselves and question what you are. Ye say I contravene the Koran&#x27;s law. Yet I have only known the sins of drunkenness, debauchery and leasing.<\/p>"},{"n":89,"label":"LXXXIX","verse":"<p class=\"q-prose\">Free yourselves from your own passions and insatiate greed and lo! you shall go out poor as a mendicant. Look, rather, unto what you are, whence you have come, and learn what you are doing and where bound.<\/p>"},{"n":90,"label":"XC","verse":"<p class=\"q-prose\">The universe is but a point in our poor round of life; the Djeihoun [Oxus] but a feeble trace of tears and blood; Hell but a spark of useless worry which we give ourselves, and Paradise an instant of repose, which here below we rarely catch.<\/p>"},{"n":91,"label":"XCI","verse":"<p class=\"q-prose\">A slave in dire revolt am I: where is Thy will? Black with all sin my heart: where is Thy light and Thy control? If Thou giv&#x27;st Paradise to our obedience alone [to Thy laws], it is a debt of which Thou quit&#x27;st Thyself and in such case we need Thy pity and benevolence.<\/p>"},{"n":92,"label":"XCII","verse":"<p class=\"q-prose\">I know not at all whether He who created me belongs to a delicious Paradise or a detestable Hell. [But I do know] that a cup of wine, a charming girl and a zither at the edge of a green field are three things which I enjoy at present, and that you will find them in the promise that is made you of a future Paradise.<\/p>"},{"n":93,"label":"XCIII","verse":"<p class=\"q-prose\">I drink wine, and those who are opposed to it come from the left and from the right to ask me to abstain from it, because, say they, wine is an enemy of religion. But, for that very reason I would drink it, now that I hold myself an adversary of faith, because we are permitted by God to drink the blood of an enemy.<\/p>"},{"n":94,"label":"XCIV","verse":"<p class=\"q-prose\">The light of the moon has cut the black robe of night: drink then of wine, for one finds not often moments so precious. Yes, abandon thyself to joy, for this same moon will shine over the surface of the earth a long time [after our day].<\/p>"},{"n":95,"label":"XCV","verse":"<p class=\"q-prose\">Impute not to the wheel of the heavens all the good and all the bad which are in man, all the joys and sorrows which come to us by destiny; for this wheel, friend, is a thousand times more embarrassed than thou, in the path of love [divine].<\/p>"},{"n":96,"label":"XCVI","verse":"<p class=\"q-prose\">There is no shield which is proof against an arrow hurled by Destiny. Grandeur, money, gold all go for nothing. The more I consider the things of this world, the more I see that the only good is good, all else is nothing.<\/p>"},{"n":97,"label":"XCVII","verse":"<p class=\"q-prose\">A heart which does not contain in itself complete abstinence [from things here below] is to be pitied, for it is at all times the prey of regret. It is only the heart free from care that can be joyous; all that exists beyond this is but a subject of torment.<\/p>"},{"n":98,"label":"XCVIII","verse":"<p class=\"q-prose\">He who has had the intelligence to sow joy in his heart has not lost a single day in sorrow; he has employed his faculties in seeking the will of God, or has procured repose for his soul by taking a cup of wine.<\/p>"},{"n":99,"label":"XCIX","verse":"<p class=\"q-prose\">When God fashioned the clay of my body, he knew what would be the result of my acts. It is not without His orders that I have committed the sins of which I am guilty; in that case, why should I burn in hell-fire at the last day?<\/p>"},{"n":100,"label":"C","verse":"<p class=\"q-prose\">If thou hast drunk wine every consecutive day of the week, take care not to deprive thyself of it on Wednesday, for, according to our religion, there is no difference between this day and Saturday. Be an adorer of the All-Powerful and not an adorer of days.<\/p>"},{"n":101,"label":"CI","verse":"<p class=\"q-prose\">O my God! Thou art merciful, and mercy is kindness. Why then has the first sinner been thrown out of the terrestrial Paradise? If Thou pardonest me when I obey Thee, it is not mercy. Mercy is present only when Thou pardonest me as the sinner that I am.<\/p>"},{"n":102,"label":"CII","verse":"<p class=\"q-prose\">Leave knowledge and take the cup in thy hand. Disturb thyself not about Paradise or Hell, but seek rather the _Koocer_ [the celestial river of wine]. Sell thy silken turban to buy wine and have no more fear. Rid thyself of that head-dress and envelop thy head in a simple woolen band [emblem of Sufism].<\/p>"},{"n":103,"label":"CIII","verse":"<p class=\"q-prose\">Tell me, friend, have I acquired riches in this world? No. Have I given myself up to time as it was slipping away? No. I am the torch of joy; but that torch once extinguished, I am nothing. I am the cup of Djem [the royal cup], but that cup once broken, I am no longer anything.<\/p>"},{"n":104,"label":"CIV","verse":"<p class=\"q-prose\">Where are the dancers? Where is the wine? Quick! that I may do honor to the gourd! Happy the heart who remembers his morning cup! Oh! there are three things in this world which are dear to me: a head lost in wine, an amorous girl, and the noise of the dawn.<\/p>"},{"n":105,"label":"CV","verse":"<p class=\"q-prose\">Since life so soon slips away, what matters it whether it be sweet or bitter? Since the soul must pass through the lips, what matters whether it be at Nishapur or at Balkh? Drink then of wine, for after thee and me, the moon will long pass on from its last quarter to its first, and from the first to last.<\/p>"},{"n":106,"label":"CVI","verse":"<p class=\"q-prose\">This caravan of life passes in curious guise! Be on thy guard, my friend, for it is joy that thus escapes! Disturb not thyself with the sorrow which to-morrow waits our friends, and bring me my cup quickly, for the night fast slips away!<\/p>"},{"n":107,"label":"CVII","verse":"<p class=\"q-prose\">He who has made the foundations of the world, the wheel of the heavens, how He has crucified the heart of man with affliction! How many ruby-colored lips has He buried in this little globe of earth! How many locks of hair perfumed with musk has He hidden in the bosom of the dust!<\/p>"},{"n":108,"label":"CVIII","verse":"<p class=\"q-prose\">O careless men! be not duped by this world, since you know its pursuits. Throw not to the wind your precious lives; hasten to seek a friend [God], and quickly drink of wine.<\/p>"},{"n":109,"label":"CIX","verse":"<p class=\"q-prose\">O my companions! pour me some wine and thus change my face, from yellow as amber, to the color of the ruby. When I am dead, lave me in wine, and of the wood of the vine make my coffin and bier.<\/p>"},{"n":110,"label":"CX","verse":"<p class=\"q-prose\">The day when the celestial war-horse of the golden stars was saddled, when the planet Jupiter and the Pleiades were created, from that day the Divan [Chief Justice] of destiny fixed our lot. In what respect, then, are we guilty, since such is the part that was made for us?<\/p>"},{"n":111,"label":"CXI","verse":"<p class=\"q-prose\">Oh! what damage may the vessels filled to flowing do, and how incomplete are they who possess riches! The eyes of beautiful Turkish women are a feast to the heart, yet they are simple learners from the slaves who own them.<\/p>"},{"n":112,"label":"CXII","verse":"<p class=\"q-prose\">It is necessary that our existence be effaced from the book of life, that we expire in the arms of death. O charming cupbearer, go, gaily bring me wine since my poor earth to earth must come.<\/p>"},{"n":113,"label":"CXIII","verse":"<p class=\"q-prose\">At this moment, when my heart is not yet deprived of life, it seems to me that there are few problems that I have not solved. However, when I call intelligence to my aid, when I examine myself with care, I perceive that my existence has slipped away and that I have still defined nothing.<\/p>"},{"n":114,"label":"CXIV","verse":"<p class=\"q-prose\">Those who adore the _seddjadeh_ [prayer-rug] are asses, since they throw themselves, with full consent, into the charge of devotees and hypocrites. What is most singular about them is that they, under a mantle of piety, preach Islamism and are, in reality, worse than idolaters.<\/p>"},{"n":115,"label":"CXV","verse":"<p class=\"q-prose\">When the tree of my existence shall be cut down, when my members shall be dispersed, let them make pitchers of my dust and fill these pitchers with wine; then shall my dust be revived [through the wine contained in them].<\/p>"},{"n":116,"label":"CXVI","verse":"<p class=\"q-prose\">O Thou, God, before whom sin is without consequence, tell him who possesses intelligence to proclaim this important point: that in the eyes of a philosopher it is an absolute absurdity to make divine fore-knowledge in league with sin.<\/p>"},{"n":117,"label":"CXVII","verse":"<p class=\"q-prose\">In the first place, my being was given me without my consent, which makes my own existence a lasting problem to me. Then, we leave this world with regret, and without having accomplished the aim of our coming, of our stay, or our departure.<\/p>"},{"n":118,"label":"CXVIII","verse":"<p class=\"q-prose\">When my sins come back to mind, the fire which then burned in my heart makes my boldness stream forth; for everywhere is it established that when a slave repents, a generous master pardons him.<\/p>"},{"n":119,"label":"CXIX","verse":"<p class=\"q-prose\">These potters who constantly plunge their fingers into the clay, who employ all their mind, all their intelligence, all their faculties to mould it, even to the crushing of it with their feet and striking with their hands, of what think they? It is the same clay as the human body that they are treating thus.<\/p>"},{"n":120,"label":"CXX","verse":"<p class=\"q-prose\">Those who, through knowledge, are the cream of the world; who, with intelligence scan the heights of the heavens, they also, like the firmament, have their heads turned in their search for divine knowledge, and are taken with vertigo and dimness of sight.<\/p>"},{"n":121,"label":"CXXI","verse":"<p class=\"q-prose\">God has promised us wine in Paradise. In that case why should He prohibit it in this world? One day an Arab in a state of drunkenness cut the hams of Hamzah&#x27;s camel with his sword. It is only for him that our Prophet makes wine illicit.<\/p>"},{"n":122,"label":"CXXII","verse":"<p class=\"q-prose\">Since at this moment there only remains to you the memory of pleasure passed away; since for a perfect friend you have only a cup of wine; finally, since that is all you own, rejoice at least in this possession and let the cup not slip from your hands.<\/p>"},{"n":123,"label":"CXXIII","verse":"<p class=\"q-prose\">Oh! for the time when we shall be no more and the world shall still be here! There will remain no fame or trace of us. The world was not unfinished when we came; naught will be changed when we have gone from it.<\/p>"},{"n":124,"label":"CXXIV","verse":"<p class=\"q-prose\">Those whose feet have trodden the world, who have run over it for the sake of appropriating the riches of the two hemispheres to themselves, they are not the ones, I believe, who have ever been able to explain the true state, the real situation of things here below.<\/p>"},{"n":125,"label":"CXXV","verse":"<p class=\"q-prose\">O regret! The capital [of life] has slipped from our hands. Alas! many hearts have been through death drowned in blood, and no one returns from the other world that I may ask him news of the travelers who have gone.<\/p>"},{"n":126,"label":"CXXVI","verse":"<p class=\"q-prose\">These numerous great lords, so proud of their titles, are so gnawed by cares and sorrows that existence to them is a burden. And most ridiculous it is that they deign not to call by the name of men those who, unlike to them, are not slaves to their passions.<\/p>"},{"n":127,"label":"CXXVII","verse":"<p class=\"q-prose\">This lofty Wheel, whose trade it is to tyrannize, has never loosed for man the knot of any difficulty. Wherever it has seen an ulcerated heart, there has it come to add wound unto wound.<\/p>"},{"n":128,"label":"CXXVIII","verse":"<p class=\"q-prose\">Alas! the period of adolescence reaches home. The springtime of our pleasures slips away! That bird of gaiety which is called _youth_, alas! I know not when it came nor when it flew away!<\/p>"},{"n":129,"label":"CXXIX","verse":"<p class=\"q-prose\">In the midst of this whirlpool of the world, hasten to gather some fruit. Seat thyself upon the throne of gaiety and bring the cup to thy lips. God is indifferent both to creed and sin; enjoy then here below, what pleases thee.<\/p>"},{"n":130,"label":"CXXX","verse":"<p class=\"q-prose\">Do you see those two or three imbeciles who hold the world in their hands, and who, in their candid ignorance, believe themselves the wisest in the universe? Do not disturb yourself for, in their high content, they deem all heretics who are not asses [like themselves].<\/p>"},{"n":131,"label":"CXXXI","verse":"<p class=\"q-prose\">Would that the tavern could always be animated by the presence of drinkers, that fire would reach the hem of the holy robe of devotees, that their monk&#x27;s frock might be torn to tatters and their blue woolen garment be trampled under the feet of the drinkers.<\/p>"},{"n":132,"label":"CXXXII","verse":"<p class=\"q-prose\">How long wilt thou be a dupe to colors and perfumes? When wilt thou cease to seek out good and bad? Thou mightest be the source of Zemzem, thou mightest even be the water of life since thou wouldst not know how to escape entering the bosom of the earth.<\/p>"},{"n":133,"label":"CXXXIII","verse":"<p class=\"q-prose\">Renounce not the drinking of wine if you have any, for a hundred repentances follow one such resolution. The roses scatter their blossoms, the nightingales fill the air with their song, and would it be reasonable to renounce drinking in a moment like this?<\/p>"},{"n":134,"label":"CXXXIV","verse":"<p class=\"q-prose\">As long as the friend [God] will pour for me the wine which rejoices my soul, as long as the heavens have not deposited a hundred kisses upon my head and feet, whatever they may do, when the moment comes, to induce me to renounce drinking, how can I renounce it, God not having ordered me to?<\/p>"},{"n":135,"label":"CXXXV","verse":"<p class=\"q-prose\">Whoever has constancy will not renounce drinking wine, for wine has within itself the virtue of the water of life. If any one renounce it during the month of Ramazan, let him at least abstain from engagement in prayer.<\/p>"},{"n":136,"label":"CXXXVI","verse":"<p class=\"q-prose\">When I am dead, smooth to the level of the soil the dust of my tomb, that I may thus be an example to other men. Then, mix with wine the earth of my body and make of it--a cover for a wine-jar.<\/p>"},{"n":137,"label":"CXXXVII","verse":"<p class=\"q-prose\">O Khayyam! although the Wheel of the Heavens has, in setting up his tent, closed the door to discussions, [it is evident, nevertheless,] that the cupbearer of eternity [God] has produced, in the form of globules of wine in the cup of creation, a thousand other Khayyams like thee.<\/p>"},{"n":138,"label":"CXXXVIII","verse":"<p class=\"q-prose\">Give thyself to gaiety, for sorrow will be infinite. The stars will continue movement in the firmament, and the bricks which will be made of thy body will serve to construct palaces for others.<\/p>"},{"n":139,"label":"CXXXIX","verse":"<p class=\"q-prose\">Pass joyously thy life, for many other travelers will file through this world; the soul will cry after the body from which it will be separated, and the head, the seat of the passions, will be trampled under the potter&#x27;s feet.<\/p>"},{"n":140,"label":"CXL","verse":"<p class=\"q-prose\">Happy the heart of him who has passed unknown, who has not been clothed in a robe of ceremony, nor in luxurious garments, nor in stuffs of great price, who, like the _simourg_, is lifted into the skies to the place of his delight as the owl sits among the ruins of this world.<\/p>"},{"n":141,"label":"CXLI","verse":"<p class=\"q-prose\">Drinkers alone know how to appreciate the language of the roses and of wine, and not the feeble in heart or the poor in spirit. Those who have no idea of what is occult, to them ignorance is pardonable, for drunkards alone can understand what belongs to such an order of of things.<\/p>"},{"n":142,"label":"CXLII","verse":"<p class=\"q-prose\">Once in the tavern, one can make his ablutions only with wine. There, when a name is soiled, it cannot be restored. Bring, then, some wine, since the veil of our shame is torn in such a manner that it cannot be repaired.<\/p>"},{"n":143,"label":"CXLIII","verse":"<p class=\"q-prose\">Pierced with a vain hope, I have thrown to the wind a part of my existence, and that without having known here below a day of happiness. That which I fear now is that time will prevent me from seizing the opportunity to make amends for the past.<\/p>"},{"n":144,"label":"CXLIV","verse":"<p class=\"q-prose\">Alas! my heart has not been able to find any remedy [for its grief], my soul has arrived at the edge of my lips [death], without having attained the object of its love. Alas! my life has passed in ignorance, and the enigma of this love has not been explained.<\/p>"},{"n":145,"label":"CXLV","verse":"<p class=\"q-prose\">In the regions of the soul, it is necessary to walk with discernment; upon the things of this world, it is well to be silent. While we have our eyes, our tongues, and our ears, we should be without eyes, without tongues, and without ears.<\/p>"},{"n":146,"label":"CXLVI","verse":"<p class=\"q-prose\">In this world, he who commands a loaf of bread and who can cover his body with any garment whatsoever, he who is neither master nor servant, tell him to live content, for he has a sweet existence.<\/p>"},{"n":147,"label":"CXLVII","verse":"<p class=\"q-prose\">One should not plant in his heart the tree of sadness. On the contrary, he should ever peruse the book of joy. One should drink wine, and follow the trend of his own heart, for behold, the length of time remaining to you in this world is quickly measured.<\/p>"},{"n":148,"label":"CXLVIII","verse":"<p class=\"q-prose\">Has Thy empire gained in splendor by my obeisance, O God? Or have my sins retrenched in any degree Thy immensity? Pardon, O God, and do not punish, for I know well that Thou punishest late and pardonest early.<\/p>"},{"n":149,"label":"CXLIX","verse":"<p class=\"q-prose\">It would be troublesome if my hand, accustomed to seize the cup, took the Koran and depended upon Mohammedan diet. With you it is different; you are a dry devotee, while I am a depraved one, moist [through drink], and the only fire I know is kindled by wine.<\/p>"},{"n":150,"label":"CL","verse":"<p class=\"q-prose\">Upon earth, no one presses to his heart a charmer with cheeks of the tints of a rose without the time comes that he feels the sting of the thorn. See the comb: before it could caress the perfumed hair of the beauty, it had to be cut into many teeth.<\/p>"},{"n":151,"label":"CLI","verse":"<p class=\"q-prose\">Would that I had constantly in my hand the juice of the vine! Would that my love for these beautiful idols, that are like houris, might never leave my heart! They say to me: God has ordered you to renounce these things. Oh! should He give me such a command, I would not obey it. Far be the thought!<\/p>"},{"n":152,"label":"CLII","verse":"<p class=\"q-prose\">Behold, I must go, and life is saddened by my going; for, out of a hundred precious pearls but one have I pierced. Alas! thanks to the ignorance of men, a hundred thousand things of deepest import yet remain unheard.<\/p>"},{"n":153,"label":"CLIII","verse":"<p class=\"q-prose\">To-day the season smiles; &#x27;tis neither hot nor cold. The clouds have washed away the dust which dimmed the roses; and nightingales seem whispering to the yellow flowers that wine is balm for all.<\/p>"},{"n":154,"label":"CLIV","verse":"<p class=\"q-prose\">The day when I shall know myself no more, and when they will speak of me as of a fable, then I desire [do I dare say it?] that my clay be made into a jar for wine and destined to service at the tavern.<\/p>"},{"n":155,"label":"CLV","verse":"<p class=\"q-prose\">Drink thou of wine before thy name shall vanish from this world, for, when this nectar enters thy heart, sorrow disappears. Unbind strand by strand the hair of thy charming idol, before the jointure of thy frame itself is loosed.<\/p>"},{"n":156,"label":"CLVI","verse":"<p class=\"q-prose\">O idol! ere sorrow comes to assail thee, order rose-colored wine. Thou art not gold, O imbecile! to believe that after burial in the earth, you can be drawn from it again.<\/p>"},{"n":157,"label":"CLVII","verse":"<p class=\"q-prose\">This world has not derived any advantage from my coming here below. Its glory and its dignity are equally unaffected by my departure. My two ears have never heard any one say why I have come, or why I am forced to go again.<\/p>"},{"n":158,"label":"CLVIII","verse":"<p class=\"q-prose\">All thy secrets are known to the wisdom of Heaven [God]· He knows them hair by hair and vein by vein. I admit that by power of hypocrisy you may be able to deceive men, but what will you do before Him who knows your misdeeds one by one in every detail?<\/p>"},{"n":159,"label":"CLIX","verse":"<p class=\"q-prose\">Wine gives wings to those attacked by melancholy; wine is a mole of beauty upon the cheek of intelligence, we have not drunk of it during the Ramazan which has passed, but now the eve of [the month of] Burak hath arrived and we shall make amends.<\/p>"},{"n":160,"label":"CLX","verse":"<p class=\"q-prose\">Live in joy, for the time is coming when all the creatures that you see will disappear under the earth; drink, drink of wine, and never abandon yourself to the sorrow of this world. Those who come after you only too soon become a prey to it.<\/p>"},{"n":161,"label":"CLXI","verse":"<p class=\"q-prose\">There is not a night when my mind is not in a state of stupefaction. There is not one when my breast is not inundated with pearls that flow from my eyes. The disquiet which possesses me keeps the bowl of my head from filling itself with wine, can a bowl overturned ever be filled?<\/p>"},{"n":162,"label":"CLXII","verse":"<p class=\"q-prose\">When my nature has seemed disposed to fasting and prayer, I have a moment&#x27;s hope that I am going to attain the aim of my desires; but alas! a breath of wind has sufficed to destroy the efficacy of my ablutions, and a mouthful of wine has annihilated my fast.<\/p>"},{"n":163,"label":"CLXIII","verse":"<p class=\"q-prose\">All my being is attracted by the sight of beautiful, rose-colored faces; my hand is aye ready to seize a cup of wine. Oh, I wish to enjoy for its part what belongs to each of my members, ere these same members are lost in the Whole.<\/p>"},{"n":164,"label":"CLXIV","verse":"<p class=\"q-prose\">A worldly love knows not how to produce reflection. It is like a fire half extinguished which no longer gives heat. A true love should know neither tranquillity, nor repose, nor nourishment, nor sleep for months and years, day nor night.<\/p>"},{"n":165,"label":"CLXV","verse":"<p class=\"q-prose\">How long wilt thou pass thy life in adoring thyself, and seeking the cause of annihilation of thy being? Drink wine, for a life that is followed by death is better spent in sleep or drunkenness.<\/p>"},{"n":166,"label":"CLXVI","verse":"<p class=\"q-prose\">To-morrow I shall have surmounted the mountain which separates us, and with indescribable happiness take the cup in my hand. My mistress longs for me, the day is bright; if I do not hasten to enjoy myself in such a moment, when shall I find enjoyment?<\/p>"},{"n":167,"label":"CLXVII","verse":"<p class=\"q-prose\">There are people who through outrageous presumption are sunk in pride; and others who abandon themselves to the houris of celestial palaces. When the curtain is raised, we shall see that they have fallen far, far, far, from Thee [O God]!<\/p>"},{"n":168,"label":"CLXVIII","verse":"<p class=\"q-prose\">We are assured that there is a Paradise for us peopled with houris, and that we shall find there limpid wine and honey. It must then be permitted us to love women and wine here below, for is not this our end and aim?<\/p>"},{"n":169,"label":"CLXIX","verse":"<p class=\"q-prose\">They pretend that there exists a Paradise where there are houris, where the _Koocer_ flows, where there is limpid wine, honey and sugar. Oh! fill quickly a cup of wine and put it in my hand, for one present joy is worth more than a thousand promised for the future.<\/p>"},{"n":170,"label":"CLXX","verse":"<p class=\"q-prose\">Even a mountain would dance for joy if you soaked it in wine. Poor is the fool who scorns the cup. You dare order me to renounce the juice of the vine! Know then that wine is a soul which helps to bring man to perfection.<\/p>"},{"n":171,"label":"CLXXI","verse":"<p class=\"q-prose\">From time to time my heart finds itself much straitened in its cage. Shameful is it to be mixed with water and clay. I have often thought of destroying this prison, but my foot would come in contact with a stone and slip on the stirrup of the Koran&#x27;s law.<\/p>"},{"n":172,"label":"CLXXII","verse":"<p class=\"q-prose\">They say that the moon of Ramazan [month of fasting] is about to appear and that wine must no longer be thought of. It is well; but let me during the remainder of Cheeban [the month preceding] drink such a quantity of it that I may remain drunk up to the day of the fast.<\/p>"},{"n":173,"label":"CLXXIII","verse":"<p class=\"q-prose\">Cease, if ye are my friends, all vain discourse, and, to relieve my mental pains pour out the wine. And when to dust my frame returns, the self-same dust collect and make it brick to stop some crevice in the tavern wall.<\/p>"},{"n":174,"label":"CLXXIV","verse":"<p class=\"q-prose\">The beverage of our existence is sometimes limpid, sometimes muddy. Our garments are at one time of coarse wool, at another of finest fabric. All this is insignificant to a clear mind; but is it insignificant to die?<\/p>"},{"n":175,"label":"CLXXV","verse":"<p class=\"q-prose\">No one has penetrated the secrets of the Principle [First Cause]. No one has taken a step outside himself. I look about and see only insufficiency from pupil to master, insufficiency in all that the mother brings forth.<\/p>"},{"n":176,"label":"CLXXVI","verse":"<p class=\"q-prose\">Restrain thy envy of the things of this world if thou wishest to be happy; break the bonds which enchain thee to the good and the bad here below; live contented, for the periodic movement of the heavens takes its course, and this life will not be of long duration.<\/p>"},{"n":177,"label":"CLXXVII","verse":"<p class=\"q-prose\">No one has had access behind the curtain of destiny; no one has knowledge of the secrets of Providence. For seventy-two years I have reflected day and night, I have learned nothing anywhere, and the enigma remains unexplained.<\/p>"},{"n":178,"label":"CLXXVIII","verse":"<p class=\"q-prose\">They say that at the last day there will be judgments, and that our dear Friend [God] will be in anger. But from pure goodness only goodness emanates. Be then without fear, for finally you will see that He is full of gentleness.<\/p>"},{"n":179,"label":"CLXXIX","verse":"<p class=\"q-prose\">Drink wine, since it is that which will put an end to the disquiet of thy heart; it will deliver thee from thy meditations upon the seventy-two sects of the globe. Do not abstain from this alchemy for, if thou drinkest but a _men_ [a measure] of it, it will destroy for thee a thousand infirmities.<\/p>"},{"n":180,"label":"CLXXX","verse":"<p class=\"q-prose\">Wine has been prohibited, perhaps, but it is only prohibited according to the person who drinks it, according to the quantity drunk, and according to the individual with whom we drink it. These points once observed, who would drink it if not the wise?<\/p>"},{"n":181,"label":"CLXXXI","verse":"<p class=\"q-prose\">For myself, I should pour some wine into a cup that would contain a pint. I should be content with two cups; but first I should divorce myself thrice from religion and reason, and then espouse the daughter of the vine.<\/p>"},{"n":182,"label":"CLXXXII","verse":"<p class=\"q-prose\">Yes, I drink wine, and whoever like me is far-seeing will find that this act is insignificant in the eyes of the Divinity. From all eternity God has known that I would drink wine. If I did not drink it, His prescience would be pure ignorance.<\/p>"},{"n":183,"label":"CLXXXIII","verse":"<p class=\"q-prose\">The drinker, if he is rich, ruins himself. The disorder of his drunkenness provokes scandal in the world. For this I should put an emerald in the bowl of my ruby pipe, effectually to blind the serpent of my grief.<\/p>"},{"n":184,"label":"CLXXXIV","verse":"<p class=\"q-prose\">There are some ignorant beings who have never passed a night in quest of truth, who have never taken a step outside themselves, who show themselves clothed in the garments of great lords and who are pleased to slander those whose conduct is irreproachable.<\/p>"},{"n":185,"label":"CLXXXV","verse":"<p class=\"q-prose\">When the azure of dawn shows itself, have the sparkling cup in thine hand. They say that truth is bitter in the mouth of mortals. That is a plausible reason for wine being truth itself.<\/p>"},{"n":186,"label":"CLXXXVI","verse":"<p class=\"q-prose\">This is the moment when the verdure begins to ornament the world, when, like the hand of Moses, the buds begin to show themselves upon the branches; when, revivified, as if by the breath of Jesus, the plants spring forth from the earth; when finally the clouds begin to ope their eyes and weep.<\/p>"},{"n":187,"label":"CLXXXVII","verse":"<p class=\"q-prose\">Keep from the trouble and vexation of aiming to acquire white silver or yellow gold. Eat with thy friend, ere thy warm breath be cooled, for after thee come enemies who will eat thee.<\/p>"},{"n":188,"label":"CLXXXVIII","verse":"<p class=\"q-prose\">Each mouthful of wine which the cupbearer pours into the cup helps to extinguish the fire of anger in thy burning eyes. Has it not been said, O great God, that wine is an elixir which drives from the heart a hundred sorrows that oppress it?<\/p>"},{"n":189,"label":"CLXXXIX","verse":"<p class=\"q-prose\">When the violet has tinted her cheeks, when the zephyr has made the roses bloom, then he who is wise in company with the fact will drink wine until he can dash the cup against a stone [showing emptiness].<\/p>"},{"n":190,"label":"CXC","verse":"<p class=\"q-prose\">The devotee knows not how to appreciate as well as we Thy divine pity. A stranger can never know Thee as perfectly as a friend. [They pretend] that Thou hast said: If you commit sin, I will send you into Hell. Go now--tell that to one who knows Thee not.<\/p>"},{"n":191,"label":"CXCI","verse":"<p class=\"q-prose\">A cup of wine is worth the empire of the universe; the brick which covers the jar is worth a thousand lives. The napkin with which one wipes lips moistened with wine is indeed worth a thousand turbans.<\/p>"},{"n":192,"label":"CXCII","verse":"<p class=\"q-prose\">O Friends! meet together [after my death]. Once reunited, rejoice in being together and, when the cupbearer takes in his hand a cup of old wine, remember poor Khayyam and drink to his memory.<\/p>"},{"n":193,"label":"CXCIII","verse":"<p class=\"q-prose\">Not a single time has the Wheel of Heaven been propitious to me, never for one instant has it allowed me to hear a sweet voice

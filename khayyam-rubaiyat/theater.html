vain desires continually?<\/p><p>Nay, but if heaven vouchsafe no place of rest,<\/p><p>What power to cease our wanderings have we?<\/p>"},{"n":89,"label":"LXXXIX","verse":"<p>To chant wine&#x27;s praises is my daily task,<\/p><p>I live encompassed by cup, bowl and flask;<\/p><p>Zealot! if reason be thy guide, then know<\/p><p>That guide of me doth ofttimes guidance ask.<\/p>"},{"n":90,"label":"XC","verse":"<p>O men of morals! why do ye defame,<\/p><p>And thus misjudge me? I am not to blame.<\/p><p>Save weakness for the grape, and female charms,<\/p><p>What sins of mine can any of ye name?<\/p>"},{"n":91,"label":"XCI","verse":"<p>Who treads in passion&#x27;s footsteps here below,<\/p><p>A helpless pauper will depart, I trow;<\/p><p>Remember who you are, and whence you come.<\/p><p>Consider what you do, and whither go.<\/p>"},{"n":92,"label":"XCII","verse":"<p>Skies like a zone our weary lives enclose,<\/p><p>And from our tear-stained eyes a Jihun flows;<\/p><p>Hell is a fire enkindled of our griefs;<\/p><p>Heaven but a moment&#x27;s peace, stolen from our woes.<\/p>"},{"n":93,"label":"XCIII","verse":"<p>I drown in sin--show me Thy clemency!<\/p><p>My soul is dark--make me Thy light to see!<\/p><p>A heaven that must be earned by painful works,<\/p><p>I call a wage, not a gift fair and free.<\/p>"},{"n":94,"label":"XCIV","verse":"<p>Did He who made me fashion me for hell,<\/p><p>Or destine me for heaven? I cannot tell.<\/p><p>Yet will I not renounce cup, lute and love,<\/p><p>Nor earthly cash for heavenly credit sell.<\/p>"},{"n":95,"label":"XCV","verse":"<p>From right and left the censors came and stood,<\/p><p>Saying, &quot;Renounce this wine, this foe of good&quot;;<\/p><p>But if wine be the foe of holy faith,<\/p><p>By Allah, right it is to drink its blood!<\/p>"},{"n":96,"label":"XCVI","verse":"<p>The good and evil with man&#x27;s nature blent,<\/p><p>The weal and woe that heaven&#x27;s decrees have sent,--<\/p><p>Impute them not to motions of the skies,--<\/p><p>Skies than thyself ten times more impotent.<\/p>"},{"n":97,"label":"XCVII","verse":"<p>Against death&#x27;s arrows what are buckles worth?<\/p><p>What all the pomps and riches of the earth?<\/p><p>When I survey the world, I see no good<\/p><p>But goodness, all beside is nothing worth.<\/p>"},{"n":98,"label":"XCVIII","verse":"<p>Weak souls, who from the world cannot refrain,<\/p><p>Hold life-long fellowship with rule and pain;<\/p><p>Hearts free from worldly cares have store of bliss,<\/p><p>All others seeds of bitter woe contain.<\/p>"},{"n":99,"label":"XCIX","verse":"<p>He, in whose bosom wisdom&#x27;s seed is sown,<\/p><p>To waste a single day was never known;<\/p><p>Either he strives to work great Allah&#x27;s will,<\/p><p>Or else exalts the cup, and works his own.<\/p>"},{"n":100,"label":"C","verse":"<p>When Allah mixed my clay, He knew full well<\/p><p>My future acts, and could each one foretell;<\/p><p>Without His will no act of mine was wrought;<\/p><p>Is it then just to punish me in hell?<\/p>"},{"n":101,"label":"CI","verse":"<p>Ye, who cease not to drink on common days,<\/p><p>Do not on Friday quit your drinking ways;<\/p><p>Adopt my creed, and count all days the same,<\/p><p>Be worshippers of God, and not of days.<\/p>"},{"n":102,"label":"CII","verse":"<p>If grace be grace, and Allah gracious be,<\/p><p>Adam from Paradise why banished He?<\/p><p>Grace to poor sinners shown is grace indeed;<\/p><p>In grace hard earned by works no grace I see.<\/p>"},{"n":103,"label":"CIII","verse":"<p>Dame Fortune&#x27;s smiles are full of guile, beware!<\/p><p>Her scimitar is sharp to smite, take care!<\/p><p>If e&#x27;er she drop a sweetmeat in thy mouth,<\/p><p>&#x27;Tis poisonous,--to swallow it forbear!<\/p>"},{"n":104,"label":"CIV","verse":"<p>Where&#x27;er you see a rose or tulip bed,<\/p><p>Know that a mighty monarch&#x27;s blood was shed<\/p><p>And where the violet rears her purple tuft,<\/p><p>Be sure a black-moled girl hath laid her head.<\/p>"},{"n":105,"label":"CV","verse":"<p>Wine is a melting ruby, cup its mine;<\/p><p>Cup is the body, and the soul is wine;<\/p><p>These crystal goblets smile with ruddy wine<\/p><p>Like tears, that blood of wounded hearts enshrine.<\/p>"},{"n":106,"label":"CVI","verse":"<p>Drink wine! &#x27;tis life etern, and travail&#x27;s meed,<\/p><p>Fruitage of youth, and balm of age&#x27;s need:<\/p><p>&#x27;Tis the glad time of roses, wine and friends;<\/p><p>Rejoice thy spirit--that is life indeed.<\/p>"},{"n":107,"label":"CVII","verse":"<p>Drink wine! long must you sleep within the tomb,<\/p><p>Without a friend, or wife to cheer your gloom;<\/p><p>Hear what I say, and tell it not again,<\/p><p>&quot;Never again can withered tulips bloom.&quot;<\/p>"},{"n":108,"label":"CVIII","verse":"<p>They preach how sweet those Houri brides will be,<\/p><p>But I say wine is sweeter--taste and see!<\/p><p>Hold fast this cash, and let that credit go,<\/p><p>And shun the din of empty drums like me.<\/p>"},{"n":109,"label":"CIX","verse":"<p>Once and again my soul did me implore,<\/p><p>To teach her, if I might, the heavenly lore;<\/p><p>I bade her learn the _Alif_ well by heart.<\/p><p>Who knows that letter well need learn no more.<\/p>"},{"n":110,"label":"CX","verse":"<p>I came not hither of my own free will,<\/p><p>And go against my wish, a puppet still;<\/p><p>Cupbearer! gird thy loins, and fetch some wine;<\/p><p>To purge the world&#x27;s despite, my goblet fill.<\/p>"},{"n":111,"label":"CXI","verse":"<p>How long must I make bricks upon the sea?<\/p><p>Beshrew this vain task of idolatry;<\/p><p>Call not Khayyam a denizen of hell;<\/p><p>One while in heaven, and one in hell is he.<\/p>"},{"n":112,"label":"CXII","verse":"<p>Sweet is the breath of Spring to rose&#x27;s face,<\/p><p>And thy sweet face adds charm to this fair place;<\/p><p>To-day is sweet, but yesterday is sad,<\/p><p>And sad all mention of its parted grace.<\/p>"},{"n":113,"label":"CXIII","verse":"<p>To-night pour wine, and sing a dulcet air,<\/p><p>And I upon thy lips will hang, O fair;<\/p><p>Yea, pour some wine as rosy as thy cheeks,<\/p><p>My mind is troubled like thy ruffled hair.<\/p>"},{"n":114,"label":"CXIV","verse":"<p>Pen, tablet, heaven and hell I looked to see<\/p><p>Above the skies, from all eternity;<\/p><p>At last the master sage instructed me,<\/p><p>&quot;Pen, tablet, heaven and hell are all in thee.&quot;<\/p>"},{"n":115,"label":"CXV","verse":"<p>The fruit of certitude _he_ cannot pluck,<\/p><p>The path that leads thereto who never struck,<\/p><p>Nor ever shook the bough with strenuous hand;<\/p><p>To-day is lost; hope for to-morrow&#x27;s luck.<\/p>"},{"n":116,"label":"CXVI","verse":"<p>Now spring-tide showers its foison on the land,<\/p><p>And lively hearts wend forth, a joyous band,<\/p><p>For &#x27;Isa&#x27;s breath wakes the dead earth to life,<\/p><p>And trees gleam white with flowers, like Musa&#x27;s hand.<\/p>"},{"n":117,"label":"CXVII","verse":"<p>Alas for that cold heart, which never glows<\/p><p>With love, nor e&#x27;er that charming madness knows;<\/p><p>The days misspent with no redeeming love;--<\/p><p>No days are wasted half as much as those!<\/p>"},{"n":118,"label":"CXVIII","verse":"<p>The zephyrs waft thy fragrance, and it takes<\/p><p>My heart, and me, his master, he forsakes;<\/p><p>Careless of me he pants and leaps to thee,<\/p><p>And thee his pattern and ensample makes!<\/p>"},{"n":119,"label":"CXIX","verse":"<p>Drink wine! and then as Mahmud thou wilt reign,<\/p><p>And hear a music passing David&#x27;s strain:<\/p><p>Think not of past or future, seize to-day,<\/p><p>Then all thy life will not be lived in vain.<\/p>"},{"n":120,"label":"CXX","verse":"<p>Ten Powers, and nine spheres, eight heavens made He,<\/p><p>And planets seven, of six sides, as we see,<\/p><p>Five senses, and four elements, three souls,<\/p><p>Two worlds, but only one, O man, like thee.<\/p>"},{"n":121,"label":"CXXI","verse":"<p>Jewry hath seen a thousand prophets die,<\/p><p>Sinai a thousand Musas mount the sky;<\/p><p>How many Cæsars Rome&#x27;s proud forum crossed!<\/p><p>&#x27;Neath Kasra&#x27;s dome how many monarchs lie!<\/p>"},{"n":122,"label":"CXXII","verse":"<p>Gold breeds not wit, but to wit lacking bread<\/p><p>Earth&#x27;s flowery carpet seems a dungeon bed;<\/p><p>&#x27;Tis his full purse that makes the rose to smile,<\/p><p>While empty-handed violets hang the head.<\/p>"},{"n":123,"label":"CXXIII","verse":"<p>Heaven&#x27;s wheel has made full many a heart to moan,<\/p><p>And many a budding rose to earth has thrown;<\/p><p>Plume thee not on thy youth and lusty strength,<\/p><p>Full many a bud is blasted ere &#x27;tis blown.<\/p>"},{"n":124,"label":"CXXIV","verse":"<p>What lord is fit to rule but &quot;Truth&quot;? Not one.<\/p><p>What beings disobey His rule? Not one.<\/p><p>All things that are, are such as He decrees;<\/p><p>And naught is there beside beneath the sun.<\/p>"},{"n":125,"label":"CXXV","verse":"<p>That azure coloured vault and golden tray<\/p><p>Have turned, and will turn yet for many a day;<\/p><p>And just so we, impelled by turns of fate,--<\/p><p>Come here but for a while, then pass away.<\/p>"},{"n":126,"label":"CXXVI","verse":"<p>The Master did himself these vessels frame,<\/p><p>Why should he cast them out to scorn and shame?<\/p><p>If he has made them well, why should he break them?<\/p><p>Yea, though he marred them, _they_ are not to blame.<\/p>"},{"n":127,"label":"CXXVII","verse":"<p>Kindness to friends and foes &#x27;tis well to show,<\/p><p>No kindly heart can prove unkind, I trow:<\/p><p>Harshness will alienate a bosom friend,<\/p><p>And kindness reconcile a deadly foe.<\/p>"},{"n":128,"label":"CXXVIII","verse":"<p>To lovers true, what matters dark or fair?<\/p><p>Or if the loved one silk or sackcloth wear,<\/p><p>Or lie on down or dust, or rise to heaven?<\/p><p>Yea, though she sink to hell, he&#x27;ll seek her there.<\/p>"},{"n":129,"label":"CXXIX","verse":"<p>Full many a hill and vale I journeyed o&#x27;er;<\/p><p>Yea, journeyed through the world&#x27;s wide quarters four,<\/p><p>But never heard of pilgrim who returned;<\/p><p>When once they go, they go to come no more.<\/p>"},{"n":130,"label":"CXXX","verse":"<p>Wine-houses flourish through this thirst of mine,<\/p><p>Loads of remorse weigh down this back of mine;<\/p><p>Yet, if I sinned not, what would mercy do?<\/p><p>Mercy depends upon these sins of mine.<\/p>"},{"n":131,"label":"CXXXI","verse":"<p>Thy being is the being of Another,<\/p><p>Thy passion is the passion of Another.<\/p><p>Cover thy head, and think, and thou wilt see,<\/p><p>Thy hand is but the cover of Another.<\/p>"},{"n":132,"label":"CXXXII","verse":"<p>From learning to the cup your bridle turn;<\/p><p>All lore of world to come, save Kausar, spurn;<\/p><p>Your turban pawn for wine, or keep a shred<\/p><p>To bind your brow, and all the remnant burn.<\/p>"},{"n":133,"label":"CXXXIII","verse":"<p>See! from the world what profit have I gained?<\/p><p>What fruitage of my life in hand retained?<\/p><p>What use is Jamshid&#x27;s goblet, once &#x27;tis crushed?<\/p><p>What pleasure&#x27;s torch, when once its light has waned?<\/p>"},{"n":134,"label":"CXXXIV","verse":"<p>When life is spent, what&#x27;s Balkh or Nishapore?<\/p><p>What sweet or bitter, when the cup runs o&#x27;er?<\/p><p>Come drink! full many a moon will wax and wane<\/p><p>In times to come, when we are here no more.<\/p>"},{"n":135,"label":"CXXXV","verse":"<p>O fair! whose cheeks checkmate red eglantine,<\/p><p>And draw the game with those fair maids of Chin,<\/p><p>You played one glance against the king of Babil<\/p><p>And took his pawns, and knights, and rooks, and queen.<\/p>"},{"n":136,"label":"CXXXVI","verse":"<p>Life&#x27;s caravan is hastening on its way;<\/p><p>Brood not on troubles of the coming day,<\/p><p>But fill the wine-cup, ere sweet night be gone,<\/p><p>And snatch a pleasant moment, while you may.<\/p>"},{"n":137,"label":"CXXXVII","verse":"<p>He, who the world&#x27;s foundations erst did lay,<\/p><p>Doth bruise full many a bosom day by day,<\/p><p>And many a ruby lip and musky tress<\/p><p>Doth coffin in the earth, and shroud with clay.<\/p>"},{"n":138,"label":"CXXXVIII","verse":"<p>Be not beguiled by world&#x27;s insidious wiles;<\/p><p>O foolish ones, ye know her tricks and guiles;<\/p><p>Your precious life-time cast not to the winds;<\/p><p>Haste to seek wine, and court a sweetheart&#x27;s smile.<\/p>"},{"n":139,"label":"CXXXIX","verse":"<p>Comrades! I pray you, physic me with wine,<\/p><p>Make this wan amber face like rubies shine,<\/p><p>And, if I die, use wine to wash my corpse,<\/p><p>And frame my coffin out of planks of vine!<\/p>"},{"n":140,"label":"CXL","verse":"<p>When Allah yoked the courses of the sun,<\/p><p>And launched the Pleiades their race to run,<\/p><p>My lot was fixed in fate&#x27;s high chancery;<\/p><p>Then why blame me for wrong that fate has done?<\/p>"},{"n":141,"label":"CXLI","verse":"<p>Ah! seasoned wine oft falls to rawest fools,<\/p><p>And clumsiest workmen own the finest tools;<\/p><p>And Turki maids, fit to delight men&#x27;s hearts,<\/p><p>Lavish their smiles on beardless boys in school!<\/p>"},{"n":142,"label":"CXLII","verse":"<p>Whilom, ere youth&#x27;s conceit had waned, methought<\/p><p>Answers to all life&#x27;s problems I had wrought;<\/p><p>But now, grown old and wise, too late I see<\/p><p>My life is spent, and all my lore is naught.<\/p>"},{"n":143,"label":"CXLIII","verse":"<p>They who of prayer-mats make such great display<\/p><p>Are fools to bear hypocrisy&#x27;s hard sway;<\/p><p>Strange! under cover of this saintly show<\/p><p>They live like heathen, and their faith betray.<\/p>"},{"n":144,"label":"CXLIV","verse":"<p>To him who would his sins extenuate,<\/p><p>Let pious men this verse reiterate,<\/p><p>&quot;To call God&#x27;s prescience the cause of sin<\/p><p>In wisdom&#x27;s purview is but folly&#x27;s prate.&quot;<\/p>"},{"n":145,"label":"CXLV","verse":"<p>He brought me hither, and I felt surprise,<\/p><p>From life I gather but a dark surmise,<\/p><p>I go against my will;--thus, why I come,<\/p><p>Why live, why go, are all dark mysteries.<\/p>"},{"n":146,"label":"CXLVI","verse":"<p>When I recall my grievous sins to mind,<\/p><p>Fire burns my breast, and tears my vision blind;<\/p><p>Yet, when a slave repents, is it not meet<\/p><p>His lord should pardon, and again be kind?<\/p>"},{"n":147,"label":"CXLVII","verse":"<p>They at whose lore the whole world stands amazed,<\/p><p>Whose high thoughts, like Borak, to heaven are raised,<\/p><p>Strive to know Thee in vain, and like heaven&#x27;s wheel<\/p><p>Their heads are turning, and their brains are dazed.<\/p>"},{"n":148,"label":"CXLVIII","verse":"<p>Allah hath promised wine in Paradise,<\/p><p>Why then should wine on earth be deemed a vice?<\/p><p>An Arab in his cups cut Hamzah&#x27;s girths,--<\/p><p>For that sole cause was drink declared a vice.<\/p>"},{"n":149,"label":"CXLIX","verse":"<p>Now of old joys naught but the name is left,<\/p><p>Of all old friends but wine we are bereft,<\/p><p>And that wine _new_, but still cleave to the cup,<\/p><p>For save the cup, what single joy is left?<\/p>"},{"n":150,"label":"CL","verse":"<p>The world will last long after Khayyam&#x27;s fame<\/p><p>Has passed away, yea, and his very name;<\/p><p>Aforetime we were not, and none did heed.<\/p><p>When we are dead and gone, &#x27;twill be the same.<\/p>"},{"n":151,"label":"CLI","verse":"<p>The sages who have compassed sea and land,<\/p><p>Their secret to search out, and understand,--<\/p><p>My mind misgives me if they ever solve<\/p><p>The scheme on which this universe is planned.<\/p>"},{"n":152,"label":"CLII","verse":"<p>Ah! wealth takes wings, and leaves our hands all bare,<\/p><p>And death&#x27;s rough hands delight our hearts to tear;<\/p><p>And from the nether world none e&#x27;er escapes,<\/p><p>To bring us news of the poor pilgrims there.<\/p>"},{"n":153,"label":"CLIII","verse":"<p>&#x27;Tis passing strange, those titled noblemen<\/p><p>Find their own lives a burden sore, but when<\/p><p>They meet with poorer men, not slaves to sense,<\/p><p>They scarcely deign to reckon them as men.<\/p>"},{"n":154,"label":"CLIV","verse":"<p>The wheel on high, still busied with despite,<\/p><p>Will ne&#x27;er unloose a wretch from his sad plight;<\/p><p>But when it lights upon a smitten heart,<\/p><p>Straightway essays another blow to smite.<\/p>"},{"n":155,"label":"CLV","verse":"<p>Now is the volume of my youth outworn,<\/p><p>And all my spring-tide blossoms rent and torn.<\/p><p>Ah, bird of youth! I marked not when you came,<\/p><p>Nor when you fled, and left me thus forlorn.<\/p>"},{"n":156,"label":"CLVI","verse":"<p>These fools, by dint of ignorance most crass,<\/p><p>Think they in wisdom all mankind surpass;<\/p><p>And glibly do they damn as infidel,<\/p><p>Whoever is not, like themselves, an ass.<\/p>"},{"n":157,"label":"CLVII","verse":"<p>Still be the wine-house thronged with its glad choir,<\/p><p>And Pharisaic skirts burnt up with fire,<\/p><p>Still be those tattered frocks and azure robes<\/p><p>Trod under feet of revellers in the mire.<\/p>"},{"n":158,"label":"CLVIII","verse":"<p>Why toil ye to ensure illusions vain,<\/p><p>And good or evil of the world attain?<\/p><p>Ye rise like Zamzam, or the fount of life,<\/p><p>And, like them, in earth&#x27;s bosom sink again.<\/p>"},{"n":159,"label":"CLIX","verse":"<p>Till the Friend pours his wine to glad my heart,<\/p><p>No kisses to my face will heaven impart<\/p><p>They say, &quot;Repent in time&quot;; but how repent,<\/p><p>Ere Allah&#x27;s grace hath softened my hard heart?<\/p>"},{"n":160,"label":"CLX","verse":"<p>When I am dead, take me and grind me small,<\/p><p>So that I be a caution unto all,<\/p><p>And knead me into clay with wine, and then<\/p><p>Use me to stop the wine-jar&#x27;s mouth withal.<\/p>"},{"n":161,"label":"CLXI","verse":"<p>What though the sky with its blue canopy<\/p><p>Doth close us in so that we cannot see,<\/p><p>In the etern Cupbearer&#x27;s wine methinks,<\/p><p>There float a myriad bubbles like to me.<\/p>"},{"n":162,"label":"CLXII","verse":"<p>Take heart! Long in the weary tomb you&#x27;ll lie,<\/p><p>While stars keep countless watches in the sky,<\/p><p>And see your ashes moulded into bricks,<\/p><p>To build another&#x27;s house and turrets high.<\/p>"},{"n":163,"label":"CLXIII","verse":"<p>Glad hearts, who seek not notoriety,<\/p><p>Nor flaunt in gold and silken bravery,<\/p><p>Haunt not this ruined earth like gloomy owls,<\/p><p>But wing their way, Simurgh-like, to the sky.<\/p>"},{"n":164,"label":"CLXIV","verse":"<p>Wine&#x27;s power is known to wine-bibbers alone,<\/p><p>To narrow heads and hearts &#x27;tis never shown;<\/p><p>I blame not them who never felt its force,<\/p><p>For, till they feel it, how can it be known.<\/p>"},{"n":165,"label":"CLXV","verse":"<p>Needs must the tavern-hunter bathe in wine,<\/p><p>For none can make a tarnished name to shine;<\/p><p>Go! bring me wine, for none can now restore<\/p><p>Its pristine sheen to this soiled veil of mine.<\/p>"},{"n":166,"label":"CLXVI","verse":"<p>I wasted life in hope, yet gathered not<\/p><p>In all my life of happiness one jot;<\/p><p>Now my fear is that life may not endure.<\/p><p>Till I have taken vengeance on my lot!<\/p>"},{"n":167,"label":"CLXVII","verse":"<p>Be very wary in the soul&#x27;s domain,<\/p><p>And on the world&#x27;s affairs your lips refrain;<\/p><p>Be, as it were, sans tongue, sans ear, sans eye,<\/p><p>While tongue, and ears, and eyes you still retain.<\/p>"},{"n":168,"label":"CLXVIII","verse":"<p>Let him rejoice who has a loaf of bread,<\/p><p>A little nest wherein to lay his head,<\/p><p>Is slave to none, and no man slaves for him,--<\/p><p>In truth his lot is wondrous well bested.<\/p>"},{"n":169,"label":"CLXIX","verse":"<p>What adds my service to Thy majesty?<\/p><p>Or how can sin of mine dishonour Thee?<\/p><p>O pardon, then, and punish not, I know<\/p><p>Thou&#x27;rt slow to wrath, and prone to clemency.<\/p>"},{"n":170,"label":"CLXX","verse":"<p>Hands, such as mine, that handle bowls of wine,<\/p><p>&#x27;Twere shame to book and pulpit to confine;<\/p><p>Zealot! thou&#x27;rt dry, and I am moist with drink,<\/p><p>Yea, far too moist to catch that fire of thine!<\/p>"},{"n":171,"label":"CLXXI","verse":"<p>Whoso aspires to gain a rose-cheeked fair,<\/p><p>Sharp pricks from fortune&#x27;s thorns must learn to bear.<\/p><p>See! till this comb was cleft by cruel cuts,<\/p><p>It never dared to touch my lady&#x27;s hair.<\/p>"},{"n":172,"label":"CLXXII","verse":"<p>For ever may my hands on wine be stayed.<\/p><p>And my heart pant for some fair Houri maid!<\/p><p>They say, &quot;May Allah aid thee to repent!&quot;<\/p><p>Repent I could not, e&#x27;en with Allah&#x27;s aid!<\/p>"},{"n":173,"label":"CLXXIII","verse":"<p>Soon shall I go, by time and fate deplored,<\/p><p>Of all my precious pearls not one is bored;<\/p><p>Alas! there die with me a thousand truths<\/p><p>To which these fools fit audience ne&#x27;er accord.<\/p>"},{"n":174,"label":"CLXXIV","verse":"<p>To-day how sweetly breathes the temperate air,<\/p><p>The rains have newly laved the parched parterre;<\/p><p>And Bulbuls cry in notes of ecstasy,<\/p><p>&quot;Thou too, O pallid rose, our wine must share!&quot;<\/p>"},{"n":175,"label":"CLXXV","verse":"<p>Ere you succumb to shocks of mortal pain,<\/p><p>The rosy grape-juice from your wine-cup drain.<\/p><p>You are not gold, that, hidden in the earth,<\/p><p>Your friends should care to dig you up again!<\/p>"},{"n":176,"label":"CLXXVI","verse":"<p>My coming brought no profit to the sky,<\/p><p>Nor does my going swell its majesty;<\/p><p>Coming and going put me to a stand,<\/p><p>Ear never heard their wherefore nor their why.<\/p>"},{"n":177,"label":"CLXXVII","verse":"<p>The heavenly Sage, whose wit exceeds compare,<\/p><p>Counteth each vein, and numbereth every hair;<\/p><p>Men you may cheat by hypocritic arts,<\/p><p>But how cheat Him to whom all hearts are bare?<\/p>"},{"n":178,"label":"CLXXVIII","verse":"<p>Ah! wine lends wings to many a weary wight,<\/p><p>And beauty spots to ladies&#x27; faces bright;<\/p><p>All Ramazan I have not drunk a drop,<\/p><p>Thrice welcome, then, O Bairam&#x27;s blessed night!<\/p>"},{"n":179,"label":"CLXXIX","verse":"<p>All night in deep bewilderment I fret,<\/p><p>With tear-drops big as pearls my breast is wet;<\/p><p>I cannot fill my cranium with wine,<\/p><p>How can it hold wine, when &#x27;tis thus upset?<\/p>"},{"n":180,"label":"CLXXX","verse":"<p>To prayer and fasting when my heart inclined,<\/p><p>All my desire I surely hoped to find;<\/p><p>Alas! my purity is stained with wine,<\/p><p>My prayers are wasted like a breath of wind.<\/p>"},{"n":181,"label":"CLXXXI","verse":"<p>I worship rose-red cheeks with heart and soul,<\/p><p>I suffer not my hand to quit the bowl,<\/p><p>I make each part of me his function do,<\/p><p>Or e&#x27;er my parts be swallowed in the Whole.<\/p>"},{"n":182,"label":"CLXXXII","verse":"<p>This worldly love of yours is counterfeit,<\/p><p>And, like a half-spent blaze, lacks light and heat;<\/p><p>True love is his, who for days, months and years,<\/p><p>Rests not, nor sleeps, nor craves for drink or meat.<\/p>"},{"n":183,"label":"CLXXXIII","verse":"<p>Why spend life in vainglorious essay<\/p><p>All Being and Not-being to survey?<\/p><p>Since Death is ever pressing at your heels,<\/p><p>&#x27;Tis best to drink or dream your life away.<\/p>"},{"n":184,"label":"CLXXXIV","verse":"<p>Some hanker after that vain phantasy<\/p><p>Of Houris, feigned in Paradise to be,<\/p><p>But, when the veil is lifted, they will find<\/p><p>How far they are from Thee, how far from Thee!<\/p>"},{"n":185,"label":"CLXXXV","verse":"<p>In Paradise, they tell us, Houris dwell,<\/p><p>And fountains run with wine and oxymel:<\/p><p>If these be lawful in the world to come,<\/p><p>Surely &#x27;tis right to love them here as well.<\/p>"},{"n":186,"label":"CLXXXVI","verse":"<p>A draught of wine would make a mountain dance,<\/p><p>Base is the churl who looks at wine askance;<\/p><p>Wine is a soul our bodies to inspire,<\/p><p>A truce to this vain talk of temperance!<\/p>"},{"n":187,"label":"CLXXXVII","verse":"<p>Oft doth my soul her prisoned state bemoan,<\/p><p>Her earth-born co-mate she would fain disown,<\/p><p>And quit, did not the stirrup of the law<\/p><p>Upbear her foot from dashing on the stone.<\/p>"},{"n":188,"label":"CLXXXVIII","verse":"<p>The moon of Ramazan is risen, see!<\/p><p>Alas, our wine must henceforth banished be;<\/p><p>Well! on Sha&#x27;ban&#x27;s last day I&#x27;ll drink enough<\/p><p>To keep me drunk till Bairam&#x27;s jubilee.<\/p>"},{"n":189,"label":"CLXXXIX","verse":"<p>From life we draw now wine, now dregs to drink,<\/p><p>Now flaunt in silk, and now in tatters shrink;<\/p><p>Such changes wisdom holds of slight account<\/p><p>To those who stand on death&#x27;s appalling brink!<\/p>"},{"n":190,"label":"CXC","verse":"<p>What sage the eternal tangle e&#x27;er unravelled,<\/p><p>Or one short step beyond his nature travelled?<\/p><p>From pupils to the masters turn your eyes,<\/p><p>And see, each mother&#x27;s son alike is gravelled.<\/p>"},{"n":191,"label":"CXCI","verse":"<p>Crave not of worldly sweets to take your fill,<\/p><p>Nor wait on turns of fortune, good or ill;<\/p><p>Be of light heart, as are the skies above,<\/p><p>They roll a round or two, and then lie still.<\/p>"},{"n":192,"label":"CXCII","verse":"<p>What eye can pierce the veil of God&#x27;s decrees,<\/p><p>Or read the riddle of earth&#x27;s destinies?<\/p><p>Pondered have I for years threescore and ten,<\/p><p>But still am baffled by these mysteries.<\/p>"},{"n":193,"label":"CXCIII","verse":"<p>They say, when the last trump shall sound its knell,<\/p><p>Our Friend will sternly judge, and doom to hell.<\/p><p>Can aught but good from perfect goodness come?<\/p><p>Compose your trembling hearts, &#x27;twill all be well.<\/p>"},{"n":194,"label":"CXCIV","verse":"<p>Drink wine to root up metaphysic weeds,<\/p><p>And tangle of the two-and-seventy creeds;<\/p><p>Do not forswear that wondrous alchemy,<\/p><p>&#x27;Twill turn to gold, and cure a thousand needs.<\/p>"},{"n":195,"label":"CXCV","verse":"<p>Though drink is wrong, take care with whom you drink,<\/p><p>And who you are that drink, and what you drink;<\/p><p>And drink at will, for, these three points observed,<\/p><p>Who but the very wise can ever drink?<\/p>"},{"n":196,"label":"CXCVI","verse":"<p>To drain a gallon beaker I design,<\/p><p>Yea, two great beakers, brimmed with richest wine;<\/p><p>Old faith and reason thrice will I divorce,<\/p><p>Then take to wife the daughter of the vine.<\/p>"},{"n":197,"label":"CXCVII","verse":"<p>True I drink wine, like every man of sense,<\/p><p>For I know Allah will not take offence;<\/p><p>Before time was, He knew that I should drink,<\/p><p>And who am I to thwart His prescience?<\/p>"},{"n":198,"label":"CXCVIII","verse":"<p>Rich men, who take to drink, the world defy<\/p><p>With shameless riot, and as beggars die;<\/p><p>Place in my ruby pipe some emerald hemp,<\/p><p>&#x27;Twill do as well to blind care&#x27;s serpent eye.<\/p>"},{"n":199,"label":"CXCIX","verse":"<p>These fools have never burnt the midnight oil<\/p><p>In deep research, nor do they ever toil<\/p><p>To step beyond themselves, but dress them fine,<\/p><p>And plot of credit others to despoil.<\/p>"},{"n":200,"label":"CC","verse":"<p>When false dawn streaks the east with cold, grey line,<\/p><p>Pour in your cups the pure blood of the vine;<\/p><p>The truth, they say, tastes bitter in the mouth,<\/p><p>This is a token that the &quot;Truth&quot; is wine.<\/p>"},{"n":201,"label":"CCI","verse":"<p>Now is the time earth decks her greenest bowers,<\/p><p>And trees, like Musa&#x27;s hand, grow white with flowers!<\/p><p>As &#x27;twere at &#x27;Isa&#x27;s breath the plants revive,<\/p><p>While clouds brim o&#x27;er, like tearful eyes, with showers.<\/p>"},{"n":202,"label":"CCII","verse":"<p>O burden not thyself with drudgery,<\/p><p>Lord of white silver and red gold to be;<\/p><p>But feast with friends, ere this warm breath of thine<\/p><p>Be chilled in death, and earthworms feast on thee.<\/p>"},{"n":203,"label":"CCIII","verse":"<p>The showers of grape-juice, which cupbearers pour,<\/p><p>Quench fires of grief in many a sad heart&#x27;s core<\/p><p>Praise be to Allah, who hath sent this balm<\/p><p>To heal sore hearts, and spirits&#x27; health restore!<\/p>"},{"n":204,"label":"CCIV","verse":"<p>Can alien Pharisees Thy kindness tell,<\/p><p>Like us, Thy intimates, who nigh Thee dwell?<\/p><p>Thou say&#x27;st, &quot;All sinners will I burn with fire.&quot;<\/p><p>Say that to strangers, we know Thee too well.<\/p>"},{"n":205,"label":"CCV","verse":"<p>O comrades dear, when hither ye repair<\/p><p>In times to come, communion sweet to share,<\/p><p>While the cupbearer pours your old Magh wine,<\/p><p>Call poor Khayyam to mind, and breathe a prayer.<\/p>"},{"n":206,"label":"CCVI","verse":"<p>For me heaven&#x27;s sphere no music ever made,<\/p><p>Nor yet with soothing voice my fears allayed;<\/p><p>If e&#x27;er I found brief respite from my woes,<\/p><p>Back to woe&#x27;s thrall I was at once betrayed.<\/p>"},{"n":207,"label":"CCVII","verse":"<p>Sooner with half a loaf contented be,<\/p><p>And water from a broken crock, like me,<\/p><p>Than lord it over one poor fellow-man,<\/p><p>Or to another bow the vassal knee.<\/p>"},{"n":208,"label":"CCVIII","verse":"<p>While Moon and Venus in the sky shall dwell,<\/p><p>None shall see aught red grape-juice to excel:<\/p><p>O foolish publicans, what can you buy<\/p><p>One half so precious as the goods you sell?<\/p>"},{"n":209,"label":"CCIX","verse":"<p>They who by genius, and by power of brain,<\/p><p>The rank of man&#x27;s enlighteners attain,<\/p><p>Not even they emerge from this dark night,<\/p><p>But tell their dreams, and fall asleep again.<\/p>"},{"n":210,"label":"CCX","verse":"<p>At dawn, when dews bedeck the tulip&#x27;s face,<\/p><p>And violets their heavy heads abase,<\/p><p>I love to see the roses&#x27; folded buds,<\/p><p>With petals closed against the wind&#x27;s disgrace.<\/p>"},{"n":211,"label":"CCXI","verse":"<p>Like as the skies rain down sweet jessamine,<\/p><p>And sprinkle all the meads with eglantine,<\/p><p>Right so, from out this jug of violet hue,<\/p><p>I pour in lily cups this rosy wine.<\/p>"},{"n":212,"label":"CCXII","verse":"<p>Ah! thou hast snared this head, though white as snow,<\/p><p>Which oft has vowed the wine-cup to forego;<\/p><p>And wrecked the mansion long resolve did build,<\/p><p>And rent the vesture penitence did sew!<\/p>"},{"n":213,"label":"CCXIII","verse":"<p>I am not one whom Death doth much dismay,<\/p><p>Life&#x27;s terrors all Death&#x27;s terrors far outweigh;<\/p><p>This life, that Heaven hath lent me for a while,<\/p><p>I will pay back, when it is time to pay.<\/p>"},{"n":214,"label":"CCXIV","verse":"<p>The stars, who dwell on heaven&#x27;s exalted stage,<\/p><p>Baffle the wise diviners of our age;<\/p><p>Take heed, hold fast the rope of mother wit.<\/p><p>These augurs all distrust their own presage.<\/p>"},{"n":215,"label":"CCXV","verse":"<p>The people who the heavenly world adorn,<\/p><p>Who come each night, and go away each morn,<\/p><p>Now on Heaven&#x27;s skirt, and now in earth&#x27;s deep pouch,<\/p><p>While Allah lives, shall aye anew be born!<\/p>"},{"n":216,"label":"CCXVI","verse":"<p>Slaves of vain wisdom and philosophy,<\/p><p>Who toil at Being and Nonentity,<\/p><p>Parching your brains till they are like dry grapes,<\/p><p>Be wise in time, and drink grape-juice, like me!<\/p>"},{"n":217,"label":"CCXVII","verse":"<p>Sense, seeking happiness, bids us pursue<\/p><p>All present joys, and present griefs eschew;<\/p><p>She says, we are not as the meadow grass,<\/p><p>Which, when they mow it down, springs up anew.<\/p>"},{"n":218,"label":"CCXVIII","verse":"<p>Now Ramazan is past, Shawwal comes back,<\/p><p>And feast and song and joy no more we lack;<\/p><p>The wine-skin carriers throng the streets and cry,<\/p><p>&quot;Here comes the porter with his precious pack.&quot;<\/p>"},{"n":219,"label":"CCXIX","verse":"<p>My comrades all are gone; Death, deadly foe,<\/p><p>Has caught them one by one, and trampled low;<\/p><p>They shared life&#x27;s feast, and drank its wine with me,<\/p><p>But lost their heads, and dropped a while ago.<\/p>"},{"n":220,"label":"CCXX","verse":"<p>Those hypocrites, all know so well, who lurk<\/p><p>In streets to beg their bread, and will not work,<\/p><p>Claim to be saints, like Shibli and Junaid,<\/p><p>No Shiblis are they, though well known in Karkh!<\/p>"},{"n":221,"label":"CCXXI","verse":"<p>When the great Founder moulded me of old,<\/p><p>He mixed much baser metal with my gold;<\/p><p>Better or fairer I can never be<\/p><p>Than I first issued from his heavenly mould.<\/p>"},{"n":222,"label":"CCXXII","verse":"<p>The joyous souls who quaff potations deep,<\/p><p>And saints who in the mosques sad vigils keep,<\/p><p>Are lost at sea alike, and find no shore,<\/p><p>ONE only wakes, all others are asleep.<\/p>"},{"n":223,"label":"CCXXIII","verse":"<p>Not-being&#x27;s water served to mix my clay,<\/p><p>And on my heart grief&#x27;s fire doth ever prey,<\/p><p>And blown am I like wind about the world,<\/p><p>And last my crumbling earth is swept away.<\/p>"},{"n":224,"label":"CCXXIV","verse":"<p>Small gains to learning on this earth accrue,<\/p><p>They pluck life&#x27;s fruitage, learning who eschew;<\/p><p>Take pattern by the fools who learning shun,<\/p><p>And then perchance shall fortune smile on you.<\/p>"},{"n":225,"label":"CCXXV","verse":"<p>When the fair soul this mansion doth vacate,<\/p><p>Each element assumes its primal state,<\/p><p>And all the silken furniture of life<\/p><p>Is then dismantled by the blows of fate.<\/p>"},{"n":226,"label":"CCXXVI","verse":"<p>These people string their beads of learned lumber,<\/p><p>And tell of Allah stories without number;<\/p><p>Yet never solve the riddle of the skies,<\/p><p>But wag the chin, and get them back to slumber.<\/p>"},{"n":227,"label":"CCXXVII","verse":"<p>These folk are asses, laden with conceit,<\/p><p>And glittering drums, that empty sounds repeat,<\/p><p>And humble slaves are they of name and fame,<\/p><p>Acquire a name, and, lo! they kiss thy feet.<\/p>"},{"n":228,"label":"CCXXVIII","verse":"<p>On the dread day of final scrutiny<\/p><p>Thou wilt be rated by thy quality;<\/p><p>Get wisdom and fair qualities to-day,<\/p><p>For, as thou art, requited wilt thou be.<\/p>"},{"n":229,"label":"CCXXIX","verse":"<p>Many fine heads, like bowls, the Brazier made,<\/p><p>And thus his own similitude portrayed;<\/p><p>He set one upside down above our heads,<\/p><p>Which keeps us all continually afraid.<\/p>"},{"n":230,"label":"CCXXX","verse":"<p>My true condition I may thus explain<\/p><p>In two short verses which the whole contain:<\/p><p>&quot;From love to Thee I now lay down my life,<\/p><p>In hope Thy love will raise me up again.&quot;<\/p>"},{"n":231,"label":"CCXXXI","verse":"<p>The heart, like tapers, takes at beauty&#x27;s eyes<\/p><p>A flame, and lives by that whereby it dies;<\/p><p>And beauty is a flame where hearts, like moths,<\/p><p>Offer themselves a burning sacrifice.<\/p>"},{"n":232,"label":"CCXXXII","verse":"<p>To please the righteous life itself I sell,<\/p><p>And, though they tread me down, never rebel;<\/p><p>Men say, &quot;Inform us what and where is hell?&quot;<\/p><p>Ill company will make this earth a hell.<\/p>"},{"n":233,"label":"CCXXXIII","verse":"<p>The sun doth smite the roofs with Orient ray<\/p><p>And, Khosrau like, his wine-red sheen display;<\/p><p>Arise, and drink! the herald of the dawn<\/p><p>Uplifts his voice, and cries, &quot;Oh, drink to-day!&quot;<\/p>"},{"n":234,"label":"CCXXXIV","verse":"<p>Comrades! when e&#x27;er you meet together here,<\/p><p>Recall your friend to mind, and drop a tear;<\/p><p>And when the circling wine-cups reach his seat,<\/p><p>Pray turn one upside down his dust to cheer.<\/p>"},{"n":235,"label":"CCXXXV","verse":"<p>That grace and favour at the first, what meant it?<\/p><p>That lavishing of joy and peace, what meant it?<\/p><p>But now thy purpose is to grieve my heart;<\/p><p>What did I do to cause this change? What meant it?<\/p>"},{"n":236,"label":"CCXXXVI","verse":"<p>These hypocrites who build on saintly show,<\/p><p>Treating the body as the spirit&#x27;s foe,<\/p><p>If they will shut their mouths with lime, like jars,<\/p><p>My jar of grape-juice I will then forego.<\/p>"},{"n":237,"label":"CCXXXVII","verse":"<p>Many have come, and run their eager race,<\/p><p>Striving for pleasures, luxuries, or place,<\/p><p>And quaffed their wine, and now all silent lie,<\/p><p>Enfolded in their parent earth&#x27;s embrace.<\/p>"},{"n":238,"label":"CCXXXVIII","verse":"<p>Then, when the good reap fruits of labours past,<\/p><p>My hapless lot with drunkards will be cast;<\/p><p>If good, may I be numbered with the first,<\/p><p>If bad, find grace and mercy with the last.<\/p>"},{"n":239,"label":"CCXXXIX","verse":"<p>Of happy turns of fortune take your fill,<\/p><p>Seek pleasure&#x27;s couch, or wine-cup, as you will;<\/p><p>Allah regards not if you sin, or saint it,<\/p><p>So take your pleasure, be it good or ill.<\/p>"},{"n":240,"label":"CCXL","verse":"<p>Heaven multiplies our sorrows day by day,<\/p><p>And grants no joys it does not take away;<\/p><p>If those unborn could know the ills we bear,<\/p><p>What think you, would they rather come or stay?<\/p>"},{"n":241,"label":"CCXLI","verse":"<p>Why ponder thus the future to foresee,<\/p><p>And jade thy brain to vain perplexity?<\/p><p>Cast off thy care, leave Allah&#x27;s plans to him,<\/p><p>He formed them all without consulting thee.<\/p>"},{"n":242,"label":"CCXLII","verse":"<p>The tenants of the tombs to dust decay,<\/p><p>Nescient of self, and all beside are they;<\/p><p>Their sundered atoms float about the world,<\/p><p>Like mirage clouds, until the judgment day.<\/p>"},{"n":243,"label":"CCXLIII","verse":"<p>O soul! lay up all earthly goods in store,<\/p><p>Thy mead with pleasure&#x27;s flowerets spangle o&#x27;er;<\/p><p>And know &#x27;tis all as dew, that decks the flowers<\/p><p>For one short night, and then is seen no more!<\/p>"},{"n":244,"label":"CCXLIV","verse":"<p>Heed not the Sunna, nor the law divine;<\/p><p>If to the poor his portion you assign,<\/p><p>And never injure one, nor yet abuse,<\/p><p>I guarantee you heaven, and now some wine!<\/p>"},{"n":245,"label":"CCXLV","verse":"<p>Vexed by this wheel of things, that pets the base,<\/p><p>My sorrow-laden life drags on apace;<\/p><p>Like rosebud, from the storm I wrap me close,<\/p><p>And blood-spots on my heart, like tulip, trace.<\/p>"},{"n":246,"label":"CCXLVI","verse":"<p>Youth is the time to pay court to the vine,<\/p><p>To quaff the cup, with revellers to recline;<\/p><p>A flood of water once laid waste the earth,<\/p><p>Hence learn to lay you waste with floods of wine.<\/p>"},{"n":247,"label":"CCXLVII","verse":"<p>The world is baffled in its search for Thee,<\/p><p>Wealth cannot find Thee, no, nor poverty;<\/p><p>Thou&#x27;rt very near us, but our ears are deaf,<\/p><p>Our eyes are blinded that we may not see!<\/p>"},{"n":248,"label":"CCXLVIII","verse":"<p>Take care you never hold a drinking-bout<\/p><p>With an ill-tempered, ill-conditioned lout;<\/p><p>He&#x27;ll make a vile disturbance all night long,<\/p><p>And vile apologies next day, no doubt.<\/p>"},{"n":249,"label":"CCXLIX","verse":"<p>The starry aspects are not all benign;<\/p><p>Why toil then after vain desires, and pine<\/p><p>To lade thyself with load of fortune&#x27;s boons,<\/p><p>Only to drop it with this life of thine?<\/p>"},{"n":250,"label":"CCL","verse":"<p>O comrades! here is filtered wine, come drink!<\/p><p>Pledge all your charming sweethearts as you drink;<\/p><p>&#x27;Tis the grape&#x27;s blood, and this is what it says,<\/p><p>&quot;To you I dedicate my life-blood! drink!&quot;<\/p>"},{"n":251,"label":"CCLI","verse":"<p>Are you depressed? Then take of _bhang_ one grain,<\/p><p>Of rosy grape-juice take one pint or twain;<\/p><p>Sufis, you say, must not take this or that,<\/p><p>Then go and eat the pebbles off the plain!<\/p>"},{"n":252,"label":"CCLII","verse":"<p>I saw a busy potter by the way<\/p><p>Kneading with might and main a lump of clay;<\/p><p>And, lo! the clay cried, &quot;Use me gently, pray;<\/p><p>I was a man myself but yesterday!&quot;<\/p>"},{"n":253,"label":"CCLIII","verse":"<p>Oh! wine is richer that the realm of Jam,<\/p><p>More fragrant than the food of Miriam;<\/p><p>Sweeter are sighs that drunkards heave at morn<\/p><p>Than strains of Bu Sa&#x27;id and Bin Adham.<\/p>"},{"n":254,"label":"CCLIV","verse":"<p>Deep in the rondure of the heavenly blue,<\/p><p>There is a cup, concealed from mortals&#x27; view,<\/p><p>Which all must drink in turn; Oh, sigh not then,<\/p><p>But drink it boldly, when it comes to you!<\/p>"},{"n":255,"label":"CCLV","verse":"<p>Though you should live to four, or forty score,<\/p><p>Go hence you must, as all have gone before;<\/p><p>Then, be you king, or beggar of the streets,<\/p><p>They&#x27;ll rate you all the same, no less, no more.<\/p>"},{"n":256,"label":"CCLVI","verse":"<p>If you seek Him, abandon child and wife,<\/p><p>Arise, and sever all these ties to life;<\/p><p>All these are bonds to check you on your course.<\/p><p>Arise, and cut these bonds, as with a knife.<\/p>"},{"n":257,"label":"CCLVII","verse":"<p>O heart! this world is but a fleeting show,<\/p><p>Why should its empty griefs distress thee so?<\/p><p>Bow down, and bear thy fate, the eternal pen<\/p><p>Will not unwrite its roll for thee, I trow!<\/p>"},{"n":258,"label":"CCLVIII","verse":"<p>Who e&#x27;er returned of all that went before,<\/p><p>To tell of that long road they travel o&#x27;er?<\/p><p>Leave naught undone of what you have to do,<\/p><p>For when you go, you will return no more.<\/p>"},{"n":259,"label":"CCLIX","verse":"<p>Dark wheel! how many lovers thou hast slain,<\/p><p>Like Mahmud and Ayaz, O inhumane!<\/p><p>Come, let us drink, thou grantest not two lives,<\/p><p>When one is spent, we find it not again.<\/p>"},{"n":260,"label":"CCLX","verse":"<p>Illustrious Prophet! whom all kings obey,<\/p><p>When is our darkness lightened by wine&#x27;s ray?<\/p><p>On Sunday, Monday, Tuesday, Wednesday, Thursday,<\/p><p>Friday, and Saturday, both night and day!<\/p>"},{"n":261,"label":"CCLXI","verse":"<p>O turn away those roguish eyes of thine!<\/p><p>Be still! seek not my peace to undermine!<\/p><p>Thou say&#x27;st, &quot;Look not.&quot; I might as well essay<\/p><p>To slant my goblet, and not spill my wine.<\/p>"},{"n":262,"label":"CCLXII","verse":"<p>In taverns better far commune with Thee,<\/p><p>Than pray in mosques, and fail Thy face to see!<\/p><p>O first and last of all Thy creatures Thou,<\/p><p>&#x27;Tis Thine to burn, and Thine to cherish me!<\/p>"},{"n":263,"label":"CCLXIII","verse":"<p>To wise and worthy men your life devote,<\/p><p>But from the worthless keep your walk remote;<\/p><p>Dare to take poison from a sage&#x27;s hand,<\/p><p>But from a fool refuse an antidote.<\/p>"},{"n":264,"label":"CCLXIV","verse":"<p>I flew here, as a bird from the wild, in aim<\/p><p>Up to a higher nest my course to frame,<\/p><p>But, finding here no guide who knows the way,<\/p><p>Fly out by the same door where through I came.<\/p>"},{"n":265,"label":"CCLXV","verse":"<p>He binds us in resistless Nature&#x27;s chain,<\/p><p>And yet bids us our natures to restrain;<\/p><p>Between these counter rules we stand perplexed,<\/p><p>&quot;Hold the jar slant, but all the wine retain.&quot;<\/p>"},{"n":266,"label":"CCLXVI","verse":"<p>They go away, and none is seen returning,<\/p><p>To teach that other world&#x27;s recondite learning;<\/p><p>&#x27;Twill not be shown for dull mechanic prayers,<\/p><p>For prayer is naught without true heartfelt yearning.<\/p>"},{"n":267,"label":"CCLXVII","verse":"<p>Go to! Cast dust on those deaf skies, who spurn<\/p><p>Thy orisons and bootless prayers, and learn<\/p><p>To quaff the cup, and hover round the fair;<\/p><p>Of all who go, did ever one return?<\/p>"},{"n":268,"label":"CCLXVIII","verse":"<p>Though Khayyam strings no pearls of righteous deeds,<\/p><p>Nor sweeps from off his soul sin&#x27;s noisome weeds,<\/p><p>Yet will he not despair of heavenly grace,<\/p><p>Seeing that ONE as two he ne&#x27;er misreads.<\/p>"},{"n":269,"label":"CCLXIX","verse":"<p>Again to tavern haunts do we repair,<\/p><p>And say &quot;Adieu&quot; to the five hours of prayer;<\/p><p>Where&#x27;er we see a long-necked flask of wine,<\/p><p>We elongate our necks that wine to share.<\/p>"},{"n":270,"label":"CCLXX","verse":"<p>We are but chessmen, destined, it is plain,<\/p><p>That great chess-player, Heaven, to entertain;<\/p><p>It moves us on life&#x27;s chess-board to and fro,<\/p><p>And then in death&#x27;s dark box shuts up again.<\/p>"},{"n":271,"label":"CCLXXI","verse":"<p>You ask what is this life so frail, so vain,<\/p><p>&#x27;Tis long to tell, yet will I make it plain;<\/p><p>&#x27;Tis but a breath blown from the vasty deeps,<\/p><p>And then blown back to those same deeps again!<\/p>"},{"n":272,"label":"CCLXXII","verse":"<p>To-day to heights of rapture have I soared,<\/p><p>Yea, and with drunken Maghs pure wine adored;<\/p><p>I am become beside myself, and rest<\/p><p>In that pure temple, &quot;Am not I your Lord?&quot;<\/p>"},{"n":273,"label":"CCLXXIII","verse":"<p>My queen (long may she live to vex her slave!)<\/p><p>To-day a token of affection gave,<\/p><p>Darting a kind glance from her eyes, she passed,<\/p><p>And said, &quot;Do good and cast it on the wave!&quot;<\/p>"},{"n":274,"label":"CCLXXIV","verse":"<p>I put my lips to the cup, for I did yearn<\/p><p>The hidden cause of length of days to learn;<\/p><p>He leaned his lip to mine, and whispered low,<\/p><p>&quot;Drink! for, once gone, you never will return.&quot;<\/p>"},{"n":275,"label":"CCLXXV","verse":"<p>We lay in the cloak of Naught, asleep and still,<\/p><p>Thou said&#x27;st, &quot;Awake! taste the world&#x27;s good and ill&quot;;<\/p><p>Here we are puzzled by Thy strange command,<\/p><p>From slanted jars no single drop to spill.<\/p>"},{"n":276,"label":"CCLXXVI","verse":"<p>O Thou! who know&#x27;st the secret thoughts of all,<\/p><p>In time of sorest need who aidest all,<\/p><p>Grant me repentance, and accept my plea,<\/p><p>O Thou who dost accept the pleas of all!<\/p>"},{"n":277,"label":"CCLXXVII","verse":"<p>I saw a bird perched on the walls of Tus,<\/p><p>Before him lay the skull of Kai Kawus,<\/p><p>And thus he made his moan, &quot;Alas, poor king!<\/p><p>Thy drums are hushed, thy &#x27;larums have rung truce.&quot;<\/p>"},{"n":278,"label":"CCLXXVIII","verse":"<p>Ask not the chances of the time to be,<\/p><p>And for the past, &#x27;tis vanished, as you see;<\/p><p>This ready-money breath set down as gain,<\/p><p>Future and past concern not you or me.<\/p>"},{"n":279,"label":"CCLXXIX","verse":"<p>What launched that golden orb his course to run,<\/p><p>What wrecks his firm foundations, when &#x27;tis done,<\/p><p>No man of science ever weighed with scales,<\/p><p>Nor made assay with touchstone, no, not one!<\/p>"},{"n":280,"label":"CCLXXX","verse":"<p>I pray thee to my counsel lend thine ear,<\/p><p>Cast off this false hypocrisy&#x27;s veneer;<\/p><p>This life a moment is, the next all time,<\/p><p>Sell not eternity for earthly gear!<\/p>"},{"n":281,"label":"CCLXXXI","verse":"<p>Ofttimes I plead my foolishness to Thee,<\/p><p>My heart contracted with perplexity;<\/p><p>I gird me with the Magian zone, and why?<\/p><p>For shame so poor a Musulman to be.<\/p>"},{"n":282,"label":"CCLXXXII","verse":"<p>Khayyam! rejoice that wine you still can pour,<\/p><p>And still the charms of tulip cheeks adore;<\/p><p>You&#x27;ll soon not be, rejoice then that you are,<\/p><p>Think how &#x27;twould be in case you were no more!<\/p>"},{"n":283,"label":"CCLXXXIII","verse":"<p>Once, in a potter&#x27;s shop, a company<\/p><p>Of cups in converse did I chance to see,<\/p><p>And lo! one lifted up his voice, and cried,<\/p><p>&quot;Who made, who sells, who buys this crockery?&quot;<\/p>"},{"n":284,"label":"CCLXXXIV","verse":"<p>Last night, as I reeled from the tavern door,<\/p><p>I saw a sage, who a great wine-jug bore;<\/p><p>I said, &quot;O Shaikh, have you no shame?&quot; Said he,<\/p><p>&quot;Allah hath boundless mercy in his store.&quot;<\/p>"},{"n":285,"label":"CCLXXXV","verse":"<p>Life&#x27;s fount is wine, Khizir its guardian,<\/p><p>I, like Elias, find it where I can,<\/p><p>&#x27;Tis sustenance for heart and spirit too,<\/p><p>Allah himself calls wine &quot;a boon to man.&quot;<\/p>"},{"n":286,"label":"CCLXXXVI","verse":"<p>Though wine is banned, yet drink, for ever drink!<\/p><p>By day and night, with strains of music drink!<\/p><p>Where&#x27;er thou lightest on a cup of wine,<\/p><p>Spill just one drop, and take the rest and drink!<\/p>"},{"n":287,"label":"CCLXXXVII","verse":"<p>Although the creeds number some seventy-three,<\/p><p>I hold with none but that of loving Thee;<\/p><p>What matter faith, unfaith, obedience, sin?<\/p><p>Thou&#x27;rt all we need, the rest is vanity.<\/p>"},{"n":288,"label":"CCLXXXVIII","verse":"<p>Tell one by one my scanty virtues o&#x27;er;<\/p><p>As for my sins, forgive them by the score;<\/p><p>Let not my faults kindle Thy wrath to flame;<\/p><p>By blest Muhammad&#x27;s tomb, forgive once more!<\/p>"},{"n":289,"label":"CCLXXXIX","verse":"<p>Grieve not at coming ill, you can&#x27;t defeat it,<\/p><p>And what far-sighted person goes to meet it?<\/p><p>Cheer up! bear not about a world of grief,<\/p><p>Your fate is fixed, and grieving will not cheat it.<\/p>"},{"n":290,"label":"CCXC","verse":"<p>There is a chalice made with wit profound,<\/p><p>With tokens of the Maker&#x27;s favour crowned;<\/p><p>Yet the world&#x27;s Potter takes his masterpiece,<\/p><p>And dashes it to pieces on the ground!<\/p>"},{"n":291,"label":"CCXCI","verse":"<p>In truth wine is a spirit thin as air,<\/p><p>A limpid soul in the cup&#x27;s earthen ware;<\/p><p>No dull, dense person shall be friend of mine<\/p><p>Save wine-cups, which are dense and also rare.<\/p>"},{"n":292,"label":"CCXCII","verse":"<p>O wheel of heaven! no ties of bread you feel,<\/p><p>No ties of salt, you flay me like an eel!<\/p><p>A woman&#x27;s wheel spins clothes for man and wife,<\/p><p>It does more good than you, O heavenly wheel!<\/p>"},{"n":293,"label":"CCXCIII","verse":"<p>Did no fair rose my paradise adorn,<\/p><p>I would make shift to deck it with a thorn;<\/p><p>And if I lacked my prayer-mats, beads, and Shaikh,<\/p><p>&#x27;Those Christian bells and stoles I would not scorn.<\/p>"},{"n":294,"label":"CCXCIV","verse":"<p>&quot;If heaven deny me peace and fame,&quot; I said,<\/p><p>&quot;Let it be open war and shame instead;<\/p><p>The man who scorns bright wine had best beware,<\/p><p>I&#x27;ll arm me with a stone, and break his head!&quot;<\/p>"},{"n":295,"label":"CCXCV","verse":"<p>See! the dawn breaks, and rends night&#x27;s canopy:<\/p><p>Arise! and drain a morning draught with me!<\/p><p>Away with gloom! full many a dawn will break<\/p><p>Looking for us, and we not here to see!<\/p>"},{"n":296,"label":"CCXCVI","verse":"<p>O you who tremble not at fires of hell,<\/p><p>Nor wash in water of remorse&#x27;s well,<\/p><p>When winds of death shall quench your vital torch,<\/p><p>Beware lest earth your guilty dust expel.<\/p>"},{"n":297,"label":"CCXCVII","verse":"<p>This world a hollow pageant you should deem;<\/p><p>All wise men know things are not what they seem;<\/p><p>Be of good cheer, and drink, and so shake off<\/p><p>This vain illusion of a baseless dream.<\/p>"},{"n":298,"label":"CCXCVIII","verse":"<p>With maids stately as cypresses, and fair<\/p><p>As roses newly plucked, your wine-cups share,<\/p><p>Or e&#x27;er Death&#x27;s blasts shall rend your robe of flesh<\/p><p>Like yonder rose leaves, lying scattered there!<\/p>"},{"n":299,"label":"CCXCIX","verse":"<p>Cast off dull care, O melancholy brother!<\/p><p>Woo the sweet daughter of the grape, no other;<\/p><p>The daughter is forbidden, it is true,<\/p><p>But she is nicer than her lawful mother!<\/p>"},{"n":300,"label":"CCC","verse":"<p>My love shone forth, and I was overcome,<\/p><p>My heart was speaking, but my tongue was dumb;<\/p><p>Beside the water-brooks I died of thirst.<\/p><p>Was ever known so strange a martyrdom?<\/p>"},{"n":301,"label":"CCCI","verse":"<p>Give me my cup in hand, and sing a glee<\/p><p>In concert with the bulbul&#x27;s symphony;<\/p><p>Wine would not gurgle as it leaves the flask,<\/p><p>If drinking mute were right for thee and me!<\/p>"},{"n":302,"label":"CCCII","verse":"<p>The &quot;Truth&quot; will not be shown to lofty thought,<\/p><p>Nor yet with lavished gold may it be bought;<\/p><p>But, if you yield your life for fifty years,<\/p><p>From words to &quot;states&quot; you may perchance be brought.<\/p>"},{"n":303,"label":"CCCIII","verse":"<p>I solved all problems, down from Saturn&#x27;s wreath<\/p><p>Unto this lowly sphere of earth beneath,<\/p><p>And leapt out free from bonds of fraud and lies,<\/p><p>Yea, every knot was loosed, save that of death!<\/p>"},{"n":304,"label":"CCCIV","verse":"<p>Peace! the eternal &quot;Has been&quot; and &quot;To be&quot;<\/p><p>Pass man&#x27;s experience, and man&#x27;s theory;<\/p><p>In joyful seasons naught can vie with wine,<\/p><p>To all these riddles wine supplies the key!<\/p>"},{"n":305,"label":"CCCV","verse":"<p>Allah, our Lord, is merciful, though just;<\/p><p>Sinner! despair not, but His mercy trust!<\/p><p>For though to-day you perish in your sins,<\/p><p>To-morrow He&#x27;ll absolve your crumbling dust.<\/p>"},{"n":306,"label":"CCCVI","verse":"<p>Your course annoys me, O ye wheeling skies!<\/p><p>Unloose me from your chain of tyrannies!<\/p><p>If none but fools your favours may enjoy,<\/p><p>Then favour me,--I am not very wise!<\/p>"},{"n":307,"label":"CCCVII","verse":"<p>O City Mufti, you go more astray<\/p><p>Than I do, though to wine I do give way;<\/p><p>I drink the blood of grapes, you that of men:<\/p><p>Which of us is the more bloodthirsty, pray?<\/p>"},{"n":308,"label":"CCCVIII","verse":"<p>&#x27;Tis well to drink, and leave anxiety<\/p><p>For what is past, and what is yet to be;<\/p><p>Our prisoned spirits, lent us for a day,<\/p><p>A while from season&#x27;s bondage shall go free!<\/p>"},{"n":309,"label":"CCCIX","verse":"<p>When Khayyam quittance at Death&#x27;s hand receives,<\/p><p>And sheds his outworn life, as trees their leaves,<\/p><p>Full gladly will he sift this world away,<\/p><p>Ere dustmen sift his ashes in their sieves.<\/p>"},{"n":310,"label":"CCCX","verse":"<p>This wheel of heaven, which makes us all afraid,<\/p><p>I liken to a lamp&#x27;s revolving shade,<\/p><p>The sun the candlestick, the earth the shade,<\/p><p>And men the trembling forms thereon portrayed.<\/p>"},{"n":311,"label":"CCCXI","verse":"<p>Who was it that did mix my clay? Not I.<\/p><p>Who spun my web of silk and wool? Not I.<\/p><p>Who wrote upon my forehead all my good,<\/p><p>And all my evil deeds? In truth not I.<\/p>"},{"n":312,"label":"CCCXII","verse":"<p>O let us not forecast to-morrow&#x27;s fears,<\/p><p>But count to-day as gain, my brave compeers!<\/p><p>To-morrow we shall quit this inn, and march<\/p><p>With comrades who have marched seven thousand years.<\/p>"},{"n":313,"label":"CCCXIII","verse":"<p>Ne&#x27;er for one moment leave your cup unused!<\/p><p>Wine keeps heart, faith, and reason too, amused;<\/p><p>Had Iblis swallowed but a single drop,<\/p><p>To worship Adam he had ne&#x27;er refused!<\/p>"},{"n":314,"label":"CCCXIV","verse":"<p>Come, dance! while we applaud thee, and adore<\/p><p>Thy sweet Narcissus eyes, and grape-juice pour;<\/p><p>A score of cups is no such great affair,<\/p><p>But &#x27;tis enchanting when we reach three score!<\/p>"},{"n":315,"label":"CCCXV","verse":"<p>I close the door of hope in my own face,<\/p><p>Nor sue for favours from good men, or base;<\/p><p>I have but ONE to lend a helping hand,<\/p><p>He knows, as well as I, my sorry case.<\/p>"},{"n":316,"label":"CCCXVI","verse":"<p>Ah! by these heavens, that ever circling run,<\/p><p>And by my own base lusts I am undone,<\/p><p>Without the wit to abandon worldly hopes,<\/p><p>And wanting sense the world&#x27;s allures to shun!<\/p>"},{"n":317,"label":"CCCXVII","verse":"<p>On earth&#x27;s green carpet many sleepers lie,<\/p><p>And hid beneath it others I descry,<\/p><p>And others, not yet come, or passed away,<\/p><p>People the desert of Nonentity!<\/p>"},{"n":318,"label":"CCCXVIII","verse":"<p>Sure of Thy grace, for sins why need I fear?<\/p><p>How can the pilgrim faint whilst Thou art near?<\/p><p>On the last day Thy grace will wash me white,<\/p><p>And make my &quot;black record&quot; to disappear.<\/p>"},{"n":319,"label":"CCCXIX","verse":"<p>Think not I dread from out the world to hie,<\/p><p>And see my disembodied spirit fly;<\/p><p>I tremble not at death, for death is true,<\/p><p>&#x27;Tis my ill life that makes me fear to die!<\/p>"},{"n":320,"label":"CCCXX","verse":"<p>Let us shake off dull reason&#x27;s incubus,<\/p><p>Our tale of days or years cease to discuss,<\/p><p>And take our jugs, and plenish them with wine,<\/p><p>Or e&#x27;er grim potters make their jugs of us!<\/p>"},{"n":321,"label":"CCCXXI","verse":"<p>How much more wilt thou chide, O raw divine,<\/p><p>For that I drink, and am a libertine?<\/p><p>Thou hast thy weary beads, and saintly show,<\/p><p>Leave me my cheerful sweetheart, and my wine!<\/p>"},{"n":322,"label":"CCCXXII","verse":"<p>Against my lusts I ever war, in vain,<\/p><p>I think on my ill deeds with shame and pain;<\/p><p>I trust Thou wilt assoil me of my sins,<\/p><p>But even so, my shame must still remain.<\/p>"},{"n":323,"label":"CCCXXIII","verse":"<p>In these twin compasses, O Love, you see<\/p><p>One body with two heads, like you and me,<\/p><p>Which wander round one centre, circlewise.<\/p><p>But at the last in one same point agree.<\/p>"},{"n":324,"label":"CCCXXIV","verse":"<p>We shall not stay here long, but while we do,<\/p><p>&#x27;Tis folly wine and sweethearts to eschew;<\/p><p>Why ask if earth etern or transient be?<\/p><p>Since you must go, it matters not to you.<\/p>"},{"n":325,"label":"CCCXXV","verse":"<p>In reverent sort to mosque I wend my way,<\/p><p>But, by great Allah, it is not to pray;<\/p><p>No! but to steal a prayer-mat! When &#x27;tis worn,<\/p><p>I go again, another to purvey.<\/p>"},{"n":326,"label":"CCCXXVI","verse":"<p>No more let fate&#x27;s annoys our peace consume,<\/p><p>But let us rather rosy wine consume,<\/p><p>The world our murderer is, and wine its blood,<\/p><p>Shall we not then that murderer&#x27;s blood consume?<\/p>"},{"n":327,"label":"CCCXXVII","verse":"<p>For Thee I vow to cast repute away,<\/p><p>And, if I shrink, the penalty to pay;<\/p><p>Though life might satisfy Thy cruelty,<\/p><p>&#x27;Twere naught, I&#x27;ll bear it till the judgment-day!<\/p>"},{"n":328,"label":"CCCXXVIII","verse":"<p>In Being&#x27;s rondure do we stray belated,<\/p><p>Our pride of manhood humbled and abated;<\/p><p>Would we were gone! long since have we been wearied<\/p><p>With this world&#x27;s griefs, and with its pleasures sated.<\/p>"},{"n":329,"label":"CCCXXIX","verse":"<p>The world is false, so I&#x27;ll be false as well,<\/p><p>And with bright wine, and gladness ever dwell!<\/p><p>They say, &quot;May Allah grant thee penitence!&quot;<\/p><p>He grants it not, and, did he, I&#x27;d rebel!<\/p>"},{"n":330,"label":"CCCXXX","verse":"<p>When Death shall tread me down upon the plain,<\/p><p>And pluck my feathers, and my life-blood drain,<\/p><p>Then mould me to a cup, and fill with wine,<\/p><p>Haply its scent will make me breathe again.<\/p>"},{"n":331,"label":"CCCXXXI","verse":"<p>So far as this world&#x27;s dealings I have traced,<\/p><p>I find its favours shamefully misplaced;<\/p><p>Allah be praised! I see myself debarred<\/p><p>From all its boons, and wrongfully disgraced.<\/p>"},{"n":332,"label":"CCCXXXII","verse":"<p>&#x27;Tis dawn! my heart with wine I will recruit,<\/p><p>And dash to bits the glass of good repute;<\/p><p>My long-extending hopes I will renounce,<\/p><p>And grasp long tresses, and the charming lute.<\/p>"},{"n":333,"label":"CCCXXXIII","verse":"<p>Though I had sinned the sins of all mankind,<\/p><p>I know Thou would&#x27;st to mercy be inclined;<\/p><p>Thou sayest, &quot;I will help in time of need&quot;<\/p><p>One needier than I where wilt Thou find?<\/p>"},{"n":334,"label":"CCCXXXIV","verse":"<p>Am I a wine-bibber? What if I am?<\/p><p>Gueber or infidel? Suppose I am?<\/p><p>Each sect miscalls me, but I heed them not,<\/p><p>I am my own, and, what I am, I am.<\/p>"},{"n":335,"label":"CCCXXXV","verse":"<p>All my life long from drink I have not ceased,<\/p><p>And drink I will to-night on Kadr&#x27;s feast;<\/p><p>And throw my arms about the wine-jar&#x27;s neck,<\/p><p>And kiss its lip, and clasp it to my breast!<\/p>"},{"n":336,"label":"CCCXXXVI","verse":"<p>I know what is, and what is not, I know<\/p><p>The lore of things above, and things below;<\/p><p>But all this lore will cheerfully renounce,<\/p><p>If one a higher grade than drink can show.<\/p>"},{"n":337,"label":"CCCXXXVII","verse":"<p>Though I drink wine, I am no libertine,<\/p><p>Nor am I grasping, save of cups of wine;<\/p><p>I scruple to adore myself, like you;<\/p><p>For this cause to wine-worship I incline.<\/p>"},{"n":338,"label":"CCCXXXVIII","verse":"<p>To confidants like you I dare to say<\/p><p>What mankind really are--moulded of clay,<\/p><p>Affliction&#x27;s clay, and kneaded in distress,<\/p><p>They taste the world awhile, then pass away.<\/p>"},{"n":339,"label":"CCCXXXIX","verse":"<p>We make the wine-jar&#x27;s lip our place of prayer,<\/p><p>And drink in lessons of true manhood there,<\/p><p>And pass our lives in taverns, if perchance<\/p><p>The time mis-spent in mosques we may repair.<\/p>"},{"n":340,"label":"CCCXL","verse":"<p>Man is the whole creation&#x27;s summary,<\/p><p>The precious apple of great wisdom&#x27;s eye;<\/p><p>The circle of existence is a ring,<\/p><p>Whereof the signet is humanity.<\/p>"},{"n":341,"label":"CCCXLI","verse":"<p>With fancies, as with wine, our heads we turn,<\/p><p>Aspire to heaven, and earth&#x27;s low trammels spurn;<\/p><p>But, when we drop this fleshly clog, &#x27;tis seen<\/p><p>From dust we came, and back to dust return.<\/p>"},{"n":342,"label":"CCCXLII","verse":"<p>If so it be that I did break the fast,<\/p><p>Think not I meant it; no! I thought &#x27;twas past;--<\/p><p>That day more weary than a sleepless night,--<\/p><p>And blesséd breakfast-time had come at last!<\/p>"},{"n":343,"label":"CCCXLIII","verse":"<p>I never drank of joy&#x27;s sweet cordial,<\/p><p>But grief&#x27;s fell hand infused a drop of gall;<\/p><p>Nor dipped my bread in pleasure&#x27;s piquant salt,<\/p><p>But briny sorrow made me smart withal!<\/p>"},{"n":344,"label":"CCCXLIV","verse":"<p>At dawn to tavern haunts I wend my way,<\/p><p>And with distraught Kalendars pass the day;<\/p><p>O Thou! who know&#x27;st things secret, and things known,<\/p><p>Grant me Thy grace, that I may learn to pray!<\/p>"},{"n":345,"label":"CCCXLV","verse":"<p>The world&#x27;s annoys I rate not at one grain,<\/p><p>So I eat once a day I don&#x27;t complain;<\/p><p>And, since earth&#x27;s kitchen yields no solid food,<\/p><p>I pester no man with petitions vain.<\/p>"},{"n":346,"label":"CCCXLVI","verse":"<p>Never from worldly toils have I been free,<\/p><p>Never for one short moment glad to be!<\/p><p>I served a long apprenticeship to fate,<\/p><p>But yet of fortune gained no mastery.<\/p>"},{"n":347,"label":"CCCXLVII","verse":"<p>One hand with Koran, one with wine-cup dight,<\/p><p>I half incline to wrong, and half to right;<\/p><p>The azure-marbled sky looks down on me<\/p><p>A sorry Moslem, yet not heathen quite.<\/p>"},{"n":348,"label":"CCCXLVIII","verse":"<p>Khayyam&#x27;s respects to Mustafa convey,<\/p><p>And with due reverence ask him to say,<\/p><p>Why it has pleased him to forbid pure wine,<\/p><p>When he allows his people acid whey?<\/p>"},{"n":349,"label":"CCCXLIX","verse":"<p>Tell Khayyam, for a master of the schools,<\/p><p>He strangely misinterprets my plain rules:<\/p><p>Where have I said that wine is wrong for all?<\/p><p>&#x27;Tis lawful for the wise, but not for fools.<\/p>"},{"n":350,"label":"CCCL","verse":"<p>My critics call me a philosopher,<\/p><p>But Allah knows full well they greatly err;<\/p><p>I know not even what I am, much less<\/p><p>Why on this earth I am a sojourner!<\/p>"},{"n":351,"label":"CCCLI","verse":"<p>The more I die to self, I live the more,<\/p><p>The more abase myself, the higher soar;<\/p><p>And, strange! the more I drink of Being&#x27;s wine,<\/p><p>More sane I grow and sober than before.<\/p>"},{"n":352,"label":"CCCLII","verse":"<p>Quoth rose, &quot;I am the Yusuf flower, I swear,<\/p><p>For in my mouth rich golden gems I bear&quot;:<\/p><p>I said, &quot;Show me another proof.&quot; Quoth she,<\/p><p>&quot;Behold this blood-stained vesture that I wear!&quot;<\/p>"},{"n":353,"label":"CCCLIII","verse":"<p>I studied with the masters long ago,<\/p><p>And long ago did master all they know;<\/p><p>Here now the end and issue of it all,<\/p><p>From earth I came, and like the wind I go!<\/p>"},{"n":354,"label":"CCCLIV","verse":"<p>Death finds us soiled, though we were pure at birth,<\/p><p>With grief we go, although we came with mirth;<\/p><p>Watered with tears, and burned with fires of woe,<\/p><p>And, casting life to winds, we rest in earth!<\/p>"},{"n":355,"label":"CCCLV","verse":"<p>To find great Jamshid&#x27;s world-reflecting bowl<\/p><p>I compassed sea and land, and viewed the whole;<\/p><p>But, when I asked the wary sage, I learned<\/p><p>That bowl was my own body, and my soul!<\/p>"},{"n":356,"label":"CCCLVI","verse":"<p>Me, cruel Queen! you love to captivate,<\/p><p>And from a knight to a poor pawn translate,<\/p><p>You marshal all your force to tire me out,<\/p><p>You take my rooks with yours, and then checkmate!<\/p>"},{"n":357,"label":"CCCLVII","verse":"<p>If Allah wills me not to will aright,<\/p><p>How can I frame my will to will aright?<\/p><p>Each single act I will must needs be wrong,<\/p><p>Since none but He has power to will aright.<\/p>"},{"n":358,"label":"CCCLVIII","verse":"<p>&quot;For once, while roses are in bloom,&quot; I said,<\/p><p>&quot;I&#x27;ll break the law, and please myself instead,<\/p><p>With blooming youths, and maidens&#x27; tulip cheeks<\/p><p>The plain shall blossom like a tulip-bed.&quot;<\/p>"},{"n":359,"label":"CCCLIX","verse":"<p>Think not I am existent of myself,<\/p><p>Or walk this blood-stained pathway of myself;<\/p><p>This being is not I, it is of Him.<\/p><p>Pray what, and where, and whence is this &quot;myself&quot;?<\/p>"},{"n":360,"label":"CCCLX","verse":"<p>Endure this world without my wine I cannot!<\/p><p>Drag on life&#x27;s load without my cups I cannot!<\/p><p>I am the slave of that sweet moment, when<\/p><p>They say, &quot;Take one more goblet,&quot; and I cannot!<\/p>"},{"n":361,"label":"CCCLXI","verse":"<p>You, who both day and night the world pursue,<\/p><p>And thoughts of that dread day of doom eschew,<\/p><p>Bethink you of your latter end; be sure<\/p><p>As time has treated others, so &#x27;twill you!<\/p>"},{"n":362,"label":"CCCLXII","verse":"<p>O man, who art creation&#x27;s summary,<\/p><p>Getting and spending too much trouble thee!<\/p><p>Arise, and quaff the Etern Cupbearer&#x27;s wine,<\/p><p>And so from troubles of both worlds be free!<\/p>"},{"n":363,"label":"CCCLXIII","verse":"<p>In this eternally revolving zone,<\/p><p>Two lucky species of men are known;<\/p><p>One knows all good and ill that are on earth,<\/p><p>One neither earth&#x27;s affairs, nor yet his own.<\/p>"},{"n":364,"label":"CCCLXIV","verse":"<p>Make light to me the world&#x27;s oppressive weight,<\/p><p>And hide my failings from the people&#x27;s hate,<\/p><p>And grant me peace to-day, and on the morrow<\/p><p>Deal with me as Thy mercy may dictate!<\/p>"},{"n":365,"label":"CCCLXV","verse":"<p>Souls that are well informed of this world&#x27;s state,<\/p><p>Its weal and woe with equal mind await:<\/p><p>For, be it weal we meet, or be it woe,<\/p><p>The weal doth pass, and woe too hath its date.<\/p>"},{"n":366,"label":"CCCLXVI","verse":"<p>Lament not fortune&#x27;s want of constancy,<\/p><p>But up! and seize her favours ere they flee;<\/p><p>If fortune always cleaved to other men,<\/p><p>How could a turn of luck have come to thee?<\/p>"},{"n":367,"label":"CCCLXVII","verse":"<p>Chief of old friends! hearken to what I say,<\/p><p>Let not heaven&#x27;s treacherous wheel your heart dismay;<\/p><p>But rest contented in your humble nook,<\/p><p>And watch the games that wheel is wont to play.<\/p>"},{"n":368,"label":"CCCLXVIII","verse":"<p>Hear now Khayyam&#x27;s advice, and bear in mind,<\/p><p>Consort with revellers, though they be maligned,<\/p><p>Cast down the gates of abstinence and prayer,<\/p><p>Yea, drink, and even rob, but, oh! be kind!<\/p>"},{"n":369,"label":"CCCLXIX","verse":"<p>This world a body is, and God its soul,<\/p><p>And angels are its senses, who control<\/p><p>Its limbs--the creatures, elements, and spheres;<\/p><p>The ONE is the sole basis of the whole.<\/p>"},{"n":370,"label":"CCCLXX","verse":"<p>Last night that idol who enchants my heart,<\/p><p>With true desire to elevate my heart,<\/p><p>Gave me his cup to drink; when I refused,<\/p><p>He said, &quot;Oh, drink to gratify my heart!&quot;<\/p>"},{"n":371,"label":"CCCLXXI","verse":"<p>Would&#x27;st thou have fortune bow her neck to thee,<\/p><p>Make it thy care to feed thy soul with glee;<\/p><p>And hold a creed like mine, which is to drain<\/p><p>The cup of wine, not that of misery.<\/p>"},{"n":372,"label":"CCCLXXII","verse":"<p>Though you survey O my enlightened friend,<\/p><p>This world of vanity from end to end,<\/p><p>You will discover there no other good<\/p><p>Than wine and rosy cheeks, you may depend!<\/p>"},{"n":373,"label":"CCCLXXIII","verse":"<p>Last night upon the river bank we lay,<\/p><p>I with my wine-cup, and a maiden gay,<\/p><p>So bright it shone, like pearl within its shell,<\/p><p>The watchman cried, &quot;Behold the break of day!&quot;<\/p>"},{"n":374,"label":"CCCLXXIV","verse":"<p>Have you no shame for all the sins you do,<\/p><p>Sins of omission and commission too?<\/p><p>Suppose you gain the world, you can but leave it,<\/p><p>You cannot carry it away with you!<\/p>"},{"n":375,"label":"CCCLXXV","verse":"<p>In a lone waste I saw a debauchee,<\/p><p>He had no home, no faith, no heresy,<\/p><p>No God, no truth, no law, no certitude;<\/p><p>Where in this world is man so bold as he?<\/p>"},{"n":376,"label":"CCCLXXVI","verse":"<p>Some look for truth in creeds, and forms, and rules;<\/p><p>Some grope for doubts or dogmas in the schools;<\/p><p>But from behind the veil a voice proclaims,<\/p><p>&quot;Your road lies neither here nor there, O fools.&quot;<\/p>"},{"n":377,"label":"CCCLXXVII","verse":"<p>In heaven is seen the bull we name Parwin,<\/p><p>Beneath the earth another lurks unseen;<\/p><p>And thus to wisdom&#x27;s eyes mankind appear<\/p><p>A drove of asses, two great bulls between!<\/p>"},{"n":378,"label":"CCCLXXVIII","verse":"<p>The people say, &quot;Why not drink somewhat less?<\/p><p>What reasons have you for such great excess?&quot;<\/p><p>First, my Love&#x27;s face, second, my morning draught;<\/p><p>Can there be clearer reasons, now confess?<\/p>"},{"n":379,"label":"CCCLXXIX","verse":"<p>Had I the power great Allah to advise,<\/p><p>I&#x27;d bid him sweep away this earth and skies,<\/p><p>And build a better, where, unclogged and free,<\/p><p>The clear soul might achieve her high emprise.<\/p>"},{"n":380,"label":"CCCLXXX","verse":"<p>This silly sorrow-laden heart of mine<\/p><p>Is ever pining for that Love of mine;<\/p><p>When the Cupbearer poured the wine of love,<\/p><p>With my heart&#x27;s blood he filled this cup of mine!<\/p>"},{"n":381,"label":"CCCLXXXI","verse":"<p>To drain the cup, to hover round the fair,<\/p><p>Can hypocritic arts with these compare?<\/p><p>If all who love and drink are going wrong,<\/p><p>There&#x27;s many a wight of heaven may well despair!<\/p>"},{"n":382,"label":"CCCLXXXII","verse":"<p>&#x27;Tis wrong with gloomy thoughts your mirth to drown,--<\/p><p>To let grief&#x27;s millstone weigh your spirits down;<\/p><p>Since none can tell what is to be, &#x27;tis best<\/p><p>With wine and love your heart&#x27;s desires to crown.<\/p>"},{"n":383,"label":"CCCLXXXIII","verse":"<p>&#x27;Tis well in reputation to abide,<\/p><p>&#x27;Tis shameful against heaven to rail and chide;<\/p><p>Still, head had better ache with over drink,<\/p><p>Than be puffed up with Pharisaic pride!<\/p>"},{"n":384,"label":"CCCLXXXIV","verse":"<p>O Lord! pity this prisoned heart, I pray,<\/p><p>Pity this bosom stricken with dismay!<\/p><p>Pardon these hands that ever grasp the cup,<\/p><p>These feet that to the tavern ever stray!<\/p>"},{"n":385,"label":"CCCLXXXV","verse":"<p>O Lord! from self-conceit deliver me,<\/p><p>Sever from self, and occupy with Thee!<\/p><p>This self is captive to earth&#x27;s good and ill,<\/p><p>Make me beside myself, and set me free!<\/p>"},{"n":386,"label":"CCCLXXXVI","verse":"<p>Behold the tricks this wheeling dome doth play,<\/p><p>And earth laid bare of old friends torn away!<\/p><p>O live this present moment, which is thine,<\/p><p>Seek not a morrow, mourn not yesterday!<\/p>"},{"n":387,"label":"CCCLXXXVII","verse":"<p>Since all man&#x27;s business in this world of woe<\/p><p>Is sorrow&#x27;s pangs to feel, and grief to know,<\/p><p>Happy are they that never come at all,<\/p><p>And they that, having come, the soonest go!<\/p>"},{"n":388,"label":"CCCLXXXVIII","verse":"<p>By reason&#x27;s dictates it is right to live,<\/p><p>But of ourselves we know not how to live,<\/p><p>So Fortune, like a master, rod in hand,<\/p><p>Raps our pates well to teach us how to live!<\/p>"},{"n":389,"label":"CCCLXXXIX","verse":"<p>Nor you nor I can read the etern decree,<\/p><p>To that enigma we can find no key;<\/p><p>They talk of you and me _behind_ the veil,<\/p><p>But, if that veil be lifted, where are _we_?<\/p>"},{"n":390,"label":"CCCXC","verse":"<p>O Love, for ever doth heaven&#x27;s wheel design<\/p><p>To take away thy precious life, and mine;<\/p><p>Sit we upon this turf, &#x27;twill not be long<\/p><p>Ere turf shall grow upon my dust, and thine!<\/p>"},{"n":391,"label":"CCCXCI","verse":"<p>When life has fled, and we rest in the tomb,<\/p><p>They&#x27;ll place a pair of bricks to mark our tomb;<\/p><p>And, a while after, mould our dust to bricks,<\/p><p>To furnish forth some other person&#x27;s tomb!<\/p>"},{"n":392,"label":"CCCXCII","verse":"<p>Yon palace, towering to the welkin blue,<\/p><p>Where kings did bow them down, and homage do,<\/p><p>I saw a ringdove on its arches perched,<\/p><p>And thus she made complaint, &quot;Coo, Coo, Coo, Coo!&quot;<\/p>"},{"n":393,"label":"CCCXCIII","verse":"<p>We come and go, but for the gain, where is it?<\/p><p>And spin life&#x27;s woof, but for the warp, where is it?<\/p><p>And many a righteous man has burned to dust<\/p><p>In heaven&#x27;s blue rondure, but their smoke, where is it?<\/p>"},{"n":394,"label":"CCCXCIV","verse":"<p>Life&#x27;s well-spring lurks within that lip of thine!<\/p><p>Let not the cup&#x27;s lip touch that lip of thine!<\/p><p>Beshrew me, if I fail to drink his blood,<\/p><p>For who is he, to touch that lip of thine?<\/p>"},{"n":395,"label":"CCCXCV","verse":"<p>Such as I am, Thy power created me,<\/p><p>Thy care hath kept me for a century!<\/p><p>Through all these years I make experiment,<\/p><p>If my sins or Thy mercy greater be.<\/p>"},{"n":396,"label":"CCCXCVI","verse":"<p>&quot;Take up thy cup and goblet, Love,&quot; I said,<\/p><p>&quot;Haunt purling river bank, and grassy glade;<\/p><p>Full many a moon-like form has heaven&#x27;s weel<\/p><p>Oft into cup, oft into goblet, made!&quot;<\/p>"},{"n":397,"label":"CCCXCVII","verse":"<p>We buy new wine and old, our cups to fill,<\/p><p>And sell for two grains this world&#x27;s good and ill;<\/p><p>Know you where you will go to after death?<\/p><p>Set wine before me, and go where you will!<\/p>"},{"n":398,"label":"CCCXCVIII","verse":"<p>Was e&#x27;er man born who never went astray?<\/p><p>Did ever mortal pass a sinless day?<\/p><p>If I do ill, do not requite with ill!<\/p><p>Evil for evil how can&#x27;st Thou repay?<\/p>"},{"n":399,"label":"CCCXCIX","verse":"<p>Bring forth that ruby gem of Badakhshan,<\/p><p>That heart&#x27;s delight, that balm of Turkistan;<\/p><p>They say &#x27;tis wrong for Musulmen to drink,<\/p><p>But ah! where can we find a Musulman?<\/p>"},{"n":400,"label":"CD","verse":"<p>My body&#x27;s life and strength proceed from Thee!<\/p><p>My soul within and spirit are of Thee!<\/p><p>My being is of Thee, and Thou art mine,<\/p><p>And I am Thine, since I am lost in Thee!<\/p>"},{"n":401,"label":"CDI","verse":"<p>Man, like a ball, hither and thither goes,<\/p><p>As fate&#x27;s resistless bat directs the blows;<\/p><p>But He, who gives thee up to this rude sport,<\/p><p>He knows what drives thee, yea, He knows, He knows!<\/p>"},{"n":402,"label":"CDII","verse":"<p>O Thou who givest sight to emmet&#x27;s eyes,<\/p><p>And strength to puny limbs of feeble flies,<\/p><p>To Thee we will ascribe Almighty power,<\/p><p>And not base, unbecoming qualities.<\/p>"},{"n":403,"label":"CDIII","verse":"<p>Let not base avarice enslave thy mind,<\/p><p>Nor vain ambition in its trammels bind;<\/p><p>Be sharp as fire, as running water swift,<\/p><p>Not, like earth&#x27;s dust, the sport of every wind!<\/p>"},{"n":404,"label":"CDIV","verse":"<p>&#x27;Tis best all other blessings to forego<\/p><p>For wine, that charming Turki maids bestow;<\/p><p>Kalendars&#x27; raptures pass all things that are,<\/p><p>From moon on high down into fish below!<\/p>"},{"n":405,"label":"CDV","verse":"<p>Friend! trouble not yourself about your lot,<\/p><p>Let futile care and sorrow be forgot;<\/p><p>Since this life&#x27;s vesture crumbles into dust,<\/p><p>What matters stain of word or deed, or blot?<\/p>"},{"n":406,"label":"CDVI","verse":"<p>O thou who hast done ill, and ill alone,<\/p><p>And thinkest to find mercy at the throne,<\/p><p>Hope not for mercy! for good left undone<\/p><p>Cannot be done, nor evil done undone!<\/p>"},{"n":407,"label":"CDVII","verse":"<p>Count not to live beyond your sixtieth year,<\/p><p>To walk in jovial courses persevere;<\/p><p>And ere your skull be turned into a cup,<\/p><p>Let wine-cups ever to your hand adhere!<\/p>"},{"n":408,"label":"CDVIII","verse":"<p>These heavens resemble an inverted cup,<\/p><p>Whereto the wise with awe keep gazing up;<\/p><p>So stoops the bottle o&#x27;er his love, the cup,<\/p><p>Feigning to kiss, and gives her blood to sup!<\/p>"},{"n":409,"label":"CDIX","verse":"<p>I sweep the tavern threshold with my hair,<\/p><p>For both world&#x27;s good and ill I take no care;<\/p><p>Should the two worlds roll to my house, like balls,<\/p><p>When drunk, for one small coin I&#x27;d sell the pair!<\/p>"},{"n":410,"label":"CDX","verse":"<p>The drop wept for his severance from the sea,<\/p><p>But the sea smiled, for &quot;I am all,&quot; said he,<\/p><p>&quot;The Truth is all, nothing exists beside,<\/p><p>That one point circling apes plurality.&quot;<\/p>"},{"n":411,"label":"CDXI","verse":"<p>Shall I still sigh for what I have not got,<\/p><p>Or try with cheerfulness to bear my lot?<\/p><p>Fill up my cup! I know not if the breath<\/p><p>I now am drawing is my last, or not!<\/p>"},{"n":412,"label":"CDXII","verse":"<p>Yield not to grief, though fortune prove unkind,<\/p><p>Nor call sad thoughts of parted friends to mind;<\/p><p>Devote thy heart to sugary

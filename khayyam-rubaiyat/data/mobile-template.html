<!DOCTYPE html>
<html lang="en" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rubáiyát of Omar Khayyám — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;500&family=Noto+Naskh+Arabic:wght@400&display=swap" rel="stylesheet">
<style>
/* ===== THEMES =====
   Palette blocks are the Rubáiyát reader's, verbatim. Mobile adds only
   --sheet-bg for the bottom sheets. Default light-purple, per the house rule. */
:root {
  --font-serif: 'EB Garamond', Georgia, serif;
  --font-sans: 'Jost', -apple-system, Helvetica Neue, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-fa: 'Vazirmatn', 'Noto Naskh Arabic', 'EB Garamond', Georgia, serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text-secondary:#7a6a52;--border:#d4c8a8;--accent:#b45309;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(245,239,224,.94);--sheet-bg:#ede5d0}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(250,248,243,.94);--sheet-bg:#f2efe8}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn-bg:rgba(0,0,0,.06);--bar-bg:rgba(255,255,255,.92);--sheet-bg:#f5f5f5}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text-secondary:#8490aa;--border:#333;--accent:#9b7aed;--btn-bg:rgba(255,255,255,.08);--bar-bg:rgba(26,26,26,.95);--sheet-bg:#222}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text-secondary:#546080;--border:#1c2440;--accent:#2e6ab4;--btn-bg:rgba(255,255,255,.06);--bar-bg:rgba(0,0,0,.95);--sheet-bg:#0a0a0a}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-serif);
  height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
button{font-family:inherit;color:inherit}

/* ── Top bar ── */
#top-bar{
  position:fixed;top:0;left:0;right:0;height:48px;z-index:20;
  background:var(--bar-bg);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:6px;padding:0 8px;
  font-family:var(--font-sans);
}
.bar-btn{
  width:40px;height:40px;flex:0 0 auto;border:none;background:transparent;
  color:var(--text-secondary);border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.bar-btn:active{background:var(--btn-bg)}
.bar-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#ed-label{
  flex:1 1 auto;min-width:0;text-align:center;font-family:var(--font-sans);
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── Stage ── */
#pager{position:absolute;top:48px;bottom:52px;left:0;right:0;overflow:hidden}
#slide{
  height:100%;overflow-y:auto;padding:28px 22px 40px;
  display:flex;flex-direction:column;justify-content:center;
  transition:opacity .18s ease;
}
#slide.fading{opacity:0}
.q-num{
  font-family:var(--font-mono);font-size:11px;letter-spacing:2px;
  color:var(--accent);text-align:center;margin-bottom:6px;
}
.q-ord{
  font-family:var(--font-serif);font-size:34px;color:var(--accent);
  text-align:center;line-height:1;opacity:.85;margin-bottom:18px;
}
.q-verse{font-size:19px;line-height:2.0;text-align:left}
.q-verse p{margin:0}
.q-verse p.indent{padding-left:1.6em}
[dir="rtl"] .q-verse,.q-verse[dir="rtl"]{text-align:right;font-family:var(--font-fa);line-height:2.2}
.q-translit{
  direction:ltr;text-align:right;font-family:var(--font-mono);
  font-size:12px;line-height:1.9;color:var(--text-secondary);opacity:.75;margin-top:2px;
}
.q-gloss{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--border);
  font-size:15px;line-height:1.75;color:var(--text-secondary);
}
.q-gloss h4{
  font-family:var(--font-sans);font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600;
}
.q-gloss p{margin:0 0 8px}

/* ── Bottom bar ── */
#bottom-bar{
  position:fixed;bottom:0;left:0;right:0;height:52px;z-index:20;
  background:var(--bar-bg);border-top:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:0 8px;padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:var(--font-sans);
}
#pos{
  font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;min-width:66px;text-align:center;
}
#progress{position:fixed;top:48px;left:0;height:2px;background:var(--accent);z-index:19;transition:width .2s}

/* ── Bottom sheets ── */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  background:var(--sheet-bg);border-top:1px solid var(--border);
  border-radius:14px 14px 0 0;padding:8px 0 calc(14px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s ease;
  max-height:72dvh;overflow-y:auto;font-family:var(--font-sans);
}
.sheet.open{transform:translateY(0)}
.sheet h2{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;
  color:var(--text-secondary);padding:10px 20px 8px;
}
.sheet-row{
  display:block;width:100%;text-align:left;background:none;border:none;
  padding:13px 20px;font-size:15px;cursor:pointer;min-height:44px;
  border-bottom:1px solid var(--border);
}
.sheet-row:last-child{border-bottom:none}
.sheet-row:active{background:var(--btn-bg)}
.sheet-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheet-row.active{color:var(--accent);font-weight:500}
.sheet-row .sub{
  display:block;font-family:var(--font-mono);font-size:10px;
  color:var(--text-secondary);letter-spacing:.5px;margin-top:2px;
}
#theme-row{display:flex;gap:14px;padding:14px 20px;flex-wrap:wrap}
.theme-dot{
  width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
  cursor:pointer;padding:0;position:relative;flex:0 0 auto;
}
.theme-dot::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.theme-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dot.active{box-shadow:0 0 0 2px var(--sheet-bg),0 0 0 4px var(--accent)}
.theme-dot[data-theme="sepia"]{background:#d4c8a8}
.theme-dot[data-theme="light-purple"]{background:#c9b8e8}
.theme-dot[data-theme="light-azure"]{background:#d4e8f7}
.theme-dot[data-theme="dark-violet"]{background:#4a3a6a}
.theme-dot[data-theme="dark-blue"]{background:#1e2a4a}

@media (prefers-reduced-motion: reduce){
  #slide,.sheet,.sheet-backdrop,#progress{transition:none}
}
</style>
</head>
<body>

<div id="progress" style="width:0"></div>

<nav id="top-bar">
  <button class="bar-btn" id="ed-btn" aria-label="Choose edition" aria-haspopup="dialog">☰</button>
  <span id="ed-label"></span>
  <button class="bar-btn" id="theme-btn" aria-label="Choose theme" aria-haspopup="dialog">◐</button>
</nav>

<main id="pager">
  <div id="slide" aria-live="polite"></div>
</main>

<nav id="bottom-bar">
  <button class="bar-btn" id="prev" aria-label="Previous quatrain">←</button>
  <button class="bar-btn" id="jump-btn" aria-label="Jump to quatrain" aria-haspopup="dialog">⋯</button>
  <span id="pos"></span>
  <button class="bar-btn" id="next" aria-label="Next quatrain">→</button>
</nav>

<div class="sheet-backdrop" id="backdrop"></div>

<div class="sheet" id="ed-sheet" role="dialog" aria-modal="true" aria-label="Choose edition" aria-hidden="true">
  <h2>Edition</h2>
  <div id="ed-list"></div>
</div>

<div class="sheet" id="theme-sheet" role="dialog" aria-modal="true" aria-label="Choose theme" aria-hidden="true">
  <h2>Theme</h2>
  <div id="theme-row"></div>
</div>

<div class="sheet" id="jump-sheet" role="dialog" aria-modal="true" aria-label="Jump to quatrain" aria-hidden="true">
  <h2>Jump to</h2>
  <div id="jump-list"></div>
</div>

<script>
const DATA = __DATA__;
const PREFS_KEY = 'rubaiyat-mobile-prefs';
const THEMES = {sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};

let edition = DATA.default;
let idx = 0;

const $ = id => document.getElementById(id);
const cur = () => DATA.editions[edition];
const list = () => cur().quatrains;

/* ── Prefs (theme + edition only; position lives in the hash) ── */
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify({
    theme: document.documentElement.dataset.theme, edition
  })); }catch(e){}
}
function loadPrefs(){
  let p = null;
  try{ p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); }catch(e){}
  if(!p) return;
  if(p.theme && THEMES[p.theme]) document.documentElement.dataset.theme = p.theme;
  if(p.edition && DATA.editions[p.edition]) edition = p.edition;
}

/* ── Hash: #q-<edition>-N, the same deep-link form the reader parses ── */
function writeHash(){
  history.replaceState(null,'','#q-'+edition+'-'+list()[idx].n);
}
function readHash(){
  const m = location.hash.match(/^#q-([a-z]+)-(\d+)$/);
  if(!m) return false;
  const [,ed,n] = m;
  if(!DATA.editions[ed]) return false;
  const i = DATA.editions[ed].quatrains.findIndex(q => q.n === parseInt(n,10));
  if(i < 0) return false;
  edition = ed; idx = i;
  return true;
}

/* ── Render ── */
function render(){
  const q = list()[idx];
  const rtl = edition === 'persian';
  const slide = $('slide');
  slide.classList.add('fading');
  setTimeout(() => {
    let html = '<div class="q-num">' + cur().short + ' &middot; ' + q.n + '</div>';
    html += '<div class="q-ord">' + q.label + '</div>';
    html += '<div class="q-verse"' + (rtl ? ' dir="rtl" lang="fa"' : '') + '>' + q.verse + '</div>';
    if(q.gloss) html += '<div class="q-gloss">' + q.gloss + '</div>';
    slide.innerHTML = html;
    slide.scrollTop = 0;
    slide.classList.remove('fading');
  }, 120);

  $('ed-label').textContent = cur().plain;
  $('pos').textContent = (idx+1) + ' / ' + list().length;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === list().length - 1;
  $('progress').style.width = ((idx+1)/list().length*100) + '%';
  writeHash();
}

function go(d){
  const n = idx + d;
  if(n < 0 || n >= list().length) return;
  idx = n; render();
}
function setEdition(ed){
  if(!DATA.editions[ed]) return;
  edition = ed; idx = 0;
  buildJump(); render(); savePrefs();
}

/* ── Sheets, with a focus trap (the pattern gibran-prophet/mobile.html uses) ── */
let openSheet = null, lastFocus = null;
function sheetOpen(id){
  closeSheet();
  const s = $(id);
  openSheet = s; lastFocus = document.activeElement;
  s.classList.add('open'); s.setAttribute('aria-hidden','false');
  $('backdrop').classList.add('open');
  const first = s.querySelector('button');
  if(first) first.focus();
}
function closeSheet(){
  if(!openSheet) return;
  openSheet.classList.remove('open');
  openSheet.setAttribute('aria-hidden','true');
  $('backdrop').classList.remove('open');
  openSheet = null;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && openSheet){ closeSheet(); return; }
  if(openSheet && e.key === 'Tab'){
    const f = [...openSheet.querySelectorAll('button')].filter(b => b.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    return;
  }
  if(openSheet) return;
  if(e.key === 'ArrowRight' || e.key === 'j' || e.key === ' ') { e.preventDefault(); go(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); go(-1); }
});

/* ── Build sheet contents ── */
function buildEditions(){
  const wrap = $('ed-list'); wrap.innerHTML = '';
  DATA.order.forEach(k => {
    const m = DATA.editions[k];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheet-row' + (k === edition ? ' active' : '');
    b.innerHTML = m.plain + '<span class="sub">' + m.year + ' &middot; ' + m.count + ' ' + m.unit + '</span>';
    b.addEventListener('click', () => { setEdition(k); buildEditions(); closeSheet(); });
    wrap.appendChild(b);
  });
}
function buildThemes(){
  const wrap = $('theme-row'); wrap.innerHTML = '';
  Object.keys(THEMES).forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-dot' + (document.documentElement.dataset.theme === t ? ' active' : '');
    b.dataset.theme = t;
    b.setAttribute('aria-label', THEMES[t] + ' theme');
    b.addEventListener('click', () => {
      document.documentElement.dataset.theme = t;
      buildThemes(); savePrefs(); closeSheet();
    });
    wrap.appendChild(b);
  });
}
function buildJump(){
  const wrap = $('jump-list'); wrap.innerHTML = '';
  const size = DATA.groupSize || 10, total = list().length;
  for(let s = 0; s < total; s += size){
    const e = Math.min(s + size, total);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheet-row';
    b.textContent = list()[s].label + ' – ' + list()[e-1].label;
    b.setAttribute('aria-label', 'Quatrains ' + list()[s].n + ' to ' + list()[e-1].n);
    b.addEventListener('click', () => { idx = s; render(); closeSheet(); });
    wrap.appendChild(b);
  }
}

/* ── Wiring ── */
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('ed-btn').addEventListener('click', () => sheetOpen('ed-sheet'));
$('theme-btn').addEventListener('click', () => sheetOpen('theme-sheet'));
$('jump-btn').addEventListener('click', () => sheetOpen('jump-sheet'));
$('backdrop').addEventListener('click', closeSheet);

let tx = 0, ty = 0;
$('pager').addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
$('pager').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('hashchange', () => { if(readHash()) render(); });

/* ── Init: hash wins over prefs, per the house rule ── */
loadPrefs();
readHash();
buildEditions(); buildThemes(); buildJump();
render();
</script>
</body>
</html>

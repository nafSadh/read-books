<!DOCTYPE html>
<html lang="en" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="The Odyssey of Homer — an illustrated edition of the modern prose translation, read one plate at a time.">
<title>The Odyssey — Illustrated — Homer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* --bg: backdrop behind the panel · --ink: panel border/linework
   --paper: caption/paper fill · --ptext: caption text · --halftone: dot-texture
   --accent: UI accent */
[data-theme="light-purple"] {
  --bg: #120e1c; --ink: #1c1626; --paper: #faf3e4; --ptext: #241c30; --accent: #b599ff;
  --halftone: rgba(124,58,237,.10); --bar-bg: rgba(18,14,28,0.92); --bar-text: #b9aee0;
}
[data-theme="sepia"] {
  --bg: #1e150a; --ink: #241708; --paper: #f7ecd2; --ptext: #2b1d0e; --accent: #e0a15c;
  --halftone: rgba(180,83,9,.12); --bar-bg: rgba(30,21,10,0.92); --bar-text: #cdb794;
}
[data-theme="light-azure"] {
  --bg: #2b323c; --ink: #12161c; --paper: #ffffff; --ptext: #171d26; --accent: #7fb2ea;
  --halftone: rgba(46,106,180,.10); --bar-bg: rgba(30,36,44,0.92); --bar-text: #b8c4d4;
}
[data-theme="dark-violet"] {
  --bg: #0a0a0a; --ink: #e7defc; --paper: #241f30; --ptext: #e9e4f5; --accent: #9b7aed;
  --halftone: rgba(155,122,237,.10); --bar-bg: rgba(10,10,10,0.95); --bar-text: #8490aa;
}
[data-theme="dark-blue"] {
  --bg: #000000; --ink: #9fd0ff; --paper: #0a121e; --ptext: #cfe0f5; --accent: #4a90d9;
  --halftone: rgba(74,144,217,.10); --bar-bg: rgba(0,0,0,0.95); --bar-text: #546080;
}

/* height:100% (not 100vh/100dvh) is deliberate and load-bearing: 100vh
   resolves to the LARGE viewport on iOS Safari and would push the bottom bar
   under the URL bar, and 100dvh would resize the reader — and therefore
   repaginate it — every time the browser chrome slides. Do not "fix" this.
   overscroll-behavior stops Chrome for Android turning a slightly-downward
   page-swipe into pull-to-refresh, which reloads the book. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  font-family: 'EB Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased; transition: background .35s;
  display: flex; flex-direction: column;
}
@media (prefers-reduced-motion: reduce) { *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important} }

/* ONE bar, on every screen size, at the bottom — desktop had the same disease
   mobile did: two bars (82px) whose controls duplicated each other, plus 46px
   of stage padding, spent on chrome you glance at once a session. The bar
   pads itself out of the display cutouts (viewport-fit=cover extends layout
   under the notch/home indicator; without env() insets the back link sat
   under the camera in landscape and the buttons inside the home-swipe strip).
   On desktop it stays dark — the desk the book lies on; narrow re-skins it
   as the page's own running foot. */
#top-bar {
  order: 3;
  height: calc(44px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0; z-index: 50;
  background: var(--bar-bg); border-top: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; gap: 14px;
  padding: 0 calc(16px + env(safe-area-inset-right, 0px))
           env(safe-area-inset-bottom, 0px) calc(16px + env(safe-area-inset-left, 0px));
  font-family: 'Jost', sans-serif; font-size: 12px; color: var(--bar-text);
}
/* Stretch the back link to the bar height. As a bare inline <a> it was a
   17.5px-tall target with 12px of dead bar above and below — and it is the
   only route out of the reader. The negative inline margin cancels the
   padding so the text stays optically flush with the bar edge. */
#top-bar a {
  color: var(--bar-text); text-decoration: none; letter-spacing: 1px; white-space: nowrap;
  display: inline-flex; align-items: center; align-self: stretch;
  padding-inline: 8px; margin-inline: -8px;
}
/* Gated on a real pointer: on touch, :hover latches after a tap and the
   control stays lit until you tap somewhere else. */
@media (hover: hover) { #top-bar a:hover { color: #fff; } }
#book-select {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--bar-text);
  background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 3px 6px;
}
#book-select option { color: #222; }
.tb-mark { opacity: .6; letter-spacing: 1.5px; text-transform: uppercase; font-size: 11px; font-family: 'Jost', sans-serif; white-space: nowrap; }
.tb-gap { flex: 1; }
.foot-title, #theme-cycle { display: none; }   /* narrow only */
/* page turners live in the bar on every size — Prev/Next Book went with the
   second bar (they duplicated the book picker) */
.pg-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex-shrink: 0;
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1;
  color: var(--bar-text);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pg-arrow:disabled { opacity: .22; cursor: default; }
@media (hover: hover) { .pg-arrow:hover:not(:disabled) { color: #fff; } }
#il-label { min-width: 5em; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
#bottom-bar { display: none; }
.theme-dots { display: flex; gap: 2px; align-items: center; }
/* The dot you see is 12px, but the button is 28px: a 12x12 target is half the
   WCAG 2.5.8 minimum, and these five were the controls a night reader most
   wants. The swatch is drawn with a background-clip'd content box so the
   visual weight in the bar is unchanged. */
.theme-dot {
  width: 28px; height: 28px; padding: 8px; box-sizing: border-box;
  border: none; background-clip: content-box; border-radius: 50%;
  cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent;
}
.theme-dot.active { box-shadow: inset 0 0 0 2px var(--accent); }
.theme-dot[data-t="light-purple"] { background: #7c3aed; }
.theme-dot[data-t="sepia"] { background: #b45309; }
.theme-dot[data-t="light-azure"] { background: #2e6ab4; }
.theme-dot[data-t="dark-violet"] { background: #9b7aed; }
.theme-dot[data-t="dark-blue"] { background: #4a90d9; }

#stage {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
  /* was 26/20 vertical — with the top bar gone the book gets that height
     back; 12px is enough desk to read the panel as floating */
  padding: 12px 60px 12px;
}
/* The panel: art on top (true aspect, uncropped in the common case),
   caption band on paper *below* the art — no text over the artwork. */
#panel {
  display: flex; flex-direction: column;
  max-height: 100%; overflow: hidden;
  background: var(--paper); border-radius: 1px;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
}
/* side-by-side: plate on one side, the text column set beside it */
#panel.beside { flex-direction: row; align-items: stretch; }
/* full-bleed beat page: art alone, edge to edge */
#panel.full #art-wrap { margin: 0; box-shadow: none; }
#panel.beside #art-wrap { flex: none; margin: 22px 0 22px 22px; }
#panel.beside #cap-wrap, #panel-probe.beside #cap-probe {
  flex: 1; margin-top: 0; padding: 46px 46px 40px;
  display: flex; align-items: flex-start; min-width: 0;
}
#panel.beside .caption-box { width: 100%; }
#art-wrap {
  position: relative; flex: none; overflow: hidden; background: var(--ink);
  box-shadow: 0 0 0 1px rgba(0,0,0,.28);   /* hairline frame, not a sticker shadow */
}
#panel:not(.beside):not(.full) #art-wrap { margin: 22px 22px 0; }
#art-wrap img { display: block; width: 100%; height: 100%; object-fit: cover; }
.no-art-tex {
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, var(--halftone) 0, var(--halftone) 2px, transparent 2px, transparent 10px);
  background-color: color-mix(in srgb, var(--ink) 88%, var(--bg));
}


/* caption band: paper gutter under the art; box straddles the art edge a little */
#cap-wrap, #cap-probe { flex: none; position: relative; z-index: 3; padding: 26px 40px 34px; margin-top: 0; }
/* top-aligned: with a fixed trim page, a short final page reads from the top
   of the paper like a book's last page, not floated in its middle */
#cap-wrap.plateless, #cap-probe.plateless { margin-top: 0; padding: 54px 46px; flex: 1; display: flex; align-items: flex-start; justify-content: center; }
/* the probe only ever has its paddings read; keep it out of layout and a11y */
#pad-probe { position: absolute; left: -9999px; top: 0; width: 600px; visibility: hidden; pointer-events: none; }
.caption-box {
  color: var(--ptext);
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 19.5px; line-height: 1.72; letter-spacing: .1px;
  /* the trim box is fixed, so wide pages must cap the measure themselves and
     centre it — geom()'s textW mirrors this 620 exactly for the probe */
  max-width: 620px; margin-left: auto; margin-right: auto;
}
.caption-box.big { width: min(620px, 92%); }
.caption-box p { margin: 0 0 .9em; text-indent: 1.3em; text-align: justify; -webkit-hyphens: auto; hyphens: auto; }
.caption-box p:first-child { text-indent: 0; }
.caption-box p:last-child { margin-bottom: 0; }
/* opening page of a book: a restrained drop cap, as a set book would have */
.caption-box.opens p:first-child::first-letter {
  float: left; font-size: 3.05em; line-height: .86;
  padding: .04em .09em 0 0; color: var(--ptext); font-weight: 500;
}
/* Page turns should read as a page moving, not a crossfade: text comes in from
   the side you turned from, with a soft leading edge. Direction-aware so
   flipping back feels like flipping back. */
.cap-anim { animation: capIn .22s cubic-bezier(.22,.61,.36,1); }
.cap-anim.back { animation-name: capBack; }
@keyframes capIn   { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes capBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
/* the paper itself gets a brief lift as it settles, like a leaf laid down */
#panel.turning { animation: pageSettle .22s ease-out; }
@keyframes pageSettle { from { transform: scale(.994); } to { transform: none; } }

/* splash / book-title page (full-art panel, overlay text) */
.cover-page { --scrim: linear-gradient(to bottom, rgba(10,8,14,.12) 0%, rgba(10,8,14,.52) 45%, rgba(10,8,14,.72) 100%); }
/* Book title page: a typographic page in the book's own paper — grand numeral,
   hairline rule, and the book's plates as a loose fan of small tiles, like
   prints laid on the page. The old design blew the first scene plate up as a
   backdrop, which read as a wallpaper, spoiled the plate before its scene,
   and printed the plate count (production metadata). A book with no art
   simply gets the pure-text page: the tiles row is empty. */
.title-page {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 40px 30px; color: var(--ptext);
}
.tp-over { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 7px; text-transform: uppercase; opacity: .55; }
.tp-roman { font-family: 'EB Garamond', Georgia, serif; font-weight: 500; font-size: min(150px, 20vh); line-height: 1.05; margin: 14px 0 20px; }
.tp-rule { width: 64px; height: 1px; background: var(--ptext); opacity: .35; }
.tp-tiles { display: flex; margin-top: 40px; }
.tp-tiles img {
  width: 96px; height: 96px; object-fit: cover; background: var(--paper);
  box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 3px 10px rgba(0,0,0,.18);
  transform: rotate(var(--r)) translateY(var(--y));
  margin-left: -14px;
}
.tp-tiles img:first-child { margin-left: 0; }

.cover-page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 3; gap: 6px; padding: 20px; background: var(--scrim); }
.cover-page .cv-title { font-family: 'EB Garamond', Georgia, serif; font-size: 54px; font-weight: 500; color: #f7f0e4; text-shadow: 0 2px 20px rgba(0,0,0,.8); }
.cover-page .cv-title em { font-style: italic; }
.cover-page .cv-sub { font-family: 'Jost', sans-serif; font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; color: rgba(247,240,228,.9); margin-top: 14px; text-shadow: 0 1px 8px rgba(0,0,0,.75); }
.cover-page .cv-credit { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 13px; letter-spacing: .5px; color: rgba(247,240,228,.75); margin-top: 10px; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.cover-page .cv-hint { font-family: 'Jost', sans-serif; font-size: 11px; color: rgba(247,240,228,.7); margin-top: 26px; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.cover-page .cv-hint kbd { font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--paper); border-radius: 3px; padding: 1px 5px; font-size: 10px; }

/* Tap-to-turn strips. Inset from the screen edge on purpose: flush against it
   they sat inside the OS back-gesture / edge-swipe zones, and they cleared the
   justified text by only 3.6px so the first and last word of every line was
   unselectable. touch-action keeps double-tap-to-zoom from eating a fast
   double page-turn; the tap highlight is suppressed because a full-height grey
   flash on every turn is not a page-turn affordance. */
#hit-left, #hit-right {
  position: fixed; z-index: 40; cursor: pointer;
  width: 8vw; max-width: 64px;
  top: env(safe-area-inset-top, 0px);
  bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#hit-left  { left:  calc(22px + env(safe-area-inset-left, 0px)); }
#hit-right { right: calc(22px + env(safe-area-inset-right, 0px)); }

/* retired: everything it held lives in the single bar now; markup kept so the
   render() writes to #pos-label and the book buttons stay harmless */
#bottom-bar { display: none; }
.bb-btn {
  font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  background: none; border: none; color: var(--bar-text); cursor: pointer; padding: 6px 10px;
  white-space: nowrap;                 /* both labels wrapped and clipped at 390px */
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .bb-btn:hover { color: #fff; } }
.bb-btn:disabled { opacity: .25; cursor: default; }
#pos-label { white-space: nowrap; }
/* rides the top edge of the single bar */
#progress { position: fixed; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); left: 0; height: 2px; background: var(--accent); transition: width .25s ease; z-index: 60; }

/* Height-aware as well as width-aware: a landscape phone is 844-956px wide but
   only ~390 tall, and the desktop 60px side gutters plus the tall paddings do
   not fit it. */
@media (max-width: 640px), (max-height: 560px) {
  #stage { padding: 10px calc(8px + env(safe-area-inset-left, 0px))
                   10px calc(8px + env(safe-area-inset-right, 0px)); }
  #cap-wrap, #cap-probe { padding: 20px 20px 22px; }
  #cap-wrap.plateless, #cap-probe.plateless { padding: 28px 22px; }
  /* EB Garamond's x-height is ~0.44em, so 17px read a size smaller than the
     phone's own body text. 18px costs ~10% more page-turns (1270 vs 1154 at
     390x844) and is the trade this edition should take; drop to 17.5 if turns
     matter more than legibility. */
  .caption-box { font-size: 18px; line-height: 1.62; }
  /* Justification needs ~65 characters to behave. At a 45-character phone
     measure it stretched word spaces to 2.9x natural and opened rivers, and
     the hyphens:auto that would have relieved it is inert in Safari without
     the prefix. Ragged-right is the normal setting for a narrow printed
     column and costs the register nothing. */
  .caption-box p { text-align: left; }
  .tp-roman { font-size: min(96px, 14vh); }
  .tp-tiles img { width: 68px; height: 68px; margin-left: -10px; }
  .cover-page .cv-title { font-size: 34px; }

  /* The bar wanted 468px of content in a 390px phone, so all five theme dots
     — the whole point of which is night reading — were pushed off-screen with
     no way to scroll to them. Drop the word-mark and one spacer, tighten the
     gaps, and the row fits with room to spare. */
  /* Edge to edge: no stage gutter, no panel inset, no art margin. The paper is
     the page. Keeps only the safe-area insets. */
  #stage { padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
  #panel.fill {
    height: 100%; border-radius: 0; box-shadow: none;
  }
  #panel.fill #cap-wrap { flex: 1; }     /* paper runs to the bottom bar */
  #panel:not(.beside):not(.full) #art-wrap { margin: 0; }

  /* ONE bar in reading mode, at the bottom where the thumb is — and it is the
     book's running foot, not app chrome: same paper, same ink, same face, a
     hairline rule above it exactly as a printed foot has. There is no seam
     between the page and the bar because there is no bar, only the foot of
     the page. Two bars cost 82px of an 844px screen, and Prev/Next Book
     duplicated the book picker. */
  #top-bar {
    order: 3; gap: 4px;
    background: var(--paper); color: var(--ptext);
    border-bottom: none; border-top: 1px solid color-mix(in srgb, var(--ptext) 18%, transparent);
    font-family: 'EB Garamond', Georgia, serif;
    height: calc(44px + env(safe-area-inset-bottom, 0px));
    padding: 0 calc(12px + env(safe-area-inset-right, 0px))
             env(safe-area-inset-bottom, 0px) calc(12px + env(safe-area-inset-left, 0px));
  }
  #bottom-bar { display: none; }
  .tb-mark, .tb-back, .tb-gap:first-of-type, .theme-dots { display: none; }

  /* the title, as a running foot carries it */
  .foot-title {
    display: block; flex-shrink: 0;
    font-family: 'EB Garamond', Georgia, serif; font-style: italic;
    font-size: 13px; letter-spacing: .3px;
    color: color-mix(in srgb, var(--ptext) 62%, transparent);
    white-space: nowrap;
  }
  #il-label {
    flex-shrink: 0; font-family: 'EB Garamond', Georgia, serif;
    font-size: 13px; letter-spacing: .2px;
    color: color-mix(in srgb, var(--ptext) 70%, transparent);
    min-width: 4.5em; text-align: center;
  }
  /* page turners, set as printed marks rather than buttons */
  .pg-arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex-shrink: 0;
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1;
    color: color-mix(in srgb, var(--ptext) 72%, transparent);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .pg-arrow:disabled { opacity: .22; cursor: default; }
  .pg-arrow:active { color: var(--ptext); }

  /* quiet enough to read as a printed folio mark, not a form control */
  #book-select {
    max-width: 74px; flex-shrink: 0;
    font-family: 'EB Garamond', Georgia, serif; font-size: 15px;
    color: var(--ptext); background: transparent;
    border: none; border-radius: 0; padding: 2px 0;
    appearance: none; -webkit-appearance: none; text-align: center;
  }
  #book-select option { color: #222; }

  #theme-cycle {
    display: block; width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 50%; padding: 5px; box-sizing: border-box;
    background-clip: content-box; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--ptext) 22%, transparent);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #progress { bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
  /* stage is now the top element; hit strips run from its top edge */
  #hit-left, #hit-right {
    top: env(safe-area-inset-top, 0px);
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  }
  /* 16px exactly: below it, iOS Safari zooms the layout on focus, and in a
     non-scrolling flip-book the reader is left on an off-centre crop with no
     way back but a pinch. */
  #book-select { font-size: 16px; padding: 5px 6px; }

  #bottom-bar { gap: 12px; padding-left: calc(8px + env(safe-area-inset-left, 0px));
                           padding-right: calc(8px + env(safe-area-inset-right, 0px)); }
  .bb-btn { font-size: 10px; letter-spacing: .5px; padding: 8px 6px; }
  #pos-label { font-size: 10px; }
}
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<nav id="top-bar">
  <a href="index.html">&larr;<span class="tb-back">&nbsp;Odyssey</span></a>
  <span class="tb-mark">Illustrated</span>
  <span class="foot-title">The Odyssey</span>
  <select id="book-select" aria-label="Go to book"></select>
  <span class="tb-gap"></span>
  <button class="pg-arrow" id="pg-prev" aria-label="Previous page">&lsaquo;</button>
  <span id="il-label"></span>
  <button class="pg-arrow" id="pg-next" aria-label="Next page">&rsaquo;</button>
  <span class="tb-gap"></span>
  <div class="theme-dots" role="group" aria-label="Theme">
    <button class="theme-dot active" data-t="light-purple" aria-pressed="true"  aria-label="Light purple theme"></button>
    <button class="theme-dot" data-t="sepia"        aria-pressed="false" aria-label="Sepia theme"></button>
    <button class="theme-dot" data-t="light-azure"  aria-pressed="false" aria-label="Light azure theme"></button>
    <button class="theme-dot" data-t="dark-violet"  aria-pressed="false" aria-label="Dark violet theme"></button>
    <button class="theme-dot" data-t="dark-blue"    aria-pressed="false" aria-label="Dark blue theme"></button>
  </div>
  <!-- narrow only: the five swatches collapse to one that shows the current
       theme and cycles on tap — five 24px targets was most of the bar -->
  <button id="theme-cycle" aria-label="Change theme"></button>
</nav>

<!-- Permanent off-screen twin of panel > cap-wrap. measurePads() reads the
     caption paddings off THIS, so they are always available — the live
     #cap-wrap does not exist on the first pagination or on any cover/splash
     page, and the hardcoded fallback it used instead was desktop-only. -->
<div id="pad-probe" aria-hidden="true"><div id="panel-probe"><div id="cap-probe"></div></div></div>

<div id="stage">
  <div id="panel"><!-- rendered by JS --></div>
</div>
<div id="hit-left" title="Previous page"></div>
<div id="hit-right" title="Next page"></div>

<div id="bottom-bar">
  <button class="bb-btn" id="prev-book">&#8592; Prev Book</button>
  <span id="pos-label">&nbsp;</span>
  <button class="bb-btn" id="next-book">Next Book &#8594;</button>
</div>
<div id="progress"></div>

<script>
const DATA = __IDATA__;
</script>
<script>
(function () {
  const KEY = 'odyssey-illustrated-prefs';
  const DEFAULT_R = 1.79;      /* landscape plates are 2752x1536 */
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} }

  const stageEl = document.getElementById('stage');
  const panelEl = document.getElementById('panel');
  const posLabel = document.getElementById('pos-label');
  const ilLabel = document.getElementById('il-label');
  const progress = document.getElementById('progress');
  const bookSel = document.getElementById('book-select');
  const prevBookBtn = document.getElementById('prev-book');
  const nextBookBtn = document.getElementById('next-book');
  const pgPrev = document.getElementById('pg-prev');
  const pgNext = document.getElementById('pg-next');

  const dots = document.querySelectorAll('.theme-dot');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    /* the ring is the only visual state; mirror it for screen readers, which
       otherwise announce five identically-named buttons and no current value */
    dots.forEach(d => {
      const on = d.dataset.t === t;
      d.classList.toggle('active', on);
      d.setAttribute('aria-pressed', String(on));
    });
    paintCycle(t);
    prefs.theme = t; save();
  }
  dots.forEach(d => d.addEventListener('click', () => setTheme(d.dataset.t)));

  /* Narrow: one swatch instead of five. It wears the CURRENT theme's colour,
     so it reads as state rather than as a menu, and cycles on tap. */
  const themeOrder = [...dots].map(d => d.dataset.t);
  const cycleBtn = document.getElementById('theme-cycle');
  function paintCycle(t) {
    const src = [...dots].find(d => d.dataset.t === t) || dots[0];
    cycleBtn.style.background = getComputedStyle(src).backgroundColor;
  }
  cycleBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || themeOrder[0];
    setTheme(themeOrder[(themeOrder.indexOf(cur) + 1) % themeOrder.length]);
  });

  if (prefs.theme) setTheme(prefs.theme); else setTheme(themeOrder[0]);

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  /* speech-bubble styling only for shortish lines; long speeches stay plain
     text (a 10-line "bubble" reads as ruled stripes, not a bubble) */
  function renderCaptionPara(t) {
    return esc(t);
  }
  function splitSentences(text) {
    const m = text.match(/[^.!?]*[.!?]+[”’"')]*|[^.!?]+$/g);
    return (m || [text]).map(s => s.trim()).filter(Boolean);
  }
  function unitsToHTML(units, escapeFn) {
    let html = '', lastPara = null, buf = [];
    const flushBuf = () => { if (buf.length) { html += `<p>${escapeFn(buf.join(' '))}</p>`; buf = []; } };
    units.forEach(u => { if (u.para !== lastPara) { flushBuf(); lastPara = u.para; } buf.push(u.text); });
    flushBuf();
    return html;
  }

  /* ---- geometry ----
     Panel width follows the current plate's aspect ratio so landscape art is
     shown full-width, uncropped, with the caption band below it. */
  /* Layout picker: squarish art on a wide screen goes side-by-side (art left,
     caption column right); tall/landscape art, or a narrow screen, stacks. */
  /* The measuring probe must be exactly as wide as the real text column, or
     pagination silently overfills: a wider probe fits more words per line,
     counts fewer lines, and the last line falls off the page. These paddings
     used to be hand-copied constants in geom() and had drifted from the CSS
     by 8px (beside) and 6px (stacked) — enough to clip a line. Read them off
     the live element instead so they cannot drift again. */
  /* Touch device: the cover's only instruction named two affordances that do
     not exist on a phone (arrow keys, "click") and listed swipe last. */
  const COARSE = matchMedia('(pointer: coarse)').matches;
  /* #art-wrap margin, mirroring the CSS — the narrow block tightens it, and
     geom subtracts it from the caption budget, so the two must agree. */
  const NARROW = '(max-width: 640px), (max-height: 560px)';
  const artMargin = () => matchMedia(NARROW).matches ? 0 : 22;
  let PAD = null;
  /* Measure off a permanent hidden probe, never off the live page. The old
     version read #cap-wrap and fell back to hardcoded desktop constants when
     it was absent — but it IS absent on the very first paginate() (the panel
     still holds only a comment) and on every cover/splash/beat page. So every
     first pagination on a phone used desktop numbers: a 36-44px too-narrow
     column, ~40px of dead paper on every page, and a book ~24% longer than it
     should be. Invisible on desktop, where the fallback happened to match. */
  function measurePads() {
    const p = document.getElementById('panel-probe'),
          c = document.getElementById('cap-probe');
    const read = () => {
      const s = getComputedStyle(c);
      return { x: parseFloat(s.paddingLeft) + parseFloat(s.paddingRight),
               y: parseFloat(s.paddingTop) + parseFloat(s.paddingBottom) };
    };
    p.className = 'beside'; c.className = ''; const beside = read();
    p.className = '';       c.className = ''; const stack  = read();
    p.className = '';       c.className = 'plateless'; const plain = read();
    p.className = '';       c.className = '';
    return { beside, stack, plain };
  }

  /* THE BOOK HAS ONE TRIM SIZE. Every page kind used to size its own panel
     from its own content — cover from the title plate's ratio (~710px wide),
     title pages 760, the beside spread ~1145, beat pages ~740 — so the book
     itself changed size as you flipped, which a physical book never does.
     trim() picks the box once per viewport; every render branch and every
     pagination budget lays out INSIDE it. Wide screens get an open-spread
     box (height-driven, capped); narrow gets the full screen.
     clientWidth/Height include #stage's own padding — read the content box,
     or a landscape phone gets a panel wider than the stage and
     overflow:hidden eats the last lines (that bug shipped once already). */
  const TRIM_RATIO = 1.55;               /* open-spread aspect: W = H * this */
  function trim() {
    const scs = getComputedStyle(stageEl);
    const W0 = Math.max(320, stageEl.clientWidth
      - parseFloat(scs.paddingLeft) - parseFloat(scs.paddingRight));
    const H = Math.max(320, stageEl.clientHeight
      - parseFloat(scs.paddingTop) - parseFloat(scs.paddingBottom));
    const narrow = matchMedia(NARROW).matches;
    const W = narrow ? W0 : Math.min(W0, Math.round(H * TRIM_RATIO), 1440);
    return { W, H, narrow };
  }

  function geom(plateR) {
    const { W, H, narrow } = trim();
    const pad = PAD || measurePads();
    const ART_M = artMargin();
    if (!plateR) { /* plateless caption page: full paper page */
      /* Budget from the real geometry, not the old `stH*.80 - 90` magic —
         that formula left ~120px of dead paper at the foot of every
         plateless page, and Books X-XXIV are ALL plateless. */
      return { beside: false, panelW: W, panelH: H, artH: 0,
               capAvail: H - pad.plain.y - 24,
               textW: Math.min(620, (W - pad.plain.x) * .92), fill: narrow };
    }
    /* Side-by-side is about SHAPE, not screen class: a landscape phone is
       700-956px wide and ~310 tall, and stacking there leaves a letterbox
       strip and three lines of prose. The capW guard below also protects the
       column — a 1.3-ratio plate could eat the spread and leave a sliver, in
       which case stacked is the honest layout. */
    if (plateR > 0.8 && plateR < 1.3
        && (W > 860 || (W >= 700 && W > H * 1.6))) {
      /* the CSS `#panel.beside #art-wrap` margin is an unconditional 22px;
         the math uses 22 even when narrow artMargin() is 0, and subtracts it
         exactly — a .96 fudge here once clipped 30px of every page on a
         landscape phone. */
      const BM = 22;
      /* The column is the reading surface — it gets a guaranteed share and
         the ART yields, not the other way round. Height-first sizing gave a
         square plate H-44px of a 1200-wide spread on a tall monitor, leaving
         the text a ~190px sliver. When the plate can't have full height AND
         a real column, it shrinks and centres vertically. */
      /* wide enough that textW can reach the full 620px book measure
         (620 + the column's 92px padding = 712) — the old 560 cap left the
         column at ~40 characters while paper sat empty beside it */
      const capW = Math.min(712, Math.max(340, W * .42));
      let artH = H - 2 * BM;
      let artW = artH * plateR;
      const maxArtW = W - BM - capW;
      if (artW > maxArtW) { artW = maxArtW; artH = artW / plateR; }
      if (artW >= 280) {
        return { beside: true, panelW: W, panelH: H, artW, artH,
                 capAvail: H - pad.beside.y - 2,
                 textW: Math.min(620, capW - pad.beside.x), fill: narrow };
      }
    }
    const artAvailW = W - 2 * ART_M;
    /* Full width, natural height; the .55/.60 clamp is only a floor for the
       caption. When it engages the plate NARROWS to its true ratio and
       centres — never cover-cropped: a trimmed composition costs more than a
       smaller plate. */
    const artH = Math.min(artAvailW / plateR, H * (narrow ? .55 : .60));
    const artW = Math.min(artAvailW, artH * plateR);
    const capAvail = H - artH - (narrow ? 0 : ART_M) - pad.stack.y - (narrow ? 4 : 14);
    /* the column is capped and centred by CSS (max-width + auto margins);
       the probe must measure the same width the page renders at */
    const textW = Math.min(620, W - pad.stack.x);
    return { beside: false, panelW: W, panelH: H, artW, artH, capAvail, textW, fill: narrow };
  }

  /* ---- pagination ---- */
  let pages = [], cur = 0;

  function paginate() {
    PAD = measurePads();   /* re-read each pass: CSS can change with viewport */
    pages = [{ k: 'cover' }];
    const probe = document.createElement('div');
    probe.className = 'caption-box';
    probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;bottom:auto;right:auto;clip-path:none;box-shadow:none;overflow:visible;max-height:none;height:auto;';
    document.body.appendChild(probe);

    /* Monotonic sentence id across the whole corpus. Page indices are only
       meaningful at the viewport that produced them, so repagination anchors
       on this instead — it is the one thing that survives a resize. */
    let gi = 0;

    DATA.books.forEach((b, bi) => {
      pages.push({ k: 'splash', bi });
      let plate = null, pending = [], paraIdx = 0, firstCap = true, curFocus = null;
      const packAndPush = () => {
        if (!pending.length) return;
        const m = geom(plate ? (plate.r || DEFAULT_R) : null);
        probe.style.width = m.textW + 'px';
        let cur2 = [];
        const emit = () => {
          if (!cur2.length) return;
          pages.push({ k: 'cap', bi, plate, units: cur2, opens: firstCap, foc: curFocus });
          firstCap = false; cur2 = [];
        };
        /* One sentence alone overruns the page: break it on a word boundary —
           a mid-sentence turn is invisible, a swallowed clause is not. */
        const wordSplit = (u) => {
          const words = u.text.split(' ');
          let head = [];
          const flush = () => {
            pages.push({ k: 'cap', bi, plate, units: [{ text: head.join(' '), para: u.para, gi: u.gi }],
                         opens: firstCap, foc: curFocus });
            firstCap = false;
          };
          for (let i = 0; i < words.length; i++) {
            head.push(words[i]);
            probe.innerHTML = unitsToHTML([{ text: head.join(' '), para: u.para }], esc);
            if (probe.scrollHeight > m.capAvail && head.length > 1) {
              head.pop(); flush(); head = [words[i]];
            }
          }
          if (head.length) flush();
        };
        /* EVERY unit passes through here, including one carried over from an
           overflowing page. The old loop reset the buffer to [u] after a pop
           without measuring u alone — so a sentence taller than the page
           budget sailed through unchecked (the length===1 guard never saw it:
           the buffer was length 2 when the NEXT unit overflowed) and rendered
           as a clipped page. Harmless at the old ~640px budgets, where no
           sentence outgrew a page; the fixed trim's tighter mid-width budget
           (~200px, six lines) made long Homeric sentences trip it. */
        const addUnit = (u) => {
          cur2.push(u);
          probe.innerHTML = unitsToHTML(cur2, esc);
          if (probe.scrollHeight <= m.capAvail) return;
          cur2.pop();
          if (!cur2.length) { wordSplit(u); return; }
          emit();
          addUnit(u);
        };
        pending.forEach(addUnit);
        emit();
        pending = [];
      };
      b.blocks.forEach(blk => {
        /* splashOnly plates (e.g. a title montage) front the book but are not
           used as sticky scene art behind the narration */
        if (blk.t === 'img') {
          if (!blk.splashOnly) {
            packAndPush(); plate = blk; curFocus = null;  /* new plate: back to full frame */
            /* A bigBeat plate lands as its own full-bleed page first — but only
               where the next page would not already show it large. In the
               side-by-side layout the plate fills half the spread, so the beat
               page is the same picture twice in a row, smaller the first time.
               Pagination reruns on resize, so this follows the layout. */
            if (blk.bigBeat && !geom(blk.r).beside) pages.push({ k: 'beat', bi, plate: blk });
          }
          return;
        }
        /* A paragraph flagged `brk` starts a fresh page. Plate changes already
           flush the buffer, so this is only for scene shifts that have no
           plate of their own — a jump to a different place or a different day
           that would otherwise begin halfway down a page still carrying the
           previous scene's art. */
        if (blk.brk) packAndPush();
        /* A paragraph flagged `foc` (build script resolved a focus anchor)
           crops the still-sticky plate into a sub-region from here on —
           flush first so a page never mixes two crop states. */
        if (blk.foc) { packAndPush(); curFocus = blk.foc; }
        splitSentences(blk.x).forEach(s => pending.push({ text: s, para: paraIdx, gi: gi++ }));
        paraIdx++;
      });
      packAndPush();
    });
    probe.remove();
  }

  /* ---- rendering (flicker-free: art element persists across caption turns) ---- */
  let lastShape = null, lastArtSrc = null;

  function artInner(src, cap) {
    return src ? `<img id="art-img" src="${src}" alt="${esc(cap || '')}">` : `<div class="no-art-tex"></div>`;
  }

  /* A focus crops the SAME <img> into a sub-region — [x,y,w,h] as fractions
     of the image — via transform, not a src swap, so the flicker-free path
     above is untouched. transform-origin 0 0 makes translate/scale compose
     as plain crop math: scale by 1/w,1/h to blow the rect up to fill the
     box, translate by -(x/w),-(y/h) (in % of the box, i.e. the untransformed
     image) so the rect's top-left lands at the box's top-left. */
  function applyFocus(img, foc) {
    if (!img) return;
    if (foc) {
      const [x, y, w, h] = foc;
      img.style.transformOrigin = '0 0';
      img.style.transform = `translate(${(-x / w * 100).toFixed(3)}%, ${(-y / h * 100).toFixed(3)}%) scale(${(1 / w).toFixed(4)}, ${(1 / h).toFixed(4)})`;
    } else {
      /* clear the inline override; the CSS default overscan takes back over */
      img.style.transform = '';
      img.style.transformOrigin = '';
    }
  }

  function render() {
    const p = pages[cur];
    const bk = p.bi != null ? DATA.books[p.bi] : null;

    if (p.k === 'beat') {
      /* the beat plate tips into the SAME trim page as every other page —
         largest size that fits, centred, paper around it */
      const r = p.plate.r || DEFAULT_R;
      const { W, H, narrow } = trim();
      const artH = Math.min(H - 2 * 22, (W - 2 * 22) / r);
      panelEl.classList.remove('beside', 'full');
      panelEl.classList.toggle('fill', narrow);
      panelEl.style.width = W + 'px';
      panelEl.style.height = H + 'px';
      panelEl.innerHTML = `<div id="art-wrap" style="width:${artH * r}px;height:${artH}px;margin:auto">${artInner(p.plate.src, p.plate.cap)}</div>`;
      lastShape = 'beat'; lastArtSrc = p.plate.src;
    } else if (p.k === 'cover') {
      const b = DATA.books[0];
      const art = b.blocks.find(x => x.t === 'img' && x.portrait) || b.blocks.find(x => x.t === 'img');
      const r = art ? (art.r || DEFAULT_R) : DEFAULT_R;
      const { W, H, narrow } = trim();
      const artH = Math.min(H - 2 * 22, (W - 2 * 22) / r);
      panelEl.classList.remove('beside', 'full');
      panelEl.classList.toggle('fill', narrow);
      panelEl.style.width = W + 'px';
      panelEl.style.height = H + 'px';
      panelEl.innerHTML =
        `<div id="art-wrap" style="width:${artH * r}px;height:${artH}px;margin:auto">${artInner(art && art.src, art && art.cap)}
         <div class="cover-page"><div class="cv-title"><em>The</em> Odyssey</div>
           <div class="cv-sub">Homer &middot; a new prose translation, illustrated</div>
           <div class="cv-credit">nafSadh &middot; lord of cool stuff</div>
           <div class="cv-hint">${COARSE ? 'swipe, or tap the edges'
             : 'flip with <kbd>&larr;</kbd> <kbd>&rarr;</kbd>, click the edges, or swipe'}</div></div></div>`;
      lastShape = 'cover'; lastArtSrc = art ? art.src : null;
    } else if (p.k === 'splash') {
      /* Typographic title page on the book's own paper. The first scene plate
         used to be blown up as a backdrop here — it read as wallpaper and
         spoiled that plate before its scene arrived. The plates instead
         appear as a loose fan of small tiles under the numeral; a book with
         no art gets the pure-text page for free. */
      panelEl.classList.remove('beside', 'full');
      const { W, H, narrow } = trim();
      panelEl.classList.toggle('fill', narrow);
      panelEl.style.width = W + 'px';
      panelEl.style.height = H + 'px';
      const tiles = bk.blocks.filter(x => x.t === 'img' && x.src && !x.splashOnly).slice(0, 5);
      const ROT = [-5, 3, -2, 6, -3], DY = [4, -6, 2, -4, 6];
      const tileHTML = tiles.length
        ? `<div class="tp-tiles">${tiles.map((a, i) =>
             `<img src="${a.src}" alt="" style="--r:${ROT[i % 5]}deg;--y:${DY[i % 5]}px">`).join('')}</div>`
        : '';
      panelEl.innerHTML =
        `<div class="title-page"><div class="tp-over">Book</div>
         <div class="tp-roman">${bk.roman}</div>
         <div class="tp-rule"></div>${tileHTML}</div>`;
      lastShape = 'splash'; lastArtSrc = p.bi;
    } else {
      panelEl.classList.remove('full');
      const r = p.plate ? (p.plate.r || DEFAULT_R) : null;
      const m = geom(r);
      panelEl.style.width = m.panelW + 'px';
      panelEl.style.height = m.panelH + 'px';
      panelEl.classList.toggle('beside', !!m.beside);
      const capHTML = unitsToHTML(p.units, renderCaptionPara);
      const shape = p.plate ? (m.beside ? 'cap-beside' : 'cap-art') : 'cap-plain';
      const artSrc = p.plate ? p.plate.src : null;
      /* stacked plates centre themselves: when the height clamp narrows the
         art below the panel width, auto margins keep it a centred tipped-in
         plate rather than a left-hugging one */
      /* beside: auto vertical margins centre a plate that yielded height to
         the column (they resolve to the usual 22px when it has full height) */
      const artStyle = m.beside
        ? `width:${m.artW}px;height:${m.artH}px;margin:auto 0 auto 22px`
        : `width:${m.artW}px;height:${m.artH}px;margin-left:auto;margin-right:auto`;
      /* narrow: the panel fills the stage so the paper is the page, not a card
         floating on a backdrop */
      panelEl.classList.toggle('fill', !!m.fill);

      if (shape === lastShape && artSrc === lastArtSrc) {
        /* same scene: swap ONLY the caption — art stays untouched, no flicker */
        const capBox = panelEl.querySelector('.caption-box');
        capBox.innerHTML = capHTML;
        capBox.classList.toggle('opens', !!p.opens);
        capBox.classList.remove('cap-anim', 'back');
        void capBox.offsetWidth;               /* restart the entry animation */
        capBox.classList.add('cap-anim');
        if (lastDir < 0) capBox.classList.add('back');
        const aw = panelEl.querySelector('#art-wrap');
        if (aw) aw.style.cssText = artStyle;
        applyFocus(panelEl.querySelector('#art-img'), p.plate ? p.foc : null);
      } else {
        panelEl.innerHTML = (p.plate
          ? `<div id="art-wrap" style="${artStyle}">${artInner(artSrc, p.plate.cap)}
               </div>
             <div id="cap-wrap"><div class="caption-box cap-anim${p.opens ? ' opens' : ''}">${capHTML}</div></div>`
          : `<div id="cap-wrap" class="plateless"><div class="caption-box big cap-anim${p.opens ? ' opens' : ''}">${capHTML}</div></div>`);
        applyFocus(panelEl.querySelector('#art-img'), p.plate ? p.foc : null);
        lastShape = shape; lastArtSrc = artSrc;
      }
    }

    /* the single bar's centre slot is the position on every screen size —
       the book name lives in the picker and the back link */
    ilLabel.textContent = `${cur + 1}/${pages.length}`;
    posLabel.textContent = bk ? `Book ${bk.roman} · page ${cur + 1}/${pages.length}` : `page ${cur + 1}/${pages.length}`;
    progress.style.width = ((cur + 1) / pages.length * 100) + '%';
    if (bk) bookSel.value = String(p.bi);
    prevBookBtn.disabled = !bk || p.bi === 0;
    nextBookBtn.disabled = bk ? p.bi === DATA.books.length - 1 : false;
    pgPrev.disabled = cur === 0;
    pgNext.disabled = cur === pages.length - 1;
    prefs.page = cur; save();
    /* replaceState, not location.hash: a hash assignment per page-turn would
       push hundreds of history entries and break the Back button */
    history.replaceState(null, '', bk ? `#bk-${bk.num}-p${cur}` : '#cover');
    for (let i = cur + 1; i <= cur + 3; i++) {
      const q = pages[i];
      const src = q && (q.k === 'splash' ? ((DATA.books[q.bi].blocks.find(x => x.t === 'img') || {}).src)
        : q.k === 'cap' ? (q.plate || {}).src : null);
      if (src) { const im = new Image(); im.src = src; }
    }
  }

  let lastDir = 1;                       /* which way the last turn went */
  function go(delta) {
    const n = Math.min(pages.length - 1, Math.max(0, cur + delta));
    if (n === cur) return;
    lastDir = delta < 0 ? -1 : 1;
    cur = n;
    render();
  }
  function goBook(bi) {
    bi = Math.min(DATA.books.length - 1, Math.max(0, bi));
    const idx = pages.findIndex(p => p.k === 'splash' && p.bi === bi);
    if (idx >= 0) { cur = idx; render(); }
  }

  document.getElementById('hit-left').addEventListener('click', () => go(-1));
  document.getElementById('hit-right').addEventListener('click', () => go(1));
  pgPrev.addEventListener('click', () => go(-1));
  pgNext.addEventListener('click', () => go(1));
  prevBookBtn.addEventListener('click', () => { const p = pages[cur]; goBook((p.bi != null ? p.bi : 0) - 1); });
  nextBookBtn.addEventListener('click', () => { const p = pages[cur]; goBook((p.bi != null ? p.bi : -1) + 1); });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    if (e.key === 'Home') { cur = 0; render(); }
    if (e.key === 'End') { cur = pages.length - 1; render(); }
  });
  /* Swipe. The previous version stored only clientX and turned the page on any
     |dx| > 48, which misfired constantly on a phone:
       - a near-vertical drag (55px across, 340px down) turned the page;
       - a thumb resting at the screen edge — how a phone is actually held —
         made touches[0] the thumb and changedTouches[0] the moving finger, so
         swipes registered INVERTED;
       - a pinch-zoom on a plate turned the page;
       - sliding off a button to cancel a mistaken tap navigated instead, the
         opposite of the universal cancel idiom;
       - and a stale tx survived touchcancel to fire on an unrelated touch.
     Track one identified finger, require the gesture to be horizontally
     dominant and reasonably quick, and ignore anything that starts on chrome. */
  const SWIPE_MIN = 40, SWIPE_RATIO = 1.7, SWIPE_MS = 700;
  let sw = null;
  const onChrome = t => !!(t && t.closest && t.closest('#top-bar, #bottom-bar'));
  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) { sw = null; return; }   /* pinch / second finger */
    if (onChrome(e.target)) { sw = null; return; }
    const t = e.changedTouches[0];
    sw = { id: t.identifier, x: t.clientX, y: t.clientY, t: Date.now() };
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (sw && e.touches.length > 1) sw = null;         /* became a pinch */
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sw = null; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!sw) return;
    const t = [...e.changedTouches].find(c => c.identifier === sw.id);
    if (!t) return;                                    /* a different finger lifted */
    const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    const ok = Math.abs(dx) > SWIPE_MIN
            && Math.abs(dx) > Math.abs(dy) * SWIPE_RATIO
            && Date.now() - sw.t < SWIPE_MS;
    sw = null;
    if (ok) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  DATA.books.forEach((b, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    /* "Bk" not "Book": the control is obviously a book picker, and the four
       characters it saves are what let the foot hold everything at 390px */
    o.textContent = `Bk ${b.roman}${b.plates ? ' ✦' : ''}`;
    bookSel.appendChild(o);
  });
  bookSel.addEventListener('change', () => goBook(parseInt(bookSel.value, 10)));

  function restore() {
    /* A page index only means anything at the viewport that produced it — the
       same book paginates to 1125 pages at 430x932 and 2250 at 932x430. So a
       link opened on a different device landed somewhere arbitrary. Fall back
       to the book number, which is right there in the hash and used to be
       parsed and thrown away. */
    const m = location.hash.match(/^#bk-(\d+)-p(\d+)$/);
    if (m) {
      const n = parseInt(m[2], 10);
      if (n < pages.length) return n;
      const idx = pages.findIndex(p => p.k === 'splash' && DATA.books[p.bi].num === parseInt(m[1], 10));
      if (idx >= 0) return idx;
    }
    const mb = location.hash.match(/^#bk-(\d+)$/);
    if (mb) {
      const idx = pages.findIndex(p => p.k === 'splash' && DATA.books[p.bi].num === parseInt(mb[1], 10));
      if (idx >= 0) return idx;
    }
    if (typeof prefs.page === 'number' && prefs.page < pages.length) return prefs.page;
    return 0;
  }



  function repaginateKeepingPosition() {
    const anchor = pages[cur];
    /* Anchor on the first sentence shown, not on {kind, book}. findIndex on
       kind returned the FIRST page of that kind in the book — so a reader 400
       pages into Book IV was thrown 165 pages back on every rotation, and the
       new position was then written to localStorage and the hash, making it
       unrecoverable. */
    const target = anchor && anchor.units && anchor.units.length ? anchor.units[0].gi : null;
    paginate();
    let n = -1;
    if (target != null) {
      n = pages.findIndex(p => p.units && p.units.length &&
                               p.units[p.units.length - 1].gi >= target);
    }
    if (n < 0 && anchor && anchor.bi != null) {
      n = pages.findIndex(p => p.k === anchor.k && p.bi === anchor.bi);
      if (n < 0) n = pages.findIndex(p => p.bi === anchor.bi);
    }
    cur = Math.max(0, n);
    lastShape = null; lastArtSrc = null;  /* force full re-render */
  }

  paginate();
  cur = restore();
  render();
  /* Web-font race: paginate() measures text with a hidden probe, so if it runs
     before EB Garamond has loaded it measures fallback-font metrics and every
     page comes out short (observed: 866 pages with ~180px of unused column on
     each, vs 748 correctly). Repaginate once the real face is ready.
     The `status !== 'loaded'` guard this used to carry never fired: at inline-
     script time no font request has started yet, so status is already
     'loaded' and the handler was never registered — the whole phone session
     then ran on Georgia metrics (16% wider, ~1.5 dead lines per page, 275
     extra turns). Ask for the faces explicitly and always repaginate; the
     pass is idempotent, so a warm cache just costs one extra run. */
  if (document.fonts) {
    Promise.all([
      document.fonts.load('400 18px "EB Garamond"'),
      document.fonts.load('500 52px "EB Garamond"'),
      document.fonts.ready,
    ]).then(() => { repaginateKeepingPosition(); render(); }).catch(() => {});
  }
  /* Defensive: a 0-sized layout at load (backgrounded tab, or a pane that has
     not sized itself yet) bakes in a bogus pagination that nothing but a
     'resize' would fix — and the Math.max(320,...) floors in geom() mean the
     result still looks plausible rather than obviously broken, so it survives.
     Observed: paginating at 0x0 gave 4293 pages where the settled layout gives
     1449. A single double-rAF recheck can land inside the same bad window, so
     watch the stage until it reports a real size, then rebuild once. */
  if (stageEl.clientWidth <= 40 || stageEl.clientHeight <= 40) {
    const ro = new ResizeObserver(() => {
      if (stageEl.clientWidth > 40 && stageEl.clientHeight > 40) {
        ro.disconnect();
        repaginateKeepingPosition(); render();
      }
    });
    ro.observe(stageEl);
  }
  /* Repagination walks every sentence of all 24 books and costs ~300ms on a
     laptop, several times that on a phone. Mobile browsers fire resize
     continuously as the URL bar slides in and out — a height-only change that
     does not deserve a reflow — so ignore pure-height jitter under the bar's
     own height and only rebuild when the text measure actually changed.
     Landscape/portrait flips change width and still come through. */
  let rt = null, lastW = innerWidth, lastH = innerHeight;
  const CHROME_SLOP = 140;               /* taller than any mobile toolbar */
  window.addEventListener('resize', () => {
    const dw = Math.abs(innerWidth - lastW), dh = Math.abs(innerHeight - lastH);
    if (dw === 0 && dh <= CHROME_SLOP) { lastH = innerHeight; return; }
    clearTimeout(rt);
    rt = setTimeout(() => {
      lastW = innerWidth; lastH = innerHeight;
      repaginateKeepingPosition(); render();
    }, 200);
  });
})();
</script>
</body>
</html>

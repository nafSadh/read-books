, not a day has it given me a second of happiness but that very day it has plunged me into an abyss of grief.<\/p>"},{"n":194,"label":"CXCIV","verse":"<p class=\"q-prose\">A cup of wine is worth a hundred hearts, a hundred creeds, a mouthful of this juice divine is worth the Empire of China. What is there, truly, on the earth preferable to wine? It is a bitter that is a hundred times sweeter than life.<\/p>"},{"n":195,"label":"CXCV","verse":"<p class=\"q-prose\">The Wheel of Heaven only multiplies our griefs! It places nothing here below that it does not soon bear away. Oh! if those who have not yet come knew the suffering this world inflicts, they would guard themselves well from coming here.<\/p>"},{"n":196,"label":"CXCVI","verse":"<p class=\"q-prose\">Drink, drink this wine which gives eternal life; drink, for it is the source of youthful joy; it burns like fire, but, like life&#x27;s essence, drives away your care. Then drink!<\/p>"},{"n":197,"label":"CXCVII","verse":"<p class=\"q-prose\">O Friend, to what good art thou preoccupied with _being_? Why trouble thus thy heart, thy soul with idle thoughts? Live happily, pass thy time joyously, for you were not asked your opinion about the making of things as they are.<\/p>"},{"n":198,"label":"CXCVIII","verse":"<p class=\"q-prose\">The inhabitants of the tomb are returned to earth in dust; the atoms [of which they are composed] are scattered here and there, separated one from the other. Alas! what is this drink in which the human race is soaked and which holds it thus in dizzy ignorance of all things, even to the day of doom?<\/p>"},{"n":199,"label":"CXCIX","verse":"<p class=\"q-prose\">O heart! act as if all the good things of this world belonged to you; imagine that this house is provided with everything, that it is richly furnished, and live joyously in this domain of disorder. Realize that thou restest here for two or three days, and that thereafter thou shalt rise and go away.<\/p>"},{"n":200,"label":"CC","verse":"<p class=\"q-prose\">The dogmas of religion admit only that which places you under obligation to the Divinity. That morsel of bread that you have, refuse not to others; keep from speaking evil; render evil to no one, and it is I who promise you a future life: bring wine.<\/p>"},{"n":201,"label":"CCI","verse":"<p class=\"q-prose\">Dragged through the rapid course of time, which accords its favors only to the least worthy, my life is passed in a gulf of grief and sorrow. In this garden of being, my heart is hard as is the green bud of a rose; and like a tulip, it is dipped in blood.<\/p>"},{"n":202,"label":"CCII","verse":"<p class=\"q-prose\">What belongs to youth is wine, the limpid juice of the vine and the society of beauty; and since water once brought ruin to this world by annihilating it, it is our part to drown ourselves in wine, to pass our life in drunkenness complete.<\/p>"},{"n":203,"label":"CCIII","verse":"<p class=\"q-prose\">Bring wine from this ruby vessel and pour it into a simple crystal cup; bring that thing habitual and dear to every noble man. Since you know that all beings are but dust, and that a two-day tempest makes them disappear, bring wine.<\/p>"},{"n":204,"label":"CCIV","verse":"<p class=\"q-prose\">O Thou, the quest of whom holds all in dizziness and distress, the dervish and the rich are equally void of means of reaching Thee. Thy name is in the speech of all, but all are deaf; Thou art present to the eyes of all, but all are blind.<\/p>"},{"n":205,"label":"CCV","verse":"<p class=\"q-prose\">In company with one dear friend, how pleasing to me is a cup of wine. When I become the prey of care, it is fitting that my eyes should be filled with tears. Oh! this abject world has nothing lasting for us, and best it is to dwell inebriate.<\/p>"},{"n":206,"label":"CCVI","verse":"<p class=\"q-prose\">Keep thyself from drinking wine in the company of a boorish, violent character, having no mind or self-control, for such a man knows only how to cause unpleasantness. For the time, thou wouldst have to undergo the disorder of his drunkenness, his vociferations, his folly. And the next day, his prayers for excuse and pardon would come to weary thy head.<\/p>"},{"n":207,"label":"CCVII","verse":"<p class=\"q-prose\">Since you only possess what God has given you, torment not yourself to obtain the object of your covetousness. Keep from burdening the heart too much, for the final drama consists in leaving all and passing beyond.<\/p>"},{"n":208,"label":"CCVIII","verse":"<p class=\"q-prose\">O my soul! drink this limpid nectar which has not been stirred; drink it in memory of the charming idols which ravish the heart. Wine is the blood of the vine, my friend, and the vine says to thee: Drink of me, since I render it lawful to you.<\/p>"},{"n":209,"label":"CCIX","verse":"<p class=\"q-prose\">In the season of flowers, drink rose-colored wine; drink to the plaintive sounds of the lute, to the melodious noise of the harp. As for me, I drink and rejoice in it; may it be salutary to me! If you do not drink, why not be willing that I should? Go, then, and eat pebbles!<\/p>"},{"n":210,"label":"CCX","verse":"<p class=\"q-prose\">Art thou sad? Take a piece of hasheesh as large as a grain of barley, or drink a small measure of rose-colored wine. Then you will become a Sufi. But, if you will not drink of this or partake of that, nothing remains for you but to eat pebbles; go, eat some pebbles!<\/p>"},{"n":211,"label":"CCXI","verse":"<p class=\"q-prose\">But yesterday, I saw a potter in a bazaar treading most vigorously the clay he was molding. The clay seemed to say to him: I also have been like thee; treat me, then, with less harshness.<\/p>"},{"n":212,"label":"CCXII","verse":"<p class=\"q-prose\">If thou drinkest wine, drink it with intelligent people, drink it in company with thy ravishing idols, with smiles upon their lips and their cheeks tinted with the colors of the tulip. Drink not too much or speak boastingly of it; make it not a refrain, but drink a little from time to time in quietude.<\/p>"},{"n":213,"label":"CCXIII","verse":"<p class=\"q-prose\">Wine should be drunk in the company of slender creatures who ravish the heart with the color of their cheeks. Art thou bitten by the serpent of grief, friend--drink, then, of this antidote. I myself drink of it and plume myself on the strength of it; would that it might be propitious! If you drink it not, why not be willing that I should? Go, eat some earth.<\/p>"},{"n":214,"label":"CCXIV","verse":"<p class=\"q-prose\">Here is the Dawn; arise, O beardless youth, and quickly fill this crystal cup with ruby wine, for [later], you could seek long time ere finding such a moment of existence as is lent us in this world of nothingness.<\/p>"},{"n":215,"label":"CCXV","verse":"<p class=\"q-prose\">&#x27;Twixt wine and Jemshid&#x27;s throne, give me the wine; the bouquet of the cup is sweeter than the Virgin&#x27;s heaven-sent fruits. The morning sigh of one inebriate the bygone night is more melodious than the longdrawn lamentations of Adhem or Bou-Saïd.<\/p>"},{"n":216,"label":"CCXVI","verse":"<p class=\"q-prose\">O my heart! since the foundation, even, of the things of this world is only a fiction, why do you venture thus in an infinite gulf of sorrow? Trust yourself to destiny, endure the evil, for the lot which the heavenly brush has traced for you will not be effaced.<\/p>"},{"n":217,"label":"CCXVII","verse":"<p class=\"q-prose\">Of all those who have taken the long road, who is there now returned of whom I may ask news? O friend! beware of putting any hope whatever in this sordid world, for, know well that thou here shalt ne&#x27;er return.<\/p>"},{"n":218,"label":"CCXVIII","verse":"<p class=\"q-prose\">Since each of these nights and each of these days cuts off a part of thy existence, allow not the nights or the days to cover thee with dust. Pass them gaily, for how long, alas! shalt thou be absent, while the nights and days will still be here!<\/p>"},{"n":219,"label":"CCXIX","verse":"<p class=\"q-prose\">This wheel of heaven which tells its secrets to no man, has killed a thousand Mahmouds [Sultans] and a thousand Ayaz [favorites]; drink wine, for the life of none shall ever be restored. Alas! not one of all those who left the world can again return!<\/p>"},{"n":220,"label":"CCXX","verse":"<p class=\"q-prose\">O Thou who rulest the whole universe! knowest Thou what are the days when wine rejoices the soul? They are: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday and Saturday, all day long.<\/p>"},{"n":221,"label":"CCXXI","verse":"<p class=\"q-prose\">O Being, exquisite in thy enticing and coquettish charm! be seated: rise no more and thus appease the fire of a thousand torments. Thou enjoinest me not to look upon Thee; but it is as if Thou shouldst order me to incline the cup and forbid me spilling its contents.<\/p>"},{"n":222,"label":"CCXXII","verse":"<p class=\"q-prose\">Better to be with Thee in the tavern, and there tell Thee my secret thoughts, than to go without Thee and make a prayer in the mosque. Yea, O Creator of all that was and all that is! such is my faith, whether Thou burnest me, or accordest me Thy favor.<\/p>"},{"n":223,"label":"CCXXIII","verse":"<p class=\"q-prose\">Consort with honest and intelligent men. Flee a thousand miles away from the ignorant. If a man of mind give thee poison, drink it; if an ignorant one present thee an antidote, pour it upon the ground.<\/p>"},{"n":224,"label":"CCXXIV","verse":"<p class=\"q-prose\">The clouds are still spread out above the roses and seem to cover them as with a veil. The desire for wine is not yet satiated in my heart. Then go not to rest, it is not yet the hour. O my soul, drink of the wine; drink, for the sun is still upon the horizon.<\/p>"},{"n":225,"label":"CCXXV","verse":"<p class=\"q-prose\">Like unto a sparrow-hawk, I am flying away from this world of mysteries, hoping to lift myself to a higher world; but, fallen, here below, and finding no one worthy to share my secret thoughts, I go out through the door by which I entered.<\/p>"},{"n":226,"label":"CCXXVI","verse":"<p class=\"q-prose\">Thou hast put in us an irresistible passion [which is equivalent to an order from Thee], and, on the other hand, forbiddest us to give way to it. Poor human beings are in extreme embarrassment between this order and this prohibition, for it is as if Thou commandest me to upset the cup but refrain from spilling the contents.<\/p>"},{"n":227,"label":"CCXXVII","verse":"<p class=\"q-prose\">They are gone, these transients, and no one of them has returned to tell the secrets concealed behind the curtain. O devotee! it is by humility that spiritual affairs take favorable turn and not by prayer, for, what is prayer without sincerity and humility?<\/p>"},{"n":228,"label":"CCXXVIII","verse":"<p class=\"q-prose\">Throw dust upon the vault of heaven and drink some wine; seek out the fair, for where see you a subject for pardon, a subject for prayer, since, of all those who have gone away, no one has returned?<\/p>"},{"n":229,"label":"CCXXIX","verse":"<p class=\"q-prose\">Although on my necklace of duty I have never strung the pearl of submission, as is Thy due, although never in my heart have I swept the dust from Thy steps, I have never despaired reaching the sill of Thy throne of pity, for never have I importuned Thee with my troubles.<\/p>"},{"n":230,"label":"CCXXX","verse":"<p class=\"q-prose\">Let us recommence the course of our pleasures and say the _tekbir_ [farewell] to the five prayers. Everywhere, where the flask is present, you will see, like the neck of the flask itself, our necks stretching out towards the cup.<\/p>"},{"n":231,"label":"CCXXXI","verse":"<p class=\"q-prose\">Here below, we are only the puppets with which the Wheel of Heaven is amused. This is a truth and not a metaphor. We are in fact the playthings upon this human checkerboard, which finally we leave to enter one by one the coffin of annihilation.<\/p>"},{"n":232,"label":"CCXXXII","verse":"<p class=\"q-prose\">You ask me what is this phantasmagoria of things here below. To tell you the whole truth regarding it would be too long: it is a fantastic image which comes out of a vast sea, and which re-enters, later, the same vast sea.<\/p>"},{"n":233,"label":"CCXXXIII","verse":"<p class=\"q-prose\">To-day we are lost in love, we are in deep distress, and finally inebriate, within the temple of our idols render to the cult of wine its due. To-day, entirely separate from our being, we shall have attained the step of the eternal throne.<\/p>"},{"n":234,"label":"CCXXXIV","verse":"<p class=\"q-prose\">My well-beloved [would that her life might last as long as my sorrows!] has commenced to be amiable to me again. She cast in my eyes a sweet and furtive look and disappeared, saying without doubt to herself: Do good and cast it on the waters.<\/p>"},{"n":235,"label":"CCXXXV","verse":"<p class=\"q-prose\">Here is the Dawn! Rise Thou, O Source of all Delight! Drink sweetly of the wine and let us listen to the harmonies of the harp, for the life of those who sleep will not be long, and of those who are no more, not one will e&#x27;er return.<\/p>"},{"n":236,"label":"CCXXXVI","verse":"<p class=\"q-prose\">O Thou, who knowest the secrets hidden most deeply at the bottom of the heart of each, Thou who raisest with Thy hand all those who fall in distress, give me the power of renunciation and accept my excuses, O God!--Thou who givest this power to all, who acceptest the excuses of all!<\/p>"},{"n":237,"label":"CCXXXVII","verse":"<p class=\"q-prose\">I saw on the walls of the city of Thous a bird hovering before the skull of Kai-Kawous. The bird said to the skull: Alas! what has become of the noise of thy glory and the sound of the clarion?<\/p>"},{"n":238,"label":"CCXXXVIII","verse":"<p class=\"q-prose\">Raise no question of the vicissitudes of this world, nor of affairs of the future. Consider what a prize we have in the present moment, and disturb not thyself with the past or question me about the future.<\/p>"},{"n":239,"label":"CCXXXIX","verse":"<p class=\"q-prose\">Let not the fear of future things yellow thy cheeks; let not present affairs make thee tremble with fright; rejoice, in this world of annihilation, at the portion of pleasure which comes to you, and wait not for that which the kindness of heaven may withhold.<\/p>"},{"n":240,"label":"CCXL","verse":"<p class=\"q-prose\">If you will listen to me, I will give you some advice: [Here it is] For the love of God put not on the mantle of hypocrisy. Eternity is for all time, and this world is but an instant. Then sell not for an instant the empire of eternity.<\/p>"},{"n":241,"label":"CCXLI","verse":"<p class=\"q-prose\">How long can I hold you by my ignorance? My own annihilation oppresses my heart. Straightway I gird my loins with the ephod of the priests. Do you know why? Because it is the fashion of the Musulman, and I am one.<\/p>"},{"n":242,"label":"CCXLII","verse":"<p class=\"q-prose\">O Khayyam! when intoxicate, be happy; when seated near a beauty, joyous be. Since the end of things in this world is annihilation, pretend that you are not, but since you are, give yourself up to pleasure.<\/p>"},{"n":243,"label":"CCXLIII","verse":"<p class=\"q-prose\">Yesterday, I visited the workshop of a potter; there I saw two thousand pitchers, some speaking, others silent. Each one of these seemed to say to me: Where is the potter? Where is the buyer of pitchers? Where the seller?<\/p>"},{"n":244,"label":"CCXLIV","verse":"<p class=\"q-prose\">Yesterday, while passing drunk before an inn, I met an old man overcome with wine and carrying a gourd of wine upon his back. I said to him: O aged man! have you no fear of God? He answered me: Pity comes from Him; go, drink some wine.<\/p>"},{"n":245,"label":"CCXLV","verse":"<p class=\"q-prose\">How long will lack of success in thy enterprises grieve thee? Torment is the portion of those who think of the future. Live then, in joy, grieve not thy heart with the cares of this world, and know that wine increases not at all the bitterness of pain.<\/p>"},{"n":246,"label":"CCXLVI","verse":"<p class=\"q-prose\">Wine, which the wise man knows how to appreciate, is for me the water of life and I its prophet am. It is balm for the heart, an elixir which fortifies the soul. Has God Himself not said: The benefits of the human race are found in wine.<\/p>"},{"n":247,"label":"CCXLVII","verse":"<p class=\"q-prose\">Although wine be prohibited, drink it without ceasing, drink it in the evening and in the morning, drink it to the noise of songs and to the sound of the harp. When you can, procure that which sparkles like the ruby, throw a drop on the earth and drink all the rest.<\/p>"},{"n":248,"label":"CCXLVIII","verse":"<p class=\"q-prose\">Diversity of creed divides the human race into about seventy-two sects. Amongst all these dogmas, I have chosen that of Thy love. What signify these words: Impiety, Islamism, creed, sin? My true aim is to seek Thee. Far be from me all these vain, indifferent pretexts.<\/p>"},{"n":249,"label":"CCXLIX","verse":"<p class=\"q-prose\">Enumerate my good qualities one by one; my faults, pass by in tens. Pardon each sin committed for the love of God. Fan not the fire of hatred by the breath of passion, pardon, rather, in memory of the tomb of the Prophet of God [Mohammed].<\/p>"},{"n":250,"label":"CCL","verse":"<p class=\"q-prose\">In truth, wine is a limpid spirit in the cup; in the body of the flask, it is a transparent soul. No annoying person is worthy of my society. It is only the cup of wine which can figure there, for that is at once a solid and a diaphanous body.<\/p>"},{"n":251,"label":"CCLI","verse":"<p class=\"q-prose\">O Wheel of Heaven! Thou art complete in Thy ingratitude. Thou keepest me constantly bare [naked] like a fish. The weaver&#x27;s loom weaves clothes for human beings; more charitable is it than Thou, O Wheel of Heaven!<\/p>"},{"n":252,"label":"CCLII","verse":"<p class=\"q-prose\">O Khayyam! Time is ashamed of him who allows his heart to be saddened by vicissitudes below; drink, then, to the sound of the harp, drink some wine from the crystal, before the crystal broken be upon a stone.<\/p>"},{"n":253,"label":"CCLIII","verse":"<p class=\"q-prose\">If the rose is not our portion, do not the thorns remain? If light divine does not reach us, is there not the fire [of hell]? If we have not the clerical mantle, or that of the temple, or the pontifical, do not the bells, the church, and the ephod remain to us?<\/p>"},{"n":254,"label":"CCLIV","verse":"<p class=\"q-prose\">If the Wheel of Heaven refuses me peace, am I not ready for war? If I have not an honorable reputation, have I not shame for myself? Here is the cup full of wine the color of rubies; he who will not drink of it, has he not his head and a stone?<\/p>"},{"n":255,"label":"CCLV","verse":"<p class=\"q-prose\">See Dawn appears. Already has it rent the veil of night. Arise, then, and empty the morning cup. Why this sadness? Drink, O my heart! drink, for these dawns will succeed each other with face turned towards us, when we shall have ours turned towards the earth.<\/p>"},{"n":256,"label":"CCLVI","verse":"<p class=\"q-prose\">All that this world contains are but images and flourishes of fiction. Ill-advised is he who does not comprehend his place in the number of these images. Repose, thou, friend, drink a cup of wine, give thyself up to joy and thus be delivered from all these vain figures, from these impossible reflections [which come to assail thy mind].<\/p>"},{"n":257,"label":"CCLVII","verse":"<p class=\"q-prose\">When you are in the company of a beauty with cypress-like figure and a color fresher than the newly-culled rose, put not far from thee the flowers of the field, nor let the cup escape from thy hand; [do this] before the north-wind of death, like a gale which disperses the leaves of the roses, tears in tatters the envelope of thy being.<\/p>"},{"n":258,"label":"CCLVIII","verse":"<p class=\"q-prose\">How long these cries, these groans against the things of this world? Rise, rather, and pass gaily every instant. When the universe shall be re-dressed in green from end to end, drink wine in a ruby cup, full to the brim.<\/p>"},{"n":259,"label":"CCLIX","verse":"<p class=\"q-prose\">Give not vain thoughts free access to thy mind. Drink wine throughout the year, and always cups filled to the brim. Pursue the daughter of the vine and aye rejoice, for it is better to enjoy the daughter without leave of law than know the mother with her full consent.<\/p>"},{"n":260,"label":"CCLX","verse":"<p class=\"q-prose\">My love is at the apogee of its flame. The beauty of the one who captivates my soul [the Divinity] is complete. My heart speaks, but my tongue remains mute, refusing to express my sentiments. Great God! Has one ever seen aught more strange? I am devoured by thirst, and before me flows a fresh and limpid draught!<\/p>"},{"n":261,"label":"CCLXI","verse":"<p class=\"q-prose\">Take a cup of wine in thy hand, then mingle thy voice with that of the nightingale, for, if it were meet to drink this juice of the vine without accompaniment of harmonious sound, the wine itself would make no noise in slipping out of the flask.<\/p>"},{"n":262,"label":"CCLXII","verse":"<p class=\"q-prose\">Guard thyself from ever despairing for a crime committed, and be mindful of the clemency of thy Creator, the pity of the Master; for, should&#x27;st thou die to-day, in a state of complete drunkenness, to-morrow he would pardon thy decaying dust for all.<\/p>"},{"n":263,"label":"CCLXIII","verse":"<p class=\"q-prose\">O Wheel of Heaven, thy circular course does not satisfy me. Deliver me from it, for I am unworthy of thy chain. If thy good pleasure consists in according thy favors only to the poor in mind, to idiots, I am neither intelligent enough or wise enough [to be confounded by it].<\/p>"},{"n":264,"label":"CCLXIV","verse":"<p class=\"q-prose\">O _mufti_ [grand judge] of the city! I am more a worker than art thou. Drunk as I am, I own more intelligence than thou; for thou, thou drinkest the blood of human beings and I that of the vine. Be just and tell me which is the more sanguinary of the two?<\/p>"},{"n":265,"label":"CCLXV","verse":"<p class=\"q-prose\">That which is wisest is to seek joy in our hearts in a cup of wine; and not preoccupy ourselves too much with the present or the past; and, finally, were it only for an instant, to free from the shackles of reason that soul which has been loaned us and which groans in its prison.<\/p>"},{"n":266,"label":"CCLXVI","verse":"<p class=\"q-prose\">The moment I shall fly from death, when, like the dry leaves, the particles of my body shall detach themselves from the centers of life, oh, then! with what joy shall I pass across the universe, as through a sieve, before the mason comes to sift my own dust.<\/p>"},{"n":267,"label":"CCLXVII","verse":"<p class=\"q-prose\">That vault of heaven, under which we reel, we might, in thought, liken to a lantern. The universe is the lantern. The sun represents the light, and we, like the images with which the lantern is ornamented, dwell there in stupefaction.<\/p>"},{"n":268,"label":"CCLXVIII","verse":"<p class=\"q-prose\">Thou hast formed me of earth and of water, what can I do? Whether I be wool or silk, it is Thou that hast woven, and what can I do? The good that I do, the evil that I am guilty of, were alike predestined by Thee; what can I do?<\/p>"},{"n":269,"label":"CCLXIX","verse":"<p class=\"q-prose\">O friend, come to me, and let us take no thought of to-day nor to-morrow, but consider our short instant of existence as spoils. To-morrow, when we shall have abandoned this old tent [the world], we shall be the companions of those who left it seven thousand years ago!<\/p>"},{"n":270,"label":"CCLXX","verse":"<p class=\"q-prose\">Never for a moment be deprived of wine, for it is wine that gives reflection to intelligence, to the heart of man and to religion. If the devil had tasted it for one instant, he would have adored Adam and have made before him thousands of genuflections.<\/p>"},{"n":271,"label":"CCLXXI","verse":"<p class=\"q-prose\">Arise, dance, and we shall clap our hands. Drink to the presence of beauties with the languorous eyes of the narcissus. Happiness is not very great when one has emptied but a score of cups; it is strangely complete when one arrives at the sixtieth.<\/p>"},{"n":272,"label":"CCLXXII","verse":"<p class=\"q-prose\">I have shut upon myself the door of avarice, and am thus free from obligation to those who are men and those who do not merit the name. Since there exists but one friend [God] toward whom I can extend my hand, I am what I am, and that concerns only Him and me.<\/p>"},{"n":273,"label":"CCLXXIII","verse":"<p class=\"q-prose\">I am constantly saddened by the motion of this Wheel of the Heavens. I am in revolt against my vile nature. I have neither enough knowledge to hide myself and not return to the world, nor intelligence enough to live there without preoccupying myself with it.<\/p>"},{"n":274,"label":"CCLXXIV","verse":"<p class=\"q-prose\">How many people that I see upon the surface of the earth are plunged in sleep [superstition]! How many I perceive that are already buried in its depths! When I throw my eyes over this desert of Not-being, how many people I see who have not yet come--how many who have already departed!<\/p>"},{"n":275,"label":"CCLXXV","verse":"<p class=\"q-prose\">Thy pity being promised me, I have no fear of sin. With the provision that Thou possessest, I have no disquiet about the journey. Thy benevolence renders my visage white and of the black book I have no fear.<\/p>"},{"n":276,"label":"CCLXXVI","verse":"<p class=\"q-prose\">Be not led to believe that I fear the world, or that I have fear of dying, or of seeing my soul go its way. Death being a truth, I have no fear of it. What I fear is that I have not lived well.<\/p>"},{"n":277,"label":"CCLXXVII","verse":"<p class=\"q-prose\">How long shall we be slaves to reason and to every day? What matters it whether we remain a hundred years in this world, or whether we dwell here but a day? Go, bring some wine in a bowl before we are transformed into pitchers in the workshop of some potter.<\/p>"},{"n":278,"label":"CCLXXVIII","verse":"<p class=\"q-prose\">How long will you blame us, O ignorant man of God! We are the patrons of the tavern, we are constantly overcome with wine. You are given up entirely to your chaplet, to your hypocrisy, and your infernal machinations. We, cup in hand and always near the object of our love, live in accordance with our desires.<\/p>"},{"n":279,"label":"CCLXXIX","verse":"<p class=\"q-prose\">Let us sell the diadem of Khan, the crown of Kai, let us sell it and buy the sound of a flute let us sell the turban and the silken cassock, yea, for a cup of wine let us sell the chaplet which in itself contains naught but hypocrisy.<\/p>"},{"n":280,"label":"CCLXXX","verse":"<p class=\"q-prose\">That day when the juice of the vine does not ferment in my head, the universe could offer me an antidote which would be a poison to me. Yea, sorrow over the things of this world is a poison, and its antidote is wine. I will take the antidote then that I may have no fear of the poison.<\/p>"},{"n":281,"label":"CCLXXXI","verse":"<p class=\"q-prose\">How long shall we blush at the injustice of others? How long shall we burn in the fire of this insipid world? Arise, banish from thee the sorrow of the world, if thou art a man; to-day is a feast; come, drink rose-colored wine.<\/p>"},{"n":282,"label":"CCLXXXII","verse":"<p class=\"q-prose\">I am in continual war with my passions, but what can I do? The memory of my deeds causes me a thousand regrets, but what can I do? I admit that in Thy clemency Thou mayest pardon my faults, but the shame of knowing that Thou knowest what I have done, that shame will remain, and what can I do?<\/p>"},{"n":283,"label":"CCLXXXIII","verse":"<p class=\"q-prose\">O my soul! we two form together the parallel of a compass. Although we have two points, we make but one body. Actually, we turn upon the same point and describe a circle, but the day will come finally, when these two points shall be united.<\/p>"},{"n":284,"label":"CCLXXXIV","verse":"<p class=\"q-prose\">Since this world is not a place of permanent sojourn for us, it would be an enormous error to deprive ourselves of wine and abstain from the favors of our well-beloved. Oh, peaceable man! how long these discussions upon the creation or upon the eternity of the world? When I no longer am, what will it matter to me whether it be ancient or modern.<\/p>"},{"n":285,"label":"CCLXXXV","verse":"<p class=\"q-prose\">Although it may be through duty that I present myself at the mosque, it certainly is not for the purpose of making a prayer. One day I stole a _sedjaddeh_ [prayer-rug]. The _sedjaddeh_ is worn out; I have returned again, and still again.<\/p>"},{"n":286,"label":"CCLXXXVI","verse":"<p class=\"q-prose\">Be not cast down by the troubles which we call vicissitudes here below. Let us occupy ourselves only in drinking pure wine, limpid wine, the color of a rose. Wine, friend, is the blood of the world. The world is our murderer; how shall we resist drinking the blood of the heart of him who spills ours?<\/p>"},{"n":287,"label":"CCLXXXVII","verse":"<p class=\"q-prose\">For the love which I bring thee, I am ready to undergo all sorts of blame, and if I violate my vow, I submit to the penalty. Oh! had I to endure until the last day the torment that thou causest me, that space of time would still seem too short.<\/p>"},{"n":288,"label":"CCLXXXVIII","verse":"<p class=\"q-prose\">We have arrived too late in this circle of being, and have descended below human dignity. Oh! since life is not passed in accordance with our vows, it is better that it should be finished, for we are glutted with it!<\/p>"},{"n":289,"label":"CCLXXXIX","verse":"<p class=\"q-prose\">Since the world is perishable, I would devise some scheme for it; I would think only of joy, or only of the limpid wine. They say to me: Would God might make thee renounce it! Nay, would that He might not give such command, for if He gave it, I would not obey!<\/p>"},{"n":290,"label":"CCXC","verse":"<p class=\"q-prose\">When, with bowed head, I have fallen at the feet of death; when this destroying angel shall have made me like a bird robbed of its plumage, then of my dust make nothing other than a flask, for the perfume of the wine that it contains might revive me for an instant.<\/p>"},{"n":291,"label":"CCXCI","verse":"<p class=\"q-prose\">When I examine closely the things of this world, what I see is that human beings in general appropriate to themselves, without merit on their part, the good it contains. As for me, O God All-Powerful! I meet only the reverse of my desires in all that falls under my eyes!<\/p>"},{"n":292,"label":"CCXCII","verse":"<p class=\"q-prose\">It is I who am the chief of habitual patrons of the tavern; it is I who am plunged in rebellion against the law, it is I who, during the long nights, soaked in pure wine, cry out to God the griefs of my heart imbrued with blood.<\/p>"},{"n":293,"label":"CCXCIII","verse":"<p class=\"q-prose\">How grow the nights without which we could not close our eyes, and before which a cruel fate comes first to sadden us! Arise, and let us breathe an instant ere the breath of the morning stirs, for, very long, alas! will this Dawn breathe when we no longer breathe!<\/p>"},{"n":294,"label":"CCXCIV","verse":"<p class=\"q-prose\">Come, see the Dawn, and, with a full cup of rose-colored wine in hand, let us breathe for an instant. As for honor, reputation, that fragile crystal, let us break it against a stone. Renounce insatiable desires, and stroke the silken tresses of the fair and list the harmonies of the harp.<\/p>"},{"n":295,"label":"CCXCV","verse":"<p class=\"q-prose\">In this world, where each breath we breathe leads to a new sorrow, it is better never to breathe an instant without a cup of wine in hand. When the breath of Aurora makes itself felt, arise and, time after time, empty the cup, for [as I have told you] this Dawn will breathe for long, long years when we no longer breathe.<\/p>"},{"n":296,"label":"CCXCVI","verse":"<p class=\"q-prose\">Should I commit all the sins of the universe, still Thy pity, I dare believe, would extend its hand to me. Hast Thou not promised to put off the day when I should be a prey to my infirmities? [Accomplish Thy promise and for that] exact not a state more frightful than that in which Thou seest me at this moment.<\/p>"},{"n":297,"label":"CCXCVII","verse":"<p class=\"q-prose\">If I am drunk with old wine, ah, well! I am. If I am an infidel, fire worshipper or idolater, ah, well! that I am. Each group of individuals forms some idea on my account. But what matters it? I belong to myself and I am what I am.<\/p>"},{"n":298,"label":"CCXCVIII","verse":"<p class=\"q-prose\">From the time since I am, I have not been for an instant without drunkenness. This night is that of _Kidr_ and I this night am drunk; my lips are glued to that of the cup and, leaning my breast against the jar, I have held the neck of the flask in my hand until day.<\/p>"},{"n":299,"label":"CCXCIX","verse":"<p class=\"q-prose\">I am constantly attracted by the sight of limpid wine, my ears are ever attentive to the melodious sounds of the flute and of the _rubab_ [viol]. Oh, if the potter make a pitcher of my dust, would that that pitcher might constantly be full of wine!<\/p>"},{"n":300,"label":"CCC","verse":"<p class=\"q-prose\">I understand all that annihilation and being apparently mean; I know the foundation of lofty thought. Ah, well! may all this knowledge be annihilated in me if I recognize in man a higher state than that of drunkenness!<\/p>"},{"n":301,"label":"CCCI","verse":"<p class=\"q-prose\">I indeed drink wine, but I commit no disorder. I stretch out my hand, but it is only to seize the cup. Would you know why I am an adorer of wine? It is because I do not wish to imitate you and be an adorer of myself.<\/p>"},{"n":302,"label":"CCCII","verse":"<p class=\"q-prose\">Are you discreet enough for me to tell you in a few words what man has been from the beginning? A miserable creature, moulded in the clay of chagrin. He has, for a few years, eaten his morsel here below, and then has raised his foot and gone away.<\/p>"},{"n":303,"label":"CCCIII","verse":"<p class=\"q-prose\">It is the rim of the wine-jar which we have chosen for our place of prayer; it is in making use of wine that we are rendered worthy of the name of man; it is in the tavern that we get back the time lost in the mosque.<\/p>"},{"n":304,"label":"CCCIV","verse":"<p class=\"q-prose\">It is we who are the true aim of universal creation; it is we who, in the eyes of wisdom, are the essence of divine regard. The circle of this world is like a ring and, without doubt, we are the jeweled signet of it.<\/p>"},{"n":305,"label":"CCCV","verse":"<p class=\"q-prose\">Drunkenness has transported us from our own misery here below to untold joys; from our humble condition, it has raised our heads to the skies. Nevertheless, behold us finally freed from our thraldom to the body! Behold us returned again to the earth, whence we came!<\/p>"},{"n":306,"label":"CCCVI","verse":"<p class=\"q-prose\">If I have eaten during the days of Ramazan, do not believe I did it through inadvertence. The fatiguing hardships of the fast have so turned about my days and nights [the one for the other] that I have always believed in eating the morning repast.<\/p>"},{"n":307,"label":"CCCVII","verse":"<p class=\"q-prose\">We have constantly heads overcome with wine; the presence of wine alone animates our society. Then leave off thy counsel, O ignorant penitent! [you see that] we are the adorers of wine, and that the lips of the object of our love are turned to our desires.<\/p>"},{"n":308,"label":"CCCVIII","verse":"<p class=\"q-prose\">This is the season of roses. Oh! I would now give rein to one of my desires. I would commit an act which infringes on the law of the Koran. Yea, for some days, in company of the fair with velvet and bright tinted cheeks spreading rose-colored wine over the green turf, I would transform the plain into a field of tulips.<\/p>"},{"n":309,"label":"CCCIX","verse":"<p class=\"q-prose\">When in this world joy seizes us, when it gives to our complexion the brilliant lustre of the courser of the firmament [the sun], then I love to be in a green prairie in the midst of beauties with velvet cheeks, and partake with them of this sweet green hasheesh ere going again myself under this earth covered with green sod.<\/p>"},{"n":310,"label":"CCCX","verse":"<p class=\"q-prose\">Never have we tasted in happiness a drop of water without the hand of grief appearing to present to us its bitter beverage. Never have we dipped a piece of bread in salt without the salt returning to re-open half-healed wounds of the heart.<\/p>"},{"n":311,"label":"CCCXI","verse":"<p class=\"q-prose\">Take care, take good care of making noise in a tavern! Pass the time there, but avoid all agitation. Sell the turban, sell the book [the Koran] to buy wine. Finally, let us pass through the _medresseh_ [school of the mosques], but let us not stop there.<\/p>"},{"n":312,"label":"CCCXII","verse":"<p class=\"q-prose\">Every day, at dawn, I go to the tavern. There I give myself to the company of _kalendar_ hypocrites. O Thou, who art the master of secrets most concealed, give me faith, if Thou wishest me to apply myself to prayer.<\/p>"},{"n":313,"label":"CCCXIII","verse":"<p class=\"q-prose\">To the cares of this world, let us not accord as much value, even, as to a grain of barley; oh! let us be happy! If we have something for breakfast, we may have nothing for dinner; oh! let us be happy! Although nothing well cooked comes to us from the kitchen, let us not address our troublesome prayers to any one; oh! let us be happy!<\/p>"},{"n":314,"label":"CCCXIV","verse":"<p class=\"q-prose\">Not a single day do I feel myself free from the troublesome bonds of this world; not for a single instant do I breathe contented with my being. I have long served an apprenticeship to human vicissitudes, and I have not yet become master, either in that which concerns this world, or in what has to do with the other.<\/p>"},{"n":315,"label":"CCCXV","verse":"<p class=\"q-prose\">We, in one hand, take the Koran; with the other we seize the cup: sometimes you see us carried away with that which is lawful, sometimes with what is prohibited. We, then, beneath this azure vault, are not completely infidel, or absolutely Musulman.<\/p>"},{"n":316,"label":"CCCXVI","verse":"<p class=\"q-prose\">Present a salutation on my account to Mostapha, and afterward say to him with all the deference due: O Lord Hachemite! why, in accordance with the law of the Koran, is the sharp _doug_ [whey] lawful, yet pure wine prohibited?<\/p>"},{"n":317,"label":"CCCXVII","verse":"<p class=\"q-prose\">Present a salutation on my part to Khayyam, and then say to him: O Khayyam! you are an ignorant man. When have I said that wine was prohibited? It is lawful for intelligent men; it is prohibited only to the ignorant.<\/p>"},{"n":318,"label":"CCCXVIII","verse":"<p class=\"q-prose\">O thou that lusteth night and day for the goods of this world, dost thou not reflect upon the terrible day? Take into consideration thy last breath, come back to self, and see how time deals with others.<\/p>"},{"n":319,"label":"CCCXIX","verse":"<p class=\"q-prose\">O thou who art the summing up of the universal creation, cease for an instant to occupy thyself with gain or loss; take a cup of wine from the hand of the etern cupbearer, and free thyself thus altogether from the cares of this world and from those of the other!<\/p>"},{"n":320,"label":"CCCXX","verse":"<p class=\"q-prose\">If you know to what to cling upon this walk around a circle without end, you must recognize two classes of men: those who understand perfectly its good and its bad side, and those who have no notion either of themselves or of things here below.<\/p>"},{"n":321,"label":"CCCXXI","verse":"<p class=\"q-prose\">Render light to my heart the weight of the vicissitudes of this world. Conceal from mortals my reprehensible actions. Render me happy to-day, and to-morrow make me what thou deemest worthy of Thy pity.<\/p>"},{"n":322,"label":"CCCXXII","verse":"<p class=\"q-prose\">For him who makes account of human ills, joy, sorrow, pain are all identical. The good and the bad of this world must one day end. What matters it whether all be torment or pleasure for us?<\/p>"},{"n":323,"label":"CCCXXIII","verse":"<p class=\"q-prose\">Now that the nightingale has made its voice heard, think no longer of anything, but seize the ruby cup of wine from the hand of the drinkers; arise, come, for the rose blossoms are breathing out joy; avenge thyself, avenge thyself for two or three days for the torments thou hast endured.<\/p>"},{"n":324,"label":"CCCXXIV","verse":"<p class=\"q-prose\">Notice this cup made of clay; it is possessed of a soul! They say a jasmine produces the flowers of the Judas-tree. But what do I say? The shining purity of wine is a cause of my error? Oh, no [it is not wine], it is diaphanous water shot with a liquid fire.<\/p>"},{"n":325,"label":"CCCXXV","verse":"<p class=\"q-prose\">Arise, leave the cares of this world which are fleeting; be joyous, pass gaily this life of a moment, for if the favors of heaven had been constant to others, this turn of joy would not have come to you.<\/p>"},{"n":326,"label":"CCCXXVI","verse":"<p class=\"q-prose\">Listen to me, O thou who hast not seen old friends [of experience]! Vex not thyself with this Wheel of Heaven which has neither surface nor foundation: content thyself with what thou hast and, as a peaceable spectator, observe here below the various games to which men are destined.<\/p>"},{"n":327,"label":"CCCXXVII","verse":"<p class=\"q-prose\">Employ all thy efforts to be agreeable to drinkers, and follow the good counsel of Khayyam. O friend! demolish the bases of prayer and of fasting, drink wine, steal if you will, but do good.<\/p>"},{"n":328,"label":"CCCXXVIII","verse":"<p class=\"q-prose\">Justice is the soul of the universe, the universe is the body. The angels are the wit of the body, the heavens the elements, the creatures in it are the members; behold here the eternal unity. The rest is only trumpery.<\/p>"},{"n":329,"label":"CCCXXIX","verse":"<p class=\"q-prose\">Yesterday evening, in the tavern, the object of my heart that ravishes my soul [God] presented me a cup with a ravishing air of sincerity and a desire to please me, inviting me to drink. No, said I to him, I will not drink. Drink, he answered me, for the love of my heart.<\/p>"},{"n":330,"label":"CCCXXX","verse":"<p class=\"q-prose\">Do you wish the universe to submit itself to your will? Occupy yourself without ceasing in fortifying your soul. Share my mood, which consists in drinking wine and never taking to myself the cares of things here below.<\/p>"},{"n":331,"label":"CCCXXXI","verse":"<p class=\"q-prose\">The sages who have well considered this world of dust, this sojourn of inconstancy from one end to the other, see nothing in it agreeable but wine in ruby cups and beautiful countenances.<\/p>"},{"n":332,"label":"CCCXXXII","verse":"<p class=\"q-prose\">Thanks to the iniquity of this Wheel of Heaven which resembles a mirror, thanks to the periodic motion of time which accords its favors only to the most abject, my cheeks, hollowed like a cup, are bathed in tears; but, like a flask, my heart is full of blood.<\/p>"},{"n":333,"label":"CCCXXXIII","verse":"<p class=\"q-prose\">Yesterday [before day], in company with a charming friend and a cup of rose-colored wine, I was seated on the border of a brook. Before me stood the cup, that shell, of which the pearl [contained in the cup] shed such a brilliant light that the herald of the sun, awaking with a start, announced the Dawn.<\/p>"},{"n":334,"label":"CCCXXXIV","verse":"<p class=\"q-prose\">Forget the day which has been cut off from thy existence; disturb not thyself about to-morrow, which has not yet come; rest not upon that which is or that which is no more; live happily one instant and throw not thy life to the winds.<\/p>"},{"n":335,"label":"CCCXXXV","verse":"<p class=\"q-prose\">Art not ashamed to give thyself to corruption?--to neglect thus both what is commanded and what is forbidden? Even if you succeed in appropriating all the goods of the earth to yourself, what can you do with them except to abandon them in your turn?<\/p>"},{"n":336,"label":"CCCXXXVI","verse":"<p class=\"q-prose\">I have seen a man betake himself to sterile soil. He was neither a heretic nor a Musulman; he had neither riches nor religion, nor God, nor truth, nor law, nor certitude. Who in this world or in the other would have so much courage?<\/p>"},{"n":337,"label":"CCCXXXVII","verse":"<p class=\"q-prose\">One host of men is pondering upon belief, or on the faith; others are hovering between doubt and certainty. But suddenly behind the veil there&#x27;s one will cry: O ignorant ones! the way that you seek is neither here nor there!<\/p>"},{"n":338,"label":"CCCXXXVIII","verse":"<p class=\"q-prose\">There hangs in the heavens a bull called Parwin [Pleiades], and another bull is underneath the earth. To the eyes of intelligence or those who live in certainty, I show a herd of asses placed between two beeves.<\/p>"},{"n":339,"label":"CCCXXXIX","verse":"<p class=\"q-prose\">Some said to me: Drink less of wine. What reason have you for not giving it up? The reason that I give is first the face of my friend [God] and secondly the morning cup. Be just and tell me, Is it possible to give a more luminous reason?<\/p>"},{"n":340,"label":"CCCXL","verse":"<p class=\"q-prose\">If I possessed in the heavens the power which God exercises there, I would destroy the people of this world, and others I would make in my own way, so that man, freed [from the bonds of superstition], could attain here below the desires of his heart.<\/p>"},{"n":341,"label":"CCCXLI","verse":"<p class=\"q-prose\">My poor heart, full of grief and folly, has not been able to free itself from drunkenness where passion for my well-beloved has plunged it. Oh! the day when the wine of this love was distributed, my portion was, without doubt, drawn from the blood of my heart!<\/p>"},{"n":342,"label":"CCCXLII","verse":"<p class=\"q-prose\">To drink wine and seek beautiful faces is wiser than to practise hypocrisy and apparent devotion. It is evident that if there exist a Hell for lovers and drinkers, no one would wish for Paradise.<\/p>"},{"n":343,"label":"CCCXLIII","verse":"<p class=\"q-prose\">Scorn the words of coquettish women, but accept limpid wine from the hand of those whose mien is irreproachable. You know that all those who have made their appearance in this world are partly of one kind and partly of the other, and it is not given to any to see a single one that may come back.<\/p>"},{"n":344,"label":"CCCXLIV","verse":"<p class=\"q-prose\">It is not necessary to soften and disgrace a joyous heart by sorrow, to break under the stones of torment our moments of delight. As no one is able to tell what is to be, what is necessary is some wine, a beloved mistress [the Divinity], and repose according to our desires.<\/p>"},{"n":345,"label":"CCCXLV","verse":"<p class=\"q-prose\">Yes, it is beautiful to enjoy good fame; it is shameful to complain of the injustice of heaven; it is better to become drunk with the juice of the grape, than to be puffed up with false devotion.<\/p>"},{"n":346,"label":"CCCXLVI","verse":"<p class=\"q-prose\">O God! be pitiful to my poor imprisoned heart; show pity to my bosom, susceptible to so much sorrow; pardon my feet which lead me to the tavern; pardon my hand which seizes the cup!<\/p>"},{"n":347,"label":"CCCXLVII","verse":"<p class=\"q-prose\">O God! deliver me from calculating, more or less, upon the things of this world; make me preoccupied with Thee, and free me from myself. While I have my sound reason good and bad are known to me; render me drunk and free me from this knowledge of good and bad.<\/p>"},{"n":348,"label":"CCCXLVIII","verse":"<p class=\"q-prose\">This Wheel of Heaven runs after my death and thine, my friend· it conspires against my soul and thine. Come, seat thyself upon the turf, for, indeed, small time remains to us before new turf shall germinate from my dust and from thine.<\/p>"},{"n":349,"label":"CCCXLIX","verse":"<p class=\"q-prose\">When we shall have lost my soul and thine, they will place bricks upon thy tomb and mine. Then, in order to cover other tombs with bricks, they will throw my dust and thine into the kiln of the brick-maker.<\/p>"},{"n":350,"label":"CCCL","verse":"<p class=\"q-prose\">In this castle which by its splendor rivals the heavens, this castle to which sovereigns succeeded with delight, we have seen a turtledove seated on the ruined battlements crying: Kou, kou, kou, kou [Where? Where?].<\/p>"},{"n":351,"label":"CCCLI","verse":"<p class=\"q-prose\">What advantage has our coming into this world produced? What advantage will result from our departure? What remains to us of the heap of hopes that we have conceived. Where is the smoke of all the pure men who under the celestial fire have been consumed and become dust?<\/p>"},{"n":352,"label":"CCCLII","verse":"<p class=\"q-prose\">O Thou whose lips secrete the water of life, permit not those of the cup to come and kiss them! [Oh, if Thou shouldst permit it], may I lose the name of man if I am not soaked in the blood of the flask, for what is it, this cup, to dare to touch its lips to Thine?<\/p>"},{"n":353,"label":"CCCLIII","verse":"<p class=\"q-prose\">I am such as Thy power has made me. I have lived a hundred years filled with Thy benevolence and benefits. I would like still a hundred years to commit sin and to see if the sum of my faults outweighed Thy pity.<\/p>"},{"n":354,"label":"CCCLIV","verse":"<p class=\"q-prose\">Now take thy cup, carry away the gourd, O Charm of my Heart! and go, explore the plains, the borders of the brooks, for indeed idols, like to the moon in the light of their beautiful countenances, have a hundred times been transformed into cups, a hundred times have they become gourds.<\/p>"},{"n":355,"label":"CCCLV","verse":"<p class=\"q-prose\">It is we who buy old wine and new wine, and it is we who sell the world for two grains of barley. Know where you will go after death? Bring me some wine and go where you will.<\/p>"},{"n":356,"label":"CCCLVI","verse":"<p class=\"q-prose\">Who is the man who here below has not committed sin; can you say? Had he not committed it, could he have lived, can you tell? If, because I do evil, you punish me for evil, what then is the difference between you and me, can you say?<\/p>"},{"n":357,"label":"CCCLVII","verse":"<p class=\"q-prose\">Oh! where is that one whose lips are of rubies, where that precious stone of Bedekhchan? Where is that wine full of perfume which gives repose to the soul? They say that the religion of Islam prohibits it; drink, friend, and have no fear, for where do you see Islam?<\/p>"},{"n":358,"label":"CCCLVIII","verse":"<p class=\"q-prose\">Best is it to abstain from all that is not joyful; and best it is to receive the cup from the hands of odalisques shut up in the palaces of the princes; but best of all is drunkenness, indifference to the Kalendars, forgetfulness of self. A mouthful of wine, finally, is worth more than all that exists in the space between Mah and Mahi.<\/p>"},{"n":359,"label":"CCCLIX","verse":"<p class=\"q-prose\">For thee, that which is best is to flee from the seeking of knowledge and devotion; to finger the tresses of thy ravishing friend; to pour into the cup the blood of the vine ere time has spilled thine own.<\/p>"},{"n":360,"label":"CCCLX","verse":"<p class=\"q-prose\">O friend! be in repose amidst human vicissitudes; disturb not thyself in vain because of the march of time. When the envelope of thy being shall be torn in tatters, what matters what thou hast done, what thou hast said, or how defiled thou mayest be?<\/p>"},{"n":361,"label":"CCCLXI","verse":"<p class=\"q-prose\">O thou who hast not done good, but who hast done evil, and who hast afterward sought refuge in the Divinity, guard thyself from relying upon pardon; for he who has done nothing resembles no more him who has sinned than he who has sinned resembles him who has done nothing!<\/p>"},{"n":362,"label":"CCCLXII","verse":"<p class=\"q-prose\">Count upon life not longer than the sixtieth year. Place thy foot in no direction without being overcome with wine. As long as thy skull hath not been made a pitcher, go always on thy way, nor take the wine-gourd from thy shoulder or the wine-cup from thy hand.<\/p>"},{"n":363,"label":"CCCLXIII","verse":"<p class=\"q-prose\">This firmament is a porringer overturned upon our heads. Wise men, thereat, humble and unpresumptuous are. But see the friendship which obtains between the cup and the flask. Lip against lip are they, and twixt them ever flows the blood.<\/p>"},{"n":364,"label":"CCCLXIV","verse":"<p class=\"q-prose\">I have swept the sill of the tavern with my hair. Yes, I have given up reflecting upon the good and the bad in this world and the next. I saw them, like two bowls, rolling in a ditch, when I was sleeping overcome with wine, and I no more occupied myself with them than if I had seen a grain of barley rolling along.<\/p>"},{"n":365,"label":"CCCLXV","verse":"<p class=\"q-prose\">The drop of water began to weep on being separated from the ocean. The ocean began to laugh, saying to it: It is we who are all; in truth, there is no other God beside us, and if we are separated, it is only by a simple point almost invisible.<\/p>"},{"n":366,"label":"CCCLXVI","verse":"<p class=\"q-prose\">How long shall I trouble myself with the care of knowing whether I possess or do not possess--if I ought or ought not to pass life gaily? Fill ever the cup of wine, O cupbearer! for I do not know whether I shall breathe out this breath that I am actually breathing or not.<\/p>"},{"n":367,"label":"CCCLXVII","verse":"<p class=\"q-prose\">Become not a prey to sorrow in this world of iniquity; recall not to thy soul the memory of those who are no longer here; give up thy heart only to a friend with sweet lips and fairy-like in form and never be deprived of wine, or throw life to the winds.<\/p>"},{"n":368,"label":"CCCLXVIII","verse":"<p class=\"q-prose\">How long will you speak to me of the mosque, of prayer and fasting? Go rather to the tavern and intoxicate yourself, and even for that ask alms. O Khayyam! drink wine, drink; for this earth of which thou art composed will be made into cups, bowls, and pitchers.<\/p>"},{"n":369,"label":"CCCLXIX","verse":"<p class=\"q-prose\">So in this palace of brief being, you ought, O wise man, to give yourself up to rose-colored wine. Then each atom of your dust that the wind carries away will fall on the sill of the tavern, all saturate with wine.<\/p>"},{"n":370,"label":"CCCLXX","verse":"<p class=\"q-prose\">Note how the zephyrs have made the roses bloom! Note how their fragrant beauty glads the nightingale! Go, then, repose in the shadow of these flowers, for very speedily they depart from the earth and very often ne&#x27;er return again.<\/p>"},{"n":371,"label":"CCCLXXI","verse":"<p class=\"q-prose\">Behold us re-united in the midst of lovers; behold us freed from the pain which time inflicts; having emptied the cup of His love, behold us all free, all tranquil, all o&#x27;ercome with wine.<\/p>"},{"n":372,"label":"CCCLXXII","verse":"<p class=\"q-prose\">Suppose that you have lived in this world in accordance with your desires; ah, well! after that? Think to yourself that the end of your days has arrived; ah, well! after that? Admitting that you have lived for a hundred years surrounded by all that your heart could desire, imagine in your turn, that you have another hundred years to live; ah, well! after that?<\/p>"},{"n":373,"label":"CCCLXXIII","verse":"<p class=\"q-prose\">Do you know how the cypress and the lily have acquired the name for freedom which they enjoy among men? It is because one has ten tongues but remains mute, and the other possesses a hundred hands and keeps them all empty.<\/p>"},{"n":374,"label":"CCCLXXIV","verse":"<p class=\"q-prose\">O cupbearer! put into my hand some of that delicious wine, some of that juice attractive as a charming idol, some of that nectar, in short, which like a chain whose links, turning and returning upon each other, hold fools and sages alike in sweet captivity.<\/p>"},{"n":375,"label":"CCCLXXV","verse":"<p class=\"q-prose\">O regret! that life should be passed in pure loss! How lawless all our eating and how defiled our bodies! I have the blame, O God! of not having done what Thou hast commanded. What will come to me for having done what Thou hast not commanded?<\/p>"},{"n":376,"label":"CCCLXXVI","verse":"<p class=\"q-prose\">Fret not thyself on account of the inconstancy of this world; seek wine and draw near to thy caressing mistress, for, thou seest that he whom his mother brought forth to-day to-morrow disappears from the earth--to-morrow returns to annihilation.<\/p>"},{"n":377,"label":"CCCLXXVII","verse":"<p class=\"q-prose\">I can renounce all else, but wine never; for I have the means of making amends for all else, but of wine, never. O God! could one like me become a Musulman and renounce old wine? Never.<\/p>"},{"n":378,"label":"CCCLXXVIII","verse":"<p class=\"q-prose\">We are all lovers, all drunkards, all adorers of wine. We are all united in the tavern, having banished far from us all that is good, all that is evil, all reflection and revery. Oh! expect not intelligence or reason of us, for we are all overcome with wine.<\/p>"},{"n":379,"label":"CCCLXXIX","verse":"<p class=\"q-prose\">It is we who have confidence in the divine goodness, who have shaken off the ideas of obedience and sin; for where Thy benevolence exists, O God, he who has done nothing is equal to him who has done something.<\/p>"},{"n":380,"label":"CCCLXXX","verse":"<p class=\"q-prose\">Thou hast imprinted on our being, O God, such singular phantasma of inconsequence, and hast made to rise such strange phenomena. Myself cannot be better than I am, for Thou hast taken me as I am from out creation&#x27;s crucible.<\/p>"},{"n":381,"label":"CCCLXXXI","verse":"<p class=\"q-prose\">We have violated all the vows that we have made; we have closed upon us the door of what is called good and what is called bad. Then blame me not if you see me committing senseless deeds, for we are drunk with the wine of love, and all are drunk as we.<\/p>"},{"n":382,"label":"CCCLXXXII","verse":"<p class=\"q-prose\">A mouthful of old wine is of more worth than a new empire. The wise man will reject all that is not wine. A cup of this nectar is a hundred times preferable to the kingdom of Feridoun. The lid which covers the wine-jar is more precious than the diadem of Kai-Khosrou.<\/p>"},{"n":383,"label":"CCCLXXXIII","verse":"<p class=\"q-prose\">O my heart! thou canst not penetrate the enigmatical secrets of the heavens; thou canst never reach the culminating point to which intrepid sages have attained. Be content, then, to organize a Paradise here below, in making daily use of cup and wine, for wilt thou ever reach that future Paradise? Thou never wilt.<\/p>"},{"n":384,"label":"CCCLXXXIV","verse":"<p class=\"q-prose\">Those who are gone before us, O cupbearer! are imbedded in the dust of pride. Go, drink wine; go, listen to the truth that I tell you: All those who have gone ahead are but as the wind; know it well, O cupbearer!<\/p>"},{"n":385,"label":"CCCLXXXV","verse":"<p class=\"q-prose\">From afar has appeared a filthy shape. It is said that its body was covered with a shirt made of the smoke of Hell. It was neither a man nor a woman. It has broken our flask and spilled upon the earth the ruby wine it contained, glorifying itself at having done a deed worthy of a man.<\/p>"},{"n":386,"label":"CCCLXXXVI","verse":"<p class=\"q-prose\">O my heart! when thou art admitted to sit at the banquet of this idol [the Divinity], it is after thou hast gone out of thyself in order to re-enter thyself again. When thou hast tasted a mouthful of the wine of annihilation, thou art entirely separate from those that are and from those that are no more.<\/p>"},{"n":387,"label":"CCCLXXXVII","verse":"<p class=\"q-prose\">Yes, I have found myself in close acquaintance with wine, with drunkenness. But why does the world blame me for it? Oh! would to God that all which is illegal might produce drunkenness! For then never here below should I have seen a shadow of sound reason.<\/p>"},{"n":388,"label":"CCCLXXXVIII","verse":"<p class=\"q-prose\">Thou hast broken my pitcher of wine, my God! Thou hast shut upon me the portals of joy, my God! Thou hast poured upon earth my limpid wine, my God! Oh! [would that my mouth were filled with earth!] couldst Thou have been drunk, my God?<\/p>"},{"n":389,"label":"CCCLXXXIX","verse":"<p class=\"q-prose\">O thou who art the result of the four [elements] and the seven [heavens], I see you in perplexity amongst these four and seven. Drink wine, for, as I have said to you more than four times, you will return no more; once departed, you are gone indeed.<\/p>"},{"n":390,"label":"CCCXC","verse":"<p class=\"q-prose\">On one hand, Thou hast raised a hundred ambushes about us; on the other, Thou sayest to us: If ye put foot there, ye shall be caught by death. It is Thou who spreadest snares, and whoever falls there, Thou bringest to a stand! Thou givest him to death and callest him rebel!<\/p>"},{"n":391,"label":"CCCXCI","verse":"<p class=\"q-prose\">O Thou whose mysterious essence is impenetrable to intelligence, Thou who carest no more for our obedience than our faults, I am drunk with sin, but the confidence that I have in Thee renders it right for me. Know Thou, that I count upon Thy pity.<\/p>"},{"n":392,"label":"CCCXCII","verse":"<p class=\"q-prose\">If this world&#x27;s things were only based on show, oh! then each day would be a feast. Oh! were it not for these vain threats, each could attain below the aim of his desires, without a fear.<\/p>"},{"n":393,"label":"CCCXCIII","verse":"<p class=\"q-prose\">O Wheel of Heaven! thou fillest constantly my heart with woe. Thou killest in me the germ of joy, with water ladening the air which, would breathe, and changest into mud the water that I drink.<\/p>"},{"n":394,"label":"CCCXCIV","verse":"<p class=\"q-prose\">O my heart! if thou free thyself from the grief inherent in matter, thou shalt become a soul in all its purity; thou shalt mount to the heavens, thy residence shall be the firmament. Oh! how thou shouldst suffer from shame at inhabiting the earth!<\/p>"},{"n":395,"label":"CCCXCV","verse":"<p class=\"q-prose\">O potter! be attentive, if thou possessest sound reason! How long wilt thou abase man in moulding his clay? It is the finger of Feridoun, the hand of Kai-Khosrou which you thus put upon your wheel.<\/p>"},{"n":396,"label":"CCCXCVI","verse":"<p class=\"q-prose\">O rose! thou art the face of some young ravishing fair! O wine! thou art the ruby whose brightness joys my soul! O fateful fortune! each instant thou appearest more strange to me, and nevertheless I seem to know thee.<\/p>"},{"n":397,"label":"CCCXCVII","verse":"<p class=\"q-prose\">From the cookery of this world, thou only absorbest the smoke. How long, plunged in the search for being and annihilation, wilt thou be the prey of sorrow? This world contains only loss for those who attach themselves to it. Now disregard this loss, and all for thee will benefit become.<\/p>"},{"n":398,"label":"CCCXCVIII","verse":"<p class=\"q-prose\">As for us, let us not try to torment men in their sleep; let us refrain from making them utter at midnight the lamentable cry _O my God! O my God!_ [as others do]. Rest not upon riches or beauty, for the one will take wings in the night, and the other, in the night also, will be ravished.<\/p>"},{"n":399,"label":"CCCXCIX","verse":"<p class=\"q-prose\">If from the commencement Thou hadst wished to make me known to _myself_, why later, hast Thou separated me from this _myself_? If from the first day Thy intention was to abandon me, why hast Thou thrown me, all amazed, into the midst of the world?<\/p>"},{"n":400,"label":"CD","verse":"<p class=\"q-prose\">Oh! would to God that there existed some place of repose--that the road we follow had some settled end! Would God that, after a hundred thousand years, we could conceive the hope of one new birth of heart upon the earth as the green turf is born again!<\/p>"},{"n":401,"label":"CDI","verse":"<p class=\"q-prose\">While I was drawing a horoscope in the book of love, suddenly, from the burning heart of a wise man came these words. Happy is he who entertains in his dwelling a friend as beautiful as the moon, and who has in prospect a night as long as a year!<\/p>"},{"n":402,"label":"CDII","verse":"<p class=\"q-prose\">The constant sequence of springtime and autumn makes the leaves of our existence disappear. Drink wine, my friend, for sages have well said that grief in this world is a poison and its antidote is wine.<\/p>"},{"n":403,"label":"CDIII","verse":"<p class=\"q-prose\">O my heart! drink of wine, drink of it in a garden and enjoy the presence of thy friend [the Divinity]; renounce hypocrisy and show. Is it the doctrine of Ahmed you follow? In that case, draw from the fountain-head a cup of wine into the bowl which Ali, in his round of cupbearing, shall serve.<\/p>"},{"n":404,"label":"CDIV","verse":"<p class=\"q-prose\">But yesterday, at eve, I broke a china cup against a stone. I was drunk when committing this senseless act. This cup seemed to say to me: &quot;I have been like thee; thou wilt, in thy turn, be like me.&quot;<\/p>"},{"n":405,"label":"CDV","verse":"<p class=\"q-prose\">The flowers are in blossom, O cupbearer! bring wine. Leave thy acts of worship, O cupbearer! Ere the angel of death put a watch upon us, come, and with a cup of ruby wine in hand, let us rejoice while yet there are some days with the sweet presence of the friend [the Divinity].<\/p>"},{"n":406,"label":"CDVI","verse":"<p class=\"q-prose\">Arise, get off thy bed, O cupbearer! and pour the limpid wine. Before they yet make pitchers of our skulls, pour out some wine from pitcher into bowl, O cupbearer!<\/p>"},{"n":407,"label":"CDVII","verse":"<p class=\"q-prose\">This hypocrisy [which I everywhere see], O cupbearer! crushes my heart with weariness. Arise, and gaily bring me wine, O cupbearer! and to procure it, put in pawn the prayer-rug and the turban. Perhaps my arguments will then rest upon a solid basis.<\/p>"},{"n":408,"label":"CDVIII","verse":"<p class=\"q-prose\">Examine thyself, if thou art intelligent, and observe what thou hast brought in the beginning and what thou wilt carry away at the end. Thou sayest that thou dost not drink because one must die. Whether thou drinkest friend, or dost not drink, thou needs must die.<\/p>"},{"n":409,"label":"CDIX","verse":"<p class=\"q-prose\">Open the door, for it is only Thou who canst open it; show me the way, for it is only Thou who canst show a way of safety. I will give my hand to none of those who wish to lead me, for all are perishable, and only Thou eternal.<\/p>"},{"n":410,"label":"CDX","verse":"<p class=\"q-prose\">All that you tell me emanates from hatred [O mullah]! You never cease to treat me as an atheist, a man without religion. I am convinced of that which I am, and I avow it; and should I be right, is it for you to lecture me thus?<\/p>"},{"n":411,"label":"CDXI","verse":"<p class=\"q-prose\">Resign yourself to grief if you would find a remedy, and do not complain of your suffering if you would cure it. In poverty, be thankful to Providence, if you wish some day to have riches for your portion.<\/p>"},{"n":412,"label":"CDXII","verse":"<p class=\"q-prose\">I have seen a wise man in the house of a drunken man at evening. I asked him if he could give me some news of the absent. He answered me: Drink wine, friend, for many like you have gone out but have never returned.<\/p>"},{"n":413,"label":"CDXIII","verse":"<p class=\"q-prose\">I seek a flask of ruby wine, a book of verse, a momentary peace in life and bread enough. And if with these, my friend, in some lone spot with thee I could repose, &#x27;twould be a happiness above a Sultan&#x27;s regal joy.<\/p>"},{"n":414,"label":"CDXIV","verse":"<p class=\"q-prose\">How long these arguments upon the five and the four, O cupbearer? In comprehending one, O cupbearer! it is difficult to grasp a hundred thousand. We are all of earth, O cupbearer! strike the harp: we are all as the wind, bring the wine, O cupbearer!<\/p>"},{"n":415,"label":"CDXV","verse":"<p class=\"q-prose\">How long will you speak of Yassin and Berat, O cupbearer? Give me a treatise upon the tavern, O cupbearer! The day that it is closed will be for me the night of Berat, O cupbearer!<\/p>"},{"n":416,"label":"CDXVI","verse":"<p class=\"q-prose\">While you have in your body bones, veins, and nerves, place not your foot outside the limits of your destiny. Yield never to your enemy, be that enemy Rustum, son of Zal; accept nothing which puts you under obligation to a friend, be that friend Hatim-tai.<\/p>"},{"n":417,"label":"CDXVII","verse":"<p class=\"q-prose\">You may indeed be taken with lips tinted with the color of the ruby, you may indeed appreciate the cup of wine, you may indeed call for the noise of the drum, the sound of the harp and of the flute, but these are only trifles. God is my witness, while you do not break the bonds of this dark world, you nothing are.<\/p>"},{"n":418,"label":"CDXVIII","verse":"<p class=\"q-prose\">Bestir yourself, since you are under this tyrannic vault; drink wine, since you are in this world, a seat of woe. And, from beginning to the end, being only earth, act like a man who is upon the earth, and not as if thou wert beneath the earth.<\/p>"},{"n":419,"label":"CDXIX","verse":"<p class=\"q-prose\">Since you all secrets know, my friend, why be a prey to so many vain torments? Suppose things do not fall in touch with your desires, you can at least be gay while you still breathe.<\/p>"},{"n":420,"label":"CDXX","verse":"<p class=\"q-prose\">Everywhere I cast my eyes I believe I see the sod of Paradise and the brook of Koocer. They say the field outside of Hell is transformed into a celestial sojourn. Rest then in that celestial place near some celestial fair.<\/p>"},{"n":421,"label":"CDXXI","verse":"<p class=\"q-prose\">Follow no other way than that which the Kalendar follows; seek no other place than the tavern; occupy yourself only with wine, song and the friend [the Divinity]; place in your hand a cup of wine, upon your back a gourd; drink, O dear object of my heart! drink and speak not of foolish things.<\/p>"},{"n":422,"label":"CDXXII","verse":"<p class=\"q-prose\">Do you wish life to rest upon a rock? Do you wish life for some time free to be from grief? Dwell for one instant without drinking wine, then at each breath you&#x27;ll find a new attraction in existence.<\/p>"},{"n":423,"label":"CDXXIII","verse":"<p class=\"q-prose\">In this world, this house of pilferers, it is useless to count upon a friend. Listen to the counsel I give you, and confide it to no one. Bear your suffering and seek no remedy here, be happy in your sorrows and try not to divide them with another.<\/p>"},{"n":424,"label":"CDXXIV","verse":"<p class=\"q-prose\">There are two things which are the foundation of wisdom and which ought to be put among the number of the most important unproclaimed revelations. Not to eat of anything which eats of other things, and to keep oneself unsullied by all that lives.<\/p>"},{"n":425,"label":"CDXXV","verse":"<p class=\"q-prose\">How is it that at the commencement of springtime the verjuice of the vine is sharp? And afterwards, how does it become so sweet? And then how do we find the wine so bitter? If one makes viols of a piece of wood by means of a curvèd knife, who would say on seeing it that a flute could be fashioned by the same means?<\/p>"},{"n":426,"label":"CDXXVI","verse":"<p class=\"q-prose\">Know you why, at the break of day, the early-rising cock makes its voice heard each moment? It is to tell you, through the mirror of the morning, that one more night has slipped away from your existence, and that you are still in ignorance.<\/p>"},{"n":427,"label":"CDXXVII","verse":"<p class=\"q-prose\">Give me some of this ruby wine, tinted like the tulip. Pour from the neck of the flask the pure blood it contains, for, to-day I can see, outside this cup of wine, no friend whose inner man is pure.<\/p>"},{"n":428,"label":"CDXXVIII","verse":"<p class=\"q-prose\">Pour me, O cupbearer! some wine colored like the flowers of the Judas-tree, pour, O cupbearer! for grief comes to oppress my soul; pour for me the nectar, for it is possible that in making me a stranger to myself, it will free me one instant from the vicissitudes of this world.<\/p>"},{"n":429,"label":"CDXXIX","verse":"<p class=\"q-prose\">Thy cup, O my cupbearer! contains liquid rubies; give some to my soul, O cupbearer! Let it reflect that precious stone; put in my hand, O cupbearer, this incomparable cup, for through this I will give new life unto my soul.<\/p>"},{"n":430,"label":"CDXXX","verse":"<p class=\"q-prose\">In philosophy, if you are an Aristotle or a Bouzourdj-mehr; in power, if you are some Roman emperor or some potentate of China, drink ever, drink wine from the cup of Djem, for the end of all is the tomb. Oh! though you are Bahram himself, the coffin is your last sojourn.<\/p>"},{"n":431,"label":"CDXXXI","verse":"<p class=\"q-prose\">I entered the studio of a potter. I watched him work at his wheel, actively occupied in moulding the necks and handles of pitchers, forming some of them like the heads of kings, others like the feet of beggars.<\/p>"},{"n":432,"label":"CDXXXII","verse":"<p class=\"q-prose\">Go, choose bliss, if you are wise, and finally you may be able to drink wine from the hand of the drinkers of eternity, but you are one of the ignorant and joy is not in you, it is not given to every ignorant one to taste the sweets that ignorance gives.<\/p>"},{"n":433,"label":"CDXXXIII","verse":"<p class=\"q-prose\">O idol, while you are on your journey through this world, draw from the fountain-head into the pitcher, draw this salutary wine and, ere the potter makes another pitcher of my dust and thine, fill out a cup, drink it and pass me one.<\/p>"},{"n":434,"label":"CDXXXIV","verse":"<p class=\"q-prose\">Be attentive, friend, and while thou still art able, lighten the grief of a loving heart, for this kingdom of grace that now thou hast will not last always, but, like so many others thou shalt unexpectedly be called.<\/p>"},{"n":435,"label":"CDXXXV","verse":"<p class=\"q-prose\">Before you are made drunk by the cup of death, before the revolutions of time are full behind you, endeavor to make a foundation here below, for you will profit nothing by going away empty-handed.<\/p>"},{"n":436,"label":"CDXXXVI","verse":"<p class=\"q-prose\">It is Thou who disposest of the lot of the living and of the dead. It is Thou who governest this unruly Wheel of the Heavens. Although I am bad, I am only Thy slave, Thou art my master. Who then is guilty here below? Art Thou not the Creator of all?<\/p>"},{"n":437,"label":"CDXXXVII","verse":"<p class=\"q-prose\">O my King! how can such a man as I, finding himself in the season of roses, in the midst of joyous society, surrounded by wine, by dancers, remain a passive spectator? Oh! to find oneself in a garden with a flask of wine and a lute are things preferable to Paradise with its houris and its Koocer.<\/p>"},{"n":438,"label":"CDXXXVIII","verse":"<p class=\"q-prose\">See the clearness of the light, the sparkle of the wine and of the moon, O cupbearer! See the ravishing beauty of the rose&#x27;s face, like a shining ruby, O cupbearer! Recall nothing of what belongs to the earth to this heart that burns like fire, throw it not to the wind, but bring wine, O cupbearer!<\/p>"},{"n":439,"label":"CDXXXIX","verse":"<p class=\"q-prose\">O limpid wine, wine full of sheen! Fool that I am, I&#x27;d drink thee in such quantity, that all perceiving me from far would my identity confound with thine, and say to me: O master wine! tell me, whence do you come?<\/p>"},{"n":440,"label":"CDXL","verse":"<p class=\"q-prose\">Be welcome, Thou, who art the repose of my soul! Thou art here, and nevertheless I cannot believe my eyes. Oh! for the love of God, and not for the love of my heart, drink, drink of wine, drink to the point when I can doubt that it is Thou.<\/p>"},{"n":441,"label":"CDXLI","verse":"<p class=\"q-prose\">A Sheikh said to a prostitute: You are in wine. Each instant you are taken in the toils of law. She answered him: O Sheikh, I am all that you say; but are you what you seem to be?<\/p>"},{"n":442,"label":"CDXLII","verse":"<p class=\"q-prose\">[I have already said] the entire world, like a bowl, was rolling in a hollow which, when I slept dead drunk, I noticed no more than if I saw a grain of barley rolling along. Yesterday, at evening, I put myself in pawn at the tavern for a cup of wine. The wine merchant never ceased to say: O excellent security that here I hold.<\/p>"},{"n":443,"label":"CDXLIII","verse":"<p class=\"q-prose\">Sometimes Thou art concealed, showing Thyself to none; sometimes Thou revealest Thyself in all things created. It is for Thyself, without doubt, and for Thy pleasure that Thou hast produced these marvellous effects, for Thou art at once the maker of the spectacle we see and Thine own beholder.<\/p>"},{"n":444,"label":"CDXLIV","verse":"<p class=\"q-prose\">Should you come to people the whole earth, that action would not make a saddened soul rejoice. It would be more to thy advantage to enslave a free man, through thy gentleness, than to give freedom to a thousand slaves.<\/p>"},{"n":445,"label":"CDXLV","verse":"<p class=\"q-prose\">They tell you not to drink, that otherwise you shall become a prey to torment, and that in the day of reckoning you will burn as fire. That may be, but the day in which wine makes you joyous is more precious than the goods of this world and those of the next.<\/p>"},{"n":446,"label":"CDXLVI","verse":"<p class=\"q-prose\">If your own satisfaction consists in casting grief into a heart free from all care, you could, friend, make mourning with your wisdom during your whole life. Go, be unhappy, then, for you are a person strangely ignorant.<\/p>"},{"n":447,"label":"CDXLVII","verse":"<p class=\"q-prose\">Each time you can procure two _mens_ of wine, drink them, in every circumstance, in all society wherever you may be; for he who does is freed from scornful looks or gestures of disdain.<\/p>"},{"n":448,"label":"CDXLVIII","verse":"<p class=\"q-prose\">With a loaf of wheaten bread, two _mens_ of wine and meat in plenty, and seated in some desert spot with some young beauty decked with cheeks tinted with the tulip&#x27;s blush, man hath a joy not given to any Sultan to procure.<\/p>"},{"n":449,"label":"CDXLIX","verse":"<p class=\"q-prose\">If in a city you acquire renown, you are thought to be the most wicked of men; if you retire into a corner, they regard you as a conspirator. What then is best, were you Elias or Saint Jude, is to live in the way of knowing none, and being known by none.<\/p>"},{"n":450,"label":"CDL","verse":"<p class=\"q-prose\">If I

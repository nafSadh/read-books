<!DOCTYPE html>
<html lang="en" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditations — PDF Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Palette blocks are reader-casaubon.html's, verbatim; this format adds
   --viewer-bg (chrome behind the card) and --page-bg (the sheet). */
:root{
  --font-serif:'EB Garamond',Georgia,serif;
  --font-sans:'Jost',-apple-system,Helvetica Neue,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-greek:'EB Garamond',Georgia,serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text-secondary:#7a6a52;--border:#d4c8a8;--accent:#8b6914;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(245,239,224,.94);--sheet-bg:#ede5d0}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn-bg:rgba(0,0,0,.05);--bar-bg:rgba(250,248,243,.94);--sheet-bg:#f2efe8}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn-bg:rgba(0,0,0,.06);--bar-bg:rgba(255,255,255,.92);--sheet-bg:#f5f5f5}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text-secondary:#8490aa;--border:#333;--accent:#9b7aed;--btn-bg:rgba(255,255,255,.08);--bar-bg:rgba(26,26,26,.95);--sheet-bg:#222}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text-secondary:#546080;--border:#1c2440;--accent:#2e6ab4;--btn-bg:rgba(255,255,255,.06);--bar-bg:rgba(0,0,0,.95);--sheet-bg:#0a0a0a}

[data-theme="sepia"]{--viewer-bg:#ded2b8;--page-bg:#f5efe0;--chrome:#3a3228}
[data-theme="light-purple"]{--viewer-bg:#c8c4bc;--page-bg:#fff;--chrome:#323639}
[data-theme="light-azure"]{--viewer-bg:#c4ccd4;--page-bg:#fff;--chrome:#2b3138}
[data-theme="dark-violet"]{--viewer-bg:#141414;--page-bg:#242424;--chrome:#0f0f0f}
[data-theme="dark-blue"]{--viewer-bg:#05070d;--page-bg:#0d1220;--chrome:#04060a}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viewer-bg);color:var(--text);font-family:var(--font-serif);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}

#toolbar{position:fixed;top:0;left:0;right:0;height:44px;z-index:100;background:var(--chrome);color:#e8e8e8;display:flex;align-items:center;gap:6px;padding:0 12px;font-family:var(--font-sans);font-size:13px;border-bottom:1px solid rgba(0,0,0,.4)}
/* Child selector on purpose: as a descendant selector this min-width also hit
   the theme dots nested in #themeDots and inflated the row past the viewport. */
#toolbar > button{min-width:32px;height:32px;background:transparent;border:1px solid transparent;color:#e8e8e8;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:4px 8px}
#toolbar > button:hover{background:rgba(255,255,255,.1)}
#toolbar > button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#toolbar select{background:rgba(255,255,255,.08);color:#e8e8e8;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:3px 8px;font-size:12px;max-width:220px}
#toolbar select option{background:#2b2b2b;color:#e8e8e8}
#pageInput{width:52px;background:rgba(255,255,255,.08);color:#e8e8e8;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:3px 6px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
#pageTotal{font-family:var(--font-mono);font-size:12px;opacity:.75;white-space:nowrap}
.tb-spacer{flex:1 1 auto;min-width:0}
.tb-sep{width:1px;height:20px;background:rgba(255,255,255,.18);flex:0 0 auto}

#viewport{position:absolute;top:44px;bottom:0;left:0;right:0;overflow-y:auto;padding:26px 0 60px;display:flex;flex-direction:column;align-items:center}
.page{width:min(700px,calc(100vw - 40px));background:var(--page-bg);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.35);padding:62px 60px;min-height:64vh;display:flex;flex-direction:column;transform-origin:top center}
.p-head{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-secondary);text-align:center;margin-bottom:8px}
.p-ord{font-family:var(--font-serif);font-size:32px;color:var(--accent);text-align:center;opacity:.85;line-height:1;margin-bottom:6px}
.p-rule{width:54px;height:1px;background:var(--border);margin:0 auto 28px}
.p-text{font-size:18px;line-height:1.85}
.p-text p{margin:0 0 1em}
.p-text p:last-child{margin-bottom:0}
.p-greek{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:17px;line-height:1.95;color:var(--text-secondary)}
.p-greek p{margin:0 0 .8em}
.p-detail{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:14.5px;line-height:1.7;color:var(--text-secondary)}
.d-sec{margin-bottom:16px}
.d-sec:last-child{margin-bottom:0}
.d-label{font-family:var(--font-sans);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-weight:600}
.d-sec p{margin:0 0 .6em}
.d-pn{margin-bottom:8px}
.d-pn-name{font-family:var(--font-sans);font-weight:600;font-size:13px;display:block;color:var(--text)}
.d-pn-tip a{color:var(--accent)}
.p-foot{margin-top:auto;padding-top:26px;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);text-align:center;letter-spacing:1px}

#sidebar{position:fixed;top:44px;bottom:0;left:0;width:240px;z-index:90;background:var(--chrome);color:#ddd;overflow-y:auto;padding:10px 0;transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;font-family:var(--font-sans)}
/* visibility (not just transform) so the closed drawer leaves the tab
   order and the a11y tree; 0s delay keeps the slide animation. */
#sidebar.open{transform:translateX(0);visibility:visible;transition:transform .25s ease,visibility 0s}
#sidebar h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;padding:8px 16px}
.thumb{display:block;width:100%;text-align:left;background:none;border:none;color:#ddd;padding:10px 16px;font-size:13px;cursor:pointer;min-height:40px;border-left:3px solid transparent}
.thumb:hover{background:rgba(255,255,255,.07)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.thumb.active{border-left-color:var(--accent);background:rgba(255,255,255,.09);color:#fff}
.thumb .sub{display:block;font-family:var(--font-mono);font-size:10px;opacity:.55;margin-top:2px}

.theme-dots{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.theme-dot{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;padding:0;position:relative}
.theme-dot::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% + 6px);height:40px}
.theme-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dot.active{box-shadow:0 0 0 2px var(--chrome),0 0 0 3.5px var(--accent)}
.theme-dot[data-theme="sepia"]{background:#d4c8a8}
.theme-dot[data-theme="light-purple"]{background:#c9b8e8}
.theme-dot[data-theme="light-azure"]{background:#d4e8f7}
.theme-dot[data-theme="dark-violet"]{background:#4a3a6a}
.theme-dot[data-theme="dark-blue"]{background:#1e2a4a}

@media (max-width:768px){
  #toolbar{padding:0 6px;gap:2px}
  #toolbar #zoomOut,#toolbar #zoomIn,#toolbar #zoomLabel,#toolbar .tb-sep,#toolbar #greekBtn{display:none}
  #toolbar select{max-width:100%;min-width:0;flex:1 1 auto}
  #toolbar > button{min-width:40px;height:40px}
  #toolbar .theme-dots{gap:8px}
  .page{padding:34px 22px;width:calc(100vw - 20px)}
  #sidebar{width:210px;max-width:78vw}
}
@media (prefers-reduced-motion:reduce){#sidebar{transition:none}}
</style>
</head>
<body>
<div id="toolbar">
  <button id="sidebarToggle" aria-label="Toggle passage list">&#9776;</button>
  <select id="bookSelect" aria-label="Choose book"></select>
  <div class="tb-spacer"></div>
  <button id="prevBtn" aria-label="Previous page">&#8249;</button>
  <input type="text" id="pageInput" value="1" aria-label="Page number" inputmode="numeric">
  <span id="pageTotal">/ 1</span>
  <button id="nextBtn" aria-label="Next page">&#8250;</button>
  <div class="tb-spacer"></div>
  <button id="greekBtn" aria-label="Toggle Greek text" aria-pressed="false">&#913;&#945;</button>
  <button id="zoomOut" aria-label="Zoom out">&#8722;</button>
  <span id="zoomLabel" style="font-size:12px;min-width:38px;text-align:center">100%</span>
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <div class="tb-sep"></div>
  <div class="theme-dots" role="group" aria-label="Theme" id="themeDots"></div>
</div>
<nav id="sidebar" aria-label="Passages"><h2>Passages</h2><div id="thumbs"></div></nav>
<main id="viewport"><article class="page" id="page"></article></main>
<script>
const DATA = __DATA__;
const PREFS_KEY = 'meditations-pdf-prefs';
const THEMES = {sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};
const ZOOMS=[75,90,100,115,130,150];
const P = DATA.passages;
let idx=0, zoom=100, showGreek=false;
const $ = id => document.getElementById(id);

function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify({theme:document.documentElement.dataset.theme, zoom, greek:showGreek})); }catch(e){} }
function loadPrefs(){
  let p=null; try{ p=JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); }catch(e){}
  if(!p) return;
  if(p.theme && THEMES[p.theme]) document.documentElement.dataset.theme=p.theme;
  if(ZOOMS.includes(p.zoom)) zoom=p.zoom;
  showGreek = !!p.greek;
}
function writeHash(){ history.replaceState(null,'','#m-'+P[idx].id); }
function readHash(){
  const m=location.hash.match(/^#m-(\d+\.\d+)$/); if(!m) return false;
  const i=P.findIndex(p=>p.id===m[1]); if(i<0) return false;
  idx=i; return true;
}
function renderPage(){
  const p=P[idx], bk=DATA.books.find(b=>b.n===p.bnum);
  let h='<div class="p-head">'+bk.title+(bk.subtitle?' &middot; '+bk.subtitle:'')+'</div>';
  h+='<div class="p-ord">'+p.num+'</div><div class="p-rule"></div>';
  h+='<div class="p-text">'+p.text+'</div>';
  if(showGreek && p.greek) h+='<div class="p-greek" lang="grc">'+p.greek+'</div>';
  if(p.detail) h+='<div class="p-detail">'+p.detail+'</div>';
  h+='<div class="p-foot">'+DATA.translator+' &middot; '+(idx+1)+' / '+P.length+'</div>';
  $('page').innerHTML=h;
  $('page').style.transform='scale('+(zoom/100)+')';
  $('pageInput').value=idx+1;
  $('pageTotal').textContent='/ '+P.length;
  $('zoomLabel').textContent=zoom+'%';
  $('bookSelect').value=String(p.bnum);
  $('greekBtn').setAttribute('aria-pressed',String(showGreek));
  $('viewport').scrollTop=0;
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const a=document.querySelector('.thumb.active'); if(a) a.scrollIntoView({block:'nearest'});
  writeHash();
}
function go(d){ const n=idx+d; if(n<0||n>=P.length) return; idx=n; renderPage(); }
function setZoom(d){ const i=ZOOMS.indexOf(zoom), n=i+d; if(n<0||n>=ZOOMS.length) return; zoom=ZOOMS[n]; renderPage(); savePrefs(); }
function buildThumbs(){
  const w=$('thumbs'); w.innerHTML='';
  P.forEach((p,i)=>{
    const bk=DATA.books.find(b=>b.n===p.bnum);
    const b=document.createElement('button'); b.type='button'; b.className='thumb';
    b.innerHTML=bk.roman+' &middot; '+p.num+'<span class="sub">passage '+(i+1)+'</span>';
    b.setAttribute('aria-label','Go to '+bk.title+', passage '+p.num);
    b.addEventListener('click',()=>{idx=i;renderPage()});
    w.appendChild(b);
  });
}
function buildBooks(){
  const s=$('bookSelect'); s.innerHTML='';
  DATA.books.forEach(b=>{
    const o=document.createElement('option'); o.value=String(b.n);
    o.textContent=b.title+(b.subtitle?' — '+b.subtitle:'')+' ('+b.count+')';
    s.appendChild(o);
  });
}
function buildThemes(){
  const w=$('themeDots'); w.innerHTML='';
  Object.keys(THEMES).forEach(t=>{
    const b=document.createElement('button'); b.type='button';
    b.className='theme-dot'+(document.documentElement.dataset.theme===t?' active':'');
    b.dataset.theme=t; b.setAttribute('aria-label',THEMES[t]+' theme');
    b.addEventListener('click',()=>{document.documentElement.dataset.theme=t;buildThemes();savePrefs()});
    w.appendChild(b);
  });
}
$('prevBtn').addEventListener('click',()=>go(-1));
$('nextBtn').addEventListener('click',()=>go(1));
$('zoomIn').addEventListener('click',()=>setZoom(1));
$('zoomOut').addEventListener('click',()=>setZoom(-1));
$('sidebarToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));
$('greekBtn').addEventListener('click',()=>{showGreek=!showGreek;renderPage();savePrefs()});
$('bookSelect').addEventListener('change',e=>{
  const b=DATA.books.find(x=>x.n===parseInt(e.target.value,10));
  if(b){ idx=b.start; renderPage(); }
});
$('pageInput').addEventListener('change',e=>{
  const n=parseInt(e.target.value,10);
  if(n>=1&&n<=P.length){ idx=n-1; renderPage(); } else { e.target.value=idx+1; }
});
document.addEventListener('keydown',e=>{
  const t=e.target.tagName; if(t==='INPUT'||t==='SELECT') return;
  if(e.key==='Escape'){ $('sidebar').classList.remove('open'); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key==='j'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='k'){e.preventDefault();go(-1)}
  else if(e.key==='Home'){e.preventDefault();idx=0;renderPage()}
  else if(e.key==='End'){e.preventDefault();idx=P.length-1;renderPage()}
});
window.addEventListener('hashchange',()=>{ if(readHash()) renderPage(); });
loadPrefs(); buildBooks(); buildThemes(); buildThumbs(); readHash(); renderPage();
</script>
</body>
</html>

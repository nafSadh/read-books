<!DOCTYPE html>
<html lang="bn" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>বেদ — PDF Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Bengali:wght@400;500&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --f-serif:'EB Garamond',Georgia,serif;
  --f-sans:'Jost',-apple-system,Helvetica Neue,sans-serif;
  --f-mono:'IBM Plex Mono',monospace;
  --f-beng:'Noto Serif Bengali','EB Garamond',serif;
  --f-deva:'Noto Serif Devanagari','EB Garamond',serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text2:#7a6a52;--border:#d4c8a8;--accent:#8b6914;--btn:rgba(0,0,0,.05);--bar:rgba(245,239,224,.94);--sheet:#ede5d0}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text2:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn:rgba(0,0,0,.05);--bar:rgba(250,248,243,.94);--sheet:#f2efe8}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text2:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn:rgba(0,0,0,.06);--bar:rgba(255,255,255,.92);--sheet:#f5f5f5}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text2:#8490aa;--border:#333;--accent:#9b7aed;--btn:rgba(255,255,255,.08);--bar:rgba(26,26,26,.95);--sheet:#222}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text2:#546080;--border:#1c2440;--accent:#2e6ab4;--btn:rgba(255,255,255,.06);--bar:rgba(0,0,0,.95);--sheet:#0a0a0a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;color:inherit}
.mantra{padding:18px 0;border-bottom:1px solid var(--border)}
.mantra:last-child{border-bottom:none}
.m-num{font-family:var(--f-mono);font-size:10px;letter-spacing:1.5px;color:var(--accent);margin-bottom:8px}
.m-bn{font-family:var(--f-beng);font-size:1.06em;line-height:2.0;margin-bottom:6px}
.m-dv{font-family:var(--f-deva);font-size:1.02em;line-height:2.0;color:var(--text2);margin-bottom:6px}
.m-iast{font-family:var(--f-mono);font-size:.80em;line-height:1.85;color:var(--text2);opacity:.85;margin-bottom:8px}
.m-mean{font-size:.94em;line-height:1.75;margin-bottom:5px}
.m-mean-bn{font-family:var(--f-beng);line-height:1.95}
body:not(.show-dv) .m-dv,body:not(.show-bn) .m-bn,body:not(.show-iast) .m-iast,
body:not(.show-en) .m-en,body:not(.show-mb) .m-mb{display:none}
body{background:var(--viewer);color:var(--text);font-family:var(--f-serif);height:100vh;height:100dvh;overflow:hidden;font-size:16.5px}
[data-theme="sepia"]{--viewer:#ded2b8;--sheetbg:#f5efe0;--chrome:#3a3228}
[data-theme="light-purple"]{--viewer:#c8c4bc;--sheetbg:#fff;--chrome:#323639}
[data-theme="light-azure"]{--viewer:#c4ccd4;--sheetbg:#fff;--chrome:#2b3138}
[data-theme="dark-violet"]{--viewer:#141414;--sheetbg:#242424;--chrome:#0f0f0f}
[data-theme="dark-blue"]{--viewer:#05070d;--sheetbg:#0d1220;--chrome:#04060a}
#tb{position:fixed;top:0;left:0;right:0;height:44px;z-index:100;background:var(--chrome);color:#e8e8e8;
  display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--f-sans);font-size:13px}
#tb > button{min-width:34px;height:34px;background:transparent;border:none;color:#e8e8e8;border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px}
#tb > button:hover{background:rgba(255,255,255,.1)}
#tb select{background:rgba(255,255,255,.08);color:#e8e8e8;border:1px solid rgba(255,255,255,.15);
  border-radius:4px;padding:3px 8px;font-size:12px;max-width:210px}
#tb select option{background:#2b2b2b}
#tot{font-family:var(--f-mono);font-size:12px;opacity:.75}
.sp{flex:1 1 auto;min-width:0}
#vp{position:absolute;top:44px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:24px 0 50px;display:flex;flex-direction:column;align-items:center}
.page{width:min(680px,calc(100vw - 32px));background:var(--sheetbg);color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.35);padding:52px 52px;min-height:62vh;transform-origin:top center}
.s-veda{font-family:var(--f-sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);text-align:center;margin-bottom:6px}
.s-title{font-family:var(--f-beng);font-size:1.4em;line-height:1.5;text-align:center}
.s-title-en{font-family:var(--f-sans);font-size:.78em;color:var(--text2);text-align:center;letter-spacing:1px}
.s-meta{font-family:var(--f-sans);font-size:.72em;color:var(--text2);text-align:center;margin:8px 0 22px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;padding:0}
.dot.active{box-shadow:0 0 0 2px var(--chrome),0 0 0 3.5px var(--accent)}
.dot[data-theme="sepia"]{background:#d4c8a8}.dot[data-theme="light-purple"]{background:#c9b8e8}
.dot[data-theme="light-azure"]{background:#d4e8f7}.dot[data-theme="dark-violet"]{background:#4a3a6a}
.dot[data-theme="dark-blue"]{background:#1e2a4a}
@media (max-width:768px){
  #tb{padding:0 6px;gap:3px}
  #tb select{max-width:100%;flex:1 1 auto;min-width:0}
  #tb > button{min-width:38px;height:38px}
  .page{padding:30px 20px;width:calc(100vw - 16px)}
}

</style>
</head>
<body class="show-bn show-dv show-en show-mb">
<div id="tb">
  <select id="sel" aria-label="Choose sukta"></select>
  <div class="sp"></div>
  <button id="prev" aria-label="Previous">&#8249;</button>
  <span id="tot"></span>
  <button id="next" aria-label="Next">&#8250;</button>
  <div class="sp"></div>
  <div class="dots" role="group" aria-label="Theme" id="dots"></div>
</div>
<main id="vp"><article class="page" id="page"></article></main>
<script>
const DATA = __DATA__;

const THEMES={sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};
const SCRIPTS=[['show-bn','\u09ac\u0999\u09cd\u0997\u09b2\u09bf\u09aa\u09bf'],['show-dv','\u0926\u0947\u0935\u0928\u093e\u0917\u0930\u0940'],['show-iast','IAST'],['show-en','English'],['show-mb','\u09ac\u09be\u0982\u09b2\u09be']];
const S=DATA.suktas; let idx=0;
const $=id=>document.getElementById(id);
function mantraHTML(m){
  let h='<div class="mantra"><div class="m-num">'+m.n+'</div>';
  if(m.bn)h+='<div class="m-bn" lang="sa-Beng">'+m.bn.replace(/\n/g,'<br>')+'</div>';
  if(m.dv)h+='<div class="m-dv" lang="sa-Deva">'+m.dv.replace(/\n/g,'<br>')+'</div>';
  if(m.iast)h+='<div class="m-iast" lang="sa-Latn">'+m.iast.replace(/\n/g,'<br>')+'</div>';
  if(m.mBn)h+='<div class="m-mean m-mb m-mean-bn" lang="bn">'+m.mBn+'</div>';
  if(m.mEn)h+='<div class="m-mean m-en" lang="en">'+m.mEn+'</div>';
  return h+'</div>';
}
function writeHash(){const s=S[idx];history.replaceState(null,'','#s-'+s.veda+'-'+s.num)}
function readHash(){const m=location.hash.match(/^#s-([a-z]+)-(\d+)$/);if(!m)return false;
  const i=S.findIndex(s=>s.veda===m[1]&&String(s.num)===m[2]);if(i<0)return false;idx=i;return true}
function headHTML(s){
  let h='<div class="s-veda">'+s.vedaTitle+'</div><div class="s-title" lang="bn">'+s.title+'</div>';
  if(s.titleEn)h+='<div class="s-title-en" lang="en">'+s.titleEn+'</div>';
  const meta=[s.rishi&&('\u098b\u09b7\u09bf '+s.rishi),s.devata&&('\u09a6\u09c7\u09ac\u09a4\u09be '+s.devata)].filter(Boolean);
  if(meta.length)h+='<div class="s-meta">'+meta.join(' \u00b7 ')+'</div>';
  return h;
}

const KEY='vedas-pdf-prefs';
function save(){try{localStorage.setItem(KEY,JSON.stringify({theme:document.documentElement.dataset.theme,cls:[...document.body.classList].filter(c=>c.startsWith('show-'))}))}catch(e){}}
function load(){let p=null;try{p=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!p)return;if(p.theme&&THEMES[p.theme])document.documentElement.dataset.theme=p.theme;
  if(Array.isArray(p.cls)){SCRIPTS.forEach(([c])=>document.body.classList.remove(c));p.cls.forEach(c=>document.body.classList.add(c))}}
function render(){const s=S[idx];
  $('page').innerHTML=headHTML(s)+s.mantras.map(mantraHTML).join('');
  $('tot').textContent=(idx+1)+' / '+S.length;$('sel').value=String(idx);
  $('prev').disabled=idx===0;$('next').disabled=idx===S.length-1;$('vp').scrollTop=0;writeHash()}
function go(d){const n=idx+d;if(n<0||n>=S.length)return;idx=n;render()}
function buildSel(){const w=$('sel');w.innerHTML='';
  S.forEach((s,i)=>{const o=document.createElement('option');o.value=String(i);
    o.textContent=s.vedaTitle+' \u00b7 '+(s.titleEn||s.title);w.appendChild(o)})}
function buildDots(){const w=$('dots');w.innerHTML='';
  Object.keys(THEMES).forEach(t=>{const b=document.createElement('button');b.type='button';
    b.className='dot'+(document.documentElement.dataset.theme===t?' active':'');b.dataset.theme=t;
    b.setAttribute('aria-label',THEMES[t]);
    b.addEventListener('click',()=>{document.documentElement.dataset.theme=t;buildDots();save()});w.appendChild(b)})}
$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
$('sel').addEventListener('change',e=>{idx=parseInt(e.target.value,10);render()});
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='SELECT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key==='j'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='k'){e.preventDefault();go(-1)}
  else if(e.key==='Home'){e.preventDefault();idx=0;render()}
  else if(e.key==='End'){e.preventDefault();idx=S.length-1;render()}});
window.addEventListener('hashchange',()=>{if(readHash())render()});
load();buildSel();buildDots();readHash();render();

</script>
</body>
</html>

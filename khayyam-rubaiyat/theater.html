 were free and were allowed to use my will, if I were free from the torments of destiny and unembarrassed by any sentiment of the good and bad in this world where disorder resides, oh! I would prefer not to have lived here, not to have existed, than to be forced to go away!<\/p>"},{"n":451,"label":"CDLI","verse":"<p class=\"q-prose\">Drink wine, my friend, for see it makes the perspiration flow upon the cheeks of the beauties of Rhei, the most beautiful creatures in the world! Oh! how long shall I repeat it to you? Yes, I have broken the bonds of all my vows. Is it not better to break the bonds of a thousand vows than to break a pitcher of wine?<\/p>"},{"n":452,"label":"CDLII","verse":"<p class=\"q-prose\">We have some wine, O cupbearer! Let us rejoice in the presence of the well-beloved [the Divinity] and in the noise of the morning. Expect not on our part the renunciation of Nessouh, O cupbearer! How long shall I speak to you of the story of Noe, O cupbearer? Bring, bring me happily the repose of my soul [the wine], O cupbearer!<\/p>"},{"n":453,"label":"CDLIII","verse":"<p class=\"q-prose\">I see neither the means of joining myself to Thee, nor the possibility of living for the space of a breath separated from Thee. I have not the courage to drive out the torments I endure. Oh! how difficult my plight, how strange my grief, how exquisite my pain!<\/p>"},{"n":454,"label":"CDLIV","verse":"<p class=\"q-prose\">Now is the time to drink the morning wine; the noise makes itself heard, O cupbearer! Now we are ready, O cupbearer! here is the wine, behold the tavern. Could a moment like this be for prayer? Silence, O cupbearer! Leave thy discourse upon tradition and upon devotion; drink, O cupbearer!<\/p>"},{"n":455,"label":"CDLV","verse":"<p class=\"q-prose\">Here is the noise of the morning, O idol, whose coming brings happiness! Chant the refrain and bring the wine; for [you know it], the constant sequence of these months of Tir and Di have overturned upon the earth a thousand potentates like Djem, a hundred thousand like to Kai.<\/p>"},{"n":456,"label":"CDLVI","verse":"<p class=\"q-prose\">Guard thyself from being coarse in the eyes of all drinkers, guard thyself from acquiring a bad reputation before the sages, and drink wine; for, whether you drink or not, if you belong to the fire of Hell, you would not know how to enter Paradise.<\/p>"},{"n":457,"label":"CDLVII","verse":"<p class=\"q-prose\">I wish that God would reconstruct the world, I wish that He would actually reconstruct it and that I might see Him at the work. I wish that He would blot my name from the register of life, or that out of His mysterious treasure, He would swell the joys of my existence.<\/p>"},{"n":458,"label":"CDLVIII","verse":"<p class=\"q-prose\">O God! open to me the door of Thy benefits. Make me come to my fortune finally, that I may not be beholden to Thy creatures. Oh! render me drunk with wine, to the point where, freed from all knowledge, the torments of my head may disappear.<\/p>"},{"n":459,"label":"CDLIX","verse":"<p class=\"q-prose\">O thou who hast been burned and burned again, and now deservest life anew! thou who art worthy only of adding fuel to the fire of Hell! how long wilt thou pray the Divinity to pardon Omar? What relation exists between thee and God? What audacity drives thee to ask Him to exercise His pity?<\/p>"},{"n":460,"label":"CDLX","verse":"<p class=\"q-prose\">As for me, without limpid wine I cannot live; my body is a burden which I cannot carry without drinking of the juice of the vine. Oh! might I be the slave of that delicious moment when the cupbearer said to me: Another cup! and that I had no longer strength to take it!<\/p>"},{"n":461,"label":"CDLXI","verse":"<p class=\"q-prose\">There remains to me still a breath of life, thanks to the care of the cupbearer. But discord reigns still among men. I know that there only remains to me about a _men_ of wine from last evening, but I am ignorant of the space of time that is still left me to live.<\/p>"},{"n":462,"label":"CDLXII","verse":"<p class=\"q-prose\">Take a man who possesses bread sufficient to live upon for two days, who can draw a drop of fresh water into a cracked pitcher, why should such a man be commanded by another who is of no more worth, or why should he serve one who should be his equal?<\/p>"},{"n":463,"label":"CDLXIII","verse":"<p class=\"q-prose\">Since the day when Venus and the moon appeared in the sky, no one has seen anything here below preferable to ruby wine. I am truly astonished at the wine-merchants, for how can they buy anything superior to that which they sell?<\/p>"},{"n":464,"label":"CDLXIV","verse":"<p class=\"q-prose\">For those endowed with knowledge and virtue, who through their wisdom have become as torches to their disciples, even those have not progressed beyond this night profound. They have left some fables and returned to death&#x27;s long sleep.<\/p>"}]},"persian":{"short":"فا","label":"Persian &middot; Foroughi &amp; Ghani","plain":"Persian original, Foroughi & Ghani","year":1960,"unit":"رباعیات","dir":"rtl","lang":"fa","kind":"verse","title":"Foroughi-Ghani 1960 Persian original — 178 quatrains, annotated","note":"The Persian original with transliteration, annotated.","key":"persian","count":178,"quatrains":[{"n":1,"label":"۱","verse":"<p class=\"fa\">برخیز بُتا بیار بهر دل ما<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brkhyz bota byar bhr dl ma<\/p><p class=\"fa\">حلّ کن بجمال خویشتن مُشکلِ ما<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hll kn bjmal khvyshtn moshkle ma<\/p><p class=\"fa\">یک کوزه شراب تا بهم نوش کنیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk kvzh shrab ta bhm nvsh knym<\/p><p class=\"fa\">زان پیش که کوزه‌ها کنند از گِلِ ما<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh kvzh-ha knnd az gele ma<\/p>"},{"n":2,"label":"۲","verse":"<p class=\"fa\">چون عهده نمی‌شود کسی فردا را<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn &#x27;hdh nmy-shvd ksy frda ra<\/p><p class=\"fa\">حالی خوش دار این دل پُر سودا را<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">haly khvsh dar ayn dl por svda ra<\/p><p class=\"fa\">می نوش بماهتاب ای ماه که ماه<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh bmahtab ay mah kh mah<\/p><p class=\"fa\">بسیار بِتابَد و نیابَد ما را<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bsyar betabad v nyabad ma ra<\/p>"},{"n":3,"label":"۳","verse":"<p class=\"fa\">قرآن که مهین کلام خوانند آنرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qrān kh mhyn klam khvannd ānra<\/p><p class=\"fa\">گه‌گاه نه بر دوام خوانند آنرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gh-gah nh br dvam khvannd ānra<\/p><p class=\"fa\">بر گِردِ پیاله آیتی هست مقیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br gerde pyalh āyty hst mqym<\/p><p class=\"fa\">کاندر همه جا مدام خوانند آنرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kandr hmh ja mdam khvannd ānra<\/p>"},{"n":4,"label":"۴","verse":"<p class=\"fa\">گر می نخوری طعنه مزن مستانرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr my nkhvry t&#x27;nh mzn mstanra<\/p><p class=\"fa\">بنیاد مکن تو حیله و دستانرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnyad mkn tv hylh v dstanra<\/p><p class=\"fa\">تو غره بدان مشو که می می نخوری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">tv ghrh bdan mshv kh my my nkhvry<\/p><p class=\"fa\">صد لقمه خوری که می غلام است آنرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sd lqmh khvry kh my ghlam ast ānra<\/p>"},{"n":5,"label":"۵","verse":"<p class=\"fa\">هرچند که رنگ و بوی زیباست مرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrchnd kh rng v bvy zybast mra<\/p><p class=\"fa\">چون لاله رخ و چو سرو بالاست مرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn lalh rkh v chv srv balast mra<\/p><p class=\"fa\">معلوم نشد که در طربخانهٔ خاک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">m&#x27;lvm nshd kh dr trbkhanhٔ khak<\/p><p class=\"fa\">نقّاش ازل بهرچه آراست مرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nqqash azl bhrchh ārast mra<\/p>"},{"n":6,"label":"۶","verse":"<p class=\"fa\">مائیم و می و مطرب و این کُنج خراب<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">maiym v my v mtrb v ayn konj khrab<\/p><p class=\"fa\">جان و دل و جام و جابه پُر درد شراب<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jan v dl v jam v jabh por drd shrab<\/p><p class=\"fa\">فارغ ز امید رحمت و بیم عذاب<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fargh z amyd rhmt v bym &#x27;zab<\/p><p class=\"fa\">آزد ز خاک و باد و از آتش و آب<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āzd z khak v bad v az ātsh v āb<\/p>"},{"n":7,"label":"۷","verse":"<p class=\"fa\">آن قصر که جمشید در او جام گرفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān qsr kh jmshyd dr av jam grft<\/p><p class=\"fa\">آهو بچه کرد و روبه آرام گرفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āhv bchh krd v rvbh āram grft<\/p><p class=\"fa\">بهرام که گور میگرفتی همه عمر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bhram kh gvr mygrfty hmh &#x27;mr<\/p><p class=\"fa\">دیدی که چگونه گور بهرام گرفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dydy kh chgvnh gvr bhram grft<\/p>"},{"n":8,"label":"۸","verse":"<p class=\"fa\">ابر آمد و باز بر سَرِ سبزه گریست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">abr āmd v baz br sare sbzh gryst<\/p><p class=\"fa\">بی باده گُلرنگ نمی‌باید زیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">by badh golrng nmy-bayd zyst<\/p><p class=\"fa\">این سبزه که امروز تماشاگه ماست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn sbzh kh amrvz tmashagh mast<\/p><p class=\"fa\">تا سبزهٔ خاک ما تماشاگه کیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta sbzhٔ khak ma tmashagh kyst<\/p>"},{"n":9,"label":"۹","verse":"<p class=\"fa\">اکنون که گُلِ سعادتت پُربار است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aknvn kh gole s&#x27;adtt porbar ast<\/p><p class=\"fa\">دست تو ز جام می چرا بیکار است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dst tv z jam my chra bykar ast<\/p><p class=\"fa\">می خور که زمانه دشمنی غدّار است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh zmanh dshmny ghddar ast<\/p><p class=\"fa\">در یافتن روز چنین دشوار است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr yaftn rvz chnyn dshvar ast<\/p>"},{"n":10,"label":"۱۰","verse":"<p class=\"fa\">امروز تُرا دسترسِ فردا نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">amrvz tora dstrse frda nyst<\/p><p class=\"fa\">و اندیشهٔ فردات بجز سودا نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">v andyshhٔ frdat bjz svda nyst<\/p><p class=\"fa\">ضایع مکن ایندم اَر دِلَت شیدا نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zay&#x27; mkn ayndm aar delat shyda nyst<\/p><p class=\"fa\">کاین باقی عمر را بها پیدا نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn baqy &#x27;mr ra bha pyda nyst<\/p>"},{"n":11,"label":"۱۱","verse":"<p class=\"fa\">ای آمده از عالم روحانی تفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay āmdh az &#x27;alm rvhany tft<\/p><p class=\"fa\">حیران شده در پنج و چهار و شش و هفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hyran shdh dr pnj v chhar v shsh v hft<\/p><p class=\"fa\">مِی خور چو ندانی از کجا آمدهٔ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mey khvr chv ndany az kja āmdhٔ<\/p><p class=\"fa\">خوش باش ندانی بکجا خواهی رفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash ndany bkja khvahy rft<\/p>"},{"n":12,"label":"۱۲","verse":"<p class=\"fa\">ای چرخ فلک خرابی از کینهٔ تُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay chrkh flk khraby az kynhٔ tost<\/p><p class=\"fa\">بیدادگری شیوهٔ دیرینهٔ تُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bydadgry shyvhٔ dyrynhٔ tost<\/p><p class=\"fa\">ای خاک اگر سینهٔ تو بشکافند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay khak agr synhٔ tv bshkafnd<\/p><p class=\"fa\">بس گوهر قیمتی که در سینهٔ تُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bs gvhr qymty kh dr synhٔ tost<\/p>"},{"n":13,"label":"۱۳","verse":"<p class=\"fa\">ای دل چو زمانه میکند غمناکت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay dl chv zmanh myknd ghmnakt<\/p><p class=\"fa\">ناگه برود ز تن روانِ پاکت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nagh brvd z tn rvane pakt<\/p><p class=\"fa\">بر سبزه نشین و خوش بزی روزی چند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br sbzh nshyn v khvsh bzy rvzy chnd<\/p><p class=\"fa\">زان پیش که سبزه بردَمَد از خاکت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh sbzh brdamad az khakt<\/p>"},{"n":14,"label":"۱۴","verse":"<p class=\"fa\">این بحر وجود آمده بیرون ز نهفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn bhr vjvd āmdh byrvn z nhft<\/p><p class=\"fa\">کس نیست که این گوهر تحقیق بسُفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks nyst kh ayn gvhr thqyq bsoft<\/p><p class=\"fa\">هر کس سخنی از سَرِ سودا گفتند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr ks skhny az sare svda gftnd<\/p><p class=\"fa\">زان روی که هست کس نمیداند گفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan rvy kh hst ks nmydand gft<\/p>"},{"n":15,"label":"۱۵","verse":"<p class=\"fa\">این کوزه چو من عاشق زاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn kvzh chv mn &#x27;ashq zary bvdh ast<\/p><p class=\"fa\">بند سرِ زُلف نگاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnd sre zolf ngary bvdh ast<\/p><p class=\"fa\">این دسته که بر گَردنِ او می‌بینی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn dsth kh br gardne av my-byny<\/p><p class=\"fa\">دستی است که بر گَردنِ یاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dsty ast kh br gardne yary bvdh ast<\/p>"},{"n":16,"label":"۱۶","verse":"<p class=\"fa\">این کوزه که آبخوارهٔ مُزدوریست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn kvzh kh ābkhvarhٔ mozdvryst<\/p><p class=\"fa\">از دیدهٔ شاهیست و دل دستوریست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az dydhٔ shahyst v dl dstvryst<\/p><p class=\"fa\">هر کاسهٔ می که بر کفِ مخموریست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr kashٔ my kh br kfe mkhmvryst<\/p><p class=\"fa\">از عارض مستی و لب مستوریست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az &#x27;arz msty v lb mstvryst<\/p>"},{"n":17,"label":"۱۷","verse":"<p class=\"fa\">این کهنه رباط را که عالم نامست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn khnh rbat ra kh &#x27;alm namst<\/p><p class=\"fa\">وارامگه ابلق صبح و شامست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">varamgh ablq sbh v shamst<\/p><p class=\"fa\">بزمیست که واماندهٔ صد جمشید است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bzmyst kh vamandhٔ sd jmshyd ast<\/p><p class=\"fa\">قصریست که تکیه‌گاه صد بهرامست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qsryst kh tkyh-gah sd bhramst<\/p>"},{"n":18,"label":"۱۸","verse":"<p class=\"fa\">این یک دو سه روزه نوبت عمر گذشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn yk dv sh rvzh nvbt &#x27;mr gzsht<\/p><p class=\"fa\">چون آب بجویبار و چون باد بدشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn āb bjvybar v chvn bad bdsht<\/p><p class=\"fa\">هرگز غم دو روز مرا یاد نگشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrgz ghm dv rvz mra yad ngsht<\/p><p class=\"fa\">روزی که نیامده است و روزی که گذشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rvzy kh nyamdh ast v rvzy kh gzsht<\/p>"},{"n":19,"label":"۱۹","verse":"<p class=\"fa\">بر چهرهٔ گل نسیم نوروز خوشست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br chhrhٔ gl nsym nvrvz khvshst<\/p><p class=\"fa\">در صحن چمن روی دل افروز خوشست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr shn chmn rvy dl afrvz khvshst<\/p><p class=\"fa\">از دی که گذشت هرچه گوئی خوش نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az dy kh gzsht hrchh gviy khvsh nyst<\/p><p class=\"fa\">خوش باش و ز دی مگو که امروز خوشست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash v z dy mgv kh amrvz khvshst<\/p>"},{"n":20,"label":"۲۰","verse":"<p class=\"fa\">پیش از من و تو لیل و نهاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pysh az mn v tv lyl v nhary bvdh ast<\/p><p class=\"fa\">گردنده فلک نیز بکاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">grdndh flk nyz bkary bvdh ast<\/p><p class=\"fa\">هرجا که قدم نهی تو بر روی زمین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrja kh qdm nhy tv br rvy zmyn<\/p><p class=\"fa\">آن مَردُمَک چشم نگاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān mardomak chshm ngary bvdh ast<\/p>"},{"n":21,"label":"۲۱","verse":"<p class=\"fa\">تا چند زنم بروی دریاها خشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta chnd znm brvy dryaha khsht<\/p><p class=\"fa\">بیزار شدم ز بُت پرستان کِنِشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">byzar shdm z bot prstan kenesht<\/p><p class=\"fa\">خیّام که گفت دوزخی خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khyyam kh gft dvzkhy khvahd bvd<\/p><p class=\"fa\">کِه رفت بدوزخ و کِه آمد ز بهشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">keh rft bdvzkh v keh āmd z bhsht<\/p>"},{"n":22,"label":"۲۲","verse":"<p class=\"fa\">ترکیب پیالهٔ که در هم پیوست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">trkyb pyalhٔ kh dr hm pyvst<\/p><p class=\"fa\">بشکستن آن روا نمیدارد مست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bshkstn ān rva nmydard mst<\/p><p class=\"fa\">چندین سر و پای نازنین از سر دست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chndyn sr v pay naznyn az sr dst<\/p><p class=\"fa\">بر مِهرِ که پیوست و بکین که شکست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br mehre kh pyvst v bkyn kh shkst<\/p>"},{"n":23,"label":"۲۳","verse":"<p class=\"fa\">ترکیب طبایع چو بکام تو دَمی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">trkyb tbay&#x27; chv bkam tv damy ast<\/p><p class=\"fa\">رو شاد بزی اگرچه بر تو ستمی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rv shad bzy agrchh br tv stmy ast<\/p><p class=\"fa\">با اهل خِرَد باش که اصل تَنِ تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba ahl kherad bash kh asl tane tv<\/p><p class=\"fa\">گَردیّ و نسیمی و غباریّ و دَمی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gardyy v nsymy v ghbaryy v damy ast<\/p>"},{"n":24,"label":"۲۴","verse":"<p class=\"fa\">چون ابر بنوروز رخ لاله بشُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn abr bnvrvz rkh lalh bshost<\/p><p class=\"fa\">برخیز و بجام باده کن عزم درست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brkhyz v bjam badh kn &#x27;zm drst<\/p><p class=\"fa\">کاین سبزه که امروز تماشاگه تُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn sbzh kh amrvz tmashagh tost<\/p><p class=\"fa\">فردا همه از خاک تو برخواهد رست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda hmh az khak tv brkhvahd rst<\/p>"},{"n":25,"label":"۲۵","verse":"<p class=\"fa\">چون بلبل مست راه در بُستان یافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn blbl mst rah dr bostan yaft<\/p><p class=\"fa\">روی گُل و جام باده را خندان یافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rvy gol v jam badh ra khndan yaft<\/p><p class=\"fa\">آمد بزبان حال در گوشم گفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āmd bzban hal dr gvshm gft<\/p><p class=\"fa\">دریاب که عمر رفته را نتوان یافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dryab kh &#x27;mr rfth ra ntvan yaft<\/p>"},{"n":26,"label":"۲۶","verse":"<p class=\"fa\">چون چرخ بکام یک خردمند نگشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn chrkh bkam yk khrdmnd ngsht<\/p><p class=\"fa\">تو خواه فلک هفت شُمر خواهی هشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">tv khvah flk hft shomr khvahy hsht<\/p><p class=\"fa\">چون باید مُرد و آرزوها همه هشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn bayd mord v ārzvha hmh hsht<\/p><p class=\"fa\">چه مور خورد بگور و چه گرگ بدشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chh mvr khvrd bgvr v chh grg bdsht<\/p>"},{"n":27,"label":"۲۷","verse":"<p class=\"fa\">چون لاله بنوروز قدح گیر بدست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn lalh bnvrvz qdh gyr bdst<\/p><p class=\"fa\">با لاله رخی اگر ترا فرصت هست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba lalh rkhy agr tra frst hst<\/p><p class=\"fa\">می نوش بخرّمی که این چرخ کهن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh bkhrrmy kh ayn chrkh khn<\/p><p class=\"fa\">ناگاه ترا چو خاک گرداند پست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nagah tra chv khak grdand pst<\/p>"},{"n":28,"label":"۲۸","verse":"<p class=\"fa\">چون نیست حقیقت و یقین اندر دست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn nyst hqyqt v yqyn andr dst<\/p><p class=\"fa\">نتوان بامید شک همه عمر نشست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ntvan bamyd shk hmh &#x27;mr nshst<\/p><p class=\"fa\">هان تا ننهیم جام می از کفِ دست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">han ta nnhym jam my az kfe dst<\/p><p class=\"fa\">در بیخبری مرو چه هشیار و چه مست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr bykhbry mrv chh hshyar v chh mst<\/p>"},{"n":29,"label":"۲۹","verse":"<p class=\"fa\">چون نیست ز هرچه هست جز باد بدست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn nyst z hrchh hst jz bad bdst<\/p><p class=\"fa\">چون هست بهرچه هست نقصان و شکست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn hst bhrchh hst nqsan v shkst<\/p><p class=\"fa\">انگار که هرچه هست در عالم نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">angar kh hrchh hst dr &#x27;alm nyst<\/p><p class=\"fa\">پندار که هرچه نیست در عالم هست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pndar kh hrchh nyst dr &#x27;alm hst<\/p>"},{"n":30,"label":"۳۰","verse":"<p class=\"fa\">خاکی که بزیر پای هر نادانی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khaky kh bzyr pay hr nadany ast<\/p><p class=\"fa\">کفّ صنمی و چهرهٔ جانانی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kff snmy v chhrhٔ janany ast<\/p><p class=\"fa\">هر خشت که بر کنگرهٔ ایوانی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr khsht kh br kngrhٔ ayvany ast<\/p><p class=\"fa\">انگشت وزیر یا سَرِ سلطانی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">angsht vzyr ya sare sltany ast<\/p>"},{"n":31,"label":"۳۱","verse":"<p class=\"fa\">دارنده چو ترکیب طبایع آراست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">darndh chv trkyb tbay&#x27; ārast<\/p><p class=\"fa\">از بهر چه افکندش اندر کم و کاست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az bhr chh afkndsh andr km v kast<\/p><p class=\"fa\">گر نیک آمد شکستن از بهر چه بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr nyk āmd shkstn az bhr chh bvd<\/p><p class=\"fa\">ور نیک نیامد این صُوَر عیب کراست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vr nyk nyamd ayn sovar &#x27;yb krast<\/p>"},{"n":32,"label":"۳۲","verse":"<p class=\"fa\">در پردهٔ اسرار کسی را ره نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr prdhٔ asrar ksy ra rh nyst<\/p><p class=\"fa\">زین تعبیه جان هیچ کس آگه نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zyn t&#x27;byh jan hych ks āgh nyst<\/p><p class=\"fa\">جز در دل خاک هیچ منزلگه نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jz dr dl khak hych mnzlgh nyst<\/p><p class=\"fa\">میْ خور که چنین فسانه‌ها کوته نیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh chnyn fsanh-ha kvth nyst<\/p>"},{"n":33,"label":"۳۳","verse":"<p class=\"fa\">در خواب بدم مرا خردمندی گفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr khvab bdm mra khrdmndy gft<\/p><p class=\"fa\">کز خواب کسی را گُلِ شادی نشکفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kz khvab ksy ra gole shady nshkft<\/p><p class=\"fa\">کاری چکنی که با اجل باشد جُفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kary chkny kh ba ajl bashd joft<\/p><p class=\"fa\">میْ خور که بزیر خاک میباید خفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh bzyr khak mybayd khft<\/p>"},{"n":34,"label":"۳۴","verse":"<p class=\"fa\">در دایرهٔ که آمد و رفتن ماست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dayrhٔ kh āmd v rftn mast<\/p><p class=\"fa\">او را نه بدایت نه نهایت پیداست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">av ra nh bdayt nh nhayt pydast<\/p><p class=\"fa\">کس می نزند دمی در این معنی راست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks my nznd dmy dr ayn m&#x27;ny rast<\/p><p class=\"fa\">کاین آمدن از کجا و رفتن بکجاست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn āmdn az kja v rftn bkjast<\/p>"},{"n":35,"label":"۳۵","verse":"<p class=\"fa\">در فصل بهار اگر بُتی حور سرشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr fsl bhar agr boty hvr srsht<\/p><p class=\"fa\">یک ساغر می دهد مرا بر لبِ کشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk saghr my dhd mra br lbe ksht<\/p><p class=\"fa\">هرچند بنزد عامه این باشد زشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrchnd bnzd &#x27;amh ayn bashd zsht<\/p><p class=\"fa\">سگ به ز من اگر برم نام بهشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sg bh z mn agr brm nam bhsht<\/p>"},{"n":36,"label":"۳۶","verse":"<p class=\"fa\">دَریاب که از روح جدا خواهی رفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">daryab kh az rvh jda khvahy rft<\/p><p class=\"fa\">در پردهٔ اسرار فنا خواهی رفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr prdhٔ asrar fna khvahy rft<\/p><p class=\"fa\">می نوش ندانی از کجا آمدهٔ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh ndany az kja āmdhٔ<\/p><p class=\"fa\">خوش باش ندانی بکجا خواهی رفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash ndany bkja khvahy rft<\/p>"},{"n":37,"label":"۳۷","verse":"<p class=\"fa\">ساقی گُل و سبزه طربناک شده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">saqy gol v sbzh trbnak shdh ast<\/p><p class=\"fa\">دریاب که هفتهٔ دگر خاک شده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dryab kh hfthٔ dgr khak shdh ast<\/p><p class=\"fa\">می نوش و گُلی بچین که تا درنگری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh v goly bchyn kh ta drngry<\/p><p class=\"fa\">گل خاک شده است و سبزه خاشاک شده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gl khak shdh ast v sbzh khashak shdh ast<\/p>"},{"n":38,"label":"۳۸","verse":"<p class=\"fa\">عمری است مرا تیره و کاریست نه راست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">&#x27;mry ast mra tyrh v karyst nh rast<\/p><p class=\"fa\">محنت همه افزوده و راحت کم و کاست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mhnt hmh afzvdh v raht km v kast<\/p><p class=\"fa\">شکر ایزد را که آنچه اسباب بلاست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shkr ayzd ra kh ānchh asbab blast<\/p><p class=\"fa\">ما را ز کس دگر نمی‌باید خواست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ma ra z ks dgr nmy-bayd khvast<\/p>"},{"n":39,"label":"۳۹","verse":"<p class=\"fa\">فصلِ گُل و طرف جویبار و لبِ کشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fsle gol v trf jvybar v lbe ksht<\/p><p class=\"fa\">با یک دو سه اهل و لعبتی حور سرشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba yk dv sh ahl v l&#x27;bty hvr srsht<\/p><p class=\"fa\">پیش آر قدح که باده نوشان صبوح<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pysh ār qdh kh badh nvshan sbvh<\/p><p class=\"fa\">آسوده ز مسجدند و فارغ ز کِنِشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āsvdh z msjdnd v fargh z kenesht<\/p>"},{"n":40,"label":"۴۰","verse":"<p class=\"fa\">گر شاخ بقا ز بیخ بختت رست است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr shakh bqa z bykh bkhtt rst ast<\/p><p class=\"fa\">ور بر تن تو عمر لباسی چست است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vr br tn tv &#x27;mr lbasy chst ast<\/p><p class=\"fa\">در خیمهٔ تن که سایه‌بانی است ترا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr khymhٔ tn kh sayh-bany ast tra<\/p><p class=\"fa\">هان تکیه مکن که چار میخش سست است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">han tkyh mkn kh char mykhsh sst ast<\/p>"},{"n":41,"label":"۴۱","verse":"<p class=\"fa\">گویند کسان بهشت با حور خوش است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd ksan bhsht ba hvr khvsh ast<\/p><p class=\"fa\">من میگویم که آب انگور خوش است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn mygvym kh āb angvr khvsh ast<\/p><p class=\"fa\">این نقد بگیر و دست از آن نسیه بدار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn nqd bgyr v dst az ān nsyh bdar<\/p><p class=\"fa\">کآواز دهل شنیدن از دور خوش است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kāvaz dhl shnydn az dvr khvsh ast<\/p>"},{"n":42,"label":"۴۲","verse":"<p class=\"fa\">گویند مرا که دوزخی باشد مست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd mra kh dvzkhy bashd mst<\/p><p class=\"fa\">قولی است خلاف و دل در آن نتوان بست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qvly ast khlaf v dl dr ān ntvan bst<\/p><p class=\"fa\">گر عاشق و میخواره بدوزخ باشند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr &#x27;ashq v mykhvarh bdvzkh bashnd<\/p><p class=\"fa\">فردا بینی بهشت همچون کف دست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda byny bhsht hmchvn kf dst<\/p>"},{"n":43,"label":"۴۳","verse":"<p class=\"fa\">من هیچ ندانم که مرا آنکه سرشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn hych ndanm kh mra ānkh srsht<\/p><p class=\"fa\">از اهل بهشت کرد یا دوزخ زشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az ahl bhsht krd ya dvzkh zsht<\/p><p class=\"fa\">جامی و بتیّ و بربطی بر لبِ کشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jamy v btyy v brbty br lbe ksht<\/p><p class=\"fa\">این هرسه مرا نقد و ترا نسیه بهشت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn hrsh mra nqd v tra nsyh bhsht<\/p>"},{"n":44,"label":"۴۴","verse":"<p class=\"fa\">مهتاب بنور دامن شب بشکافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mhtab bnvr damn shb bshkaft<\/p><p class=\"fa\">می نوش دمی بهتر از این نتوان یافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh dmy bhtr az ayn ntvan yaft<\/p><p class=\"fa\">خوش باش و میندیش که مهتاب بسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash v myndysh kh mhtab bsy<\/p><p class=\"fa\">اندر سَرِ خاکِ یک بیک خواهد تافت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">andr sare khake yk byk khvahd taft<\/p>"},{"n":45,"label":"۴۵","verse":"<p class=\"fa\">می خوردن و شاد بودن آئین من است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvrdn v shad bvdn āiyn mn ast<\/p><p class=\"fa\">فارغ بودن ز کفر و دین دین من است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fargh bvdn z kfr v dyn dyn mn ast<\/p><p class=\"fa\">گفتم بعروس دهر کابین تو چیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gftm b&#x27;rvs dhr kabyn tv chyst<\/p><p class=\"fa\">گفت دلِ خرّم تو کابین من است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gft dle khrrm tv kabyn mn ast<\/p>"},{"n":46,"label":"۴۶","verse":"<p class=\"fa\">می لعل مُذاب است و صراحی کان است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my l&#x27;l mozab ast v srahy kan ast<\/p><p class=\"fa\">جسم است پیاله و شرابش جان است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jsm ast pyalh v shrabsh jan ast<\/p><p class=\"fa\">آن جام بلورین که ز می خندان است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān jam blvryn kh z my khndan ast<\/p><p class=\"fa\">اشکی است که خون دل در او پنهان است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ashky ast kh khvn dl dr av pnhan ast<\/p>"},{"n":47,"label":"۴۷","verse":"<p class=\"fa\">می نوش که عمر جاودانی این است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh kh &#x27;mr javdany ayn ast<\/p><p class=\"fa\">خود حاصلت از دور جوانی این است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvd haslt az dvr jvany ayn ast<\/p><p class=\"fa\">هنگام گُل و باده و یاران سرمست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hngam gol v badh v yaran srmst<\/p><p class=\"fa\">خوش باش دَمی که زندگانی این است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash damy kh zndgany ayn ast<\/p>"},{"n":48,"label":"۴۸","verse":"<p class=\"fa\">نیکی و بدی که در نهادِ بشر است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nyky v bdy kh dr nhade bshr ast<\/p><p class=\"fa\">شادی و غمی که در قضا و قدر است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">shady v ghmy kh dr qza v qdr ast<\/p><p class=\"fa\">با چرخ مکل حواله کاندر رَهِ عقل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba chrkh mkl hvalh kandr rahe &#x27;ql<\/p><p class=\"fa\">چرخ از تو هزار بار بیچاره‌تر است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chrkh az tv hzar bar bycharh-tr ast<\/p>"},{"n":49,"label":"۴۹","verse":"<p class=\"fa\">در هر دشتی که لاله‌زاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr hr dshty kh lalh-zary bvdh ast<\/p><p class=\"fa\">از سرخی خون شهریاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az srkhy khvn shhryary bvdh ast<\/p><p class=\"fa\">هر شاخ بنفشه کز زمین میروید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr shakh bnfshh kz zmyn myrvyd<\/p><p class=\"fa\">خالی است که بر رخ نگاری بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khaly ast kh br rkh ngary bvdh ast<\/p>"},{"n":50,"label":"۵۰","verse":"<p class=\"fa\">هر ذرّه که در خاک زمینی بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr zrrh kh dr khak zmyny bvdh ast<\/p><p class=\"fa\">پیش از من و تو تاج و نگینی بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pysh az mn v tv taj v ngyny bvdh ast<\/p><p class=\"fa\">گرد از رخ نازنین بآزرم فشان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">grd az rkh naznyn bāzrm fshan<\/p><p class=\"fa\">کانهم رخ خوب نازنینی بوده است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kanhm rkh khvb naznyny bvdh ast<\/p>"},{"n":51,"label":"۵۱","verse":"<p class=\"fa\">هر سبزه که بر کنار جوئی رسته است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr sbzh kh br knar jviy rsth ast<\/p><p class=\"fa\">گوئی ز لب فرشته خوئی رسته است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gviy z lb frshth khviy rsth ast<\/p><p class=\"fa\">پا بر سر سبزه تا بخواری ننهی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pa br sr sbzh ta bkhvary nnhy<\/p><p class=\"fa\">کان سبزه ز خاک لاله‌روئی رسته است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kan sbzh z khak lalh-rviy rsth ast<\/p>"},{"n":52,"label":"۵۲","verse":"<p class=\"fa\">یک جرعهٔ می ز ملک کاوس بهست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jr&#x27;hٔ my z mlk kavs bhst<\/p><p class=\"fa\">از تخت قباد و ملکت طوس بهست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az tkht qbad v mlkt tvs bhst<\/p><p class=\"fa\">هر ناله که رندی بسحرگاه زند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr nalh kh rndy bshrgah znd<\/p><p class=\"fa\">از طاعت زاهدان سالوس بهست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az ta&#x27;t zahdan salvs bhst<\/p>"},{"n":53,"label":"۵۳","verse":"<p class=\"fa\">چون عمر بسر رسد چه شیرین و چه تلخ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn &#x27;mr bsr rsd chh shyryn v chh tlkh<\/p><p class=\"fa\">پیمانه چو پُر شد چه بغداد و چه بلخ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pymanh chv por shd chh bghdad v chh blkh<\/p><p class=\"fa\">می نوش که بعد از من و تو ماه بسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh kh b&#x27;d az mn v tv mah bsy<\/p><p class=\"fa\">از سلخ بغرّه آید از غرّه بسلخ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az slkh bghrrh āyd az ghrrh bslkh<\/p>"},{"n":54,"label":"۵۴","verse":"<p class=\"fa\">انانکه محیط فضل و آداب شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">anankh mhyt fzl v ādab shdnd<\/p><p class=\"fa\">در جمع کمال شمع اصحاب شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr jm&#x27; kmal shm&#x27; ashab shdnd<\/p><p class=\"fa\">ره زین شب تاریک نبردند برون<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rh zyn shb taryk nbrdnd brvn<\/p><p class=\"fa\">گفتند فسانه و در خواب شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gftnd fsanh v dr khvab shdnd<\/p>"},{"n":55,"label":"۵۵","verse":"<p class=\"fa\">آنرا که بصحرای علل تاخته‌اند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ānra kh bshray &#x27;ll takhth-and<\/p><p class=\"fa\">بی او همه کارها بپرداخته‌اند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">by av hmh karha bprdakhth-and<\/p><p class=\"fa\">امروز بهانهٔ در انداخته‌اند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">amrvz bhanhٔ dr andakhth-and<\/p><p class=\"fa\">فردا همه آن بود که درساخته‌اند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda hmh ān bvd kh drsakhth-and<\/p>"},{"n":56,"label":"۵۶","verse":"<p class=\"fa\">آنها که کهن شدند و اینها که نوند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ānha kh khn shdnd v aynha kh nvnd<\/p><p class=\"fa\">هرکس بمراد خویش یک تک بدوند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrks bmrad khvysh yk tk bdvnd<\/p><p class=\"fa\">این کهنه جهان بکس نماند باقی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn khnh jhan bks nmand baqy<\/p><p class=\"fa\">رفتند و رویم و دیگر آیند و روند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rftnd v rvym v dygr āynd v rvnd<\/p>"},{"n":57,"label":"۵۷","verse":"<p class=\"fa\">آنکس که زمین و چرخ و افلاک نهاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ānks kh zmyn v chrkh v aflak nhad<\/p><p class=\"fa\">بس داغ که او بر دل غمناک نهاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bs dagh kh av br dl ghmnak nhad<\/p><p class=\"fa\">بسیار لب چو لعل و زلفین چو مشک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bsyar lb chv l&#x27;l v zlfyn chv mshk<\/p><p class=\"fa\">در طبل زمین و حقهٔ خاک نهاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr tbl zmyn v hqhٔ khak nhad<\/p>"},{"n":58,"label":"۵۸","verse":"<p class=\"fa\">آرند یکی و دیگری بربایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ārnd yky v dygry brbaynd<\/p><p class=\"fa\">بر هیچ کسی راز همی نگشایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br hych ksy raz hmy ngshaynd<\/p><p class=\"fa\">ما را ز قضا جز این قدر ننمایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ma ra z qza jz ayn qdr nnmaynd<\/p><p class=\"fa\">پیمانهٔ عمر ماست می‌پیمایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pymanhٔ &#x27;mr mast my-pymaynd<\/p>"},{"n":59,"label":"۵۹","verse":"<p class=\"fa\">اجرام که ساکنان این ایوانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ajram kh saknan ayn ayvannd<\/p><p class=\"fa\">اسباب تردُّدِ خردمندانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">asbab trdodde khrdmndannd<\/p><p class=\"fa\">هان تا سرِ رشتهٔ خِرَد گُم نکنی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">han ta sre rshthٔ kherad gom nkny<\/p><p class=\"fa\">کانانکه مدبّرند سرگردانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kanankh mdbbrnd srgrdannd<\/p>"},{"n":60,"label":"۶۰","verse":"<p class=\"fa\">از آمدنم نبود گردون را سود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az āmdnm nbvd grdvn ra svd<\/p><p class=\"fa\">وز رفتن من جلال و جاهش نفُزود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz rftn mn jlal v jahsh nfozvd<\/p><p class=\"fa\">وز هیچ کسی نیز دو گوشم نشنود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz hych ksy nyz dv gvshm nshnvd<\/p><p class=\"fa\">کاین آمدن و رفتنم از بهر چه بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn āmdn v rftnm az bhr chh bvd<\/p>"},{"n":61,"label":"۶۱","verse":"<p class=\"fa\">از رنج کشیدن آدمی حُرّ گردد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az rnj kshydn ādmy horr grdd<\/p><p class=\"fa\">قطره چو کشد حبس صدف دُر گردد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">qtrh chv kshd hbs sdf dor grdd<\/p><p class=\"fa\">گر مال نماند سر بماناد بجای<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr mal nmand sr bmanad bjay<\/p><p class=\"fa\">پیمانه چو شد تُهی دِگر پُر گردد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pymanh chv shd tohy degr por grdd<\/p>"},{"n":62,"label":"۶۲","verse":"<p class=\"fa\">افسوس که سرمایه ز کف بیرون شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">afsvs kh srmayh z kf byrvn shd<\/p><p class=\"fa\">وز دست اجل بسی جگرها خون شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz dst ajl bsy jgrha khvn shd<\/p><p class=\"fa\">کس نامَد از آن جهان که پُرسم از وی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks namad az ān jhan kh porsm az vy<\/p><p class=\"fa\">کاحوال مسافران دنیا چون شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kahval msafran dnya chvn shd<\/p>"},{"n":63,"label":"۶۳","verse":"<p class=\"fa\">افسوس که نامهٔ جوانی طی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">afsvs kh namhٔ jvany ty shd<\/p><p class=\"fa\">وان تازه بهار زندگانی دی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">van tazh bhar zndgany dy shd<\/p><p class=\"fa\">آن مرغ طرب که نام او بود شباب<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān mrgh trb kh nam av bvd shbab<\/p><p class=\"fa\">فریاد ندانم که کی آمد کی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fryad ndanm kh ky āmd ky shd<\/p>"},{"n":64,"label":"۶۴","verse":"<p class=\"fa\">ای بس که نباشیم و جهان خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay bs kh nbashym v jhan khvahd bvd<\/p><p class=\"fa\">نی نام ز ما و نی نشان خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ny nam z ma v ny nshan khvahd bvd<\/p><p class=\"fa\">زین پیش نبودیم و نبُد هیچ خلل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zyn pysh nbvdym v nbod hych khll<\/p><p class=\"fa\">زین پس چو نباشیم همان خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zyn ps chv nbashym hman khvahd bvd<\/p>"},{"n":65,"label":"۶۵","verse":"<p class=\"fa\">این عقل که در رَهِ سعادت پوید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn &#x27;ql kh dr rahe s&#x27;adt pvyd<\/p><p class=\"fa\">روزی صدبار خود تُرا میگوید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rvzy sdbar khvd tora mygvyd<\/p><p class=\"fa\">دریاب تو این یکدم وقتت که نهٔ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dryab tv ayn ykdm vqtt kh nhٔ<\/p><p class=\"fa\">آن تره که بدروند و دیگر روید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān trh kh bdrvnd v dygr rvyd<\/p>"},{"n":66,"label":"۶۶","verse":"<p class=\"fa\">این قافلهٔ عمر عجب میگذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn qaflhٔ &#x27;mr &#x27;jb mygzrd<\/p><p class=\"fa\">دریاب دَمی که با طرب میگذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dryab damy kh ba trb mygzrd<\/p><p class=\"fa\">ساقی غم فردای حریفان چه خوری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">saqy ghm frday hryfan chh khvry<\/p><p class=\"fa\">پیش آر پیاله را که شب میگذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pysh ār pyalh ra kh shb mygzrd<\/p>"},{"n":67,"label":"۶۷","verse":"<p class=\"fa\">بر پشت من از زمانه تو می‌آید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br psht mn az zmanh tv my-āyd<\/p><p class=\"fa\">وز من همه کار نانکو می‌آید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz mn hmh kar nankv my-āyd<\/p><p class=\"fa\">جان عزم رحیل کرد گفتم بِمرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jan &#x27;zm rhyl krd gftm bemrd<\/p><p class=\"fa\">گفتا چکنم خانه فرو می‌آید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gfta chknm khanh frv my-āyd<\/p>"},{"n":68,"label":"۶۸","verse":"<p class=\"fa\">بر چرخ فلک هیچ کسی چیر نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br chrkh flk hych ksy chyr nshd<\/p><p class=\"fa\">وز خوردن آدمی زمین سیر نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz khvrdn ādmy zmyn syr nshd<\/p><p class=\"fa\">مغرور بدانی که نخوردست تُرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mghrvr bdany kh nkhvrdst tora<\/p><p class=\"fa\">تعجیل نکن هم بخورد دیر نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">t&#x27;jyl nkn hm bkhvrd dyr nshd<\/p>"},{"n":69,"label":"۶۹","verse":"<p class=\"fa\">بر چشم تو عالم ارچه می‌آرایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br chshm tv &#x27;alm archh my-āraynd<\/p><p class=\"fa\">مَگرای بدان که عاقلان نَگرایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">magray bdan kh &#x27;aqlan nagraynd<\/p><p class=\"fa\">بسیار چو تو روند و بسیار آیند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bsyar chv tv rvnd v bsyar āynd<\/p><p class=\"fa\">بربای نصیب خویش کت بربایند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brbay nsyb khvysh kt brbaynd<\/p>"},{"n":70,"label":"۷۰","verse":"<p class=\"fa\">بر من قلم قضا چو بی من رانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br mn qlm qza chv by mn rannd<\/p><p class=\"fa\">پس نیک و بَدَش ز من چرا میدانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ps nyk v badash z mn chra mydannd<\/p><p class=\"fa\">دی بی من و امروز چو دی بی من و تو<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dy by mn v amrvz chv dy by mn v tv<\/p><p class=\"fa\">فردا بچه حجّتم بداور خوانند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda bchh hjjtm bdavr khvannd<\/p>"},{"n":71,"label":"۷۱","verse":"<p class=\"fa\">تا چند اسیر رنگ و بو خواهی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta chnd asyr rng v bv khvahy shd<\/p><p class=\"fa\">چند از پی هر زشت و نکو خواهی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chnd az py hr zsht v nkv khvahy shd<\/p><p class=\"fa\">گر چشمهٔ زمزمیّ و گر آب حیات<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr chshmhٔ zmzmyy v gr āb hyat<\/p><p class=\"fa\">آخر بدل خاک فرو خواهی شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ākhr bdl khak frv khvahy shd<\/p>"},{"n":72,"label":"۷۲","verse":"<p class=\"fa\">تا راه قلندری نپوئی نشود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta rah qlndry npviy nshvd<\/p><p class=\"fa\">رخساره بخون دل نشوئی نشود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rkhsarh bkhvn dl nshviy nshvd<\/p><p class=\"fa\">سودا چه پزی تا که چو دلسوختگان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">svda chh pzy ta kh chv dlsvkhtgan<\/p><p class=\"fa\">آزاد بترک خود نگوئی نشود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āzad btrk khvd ngviy nshvd<\/p>"},{"n":73,"label":"۷۳","verse":"<p class=\"fa\">تا زهره و مه در آسمان گشت پدید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta zhrh v mh dr āsman gsht pdyd<\/p><p class=\"fa\">بهتر ز می ناب کسی هیچ ندید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bhtr z my nab ksy hych ndyd<\/p><p class=\"fa\">من در عجبم ز میفروشان کایشان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn dr &#x27;jbm z myfrvshan kayshan<\/p><p class=\"fa\">به زانکه فروشند چه خواهند خرید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bh zankh frvshnd chh khvahnd khryd<\/p>"},{"n":74,"label":"۷۴","verse":"<p class=\"fa\">چون روزی و عمر بیش و کم نتوان کرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn rvzy v &#x27;mr bysh v km ntvan krd<\/p><p class=\"fa\">دل را بکَم و بیش دژم نتوان کرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dl ra bkam v bysh dzhm ntvan krd<\/p><p class=\"fa\">کار من و تو چنانکه رای من و تُست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kar mn v tv chnankh ray mn v tost<\/p><p class=\"fa\">از موم بدست خویش هم نتوان کرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az mvm bdst khvysh hm ntvan krd<\/p>"},{"n":75,"label":"۷۵","verse":"<p class=\"fa\">حیّی که بقدرت سَرو رومی سازد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hyyy kh bqdrt sarv rvmy sazd<\/p><p class=\"fa\">همواره همو کار عدو می‌سازد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hmvarh hmv kar &#x27;dv my-sazd<\/p><p class=\"fa\">گویند قرابه گر مسلمان نبود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd qrabh gr mslman nbvd<\/p><p class=\"fa\">او را تو چه گوئی که کدو می‌سازد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">av ra tv chh gviy kh kdv my-sazd<\/p>"},{"n":76,"label":"۷۶","verse":"<p class=\"fa\">در دهر چو آوازِ گُلِ تازه دهند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dhr chv āvaze gole tazh dhnd<\/p><p class=\"fa\">فرمای بُتا که می باندازه دهند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frmay bota kh my bandazh dhnd<\/p><p class=\"fa\">از حور و قصور وَز بهشت و دوزخ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az hvr v qsvr vaz bhsht v dvzkh<\/p><p class=\"fa\">فارغ بنشین که آن هر آوازه دهند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fargh bnshyn kh ān hr āvazh dhnd<\/p>"},{"n":77,"label":"۷۷","verse":"<p class=\"fa\">در دهر هر آنکه نیم نانی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dhr hr ānkh nym nany dard<\/p><p class=\"fa\">از بهر نشست آشیانی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az bhr nshst āshyany dard<\/p><p class=\"fa\">نه خادم کس بود نه مخدوم کسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nh khadm ks bvd nh mkhdvm ksy<\/p><p class=\"fa\">گو شاد بزی که خوش جهانی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gv shad bzy kh khvsh jhany dard<\/p>"},{"n":78,"label":"۷۸","verse":"<p class=\"fa\">دهقانِ قضا بسی چو ما کِشت و درود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dhqane qza bsy chv ma kesht v drvd<\/p><p class=\"fa\">غم خوردن بیهوده نمیدارد سود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ghm khvrdn byhvdh nmydard svd<\/p><p class=\"fa\">پُر کن قدح می بکفم در نه زود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">por kn qdh my bkfm dr nh zvd<\/p><p class=\"fa\">تا باز خورم که بودنیها همه بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta baz khvrm kh bvdnyha hmh bvd<\/p>"},{"n":79,"label":"۷۹","verse":"<p class=\"fa\">روزی است خوش و هوا نه گرم است و نه سرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rvzy ast khvsh v hva nh grm ast v nh srd<\/p><p class=\"fa\">ابر از رُخ گلزار همی شوید گرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">abr az rokh glzar hmy shvyd grd<\/p><p class=\"fa\">بلبل بزبان حالِ خود با گل زرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">blbl bzban hale khvd ba gl zrd<\/p><p class=\"fa\">فریاد همی کند که می باید خورد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fryad hmy knd kh my bayd khvrd<\/p>"},{"n":80,"label":"۸۰","verse":"<p class=\"fa\">زان پیش که بر سرت شبیخون آرند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh br srt shbykhvn ārnd<\/p><p class=\"fa\">فرمای که تا بادهٔ گلگون آرند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frmay kh ta badhٔ glgvn ārnd<\/p><p class=\"fa\">تو زر نهٔ ای غافل نادان که تُرا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">tv zr nhٔ ay ghafl nadan kh tora<\/p><p class=\"fa\">در خاک نهند و باز بیرون آرند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr khak nhnd v baz byrvn ārnd<\/p>"},{"n":81,"label":"۸۱","verse":"<p class=\"fa\">عمرت تا کی بخود پرستی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">&#x27;mrt ta ky bkhvd prsty gzrd<\/p><p class=\"fa\">یا در پی نیستی و هستی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ya dr py nysty v hsty gzrd<\/p><p class=\"fa\">می نوش که عمری که اجل در پی اوست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh kh &#x27;mry kh ajl dr py avst<\/p><p class=\"fa\">آن به که بخواب یا بمستی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān bh kh bkhvab ya bmsty gzrd<\/p>"},{"n":82,"label":"۸۲","verse":"<p class=\"fa\">کس مشکل اسرار اجل را نگشاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks mshkl asrar ajl ra ngshad<\/p><p class=\"fa\">کس یک قدم از نهاد بیرون ننهاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ks yk qdm az nhad byrvn nnhad<\/p><p class=\"fa\">من مینگرم ز مُبتدی تا اُستاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn myngrm z mobtdy ta aostad<\/p><p class=\"fa\">عجز است بدست هرکه از مادر زاد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">&#x27;jz ast bdst hrkh az madr zad<\/p>"},{"n":83,"label":"۸۳","verse":"<p class=\"fa\">کم کُن طمع از جهان و میزی خورسند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">km kon tm&#x27; az jhan v myzy khvrsnd<\/p><p class=\"fa\">وز نیک و بد زمانه بکسل پیوند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz nyk v bd zmanh bksl pyvnd<\/p><p class=\"fa\">می در کف و زلف دلبری گیر که زود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my dr kf v zlf dlbry gyr kh zvd<\/p><p class=\"fa\">هم بگذرد و نماند این روزی چند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hm bgzrd v nmand ayn rvzy chnd<\/p>"},{"n":84,"label":"۸۴","verse":"<p class=\"fa\">گرچه غم و رنج من درازی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">grchh ghm v rnj mn drazy dard<\/p><p class=\"fa\">عیش و طرب تو سرفرازی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">&#x27;ysh v trb tv srfrazy dard<\/p><p class=\"fa\">بر هر دو مکن تکیه که دورانِ فلک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br hr dv mkn tkyh kh dvrane flk<\/p><p class=\"fa\">در پرده هزار گونه بازی دارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr prdh hzar gvnh bazy dard<\/p>"},{"n":85,"label":"۸۵","verse":"<p class=\"fa\">گردون ز زمین هیچ گلی بر نارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">grdvn z zmyn hych gly br nard<\/p><p class=\"fa\">کش نشکند و هم بزمین نسپارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ksh nshknd v hm bzmyn nspard<\/p><p class=\"fa\">گر ابر چو آب خاک را بردارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr abr chv āb khak ra brdard<\/p><p class=\"fa\">تا حشر همه خون عزیزان بارد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta hshr hmh khvn &#x27;zyzan bard<\/p>"},{"n":86,"label":"۸۶","verse":"<p class=\"fa\">گر یک نَفست ز زندگانی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr yk nafst z zndgany gzrd<\/p><p class=\"fa\">مگذار که جز بشادمانی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mgzar kh jz bshadmany gzrd<\/p><p class=\"fa\">هُشدار که سرمایهٔ سودای جهان<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hoshdar kh srmayhٔ svday jhan<\/p><p class=\"fa\">عمر است چنان کش گذرانی گذرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">&#x27;mr ast chnan ksh gzrany gzrd<\/p>"},{"n":87,"label":"۸۷","verse":"<p class=\"fa\">گویند بهشت و حور عین خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd bhsht v hvr &#x27;yn khvahd bvd<\/p><p class=\"fa\">آنجا می و شیر و انگبین خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ānja my v shyr v angbyn khvahd bvd<\/p><p class=\"fa\">گر ما می و معشوق گزیدیم چه باک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr ma my v m&#x27;shvq gzydym chh bak<\/p><p class=\"fa\">چون عاقبتِ کار چنین خواهد بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn &#x27;aqbte kar chnyn khvahd bvd<\/p>"},{"n":88,"label":"۸۸","verse":"<p class=\"fa\">گویند بهشت و حور و کوثر باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd bhsht v hvr v kvsr bashd<\/p><p class=\"fa\">جویِ می و شیر و شهد و شکّر باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jvye my v shyr v shhd v shkkr bashd<\/p><p class=\"fa\">پُر کُن قدح باده و بر دستم نه<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">por kon qdh badh v br dstm nh<\/p><p class=\"fa\">نقدی ز هزار نسیه خوشتر باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nqdy z hzar nsyh khvshtr bashd<\/p>"},{"n":89,"label":"۸۹","verse":"<p class=\"fa\">گویند هر آنکسان که با پرهیزند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gvynd hr ānksan kh ba prhyznd<\/p><p class=\"fa\">زانسان که بمیرند چنان برخیزند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zansan kh bmyrnd chnan brkhyznd<\/p><p class=\"fa\">ما با می و معشوقه از آنیم مُدام<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ma ba my v m&#x27;shvqh az ānym modam<\/p><p class=\"fa\">باشد که بحشرمان چنان انگیزند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bashd kh bhshrman chnan angyznd<\/p>"},{"n":90,"label":"۹۰","verse":"<p class=\"fa\">می خور که ز دل کثرت و قلّت ببرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr kh z dl ksrt v qllt bbrd<\/p><p class=\"fa\">و اندیشهٔ هفتاد و دو ملّت ببرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">v andyshhٔ hftad v dv mllt bbrd<\/p><p class=\"fa\">پرهیز مکن ز کیمیائی که از او<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">prhyz mkn z kymyaiy kh az av<\/p><p class=\"fa\">یک جرعه خوری هزار علّت ببرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jr&#x27;h khvry hzar &#x27;llt bbrd<\/p>"},{"n":91,"label":"۹۱","verse":"<p class=\"fa\">هر راز که اندر دل دانا باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr raz kh andr dl dana bashd<\/p><p class=\"fa\">باید که نهفته‌تر ز عنقا باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bayd kh nhfth-tr z &#x27;nqa bashd<\/p><p class=\"fa\">کاندر صدف از نهفتگی گردد دُر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kandr sdf az nhftgy grdd dor<\/p><p class=\"fa\">آن قطره که رازِ دلِ دریا باشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān qtrh kh raze dle drya bashd<\/p>"},{"n":92,"label":"۹۲","verse":"<p class=\"fa\">هر صبح که روی لاله شبنم گیرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr sbh kh rvy lalh shbnm gyrd<\/p><p class=\"fa\">بالای بنفشه در چمن خم گیرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">balay bnfshh dr chmn khm gyrd<\/p><p class=\"fa\">انصاف مرا ز غنچه خوش میآید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ansaf mra z ghnchh khvsh myāyd<\/p><p class=\"fa\">کو دامنِ خویشتن فراهم گیرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kv damne khvyshtn frahm gyrd<\/p>"},{"n":93,"label":"۹۳","verse":"<p class=\"fa\">هرگز دل من ز علم محروم نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hrgz dl mn z &#x27;lm mhrvm nshd<\/p><p class=\"fa\">کم ماند ز اسرار که معلوم نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">km mand z asrar kh m&#x27;lvm nshd<\/p><p class=\"fa\">هفتاد و دو سال فکر کردم شب و روز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hftad v dv sal fkr krdm shb v rvz<\/p><p class=\"fa\">معلومم شد که هیچ معلوم نشد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">m&#x27;lvmm shd kh hych m&#x27;lvm nshd<\/p>"},{"n":94,"label":"۹۴","verse":"<p class=\"fa\">هم دانهٔ امید بخرمن ماند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hm danhٔ amyd bkhrmn mand<\/p><p class=\"fa\">هم باغ و سرای بی تو و من ماند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hm bagh v sray by tv v mn mand<\/p><p class=\"fa\">سیم و زر خویش از دِرَمی تا بجوی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sym v zr khvysh az deramy ta bjvy<\/p><p class=\"fa\">با دوست بخور گرنه بدشمن ماند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba dvst bkhvr grnh bdshmn mand<\/p>"},{"n":95,"label":"۹۵","verse":"<p class=\"fa\">یارانِ موافق همه از دست شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yarane mvafq hmh az dst shdnd<\/p><p class=\"fa\">در پای اجل یکان یکان پست شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr pay ajl ykan ykan pst shdnd<\/p><p class=\"fa\">خوردیم ز یک شراب در مجلس عمر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvrdym z yk shrab dr mjls &#x27;mr<\/p><p class=\"fa\">دوری دو سه پیشتر ز ما مست شدند<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dvry dv sh pyshtr z ma mst shdnd<\/p>"},{"n":96,"label":"۹۶","verse":"<p class=\"fa\">یک جام شراب صد دل و دین ارزد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jam shrab sd dl v dyn arzd<\/p><p class=\"fa\">یک جرعهٔ می مملکت چین ارزد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk jr&#x27;hٔ my mmlkt chyn arzd<\/p><p class=\"fa\">جز بادهٔ لعل نیست در روی زمین<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jz badhٔ l&#x27;l nyst dr rvy zmyn<\/p><p class=\"fa\">تخمی که هزار جان شیرین ارزد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">tkhmy kh hzar jan shyryn arzd<\/p>"},{"n":97,"label":"۹۷","verse":"<p class=\"fa\">یک قطرهٔ آب بود با دریا شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk qtrhٔ āb bvd ba drya shd<\/p><p class=\"fa\">یک ذرّهٔ خاک با زمین یکتا شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk zrrhٔ khak ba zmyn ykta shd<\/p><p class=\"fa\">آمد شدنِ تو اندرین عالم چیست<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āmd shdne tv andryn &#x27;alm chyst<\/p><p class=\"fa\">آمد مگسی پدید و ناپیدا شد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āmd mgsy pdyd v napyda shd<\/p>"},{"n":98,"label":"۹۸","verse":"<p class=\"fa\">یک نان بدو روز اگر بود حاصلِ مرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">yk nan bdv rvz agr bvd hasle mrd<\/p><p class=\"fa\">وز کوزه شکستهٔ دَمی آبی سرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz kvzh shksthٔ damy āby srd<\/p><p class=\"fa\">مأمور کم از خودی چرا باید بود<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mamvr km az khvdy chra bayd bvd<\/p><p class=\"fa\">یا خدمت چون خودی چرا باید کرد<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ya khdmt chvn khvdy chra bayd krd<\/p>"},{"n":99,"label":"۹۹","verse":"<p class=\"fa\">آن لعل در آبگینهٔ ساده بیار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ān l&#x27;l dr ābgynhٔ sadh byar<\/p><p class=\"fa\">وان محرم و مونس هر آزاده بیار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">van mhrm v mvns hr āzadh byar<\/p><p class=\"fa\">چون میدانی که مدّت عالم خاک<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn mydany kh mddt &#x27;alm khak<\/p><p class=\"fa\">باد است که زود بگذرد باده بیار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bad ast kh zvd bgzrd badh byar<\/p>"},{"n":100,"label":"۱۰۰","verse":"<p class=\"fa\">از بودنی ایدوست چه داری تیمار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az bvdny aydvst chh dary tymar<\/p><p class=\"fa\">وز فکرت بیهوده دل و جان افکار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vz fkrt byhvdh dl v jan afkar<\/p><p class=\"fa\">خرّم بزی و جهان بشادی گذران<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khrrm bzy v jhan bshady gzran<\/p><p class=\"fa\">تدبیر نه با تو کرده‌اند اوّل کار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">tdbyr nh ba tv krdh-and avvl kar<\/p>"},{"n":101,"label":"۱۰۱","verse":"<p class=\"fa\">افلاک که جز غم نفزایند دگر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aflak kh jz ghm nfzaynd dgr<\/p><p class=\"fa\">ننهند بجا تا نربایند دگر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nnhnd bja ta nrbaynd dgr<\/p><p class=\"fa\">نا آمدگان اگر بدانند که ما<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">na āmdgan agr bdannd kh ma<\/p><p class=\"fa\">از دهر چه میکشیم نایند دگر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az dhr chh mykshym naynd dgr<\/p>"},{"n":102,"label":"۱۰۲","verse":"<p class=\"fa\">ای دل غم این جهان فرسوده مخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay dl ghm ayn jhan frsvdh mkhvr<\/p><p class=\"fa\">بیهوده نهٔ غمان بیهوده مخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">byhvdh nhٔ ghman byhvdh mkhvr<\/p><p class=\"fa\">چون بوده گذشت و نیست نابوده پدید<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn bvdh gzsht v nyst nabvdh pdyd<\/p><p class=\"fa\">خوش باش غم بوده و نابوده مخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvsh bash ghm bvdh v nabvdh mkhvr<\/p>"},{"n":103,"label":"۱۰۳","verse":"<p class=\"fa\">ایدل همه اسباب جهان خواسته گیر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">aydl hmh asbab jhan khvasth gyr<\/p><p class=\"fa\">باغ طربت بسبزه آراسته گیر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bagh trbt bsbzh ārasth gyr<\/p><p class=\"fa\">وانگاه بر آن سبزه شبی چون شبنم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vangah br ān sbzh shby chvn shbnm<\/p><p class=\"fa\">بنشسته و بامداد برخاسته گیر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bnshsth v bamdad brkhasth gyr<\/p>"},{"n":104,"label":"۱۰۴","verse":"<p class=\"fa\">این اهل قبور خاک گشتند و غبار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn ahl qbvr khak gshtnd v ghbar<\/p><p class=\"fa\">هر ذرّه ز هر ذرّه گرفتند کنار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr zrrh z hr zrrh grftnd knar<\/p><p class=\"fa\">آه این چه شراب است که تا روز شمار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āh ayn chh shrab ast kh ta rvz shmar<\/p><p class=\"fa\">بیخود شده و بیخبرند از همه کار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bykhvd shdh v bykhbrnd az hmh kar<\/p>"},{"n":105,"label":"۱۰۵","verse":"<p class=\"fa\">خشت سر خم ز ملکت جم خوشتر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khsht sr khm z mlkt jm khvshtr<\/p><p class=\"fa\">بوی قدح از غذای مریم خوشتر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bvy qdh az ghzay mrym khvshtr<\/p><p class=\"fa\">آه سحری ز سینهٔ خمّاری<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">āh shry z synhٔ khmmary<\/p><p class=\"fa\">از نالهٔ بوسعید و ادهم خوشتر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az nalhٔ bvs&#x27;yd v adhm khvshtr<\/p>"},{"n":106,"label":"۱۰۶","verse":"<p class=\"fa\">در دایرهٔ سپهر ناپیدا غور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dayrhٔ sphr napyda ghvr<\/p><p class=\"fa\">جامی است که جمله را چشانند بدور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jamy ast kh jmlh ra chshannd bdvr<\/p><p class=\"fa\">نوبت چو بدور تو رسد آه مکن<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nvbt chv bdvr tv rsd āh mkn<\/p><p class=\"fa\">می نوش بخوشدلی که دور است نه جور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my nvsh bkhvshdly kh dvr ast nh jvr<\/p>"},{"n":107,"label":"۱۰۷","verse":"<p class=\"fa\">دی کوزه گری بدیدم اندر بازار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dy kvzh gry bdydm andr bazar<\/p><p class=\"fa\">بر پاره گِلی لگد همی زد بسیار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br parh gely lgd hmy zd bsyar<\/p><p class=\"fa\">و آن گِل بزبان حال با او میگفت<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">v ān gel bzban hal ba av mygft<\/p><p class=\"fa\">من همچو تو بوده‌ام مرا نیکو دار<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mn hmchv tv bvdh-am mra nykv dar<\/p>"},{"n":108,"label":"۱۰۸","verse":"<p class=\"fa\">زان می که حیات جاودانی است بخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan my kh hyat javdany ast bkhvr<\/p><p class=\"fa\">سرمایهٔ لذّت جوانی است بخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">srmayhٔ lzzt jvany ast bkhvr<\/p><p class=\"fa\">سوزنده چو آتش است لیکن غم را<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">svzndh chv ātsh ast lykn ghm ra<\/p><p class=\"fa\">سازنده چو آب زندگانی است بخور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sazndh chv āb zndgany ast bkhvr<\/p>"},{"n":109,"label":"۱۰۹","verse":"<p class=\"fa\">گر باده خوری تو با خردمندان خور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">gr badh khvry tv ba khrdmndan khvr<\/p><p class=\"fa\">یا با صنمی لاله رخی خندان خور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ya ba snmy lalh rkhy khndan khvr<\/p><p class=\"fa\">بسیار مخور وِرْدْ مکُن فاش مساز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bsyar mkhvr verd mkon fash msaz<\/p><p class=\"fa\">اندک خور و گَه گاه خور و پنهان خور<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">andk khvr v gah gah khvr v pnhan khvr<\/p>"},{"n":110,"label":"۱۱۰","verse":"<p class=\"fa\">وقت سحر است خیز ای طرفه پسر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vqt shr ast khyz ay trfh psr<\/p><p class=\"fa\">پُر باده لعل کُن بلورین ساغر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">por badh l&#x27;l kon blvryn saghr<\/p><p class=\"fa\">کاین یکدم عاریت در این کُنج فنا<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn ykdm &#x27;aryt dr ayn konj fna<\/p><p class=\"fa\">بسیار بجوئیّ و نیابی دیگر<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bsyar bjviyy v nyaby dygr<\/p>"},{"n":111,"label":"۱۱۱","verse":"<p class=\"fa\">از جملهٔ رفتگان این راه دراز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az jmlhٔ rftgan ayn rah draz<\/p><p class=\"fa\">باز آمده کیست تا بما گوید راز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">baz āmdh kyst ta bma gvyd raz<\/p><p class=\"fa\">پس بر سر این دو راههٔ آز و نیاز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ps br sr ayn dv rahhٔ āz v nyaz<\/p><p class=\"fa\">تا هیچ نمانی که نمی‌آئی باز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta hych nmany kh nmy-āiy baz<\/p>"},{"n":112,"label":"۱۱۲","verse":"<p class=\"fa\">ای پیر خردمند پگه‌تر برخیز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay pyr khrdmnd pgh-tr brkhyz<\/p><p class=\"fa\">وان کودک خاک بیز را بنگر تیز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">van kvdk khak byz ra bngr tyz<\/p><p class=\"fa\">پندش ده و گو که نرم نرمک می‌بیز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pndsh dh v gv kh nrm nrmk my-byz<\/p><p class=\"fa\">مغزِ سَرِ کیقباد و چشم پرویز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mghze sare kyqbad v chshm prvyz<\/p>"},{"n":113,"label":"۱۱۳","verse":"<p class=\"fa\">وقت سحر است خیز ای مایهٔ ناز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vqt shr ast khyz ay mayhٔ naz<\/p><p class=\"fa\">نرمک نرمک باده خور و چنگ نواز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nrmk nrmk badh khvr v chng nvaz<\/p><p class=\"fa\">کانها که بجایند نپایند بسی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kanha kh bjaynd npaynd bsy<\/p><p class=\"fa\">وانها که شدند کس نمی‌آید باز<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vanha kh shdnd ks nmy-āyd baz<\/p>"},{"n":114,"label":"۱۱۴","verse":"<p class=\"fa\">مرغی دیدم نشسته بر بارهٔ طوس<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mrghy dydm nshsth br barhٔ tvs<\/p><p class=\"fa\">در پیش نهاده کلّه کیکاوس<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr pysh nhadh kllh kykavs<\/p><p class=\"fa\">با کلّه همی گفت که افسوس افسوس<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba kllh hmy gft kh afsvs afsvs<\/p><p class=\"fa\">کو بانگ جرسها و کجا نالهٔ کوس<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kv bang jrsha v kja nalhٔ kvs<\/p>"},{"n":115,"label":"۱۱۵","verse":"<p class=\"fa\">جامی است که عقل آفرین میزندش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">jamy ast kh &#x27;ql āfryn myzndsh<\/p><p class=\"fa\">صد بوسه ز مهر بر جبین میزندش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">sd bvsh z mhr br jbyn myzndsh<\/p><p class=\"fa\">این کوزه‌گر دهر چنین جام لطیف<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn kvzh-gr dhr chnyn jam ltyf<\/p><p class=\"fa\">میسازد و باز بر زمین میزندش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">mysazd v baz br zmyn myzndsh<\/p>"},{"n":116,"label":"۱۱۶","verse":"<p class=\"fa\">خیّام اگر ز باده مستی خوش باش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khyyam agr z badh msty khvsh bash<\/p><p class=\"fa\">با ماه رخی اگر نشستی خوش باش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba mah rkhy agr nshsty khvsh bash<\/p><p class=\"fa\">چون عاقبتِ کارِ جهان نیستی است<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chvn &#x27;aqbte kare jhan nysty ast<\/p><p class=\"fa\">انگار که نیستی چو هستی خوش باش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">angar kh nysty chv hsty khvsh bash<\/p>"},{"n":117,"label":"۱۱۷","verse":"<p class=\"fa\">در کارگه کوزه گری رفتم دوش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr kargh kvzh gry rftm dvsh<\/p><p class=\"fa\">دیدم دو هزار کوزه گویا و خموش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dydm dv hzar kvzh gvya v khmvsh<\/p><p class=\"fa\">ناگاه یکی کوزه برآورد خروش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">nagah yky kvzh brāvrd khrvsh<\/p><p class=\"fa\">کو کوزه گر و کوزه خر و کوزه فروش<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kv kvzh gr v kvzh khr v kvzh frvsh<\/p>"},{"n":118,"label":"۱۱۸","verse":"<p class=\"fa\">ایّام زمانه از کسی دارد ننگ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayyam zmanh az ksy dard nng<\/p><p class=\"fa\">کو در غم ایّام نشیند دلتنگ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kv dr ghm ayyam nshynd dltng<\/p><p class=\"fa\">می خور تو در آبگینه با نالهٔ چنگ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">my khvr tv dr ābgynh ba nalhٔ chng<\/p><p class=\"fa\">زان پیش که آبگینه آید بر سنگ<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh ābgynh āyd br sng<\/p>"},{"n":119,"label":"۱۱۹","verse":"<p class=\"fa\">از جرم گِلِ سیاه تا اوج زُحل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az jrm gele syah ta avj zohl<\/p><p class=\"fa\">کردم همه مشکلات کلّی را حل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">krdm hmh mshklat klly ra hl<\/p><p class=\"fa\">بگشادم بندهای مشکل بحیل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">bgshadm bndhay mshkl bhyl<\/p><p class=\"fa\">هر بند گشاده شد بجز بند اجل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">hr bnd gshadh shd bjz bnd ajl<\/p>"},{"n":120,"label":"۱۲۰","verse":"<p class=\"fa\">با سروقدی تازه‌تر از خرمن گل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba srvqdy tazh-tr az khrmn gl<\/p><p class=\"fa\">از دست منه جام می و دامن گُل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">az dst mnh jam my v damn gol<\/p><p class=\"fa\">زان پیش که ناگه شود از باد اجل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh nagh shvd az bad ajl<\/p><p class=\"fa\">پیراهن عمر ما چو پیراهن گُل<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">pyrahn &#x27;mr ma chv pyrahn gol<\/p>"},{"n":121,"label":"۱۲۱","verse":"<p class=\"fa\">ای دوست بیا تا غم فردا نخوریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ay dvst bya ta ghm frda nkhvrym<\/p><p class=\"fa\">وین یکدم عمر را غنیمت شمریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">vyn ykdm &#x27;mr ra ghnymt shmrym<\/p><p class=\"fa\">فردا که ازین دیر فنا درگذریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">frda kh azyn dyr fna drgzrym<\/p><p class=\"fa\">با هفت هزار سالگان سربسریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ba hft hzar salgan srbsrym<\/p>"},{"n":122,"label":"۱۲۲","verse":"<p class=\"fa\">این چرخِ فلک که ما در او حیرانیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn chrkhe flk kh ma dr av hyranym<\/p><p class=\"fa\">فانوس خیال ازو مثالی دانیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">fanvs khyal azv msaly danym<\/p><p class=\"fa\">خورشید چراغدان و عالم فانوس<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">khvrshyd chraghdan v &#x27;alm fanvs<\/p><p class=\"fa\">ما چون صُوَریم کاندر او حیرانیم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ma chvn sovarym kandr av hyranym<\/p>"},{"n":123,"label":"۱۲۳","verse":"<p class=\"fa\">برخیز ز خواب تا شرابی بخوریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brkhyz z khvab ta shraby bkhvrym<\/p><p class=\"fa\">زان پیش که از زمانه تابی بخوریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">zan pysh kh az zmanh taby bkhvrym<\/p><p class=\"fa\">کاین چرخ ستیزه‌روی ناگه روزی<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">kayn chrkh styzh-rvy nagh rvzy<\/p><p class=\"fa\">چندان ندهد زمان که آبی بخوریم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chndan ndhd zman kh āby bkhvrym<\/p>"},{"n":124,"label":"۱۲۴","verse":"<p class=\"fa\">برخیزم و عزم بادهٔ ناب کنم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">brkhyzm v &#x27;zm badhٔ nab knm<\/p><p class=\"fa\">رنگ رُخِ خود برنگ عنّاب کنم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">rng rokhe khvd brng &#x27;nnab knm<\/p><p class=\"fa\">این عقل فضول پیشه را مشتی می<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ayn &#x27;ql fzvl pyshh ra mshty my<\/p><p class=\"fa\">بر روی زنم چنانکه در خواب کنم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br rvy znm chnankh dr khvab knm<\/p>"},{"n":125,"label":"۱۲۵","verse":"<p class=\"fa\">بر مفرش خاک خفتگان می‌بینم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">br mfrsh khak khftgan my-bynm<\/p><p class=\"fa\">در زیرِ زمین نهفتگان می‌بینم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr zyre zmyn nhftgan my-bynm<\/p><p class=\"fa\">چندانکه بصحرای عدم مینگرم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">chndankh bshray &#x27;dm myngrm<\/p><p class=\"fa\">ناآمدگان و رفتگان می‌بینم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">naāmdgan v rftgan my-bynm<\/p>"},{"n":126,"label":"۱۲۶","verse":"<p class=\"fa\">تا چند اسیر عقل هرروزه شویم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">ta chnd asyr &#x27;ql hrrvzh shvym<\/p><p class=\"fa\">در دهر چه صد ساله چه یک روزه شویم<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dhr chh sd salh chh yk rvzh shvym<\/p><p class=\"fa\">در ده تو بکاسه می از آن پیش که ما<\/p><p class=\"translit\" dir=\"ltr\" lang=\"en-fa-Latn\">dr dh tv bkash my az ān pysh kh ma<\/p><p class=\"fa\">در کارگه کوزه گران کوزه شویم<\/p><p class=\"transli

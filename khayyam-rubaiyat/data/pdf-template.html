<!DOCTYPE html>
<html lang="en" data-theme="light-purple">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubáiyát of Omar Khayyám — PDF Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;500&family=Noto+Naskh+Arabic:wght@400&display=swap" rel="stylesheet">
<style>
/* Palette blocks are the Rubáiyát reader's, verbatim; this format adds only
   --viewer-bg (the chrome behind the page card) and --page-bg (the sheet). */
:root{
  --font-serif:'EB Garamond',Georgia,serif;
  --font-sans:'Jost',-apple-system,Helvetica Neue,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --font-fa:'Vazirmatn','Noto Naskh Arabic','EB Garamond',Georgia,serif;
}
[data-theme="sepia"]{--bg:#f5efe0;--text:#3a2e1e;--text-secondary:#7a6a52;--border:#d4c8a8;--accent:#b45309;--btn-bg:rgba(0,0,0,.05);--viewer-bg:#ded2b8;--page-bg:#f5efe0;--bar-bg:#3a3228}
[data-theme="light-purple"]{--bg:#faf8f3;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#7c3aed;--btn-bg:rgba(0,0,0,.05);--viewer-bg:#c8c4bc;--page-bg:#fff;--bar-bg:#323639}
[data-theme="light-azure"]{--bg:#fff;--text:#363b48;--text-secondary:#65707a;--border:#d6d0c4;--accent:#2e6ab4;--btn-bg:rgba(0,0,0,.06);--viewer-bg:#c4ccd4;--page-bg:#fff;--bar-bg:#2b3138}
[data-theme="dark-violet"]{--bg:#1a1a1a;--text:#dce0ec;--text-secondary:#8490aa;--border:#333;--accent:#9b7aed;--btn-bg:rgba(255,255,255,.08);--viewer-bg:#141414;--page-bg:#242424;--bar-bg:#0f0f0f}
[data-theme="dark-blue"]{--bg:#000;--text:#8490aa;--text-secondary:#546080;--border:#1c2440;--accent:#2e6ab4;--btn-bg:rgba(255,255,255,.06);--viewer-bg:#05070d;--page-bg:#0d1220;--bar-bg:#04060a}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--viewer-bg);color:var(--text);font-family:var(--font-serif);height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}

/* ── Toolbar ── */
#toolbar{
  position:fixed;top:0;left:0;right:0;height:44px;z-index:100;
  background:var(--bar-bg);color:#e8e8e8;
  display:flex;align-items:center;gap:6px;padding:0 12px;
  font-family:var(--font-sans);font-size:13px;
  border-bottom:1px solid rgba(0,0,0,.4);
}
#toolbar > button{
  min-width:32px;height:32px;background:transparent;border:1px solid transparent;
  color:#e8e8e8;border-radius:4px;cursor:pointer;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 8px;
}
#toolbar > button:hover{background:rgba(255,255,255,.1)}
#toolbar > button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#toolbar select{
  background:rgba(255,255,255,.08);color:#e8e8e8;border:1px solid rgba(255,255,255,.15);
  border-radius:4px;padding:3px 8px;font-size:12px;max-width:210px;
}
#toolbar select option{background:#2b2b2b;color:#e8e8e8}
#pageInput{
  width:44px;background:rgba(255,255,255,.08);color:#e8e8e8;
  border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:3px 6px;
  font-size:13px;text-align:center;font-variant-numeric:tabular-nums;
}
#pageTotal{font-family:var(--font-mono);font-size:12px;opacity:.75;white-space:nowrap}
.tb-spacer{flex:1 1 auto;min-width:0}
.tb-sep{width:1px;height:20px;background:rgba(255,255,255,.18);flex:0 0 auto}

/* ── Viewport + page card ── */
#viewport{position:absolute;top:44px;bottom:0;left:0;right:0;overflow-y:auto;padding:26px 0 60px;display:flex;flex-direction:column;align-items:center;gap:22px}
.page{
  width:min(680px,calc(100vw - 40px));
  background:var(--page-bg);color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  padding:64px 62px;min-height:60vh;
  display:flex;flex-direction:column;
  transform-origin:top center;
}
.page-ord{font-family:var(--font-serif);font-size:30px;color:var(--accent);text-align:center;opacity:.85;margin-bottom:4px;line-height:1}
.page-num-label{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-secondary);text-align:center;margin-bottom:26px}
.verse{font-size:19px;line-height:2.05;text-align:left}
.verse p{margin:0}
.verse p.indent{padding-left:1.7em}
.verse[dir="rtl"]{text-align:right;font-family:var(--font-fa);line-height:2.3}
.translit{direction:ltr;text-align:right;font-family:var(--font-mono);font-size:12px;line-height:1.9;color:var(--text-secondary);opacity:.75}
.gloss{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);font-size:14.5px;line-height:1.75;color:var(--text-secondary)}
.gloss h4{font-family:var(--font-sans);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600}
.gloss p{margin:0 0 8px}
.page-foot{margin-top:auto;padding-top:28px;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);text-align:center;letter-spacing:1px}

/* ── Sidebar ── */
#sidebar{
  position:fixed;top:44px;bottom:0;left:0;width:230px;z-index:90;
  background:var(--bar-bg);color:#ddd;overflow-y:auto;padding:10px 0;
  transform:translateX(-100%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;font-family:var(--font-sans);
}
/* visibility (not just transform) so the closed drawer leaves the tab
   order and the a11y tree; 0s delay keeps the slide animation. */
#sidebar.open{transform:translateX(0);visibility:visible;transition:transform .25s ease,visibility 0s}
#sidebar h2{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;padding:8px 16px}
.thumb{
  display:block;width:100%;text-align:left;background:none;border:none;color:#ddd;
  padding:10px 16px;font-size:13px;cursor:pointer;min-height:40px;
  border-left:3px solid transparent;
}
.thumb:hover{background:rgba(255,255,255,.07)}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.thumb.active{border-left-color:var(--accent);background:rgba(255,255,255,.09);color:#fff}
.thumb .sub{display:block;font-family:var(--font-mono);font-size:10px;opacity:.55;margin-top:2px}

/* ── Theme dots ── */
.theme-dots{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.theme-dot{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;padding:0;position:relative}
.theme-dot::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:calc(100% + 6px);height:40px}
.theme-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.theme-dot.active{box-shadow:0 0 0 2px var(--bar-bg),0 0 0 3.5px var(--accent)}
.theme-dot[data-theme="sepia"]{background:#d4c8a8}
.theme-dot[data-theme="light-purple"]{background:#c9b8e8}
.theme-dot[data-theme="light-azure"]{background:#d4e8f7}
.theme-dot[data-theme="dark-violet"]{background:#4a3a6a}
.theme-dot[data-theme="dark-blue"]{background:#1e2a4a}

@media (max-width:768px){
  #toolbar{padding:0 6px;gap:2px}
  #toolbar #zoomOut,#toolbar #zoomIn,#toolbar #zoomLabel,#toolbar .tb-sep{display:none}
  #toolbar select{max-width:100%;min-width:0;flex:1 1 auto}
  #toolbar > button{min-width:40px;height:40px}
  /* Dots keep their 14px visual; the ::before gives them the touch target. */
  #toolbar .theme-dots{gap:8px}
  .page{padding:36px 24px;width:calc(100vw - 20px)}
  #sidebar{width:200px;max-width:78vw}
}
@media (prefers-reduced-motion: reduce){#sidebar{transition:none}}
</style>
</head>
<body>

<div id="toolbar">
  <button id="sidebarToggle" aria-label="Toggle quatrain list">☰</button>
  <select id="editionSelect" aria-label="Choose edition"></select>
  <div class="tb-spacer"></div>
  <button id="prevBtn" aria-label="Previous page">‹</button>
  <input type="text" id="pageInput" value="1" aria-label="Page number" inputmode="numeric">
  <span id="pageTotal">/ 1</span>
  <button id="nextBtn" aria-label="Next page">›</button>
  <div class="tb-spacer"></div>
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <span id="zoomLabel" style="font-size:12px;min-width:38px;text-align:center">100%</span>
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <div class="tb-sep"></div>
  <div class="theme-dots" role="group" aria-label="Theme" id="themeDots"></div>
</div>

<nav id="sidebar" aria-label="Quatrains">
  <h2>Quatrains</h2>
  <div id="thumbs"></div>
</nav>

<main id="viewport">
  <article class="page" id="page"></article>
</main>

<script>
const DATA = __DATA__;
const PREFS_KEY = 'rubaiyat-pdf-prefs';
const THEMES = {sepia:'Sepia','light-purple':'Light purple','light-azure':'Light azure','dark-violet':'Dark violet','dark-blue':'Dark blue'};
const ZOOMS = [75,90,100,115,130,150];

let edition = DATA.default;
let idx = 0;
let zoom = 100;

const $ = id => document.getElementById(id);
const cur = () => DATA.editions[edition];
const list = () => cur().quatrains;

function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify({
    theme: document.documentElement.dataset.theme, edition, zoom
  })); }catch(e){}
}
function loadPrefs(){
  let p=null; try{ p=JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); }catch(e){}
  if(!p) return;
  if(p.theme && THEMES[p.theme]) document.documentElement.dataset.theme = p.theme;
  if(p.edition && DATA.editions[p.edition]) edition = p.edition;
  if(ZOOMS.includes(p.zoom)) zoom = p.zoom;
}

/* Position in the hash as #p-N (page ordinal within the edition), matching the
   house convention for paged formats. */
function writeHash(){ history.replaceState(null,'','#p-'+(idx+1)); }
function readHash(){
  const m = location.hash.match(/^#p-(\d+)$/);
  if(!m) return false;
  const n = parseInt(m[1],10);
  if(n < 1 || n > list().length) return false;
  idx = n - 1; return true;
}

function renderPage(){
  const q = list()[idx];
  const rtl = edition === 'persian';
  let html = '<div class="page-ord">' + q.label + '</div>';
  html += '<div class="page-num-label">' + cur().short + ' &middot; QUATRAIN ' + q.n + '</div>';
  html += '<div class="verse"' + (rtl ? ' dir="rtl" lang="fa"' : '') + '>' + q.verse + '</div>';
  if(q.gloss) html += '<div class="gloss">' + q.gloss + '</div>';
  html += '<div class="page-foot">' + cur().plain + ' &middot; ' + (idx+1) + ' / ' + list().length + '</div>';
  $('page').innerHTML = html;
  $('page').style.transform = 'scale(' + (zoom/100) + ')';
  $('pageInput').value = idx + 1;
  $('pageTotal').textContent = '/ ' + list().length;
  $('zoomLabel').textContent = zoom + '%';
  $('viewport').scrollTop = 0;
  document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('active', i === idx));
  const act = document.querySelector('.thumb.active');
  if(act) act.scrollIntoView({block:'nearest'});
  writeHash();
}

function go(d){ const n = idx + d; if(n<0||n>=list().length) return; idx = n; renderPage(); }
function setEdition(ed){
  if(!DATA.editions[ed]) return;
  edition = ed; idx = 0;
  buildThumbs(); renderPage(); savePrefs();
}
function setZoom(d){
  const i = ZOOMS.indexOf(zoom), n = i + d;
  if(n<0||n>=ZOOMS.length) return;
  zoom = ZOOMS[n]; renderPage(); savePrefs();
}

function buildThumbs(){
  const wrap = $('thumbs'); wrap.innerHTML = '';
  list().forEach((q,i) => {
    const b = document.createElement('button');
    b.type='button'; b.className='thumb';
    b.innerHTML = q.label + '<span class="sub">Quatrain ' + q.n + '</span>';
    b.setAttribute('aria-label','Go to quatrain ' + q.n);
    b.addEventListener('click', () => { idx = i; renderPage(); });
    wrap.appendChild(b);
  });
}
function buildEditions(){
  const sel = $('editionSelect'); sel.innerHTML = '';
  DATA.order.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = DATA.editions[k].plain + ' (' + DATA.editions[k].count + ')';
    if(k === edition) o.selected = true;
    sel.appendChild(o);
  });
}
function buildThemes(){
  const wrap = $('themeDots'); wrap.innerHTML = '';
  Object.keys(THEMES).forEach(t => {
    const b = document.createElement('button');
    b.type='button';
    b.className = 'theme-dot' + (document.documentElement.dataset.theme === t ? ' active' : '');
    b.dataset.theme = t;
    b.setAttribute('aria-label', THEMES[t] + ' theme');
    b.addEventListener('click', () => {
      document.documentElement.dataset.theme = t; buildThemes(); savePrefs();
    });
    wrap.appendChild(b);
  });
}

$('prevBtn').addEventListener('click', () => go(-1));
$('nextBtn').addEventListener('click', () => go(1));
$('zoomIn').addEventListener('click', () => setZoom(1));
$('zoomOut').addEventListener('click', () => setZoom(-1));
$('sidebarToggle').addEventListener('click', () => $('sidebar').classList.toggle('open'));
$('editionSelect').addEventListener('change', e => setEdition(e.target.value));
$('pageInput').addEventListener('change', e => {
  const n = parseInt(e.target.value,10);
  if(n>=1 && n<=list().length){ idx = n-1; renderPage(); } else { e.target.value = idx+1; }
});

document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if(t === 'INPUT' || t === 'SELECT') return;
  if(e.key === 'Escape'){ $('sidebar').classList.remove('open'); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key==='j'){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'||e.key==='k'){ e.preventDefault(); go(-1); }
  else if(e.key==='Home'){ e.preventDefault(); idx=0; renderPage(); }
  else if(e.key==='End'){ e.preventDefault(); idx=list().length-1; renderPage(); }
});

window.addEventListener('hashchange', () => { if(readHash()) renderPage(); });

loadPrefs();
buildEditions(); buildThemes(); buildThumbs();
readHash();
renderPage();
</script>
</body>
</html>
